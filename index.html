твовал меня и моих родителей, и [внуши мне] совершать праведное, чем Ты будешь доволен. И сделай моё потомство праведным. Воистину, я покаялся перед Тобой и, воистину, я — из числа мусульман».","n":1,"src":[],"q":"46:15","t":{"en":"Gratitude and righteous children","ru":"Благодарность и праведные дети","ar":"دعاء من القرآن"}},"q42":{"ar":"وَالَّذِينَ جَاءُوا مِن بَعْدِهِمْ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ ﴿١٠﴾","en":"And [there is a share for] those who come after them, saying, \"Our Lord, forgive us and our brothers who preceded us in faith and put not in our hearts [any] resentment toward those who have believed. Our Lord, indeed You are Kind and Merciful.\"","ru":"А те, которые пришли после них, говорят: «Господь наш! Прости нас и наших братьев, которые опередили нас в вере, и не вселяй в наши сердца злобу к тем, которые уверовали. Господь наш! Воистину, Ты — сострадательный, милующий».","n":1,"src":[],"q":"59:10","t":{"en":"For the believers","ru":"За верующих","ar":"دعاء من القرآن"}},"q43":{"ar":"قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌ فِي إِبْرَاهِيمَ وَالَّذِينَ مَعَهُ إِذْ قَالُوا لِقَوْمِهِمْ إِنَّا بُرَآءُ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ اللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ الْعَدَاوَةُ وَالْبَغْضَاءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا بِاللَّهِ وَحْدَهُ إِلَّا قَوْلَ إِبْرَاهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَا أَمْلِكُ لَكَ مِنَ اللَّهِ مِن شَيْءٍ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ ﴿٤﴾ رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا إِنَّكَ أَنتَ الْعَزِيزُ الْحَكِيمُ ﴿٥﴾","en":"There has already been for you an excellent pattern in Abraham and those with him, when they said to their people, \"Indeed, we are disassociated from you and from whatever you worship other than Allāh. We have denied you, and there has appeared between us and you animosity and hatred forever until you believe in Allāh alone\" - except for the saying of Abraham to his father, \"I will surely ask forgiveness for you, but I have not [power to do] for you anything against Allāh. Our Lord, upon You we have relied, and to You we have returned, and to You is the destination. Our Lord, make us not [objects of] torment for the disbelievers and forgive us, our Lord. Indeed, it is You who is the Exalted in Might, the Wise.\"","ru":"Воистину, для вас был прекрасный пример в Ибрахиме и тех, которые были с ним, когда они сказали своему народу: «Воистину, мы непричастны к вам и к тому, чему вы поклоняетесь помимо Аллаха. Мы отвергаем вас, и между нами и вами установились вражда и ненависть — навеки, пока вы не уверуете в Аллаха — в Него Одного». Исключением были лишь слова Ибрахима своему отцу: «Я непременно буду просить прощения за тебя, но я не властен сделать для тебя что-либо пред Аллахом». «Господь наш! На Тебя мы уповаем, к Тебе мы обратились, и к Тебе — конечный исход. Господь наш! Не делай нас искушением для тех, которые отвергли веру, и прости нас. Господь наш! Воистину, Ты — Могущественный, Мудрый».","n":1,"src":[],"q":"60:4–5","t":{"en":"Trust in Allah","ru":"Упование на Аллаха","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim","ru":"Ибрахим","ar":""}},"q44":{"ar":"يَا أَيُّهَا الَّذِينَ آمَنُوا تُوبُوا إِلَى اللَّهِ تَوْبَةً نَّصُوحًا عَسَىٰ رَبُّكُمْ أَن يُكَفِّرَ عَنكُمْ سَيِّئَاتِكُمْ وَيُدْخِلَكُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ يَوْمَ لَا يُخْزِي اللَّهُ النَّبِيَّ وَالَّذِينَ آمَنُوا مَعَهُ نُورُهُمْ يَسْعَىٰ بَيْنَ أَيْدِيهِمْ وَبِأَيْمَانِهِمْ يَقُولُونَ رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ﴿٨﴾","en":"O you who have believed, repent to Allāh with sincere repentance. Perhaps your Lord will remove from you your misdeeds and admit you into gardens beneath which rivers flow [on] the Day when Allāh will not disgrace the Prophet and those who believed with him. Their light will proceed before them and on their right; they will say, \"Our Lord, perfect for us our light and forgive us. Indeed, You are over all things competent.\"","ru":"О вы, которые уверовали! Покайтесь пред Аллахом искренним покаянием — может быть, ваш Господь сотрёт ваши скверные деяния и введёт вас в сады, внизу которых текут реки, в тот день, когда Аллах не унизит Пророка и тех, которые уверовали вместе с ним. Их свет будет устремляться перед ними и справа от них, и они скажут: «Господь наш! Доведи до совершенства наш свет и прости нас, воистину, Ты всемогущ над всем сущим».","n":1,"src":[],"q":"66:8","t":{"en":"Perfect our light","ru":"Доведи наш свет","ar":"دعاء من القرآن"}},"q45":{"ar":"وَضَرَبَ اللَّهُ مَثَلًا لِّلَّذِينَ آمَنُوا امْرَأَتَ فِرْعَوْنَ إِذْ قَالَتْ رَبِّ ابْنِ لِي عِندَكَ بَيْتًا فِي الْجَنَّةِ وَنَجِّنِي مِن فِرْعَوْنَ وَعَمَلِهِ وَنَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ ﴿١١﴾","en":"And Allāh presents an example of those who believed: the wife of Pharaoh, when she said, \"My Lord, build for me near You a house in Paradise and save me from Pharaoh and his deeds and save me from the wrongdoing people.\"","ru":"И Аллах привёл пример тех, которые уверовали: жену Фараона, когда она сказала: «Господь мой! Возведи для меня у Себя дом в Раю, и спаси меня от Фараона и его деяний, и спаси меня от несправедливого народа».","n":1,"src":[],"q":"66:11","t":{"en":"A home in Paradise","ru":"Дом в Раю","ar":"دعاء من القرآن"},"note":{"en":"Asiyah, wife of Pharaoh","ru":"Асия, жена Фараона","ar":""}},"q46":{"ar":"رَّبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَلِمَن دَخَلَ بَيْتِيَ مُؤْمِنًا وَلِلْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَلَا تَزِدِ الظَّالِمِينَ إِلَّا تَبَارًا ﴿٢٨﴾","en":"My Lord, forgive me and my parents and whoever enters my house a believer and the believing men and believing women. And do not increase the wrongdoers except in destruction.\"","ru":"Господь мой! Прости меня, моих родителей, и того, кто вошёл в мой дом верующим, а также верующих мужчин и верующих женщин. И не приумножай несправедливым ничего, кроме погибели».","n":1,"src":[],"q":"71:28","t":{"en":"For parents and believers","ru":"За родителей и верующих","ar":"دعاء من القرآن"},"note":{"en":"Nuh","ru":"Нух","ar":""}},"d_muqallib":{"ar":"يَا مُقَلِّبَ الْقُلُوبِ، ثَبِّتْ قَلْبِي عَلَى دِينِكَ","n":1,"src":["tir"],"t":{"en":"Steadfast heart","ru":"Твёрдость сердца","ar":"ثبات القلب"},"en":"O Turner of hearts, keep my heart firm upon Your religion.","ru":"О Переворачивающий сердца, укрепи моё сердце в Твоей религии.","note":{"en":"The supplication the Prophet ﷺ repeated most often.","ru":"Мольба, которую Пророк ﷺ повторял чаще всего.","ar":"كان أكثر دعائه ﷺ"}},"d_afw":{"ar":"اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي","n":0,"src":["tir"],"t":{"en":"Laylat al-Qadr","ru":"Ночь Предопределения","ar":"ليلة القدر"},"en":"O Allah, You are Pardoning and love to pardon, so pardon me.","ru":"О Аллах, поистине, Ты — Прощающий, любишь прощать, так прости же меня.","note":{"en":"Taught to Aishah for the nights of Laylat al-Qadr.","ru":"Пророк ﷺ научил этому Аишу для ночи Предопределения.","ar":"علّمه النبي ﷺ عائشة لليلة القدر"},"tl":"Аллахумма, иннакя ‘афуввун, тухиббу-ль-‘афуа, фа-‘фу ‘анни"},"d_huda":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى، وَالتُّقَى، وَالْعَفَافَ، وَالْغِنَى","n":1,"src":["muslim"],"t":{"en":"Guidance and purity","ru":"Руководство и чистота","ar":"الهدى والتقى"},"en":"O Allah, I ask You for guidance, piety, chastity and self-sufficiency.","ru":"О Аллах, прошу Тебя о верном руководстве, богобоязненности, целомудрии и достатке."},"d_taqwa":{"ar":"اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا","n":1,"src":["muslim"],"t":{"en":"Purifying the soul","ru":"Очищение души","ar":"تزكية النفس"},"en":"O Allah, grant my soul its piety and purify it, for You are the best to purify it. You are its Guardian and Protector.","ru":"О Аллах, даруй моей душе богобоязненность и очисти её, ведь Ты — лучший из очищающих. Ты — её Покровитель и Господин."},"h156":{"ar":"اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَداً مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ القُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلاَءَ حُزْنِي، وَذَهَابَ هَمِّي.","en":"O Allah, I am Your servant, son of Your servant, son of Your maidservant. My forelock is in Your hand, Your judgement upon me is executed and Your decree upon me is just. I ask You by every name that is Yours, with which You named Yourself, or revealed in Your Book, or taught to any of Your creation, or kept with Yourself in the knowledge of the unseen, to make the Quran the spring of my heart, the light of my chest, the departure of my sorrow and the release of my anxiety.","ru":"О Аллах, я — Твой раб, сын Твоего раба, сын Твоей рабыни. Мой хохол в Твоей руке, Твоё решение обо мне исполняется, и справедливо Твоё предопределение для меня. Прошу Тебя каждым именем, принадлежащим Тебе, которым Ты назвал Себя, или ниспослал в Своей Книге, или научил ему кого-то из Своих творений, или оставил его сокрытым у Себя, — сделай Коран весной моего сердца, светом моей груди, исчезновением моей печали и уходом моей тревоги.","n":1,"src":["ahmad"],"note":{"en":"Allah will remove his worry and replace his sorrow with joy.","ru":"Аллах избавит его от тревоги и заменит печаль радостью."},"t":{"en":"Worry and grief","ru":"Тревога и печаль","ar":"دعاء الهم والحزن"}},"h157":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.","en":"O Allah, I seek refuge in You from worry and grief, from helplessness and laziness, from miserliness and cowardice, from the burden of debt and from being overpowered by men.","ru":"О Аллах, прибегаю к Тебе от тревоги и печали, от бессилия и лени, от скупости и трусости, от бремени долга и от притеснения людей.","n":1,"src":["bukhari"],"t":{"en":"Worry and grief","ru":"Тревога и печаль","ar":"دعاء الهم والحزن"},"tl":"Аллахумма, инни а‘узу бикя мина-ль-хамми уа-ль-хазани, уа-ль-‘аджзи уа-ль-касали, уа-ль-бухли уа-ль-джубни, уа заляи-д-дайни уа галябати-р-риджаль!"},"h158":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ.","en":"There is no deity but Allah, the Mighty, the Forbearing. There is no deity but Allah, Lord of the Mighty Throne. There is no deity but Allah, Lord of the heavens, Lord of the earth and Lord of the Noble Throne.","ru":"Нет божества, кроме Аллаха, Великого, Кроткого. Нет божества, кроме Аллаха, Господа великого Трона. Нет божества, кроме Аллаха, Господа небес, Господа земли и Господа благородного Трона.","n":1,"src":["bm"],"t":{"en":"In distress","ru":"В беде","ar":"دعاء الكرب"}},"h159":{"ar":"اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لاَ إِلَهَ إِلاَّ أَنْتَ.","en":"O Allah, it is Your mercy that I hope for, so do not leave me to myself even for the blink of an eye, and set right all my affairs. There is no deity but You.","ru":"О Аллах, на Твою милость я надеюсь, так не оставляй же меня самому себе даже на мгновение ока и приведи в порядок все мои дела. Нет божества, кроме Тебя.","n":1,"src":["ad"],"t":{"en":"In distress","ru":"В беде","ar":"دعاء الكرب"}},"h160":{"ar":"لاَ إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظّالِمِينَ.","en":"There is no deity but You. Glory be to You! Indeed, I have been among the wrongdoers.","ru":"Нет божества, кроме Тебя. Пречист Ты! Поистине, я был одним из несправедливых.","n":1,"src":["tir"],"note":{"en":"The supplication of Yunus. No Muslim calls with it for anything except that Allah answers him.","ru":"Мольба Юнуса. Мусульманин, взывающий ею о чём-либо, получит ответ от Аллаха."},"t":{"en":"In distress","ru":"В беде","ar":"دعاء الكرب"}},"h161":{"ar":"اللَّهُ اللَّهُ رَبِّي لاَ أُشْرِكُ بِهِ شَيْئاً.","en":"Allah, Allah is my Lord; I do not associate anything with Him.","ru":"Аллах, Аллах — мой Господь, я не придаю Ему никого в сотоварищи.","n":1,"src":["ad"],"t":{"en":"In distress","ru":"В беде","ar":"دعاء الكرب"}},"h162":{"ar":"اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِم، وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ.","en":"O Allah, we place You before them and seek refuge in You from their evil.","ru":"О Аллах, мы выставляем Тебя против них и прибегаем к Тебе от их зла.","n":1,"src":["ad"],"note":{"en":"On meeting an enemy or a person in power you fear.","ru":"При встрече с врагом или властным человеком, которого боитесь."},"t":{"en":"Facing an enemy or ruler","ru":"Перед врагом или властью","ar":"دعاء لقاء العدو و ذي السلطان"}},"h163":{"ar":"اللَّهُمَّ أَنْتَ عَضُدِي، وَأَنْتَ نَصِيرِي، بِكَ أَحُولُ وَبِكَ أَصُولُ، وَبِكَ أُقاتِلُ.","en":"O Allah, You are my support and my helper. By You I move, by You I attack and by You I fight.","ru":"О Аллах, Ты — моя опора и мой помощник. С Тобой я маневрирую, с Тобой нападаю и с Тобой сражаюсь.","n":1,"src":["ad","tir"],"t":{"en":"Facing an enemy or ruler","ru":"Перед врагом или властью","ar":"دعاء لقاء العدو و ذي السلطان"}},"h164":{"ar":"حَسْبُنا اللَّهُ وَنِعْمَ الْوَكِيلُ.","en":"Allah is sufficient for us, and He is the best Disposer of affairs.","ru":"Нам достаточно Аллаха, и как прекрасен этот Попечитель!","n":1,"src":["bukhari"],"note":{"en":"Said by Ibrahim when thrown into the fire, and by Muhammad ﷺ when told that people had gathered against him.","ru":"Это сказал Ибрахим, когда его бросили в огонь, и Мухаммад ﷺ, когда ему сказали, что против него собрались люди."},"t":{"en":"Facing an enemy or ruler","ru":"Перед врагом или властью","ar":"دعاء لقاء العدو و ذي السلطان"}},"h165":{"ar":"اللَّهُمَّ ربَّ السَّمَوَاتِ السَّبْعِ، وَرَبَّ الْعَرْشِ الْعَظِيمِ، كُنْ لِي جَاراً مِنْ فُلاَنِ بْنِ فُلاَنٍ، وَأَحْزَابِهِ مِنْ خَلاَئِقِكَ، أَنْ يَفْرُطَ عَلَيَّ أَحَدٌ مِنْهُمْ أَوْ يَطْغَى، عَزَّ جَارُكَ، وَجَلَّ ثَنَاؤُكَ، وَلاَ إِلَهَ إِلاَّ أَنْتَ.","en":"O Allah, Lord of the seven heavens and Lord of the Mighty Throne, be my protector against (name) and his allies among Your creatures, lest any of them wrong me or transgress against me. Mighty is the one You protect, glorious is Your praise, and there is no deity but You.","ru":"О Аллах, Господь семи небес и Господь великого Трона, будь моим защитником от такого-то и его сторонников из Твоих творений, чтобы никто из них не обидел меня и не притеснил. Силён тот, кого Ты защищаешь, велика хвала Тебе, и нет божества, кроме Тебя.","n":1,"src":["bukhari"],"t":{"en":"Facing an enemy or ruler","ru":"Перед врагом или властью","ar":"دعاء لقاء العدو و ذي السلطان"}},"h166":{"ar":"اللَّهُ أَكْبَرُ، اللَّهُ أَعَزُّ مِنْ خَلْقِهِ جَمِيعاً، اللَّهُ أَعَزُّ مِمَّا أَخَافُ وَأَحْذَرُ، أَعُوذُ بِاللَّهِ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ، الْمُمْسِكِ السَّمَوَاتِ السَّبْعِ أَنْ يَقَعْنَ عَلَى الْأَرْضِ إِلاَّ بِإِذْنِهِ، مِنْ شَرِّ عَبْدِكَ فُلاَنٍ، وَجُنُودِهِ وَأَتْبَاعِهِ وَأَشْيَاعِهِ، مِنْ الْجِنِّ وَالإِنْسِ، اللَّهُمَّ كُنْ لِي جَاراً مِنْ شَرِّهِمْ، جَلَّ ثَنَاؤُكَ وَعَزَّ جَارُكَ، وَتَبَارَكَ اسْمُكَ، وَلاَ إِلَهَ غَيْرُكَ ثلاثَ مرَّاتٍ","en":"Allah is the Greatest. Allah is mightier than all His creation. Allah is mightier than what I fear and dread. I seek refuge in Allah, besides whom there is no deity, who holds the seven heavens from falling onto the earth except by His permission, from the evil of Your servant (name), his soldiers, followers and supporters among jinn and men. O Allah, be my protector from their evil. Glorious is Your praise, mighty is the one You protect, blessed is Your name, and there is no deity besides You.","ru":"Аллах велик. Аллах могущественнее всех Своих творений. Аллах могущественнее того, чего я боюсь и опасаюсь. Прибегаю к Аллаху, кроме которого нет божества и который удерживает семь небес от падения на землю иначе как с Его дозволения, от зла Твоего раба такого-то, его войск, последователей и приверженцев из джиннов и людей. О Аллах, будь моим защитником от их зла. Велика хвала Тебе, силён тот, кого Ты защищаешь, благословенно Твоё имя, и нет божества, кроме Тебя.","n":3,"src":["bukhari"],"t":{"en":"Facing an enemy or ruler","ru":"Перед врагом или властью","ar":"دعاء لقاء العدو و ذي السلطان"}},"h167":{"ar":"اللَّهُمَّ مُنْزِلَ الْكِتَابِ، سَرِيعَ الْحِسَابِ، اهْزِمِ الأَحْزَابَ، اللَّهُمَّ اهزِمْهُمْ وَزَلْزِلْهُمْ.","en":"O Allah, Revealer of the Book, Swift in reckoning, defeat the confederates. O Allah, defeat them and shake them.","ru":"О Аллах, Ниспославший Писание, Скорый в расчёте, разбей союзные племена! О Аллах, разбей их и потряси их!","n":1,"src":["muslim"],"t":{"en":"Against the enemy","ru":"Против врага","ar":"الدعاء على العدو"}},"h168":{"ar":"اللَّهُمَّ اكْفِنِيهِمْ بِمَا شِئْتَ.","en":"O Allah, suffice me against them however You will.","ru":"О Аллах, избавь меня от них, как пожелаешь.","n":1,"src":["muslim"],"note":{"en":"When you fear a group of people.","ru":"Когда боитесь каких-то людей."},"t":{"en":"Fearing people","ru":"Опасаясь людей","ar":"ما يقول من خاف قوما"}},"h170":{"ar":"يَقُولُ: آمَنْتُ بِاللَّهِ وَرُسُلِهِ.","en":"I believe in Allah and His messengers.","ru":"Я уверовал в Аллаха и Его посланников.","n":1,"src":["muslim"],"note":{"en":"When doubts about faith are whispered to you: seek refuge in Allah and stop dwelling on them.","ru":"Когда приходят сомнения в вере: попросите у Аллаха защиты и перестаньте о них думать."},"t":{"en":"Doubts in faith","ru":"Сомнения в вере","ar":"دعاء من أصابه وسوسة في الإيمان"}},"h172":{"ar":"اللَّهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكِ عَمَّنْ سِوَاكَ.","en":"O Allah, suffice me with what You have made lawful against what You have forbidden, and make me independent by Your bounty of all besides You.","ru":"О Аллах, огради меня дозволенным Тобой от запретного и обогати меня Своей милостью, чтобы я не нуждался ни в ком, кроме Тебя.","n":1,"src":["tir"],"note":{"en":"For settling debts.","ru":"Для погашения долгов."},"t":{"en":"Debt","ru":"Долги","ar":"دعاء قضاء الدين"}},"h174":{"ar":"أَعُوذُ بِاللَّهِ مِنَ الشَّيطَانِ الرَّجِيمِ، وَاتْفُلْ عَلَى يَسَارِكَ ثلاثاً","en":"I seek refuge in Allah from Satan, the accursed — and spit lightly to your left three times.","ru":"Прибегаю к Аллаху от шайтана, побиваемого камнями, — и слегка сплюньте влево три раза.","n":1,"src":["muslim"],"note":{"en":"For whisperings during prayer or recitation.","ru":"При наущениях во время намаза или чтения Корана."},"t":{"en":"Distraction in prayer","ru":"Наущения в намазе","ar":"دعاء الوسوسة في الصلاة و القراءة"}},"h175":{"ar":"اللَّهُمَّ لاَ سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً، وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلاً.","en":"O Allah, nothing is easy except what You make easy, and You make the difficult easy if You will.","ru":"О Аллах, нет лёгкого, кроме того, что Ты сделал лёгким, и Ты делаешь трудное лёгким, если пожелаешь.","n":1,"src":["ibnhibban"],"note":{"en":"When something is difficult for you.","ru":"Когда что-то даётся с трудом."},"t":{"en":"When something is hard","ru":"Когда трудно","ar":"دعاء من استصعب عليه أمر"}},"h176":{"ar":"مَا مِنْ عَبْدٍ يُذنِبُ ذَنْباً فَيُحْسِنُ الطُّهُورَ، ثُمَّ يَقُومُ فَيُصَلِّي رَكْعَتَيْنِ، ثُمَّ يَسْتَغْفِرُ اللَّهَ إِلاَّ غَفَرَ اللَّهُ لَهُ.","en":"No servant commits a sin, then purifies himself well, stands and prays two rak’ahs, and then seeks Allah’s forgiveness, except that Allah forgives him.","ru":"Если раб совершит грех, затем хорошо очистится, встанет, совершит два ракаата и попросит у Аллаха прощения, Аллах непременно простит его.","n":1,"src":["ad","tir"],"t":{"en":"After a sin","ru":"После греха","ar":"ما يقول ويفعل من أذنب ذنبا"}},"h284":{"ar":"قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: وَاللَّهِ إِنِّي لأَسْتَغفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي الْيَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةٍ.","en":"The Messenger of Allah ﷺ said: By Allah, I seek Allah’s forgiveness and turn to Him in repentance more than seventy times a day.","ru":"Посланник Аллаха ﷺ сказал: «Клянусь Аллахом, я прошу у Аллаха прощения и каюсь перед Ним более семидесяти раз в день».","n":1,"src":["bukhari"],"t":{"en":"Seeking forgiveness","ru":"Покаяние","ar":"الاستغفار و التوبة"}},"h285":{"ar":"وَقَالَ صلى الله عليه وسلم: يَا أَيُّهَا النَّاسُ تُوبُوا إِلَى اللَّهِ فَإِنِّي أَتُوبُ فِي الْيَوْمِ إِلَيْهِ مِائَةَ مَرَّةٍ.","en":"O people, turn to Allah in repentance, for I turn to Him a hundred times a day.","ru":"О люди, кайтесь перед Аллахом, ведь я каюсь перед Ним сто раз в день.","n":1,"src":["muslim"],"t":{"en":"Seeking forgiveness","ru":"Покаяние","ar":"الاستغفار و التوبة"}},"h286":{"ar":"وَقَالَ صلى الله عليه وسلم: مَنْ قَالَ أَسْتَغْفِرُ اللَّهَ الْعَظيمَ الَّذِي لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ القَيّوُمُ وَأَتُوبُ إِلَيهِ، غَفَرَ اللَّهُ لَهُ وَإِنْ كَانَ فَرَّ مِنَ الزَّحْفِ.","en":"Whoever says: I seek the forgiveness of Allah the Mighty, besides whom there is no deity, the Ever-Living, the Sustainer, and I turn to Him in repentance — Allah forgives him, even if he fled from the battlefield.","ru":"Кто скажет: «Прошу прощения у Аллаха Великого, кроме которого нет божества, Живого, Поддерживающего жизнь, и приношу Ему покаяние», тому Аллах простит, даже если он бежал с поля боя.","n":1,"src":["ad","tir"],"t":{"en":"Seeking forgiveness","ru":"Покаяние","ar":"الاستغفار و التوبة"}},"h287":{"ar":"وَقَالَ صلى الله عليه وسلم: أَقْرَبُ مَا يَكُونُ الرَّبُّ مِنَ الْعَبْدِ فِي جَوْفِ اللَّيْلِ الآخِرِ فَإِنِ اسْتَطَعْتَ أَنْ تَكُونَ مِمَّنْ يَذْكُرُ اللَّهَ فِي تِلْكَ السَّاعَةِ فَكُنْ.","en":"The Lord is closest to the servant in the last part of the night, so if you can be among those who remember Allah at that hour, then be.","ru":"Ближе всего Господь к рабу в последнюю часть ночи. Если можешь быть среди тех, кто поминает Аллаха в этот час, — будь.","n":1,"src":["tir"],"t":{"en":"Seeking forgiveness","ru":"Покаяние","ar":"الاستغفار و التوبة"}},"h288":{"ar":"وَقَالَ صلى الله عليه وسلم: أَقْرَبُ مَا يَكُونُ الْعَبْدُ مِنْ رَبِّهِ وَهُوَ سَاجِدٌ فَأَكثِرُوا الدُّعَاءَ.","en":"The closest a servant is to his Lord is while he is prostrating, so make much supplication.","ru":"Ближе всего раб к своему Господу, когда он в земном поклоне, так усердствуйте в мольбе.","n":1,"src":["muslim"],"t":{"en":"Seeking forgiveness","ru":"Покаяние","ar":"الاستغفار و التوبة"}},"h289":{"ar":"وَقَالَ صلى الله عليه وسلم: إِنَّهُ لَيُغَانُ عَلَى قَلْبِي وَإِنِّي لأَسْتَغْفِرُ اللَّهَ فِي الْيَوْمِ مِائَةَ مَرَّةٍ.","en":"My heart becomes clouded, and I seek Allah’s forgiveness a hundred times a day.","ru":"Поистине, моё сердце окутывает пелена, и я прошу у Аллаха прощения сто раз в день.","n":1,"src":["muslim"],"t":{"en":"Seeking forgiveness","ru":"Покаяние","ar":"الاستغفار و التوبة"}},"h290":{"ar":"قَالَ صلى الله عليه وسلم مَنْ قَالَ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَلَوْ كَانَتْ مِثْلَ زَبَدِ الْبَحْر.","en":"Whoever says “Glory be to Allah and praise be to Him” a hundred times a day, his sins are wiped away even if they are like the foam of the sea.","ru":"Кто скажет «Пречист Аллах и хвала Ему» сто раз в день, у того будут стёрты грехи, даже если их столько, сколько пены морской.","n":100,"src":["bukhari"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h291":{"ar":"وَقَالَ صلى الله عليه وسلم: مَنْ قَالَ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ عَشْرَ مِرَارٍ، كَانَ كَمَنْ أَعْتَقَ أَرْبَعَةَ أَنْفُسٍ مِنْ وَلَدِ إِسْمَاعِيلَ.","en":"Whoever says ten times: There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable — is like one who freed four souls from the descendants of Ismail.","ru":"Кто скажет десять раз: «Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может», тот подобен освободившему четырёх человек из потомков Исмаила.","n":10,"src":["bm"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h292":{"ar":"وَقَالَ صلى الله عليه وسلم: كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحانَ اللَّهِ الْعَظِيمِ.","en":"Two words are light on the tongue, heavy on the Scale and beloved to the Most Merciful: Glory be to Allah and praise be to Him; glory be to Allah, the Most Great.","ru":"Два слова, лёгкие для языка, тяжёлые на Весах и любимые Милостивым: «Пречист Аллах и хвала Ему, пречист Аллах Великий».","n":0,"src":["bm"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h293":{"ar":"وَقَالَ صلى الله عليه وسلم: لَأَنْ أَقُولَ سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، أَحَبُّ إِلَيَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمسُ.","en":"To say “Glory be to Allah, praise be to Allah, there is no deity but Allah, and Allah is the Greatest” is more beloved to me than everything the sun has risen upon.","ru":"Сказать «Пречист Аллах, хвала Аллаху, нет божества, кроме Аллаха, Аллах велик» для меня любимее всего, над чем восходит солнце.","n":0,"src":["muslim"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h294":{"ar":"وَقَالَ صلى الله عليه وسلم: أَيَعْجِزُ أَحَدُكُم أَنْ يَكْسِبَ كُلَّ يَوْمٍ أَلْفَ حَسَنَةٍ فَسَأَلَهُ سَائِلٌ مِنْ جُلَسَائِهِ كَيْفَ يَكْسِبُ أَحَدُنَا أَلْفَ حَسَنَةٍ؟ قَالَ: يُسَبِّحُ مِائَةَ تَسْبِيحَةٍ، فَيُكتَبُ لَهُ أَلْفُ حَسَنَةٍ أَوْ يُحَطُّ عَنْهُ أَلْفُ خَطِيئَةٍ.","en":"Is any of you unable to earn a thousand good deeds each day? He glorifies Allah a hundred times, and a thousand good deeds are written for him or a thousand sins are wiped away.","ru":"Разве не может кто-то из вас обретать каждый день тысячу добрых дел? Пусть сто раз скажет «Пречист Аллах», и ему запишется тысяча добрых дел или сотрётся тысяча грехов.","n":100,"src":["muslim"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h295":{"ar":"مَنْ قَالَ: سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ غُرِسَتْ لَهُ نَخْلَةٌ فِي الْجَنَّةِ.","en":"Whoever says “Glory be to Allah the Mighty and praise be to Him”, a palm tree is planted for him in Paradise.","ru":"Кто скажет «Пречист Аллах Великий и хвала Ему», тому посадят пальму в Раю.","n":0,"src":["tir"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h296":{"ar":"وَقَالَ صلى الله عليه وسلم: يَا عَبْدَ اللَّهِ بْنَ قَيْسٍ أَلاَ أَدُلُّكَ عَلَى كَنْزٍ مِنْ كُنُوزِ الْجَنَّةِ؟ فَقُلْتُ: بَلَى يَا رَسُولَ اللَّهِ، قَالَ: قُلْ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.","en":"O Abdullah ibn Qays, shall I not show you a treasure from the treasures of Paradise? Say: There is no might nor power except with Allah.","ru":"«О Абдуллах ибн Кайс, не указать ли тебе на одно из сокровищ Рая?» — «Конечно, о посланник Аллаха!» — «Говори: „Нет мощи и силы ни у кого, кроме Аллаха“».","n":0,"src":["bukhari"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h297":{"ar":"وَقَالَ صلى الله عليه وسلم: أَحَبُّ الْكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ: سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ، لاَ يَضُرُّكَ بِأَيِّهِنَّ بَدَأتَ.","en":"The most beloved words to Allah are four: Glory be to Allah, praise be to Allah, there is no deity but Allah, and Allah is the Greatest. It does not matter which you begin with.","ru":"Самые любимые Аллахом слова — четыре: «Пречист Аллах», «Хвала Аллаху», «Нет божества, кроме Аллаха» и «Аллах велик». Неважно, с какого начать.","n":0,"src":["muslim"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h298":{"ar":"جَاءَ أَعْرَابِيٌّ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ: عَلِّمْنِي كَلاماً أَقُولُهُ: قَالَ: قُلْ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثِيراً، سُبْحَانَ اللَّهِ رَبِّ العَالَمِينَ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَزِيزِ الْحَكِيمِ قَالَ: فَهَؤُلاَءِ لِرَبِّي، فَمَا لِي؟ قَالَ: قُلْ: اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَارْزُقْنِي.","en":"A Bedouin asked the Prophet ﷺ to teach him words to say. He said: Say: There is no deity but Allah alone, without partner. Allah is the Greatest, truly great; praise be to Allah, abundantly; glory be to Allah, Lord of the worlds; there is no might nor power except with Allah, the Mighty, the Wise. The man said: These are for my Lord, what is for me? He said: Say: O Allah, forgive me, have mercy on me, guide me and provide for me.","ru":"Бедуин попросил Пророка ﷺ научить его словам. Он сказал: «Говори: „Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Аллах велик безмерно, хвала Аллаху обильная, пречист Аллах, Господь миров, нет мощи и силы ни у кого, кроме Аллаха, Могущественного, Мудрого“». Тот спросил: «Это для моего Господа, а что для меня?» Он ответил: «Говори: „О Аллах, прости меня, помилуй меня, наставь меня и надели меня уделом“».","n":1,"src":["muslim"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h299":{"ar":"كَانَ الرَّجُلُ إِذَا أَسْلَمَ عَلَّمَهُ النَّبيُّ صلى الله عليه وسلم الصَّلاَةَ ثُمَّ أَمَرَهُ أَنْ يَدْعُوَ بِهَؤُلاَءِ الْكَلِمَاتِ: اللَّهُمَّ اغْفِرِ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَعَافِنِي وَارْزُقْنِي.","en":"When a man embraced Islam, the Prophet ﷺ taught him the prayer and then told him to supplicate with these words: O Allah, forgive me, have mercy on me, guide me, grant me well-being and provide for me.","ru":"Когда человек принимал ислам, Пророк ﷺ учил его намазу и велел молиться этими словами: «О Аллах, прости меня, помилуй меня, наставь меня, даруй мне благополучие и надели меня уделом».","n":1,"src":["muslim"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h300":{"ar":"إِنَّ أَفْضَلَ الدُّعَاءِ الْحَمْدُ لِلَّهِ، وَأَفْضَلَ الذِّكْرِ لاَ إِلَهَ إِلاَّ اللَّهُ.","en":"The best supplication is “Praise be to Allah”, and the best remembrance is “There is no deity but Allah”.","ru":"Лучшая мольба — «Хвала Аллаху», а лучшее поминание — «Нет божества, кроме Аллаха».","n":0,"src":["tir"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h301":{"ar":"الباقيات الصالحات : سبحان الله والحمد لله، ولا إله إلا الله،والله أكبر،و لا حول ولا قوة إلا بالله","en":"The enduring good deeds: Glory be to Allah, praise be to Allah, there is no deity but Allah, Allah is the Greatest, and there is no might nor power except with Allah.","ru":"Непреходящие благие дела: «Пречист Аллах», «Хвала Аллаху», «Нет божества, кроме Аллаха», «Аллах велик» и «Нет мощи и силы ни у кого, кроме Аллаха».","n":0,"src":["ahmad"],"t":{"en":"Glorification","ru":"Прославление Аллаха","ar":"التسبيح، التحميد، التهليل، التكبير"}},"h312":{"ar":"أَعُوذُ بِاللَّهِ الْعَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ.","en":"I seek refuge in Allah the Mighty, in His noble Face and His eternal authority, from Satan the accursed.","ru":"Прибегаю к Аллаху Великому, к Его благородному Лику и Его извечной власти от шайтана, побиваемого камнями.","n":1,"src":["ad"],"note":{"en":"When one says this, Satan says: he is protected from me for the rest of the day.","ru":"Когда человек говорит это, шайтан говорит: «Он защищён от меня до конца дня».","ar":"فإذا قالَ ذلكَ قال الشيطانُ : حُفِظَ منِّي سائرَ اليومِ"},"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h313":{"ar":"أَعُوذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيمِ، مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ.","en":"I seek refuge in Allah from Satan the accursed, from his madness, his pride and his poetry.","ru":"Прибегаю к Аллаху от шайтана, побиваемого камнями, от его безумия, высокомерия и стихов.","n":1,"src":["tir"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h314":{"ar":"أعوذُ بكلماتِ اللهِ التامَّةِ، مِن كُلِّ شيطانٍ وهامَّةٍ، ومِن كُلِّ عَيْنٍ لامَّةٍ.","en":"I seek refuge in the perfect words of Allah from every devil and poisonous creature, and from every harmful eye.","ru":"Прибегаю к совершенным словам Аллаха от всякого шайтана и ядовитой твари и от всякого дурного глаза.","n":1,"src":["bukhari"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h316":{"ar":"بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِسْمِ اللَّهِ أَرْقِيكَ.","en":"In the name of Allah I perform ruqyah for you, from everything that harms you, from the evil of every soul or envious eye. May Allah cure you. In the name of Allah I perform ruqyah for you.","ru":"С именем Аллаха читаю над тобой, от всего, что вредит тебе, от зла всякой души или завистливого глаза. Да исцелит тебя Аллах. С именем Аллаха читаю над тобой.","n":1,"src":["muslim"],"note":{"en":"Jibril recited this over the Prophet ﷺ when he was ill.","ru":"Это читал Джибриль над Пророком ﷺ, когда тот болел."},"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h319":{"ar":"اللَّهُمَّ ربَّ النَّاسِ، أَذْهِب الْبَأسَ، واشْفِ، أَنْتَ الشَّافي لا شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفاءً لا يُغَادِرُ سقَماً.","en":"O Allah, Lord of mankind, remove the harm and cure. You are the Healer; there is no cure but Your cure, a cure that leaves no illness behind.","ru":"О Аллах, Господь людей, устрани вред и исцели. Ты — Исцеляющий, нет исцеления, кроме Твоего, исцеления, после которого не остаётся болезни.","n":1,"src":["bukhari"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h320":{"ar":"اللَّهُمَّ اشْفِ عَبْدَكَ، وصَدِّقْ رَسُولَك.","en":"O Allah, cure Your servant and confirm Your Messenger.","ru":"О Аллах, исцели Своего раба и подтверди правоту Своего посланника.","n":1,"src":["ahmad"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h321":{"ar":"اللهُمَّ بَارِكْ عَلَيْهِ، وَأَذْهِبْ عَنْهُ حَرَّ الْعَيْنِ وَبَرْدَهَا وَوَصَبَهَا.","en":"O Allah, bless him and remove from him the heat, the cold and the pain of the evil eye.","ru":"О Аллах, благослови его и избавь его от жара, холода и боли сглаза.","n":1,"src":["ahmad"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h322":{"ar":"اللَّهُمَّ إِنَّا نَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ صلى الله عليه وسلم وَنَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ صلى الله عليه وسلم وَأَنْتَ الْمُسْتَعَانُ، وَعَلَيْكَ الْبَلَاغُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ.","en":"O Allah, we ask You for the good that Your Prophet Muhammad ﷺ asked You for, and we seek refuge in You from the evil Your Prophet Muhammad ﷺ sought refuge from. You are the One whose help is sought, and You alone convey to the goal. There is no might nor power except with Allah.","ru":"О Аллах, просим Тебя о благе, о котором просил Тебя Твой пророк Мухаммад ﷺ, и прибегаем к Тебе от зла, от которого искал защиты Твой пророк Мухаммад ﷺ. Ты — Тот, у Кого просят помощи, и Тебе — доведение до цели. Нет мощи и силы ни у кого, кроме Аллаха.","n":1,"src":["tir"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h324":{"ar":"رَبّنَا الَّلهُ الذِي فِي السَّمَاءِ، تَقَدَّسَ اسمُكَ، أَمرُكَ فِي السَّمَاءِ وَالأَرْضِ، كَمَا رَحمَتُكَ فِي السَّمَاءِ فَاجْعَلْ رَحْمَتَكَ فِي الأَرْضِ، اغفِر لَنَا حَوْبَنَا وَخَطَايَانَا، أَنتَ رَبُّ الطَّيِّبِينَ، أَنزِلْ رَحْمَةً مِن رَحمَتِكَ، وَشِفَاءً مِن شِفَائِكَ عَلَى هَذَا الوَجَعِ، فَيَبرَأ.","en":"Our Lord Allah, who is in the heaven, holy is Your name. Your command is in the heaven and the earth; as Your mercy is in the heaven, place Your mercy on the earth. Forgive us our sins and errors; You are the Lord of the good. Send down mercy from Your mercy and healing from Your healing upon this pain — and he will be cured.","ru":"Господь наш Аллах, который на небе, свято Твоё имя. Твоё повеление — на небе и на земле. Как Твоя милость на небе, так помести Твою милость и на земле. Прости нам наши проступки и грехи. Ты — Господь благих. Ниспошли милость из Твоей милости и исцеление из Твоего исцеления на эту боль — и он исцелится.","n":3,"src":["ad"],"note":{"en":"Its chain is debated among scholars.","ru":"Достоверность его иснада обсуждается учёными."},"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h328":{"ar":"بِسْمِ اللَّهِ الْعَظِيمِ، أَعُوذُ بِاللَّهِ الْكَبِيرِ مِنْ شَرِّ كُلِّ عِرْقٍ نَعَّارٍ، وَمِنْ شَرِّ حَرِّ النَّارِ.","en":"In the name of Allah the Mighty, I seek refuge in Allah the Great from the evil of every throbbing vein and from the evil of the heat of fire.","ru":"С именем Аллаха Великого, прибегаю к Аллаху Большому от зла всякой пульсирующей жилы и от зла жара огня.","n":1,"src":["tir"],"note":{"en":"For fever. Its chain is debated among scholars.","ru":"При жаре. Достоверность иснада обсуждается учёными."},"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h329":{"ar":"بِسْمِ اللهِ تربَةُ أَرْضِنَا، بِرِيقةِ بَعْضِنَا، يُشْفَى سَقِيمُنَا، بإِذْنِ رَبِّنَا.","en":"In the name of Allah, the soil of our land with the saliva of some of us cures our sick, by the permission of our Lord.","ru":"С именем Аллаха, земля нашей земли со слюной кого-то из нас исцеляет нашего больного с дозволения нашего Господа.","n":1,"src":["bukhari"],"note":{"en":"The Prophet ﷺ would wet his finger with saliva, touch the earth and place it on the wound.","ru":"Пророк ﷺ смачивал палец слюной, касался земли и прикладывал к ране."},"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h330":{"ar":"أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ، أَنْ يُعَافِيَكَ وَيَشْفِيَكَ.","en":"I ask Allah the Mighty, Lord of the Mighty Throne, to grant you well-being and to cure you.","ru":"Прошу Аллаха Великого, Господа великого Трона, даровать тебе благополучие и исцелить тебя.","n":7,"src":["ahmad"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h331":{"ar":"اللَّهُمَّ بَرِّدْ قَلْبِي بِالثَّلْجِ وَالْبَرَدِ وَالْمَاءِ الْبَارِدِ، اللَّهُمَّ نَقِّ قَلْبِي مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الْأَبْيَضَ مِنَ الدَّنَسِ.","en":"O Allah, cool my heart with snow, hail and cold water. O Allah, cleanse my heart of sins as a white garment is cleansed of dirt.","ru":"О Аллах, остуди моё сердце снегом, градом и холодной водой. О Аллах, очисти моё сердце от грехов, как очищается белая одежда от грязи.","n":1,"src":["tir"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h332":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِوَجْهِكَ الْكَرِيمِ وَكَلِمَاتِكَ التَّامَّةِ مِنْ شَرِّ مَا أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ تَكْشِفُ الْمَغْرَمَ وَالْمَأْثَمَ، اللَّهُمَّ لَا يُهْزَمُ جُنْدُكَ، وَلَا يُخْلَفُ وَعْدُكَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ، سُبْحَانَكَ وَبِحَمْدِكَ.","en":"O Allah, I seek refuge in Your noble Face and Your perfect words from the evil of every creature You hold by its forelock. O Allah, You remove debt and sin. O Allah, Your army is never defeated, Your promise is never broken, and the wealth of the wealthy cannot avail him against You. Glory be to You and praise.","ru":"О Аллах, прибегаю к Твоему благородному Лику и Твоим совершенным словам от зла всего, что Ты держишь за хохол. О Аллах, Ты избавляешь от долга и греха. О Аллах, Твоё войско не бывает разбито, Твоё обещание не нарушается, и богатство не поможет богатому перед Тобой. Пречист Ты, и хвала Тебе.","n":1,"src":["ad"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h333":{"ar":"بِاسْمِ اللَّهِ يُبْرِيكَ، وَمِنْ كُلِّ دَاءٍ يَشْفِيكَ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ، وَشَرِّ كُلِّ ذِي عَيْنٍ.","en":"In the name of Allah, may He heal you; may He cure you of every illness, and from the evil of an envier when he envies and the evil of every eye.","ru":"С именем Аллаха, да исцелит Он тебя, да излечит от всякой болезни, от зла завистника, когда он завидует, и от зла всякого обладателя дурного глаза.","n":1,"src":["muslim"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"h334":{"ar":"اللَّهُمَّ اشْفِ عَبْدَكَ يَنْكَأُ لَكَ عَدُوًّا، أَوْ يَمْشِي لَكَ إِلَى صَلاةٍ.","en":"O Allah, cure Your servant so that he may strike an enemy for You or walk to a prayer for You.","ru":"О Аллах, исцели Своего раба, чтобы он мог сразить ради Тебя врага или пойти ради Тебя на намаз.","n":1,"src":["ad"],"t":{"en":"Ruqyah from the Sunnah","ru":"Рукъя из Сунны","ar":"الرقية الشرعية من السنة النبوية"}},"b1":{"ar":"رَبِّ أَعِنِّي وَلَا تُعِنْ عَلَيَّ، وَانْصُرْنِي وَلَا تَنْصُرْ عَلَيَّ، وَامْكُرْ لِي وَلَا تَمْكُرْ عَلَيَّ، وَانْصُرْنِي عَلَى مَنْ بَغَى عَلَيَّ، رَبِّ اجْعَلْنِي لَكَ شَكَّارًا، لَكَ ذَكَّارًا، لَكَ رَهَّابًا، لَكَ مُخْبِتًا، إِلَيْكَ أَوَّاهًا مُنِيبًا، رَبِّ تَقَبَّلْ تَوْبَتِي، وَاغْسِلْ حَوْبَتِي، وَأَجِبْ دَعْوَتِي، وَثَبِّتْ حُجَّتِي، وَاهْدِ قَلْبِي، وَسَدِّدْ لِسَانِي، وَاسْلُلْ سَخِيمَةَ قَلْبِي","src":["ahmad"],"tl":"Рабби, а’инни уа ля ту’ин ‘аляййа, уа-нсурни уа ля тансур ‘аляййа, уа-мкур ли уа ля тамкур ‘аляййа, уа-нсурни ‘аля ман бага ‘аляййа! Рабби-дж’альни лякя шаккаран, лякя заккаран, лякя раххабан, лякя мухбитан, иляйкя аввахан, мунибан! Рабби, такаббаль таубати, уа г‘сил хавбати уа аджиб да’вати, уа саббит худжжати, уа-хди кальби, уа саддид лисани, уа-слюль сахимата кальби!","ru":"Господи, помоги мне, но не помогай против меня, даруй мне победу и не даруй победу надо мной врагам моим, хитри в мою пользу и не хитри против меня, и помоги мне против моих притеснителей! О Аллах, сделай меня благодарным Тебе, поминающим Тебя, страшащимся Тебя, покорным Тебе, смиренным пред Тобою или же раскаивающимся. Господи, прими моё покаяние, смой с меня грех мой, ответь на мою мольбу, даруй силу словам моим, направь моё сердце к истине, исправь речь мою и удали из сердца моего злобу!","en":"My Lord, help me and do not help against me; give me victory and do not give victory over me; plan for me and do not plan against me; and help me against those who wrong me. My Lord, make me ever grateful to You, ever remembering You, ever fearful of You, ever humble before You, and ever turning to You in repentance. My Lord, accept my repentance, wash away my sin, answer my supplication, establish my proof, guide my heart, make my tongue truthful and remove the rancour from my heart.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b3":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْعَجْزِ، وَالْكَسَلِ، وَالْجُبْنِ، وَالْبُخْلِ، وَالْهَرَمِ، وَعَذَابِ الْقَبْرِ، اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا، وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا، أَنْتَ وَلِيُّهَا وَمَوْلَاهَا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ قَلْبٍ لَا يَخْشَعُ، وَنَفْسٍ لَا تَشْبَعُ، وَعِلْمٍ لَا يَنْفَعُ، وَدَعْوَةٍ لَا يُسْتَجَابُ لَهَا","src":["muslim"],"tl":"Аллахумма, инни а‘узу бикя мина-ль-‘аджзи, уа-ль-касали, уа-ль-джубни уа-ль-бухли, уа-ль-харами уа ‘азаби-ль-кабр! Аллахумма, ати нафси такваха, уа заккиха, Анта хайру ман заккаха, Анта Валийуха уа Мауляха! Аллахумма, инни а‘узу бикя мин кальбин ля йахша‘у, уа мин нафсин ля ташба‘у уа ‘ильмин ля йанфа‘у, уа да‘ватин ля йустаджабу ляха!","ru":"О Аллах, поистине, я ищу Твоей защиты от слабости и лени, от малодушия и скупости, и от старческой дряхлости, и от мучений могилы! О Аллах, даруй душе моей богобоязненность и очисти её, ведь Ты – лучший очищающий её, и Ты – её Покровитель и Владыка! О Аллах, поистине, я ищу Твоей защиты от сердца, не проявляющего смирения, и от души, которая не насыщается, и от бесполезного знания, и от мольбы, на которую не будет дан ответ!","en":"O Allah, I seek refuge in You from helplessness and laziness, from cowardice and miserliness, from decrepit old age and from the punishment of the grave. O Allah, grant my soul its piety and purify it, for You are the best to purify it; You are its Guardian and Protector. O Allah, I seek refuge in You from a heart that is not humble, a soul that is never satisfied, knowledge that does not benefit, and a supplication that is not answered.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b4":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ، وَتَحَوُّلِ عَافِيَتِكَ، وَمِنْ فُجَاءَةِ نِقْمَتِكَ، وَمِنْ جَمِيعِ سَخَطِكَ","src":["muslim"],"tl":"Аллахумма инни а‘узу бикя мин завали ни‘матикя уа тахаввули ‘афийатикя уа мин фуджаати никматикя уа мин джами‘и сахатыкя!","ru":"О Аллах, я прошу у Тебя защиты от ухода милости и благополучия, дарованных Тобой, и от внезапного прихода наказания Твоего, и от всех [проявлений] Твоего недовольства!","en":"O Allah, I seek refuge in You from the loss of Your blessing, the change of the well-being You have given, the suddenness of Your punishment and all of Your displeasure.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b6":{"ar":"اللَّهُمَّ اهْدِنِي، وَارْزُقْنِي، وَعَافِنِي، وَارْحَمْنِي","src":["muslim"],"tl":"Аллахумма, хдини уа-рзукни уа ‘афини уа-рхамни!","ru":"О Аллах, наставь меня и даруй мне удел, и даруй мне благополучие, и помилуй меня!","en":"O Allah, guide me, provide for me, grant me well-being and have mercy on me.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b7":{"ar":"اللَّهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا، وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا، وَعَذَابِ الْآخِرَةِ","src":["ahmad"],"tl":"Аллахумма, ахсин ‘акыбатана фи-ль-умури куллиха уа аджирна мин хизйи-д-дунйа уа ‘азаби-ль-ахырати!","ru":"О Аллах, сделай исход всех наших дел благим и защити нас от позора в жизни дольней и от наказания в Жизни Последней!","en":"O Allah, make the outcome of all our affairs good, and protect us from disgrace in this world and from the punishment of the Hereafter.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b8":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ، وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ، وَحُسْنَ عِبَادَتِكَ، وَأَسْأَلُكَ قَلْبًا سَلِيمًا، وَلِسَانًا صَادِقًا، وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا تَعْلَمُ، إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ","src":["ahmad"],"tl":"Аллахумма инни ас-алюкя ас-сабата фи-ль-амри, уа-ль-‘азыймата ‘аля-р-рушди, уа ас-алюкя шукра ни’матикя, уа хусна ‘ибадатикя, уа ас’алюкя кальбан салийман, уа лисанан садикан, уа ас-алюкя мин хайри ма та’ляму, уа ‘аузу бикя мин шарри ма та’ляму, уа астагфирукя ли ма та’ляму, иннакя Анта ‘алляму-ль-гуюб","ru":"О Аллах, поистине, я прошу Тебя о стойкости в делах и решимости на истинном пути. И прошу Тебя сделать так, чтобы я благодарил Тебя за оказанную Тобой милость и должным образом поклонялся Тебе. И прошу Тебя о здравом сердце и правдивом языке. И прошу у Тебя блага, о котором Ты знаешь, прибегаю к Твоей защите от зла, о котором Ты знаешь, и прошу простить мне то, о чем Ты знаешь. Поистине, Тебе ведомо всё сокровенное!","en":"O Allah, I ask You for firmness in the matter and resolve upon right guidance. I ask You for gratitude for Your blessing and excellence in worshipping You. I ask You for a sound heart and a truthful tongue. I ask You for the good of what You know, I seek refuge in You from the evil of what You know, and I ask Your forgiveness for what You know. Indeed, You are the Knower of the unseen.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b9":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الطَّيِّبَاتِ، وَفِعْلَ الْخَيْرَاتِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَأَنْ تَتُوبَ عَلَيَّ، وَتَغْفِرَ لِي وَتَرْحَمَنِي، وَإِذَا أَرَدْتَ فِي خَلْقِكَ فِتْنَةً فَنَجِّنِي إِلَيْكَ مِنْهَا غَيْرَ مَفْتُونٍ، اللَّهُمَّ وَأَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ عَمَلٍ يُقَرِّبُنِي إِلَى حُبِّكَ","src":["hakim"],"tl":"Аллахумма, инни ас’алюкя-т-таййибати, уа фи‘ля-ль-хайрати, уа тарка-ль-мункарати, уа хубба-ль-масакини, уа ан татуба ‘аляййа, уа тагъфира ли уа тархамни, уа иза арадта фи халькыка фитнатан, фа-наджини иляйкя минха гайра мафтун. Аллахумма, уа ас’алюкя хуббака уа хубба ман йухиббука, уа хубба ‘амалин йукаррибуни иля хуббика!","ru":"О Аллах! Поистине, я прошу у Тебя благ и совершения благих деяний, и оставления порицаемого, и любви к беднякам, и чтобы Ты принял моё покаяние, и простил мне, и помиловал меня! И когда пожелаешь Ты подвергнуть творения Твои искушению, то избавь меня от этого, [забрав] к Себе, чтобы не подвергнуться мне искушению! О Аллах, и прошу у Тебя любви к Тебе, и любви к тому, кто любит Тебя, и любви к деянию, которое приблизит меня к Тебе!","en":"O Allah, I ask You for good things, for doing good deeds, for leaving evil deeds and for love of the poor; that You accept my repentance, forgive me and have mercy on me; and when You will a trial for Your creation, take me to You without being tried. O Allah, I ask You for Your love, the love of those who love You, and the love of deeds that bring me closer to Your love.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b10":{"ar":"اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي، وَعَلِّمْنِي مَا يَنْفَعُنِي، وَارْزُقْنِي عِلْمًا يَنْفَعُنِي","src":["hakim"],"tl":"Аллахумма, инфа’ни бима ‘аллямтани, уа ‘аллимни ма йанфа’уни, уа-рзукни ‘ильман йанфа‘уни","ru":"О Аллах, сделай для меня полезным то, чему научил Ты меня; научи меня тому, что будет полезным для меня, и надели меня знанием, которое принесёт мне пользу!","en":"O Allah, benefit me by what You have taught me, teach me what will benefit me, and grant me knowledge that benefits me.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"b11":{"ar":"اللَّهُمَّ إِنَّا نَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ، وَعَزَائِمَ مَغْفِرَتِكَ، وَالسَّلَامَةَ مِنْ كُلِّ إِثْمٍ، وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ، وَالْفَوْزَ بِالْجَنَّةِ، وَالنَّجَاةَ مِنَ النَّارِ","src":["hakim"],"tl":"Аллахумма, инна нас’алюка муджибати рахматикя, уа ‘аза’има магфиратикя, уа-с-салямата мин кулли исмин, уа-ль-ганимата мин кулли биррин, уа-ль-фауза би-ль-джаннати уа-н-наджата мина-н-нар!","ru":"О Аллах, поистине, мы просим Тебя о том, что обязательно [приведёт к проявлению] Твоей милости и непременно [позволит обрести] Твоё прощение, и об избавлении от всякого греха, и об умножении всякого блага, и об обретении Рая, и о спасении от Огня!","en":"O Allah, we ask You for what makes Your mercy certain and Your forgiveness assured, for safety from every sin, the gain of every good deed, success in attaining Paradise and salvation from the Fire.","n":1,"t":{"en":"Protection (Ibn al-Qayyim)","ru":"Защита · Ибн Каййим","ar":"أدعية الحفظ"},"note":{"en":"From Ibn al-Qayyim’s “Al-Wabil as-Sayyib”: supplications of protection to add to the morning and evening adhkar.","ru":"Из книги Ибн Каййима «Благодатный дождь»: мольбы о защите, которые желательно добавить к утренним и вечерним азкарам.","ar":"من الوابل الصيب لابن القيم"}},"h332s":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِوَجْهِكَ الْكَرِيمِ وَكَلِمَاتِكَ التَّامَّةِ مِنْ شَرِّ مَا أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللَّهُمَّ أَنْتَ تَكْشِفُ الْمَغْرَمَ وَالْمَأْثَمَ، اللَّهُمَّ لَا يُهْزَمُ جُنْدُكَ، وَلَا يُخْلَفُ وَعْدُكَ، وَلَا يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ، سُبْحَانَكَ وَبِحَمْدِكَ.","en":"O Allah, I seek refuge in Your noble Face and Your perfect words from the evil of every creature You hold by its forelock. O Allah, You remove debt and sin. O Allah, Your army is never defeated, Your promise is never broken, and the wealth of the wealthy cannot avail him against You. Glory be to You and praise.","ru":"О Аллах, прибегаю к Твоему благородному Лику и Твоим совершенным словам от зла всего, что Ты держишь за хохол. О Аллах, Ты избавляешь от долга и греха. О Аллах, Твоё войско не бывает разбито, Твоё обещание не нарушается, и богатство не поможет богатому перед Тобой. Пречист Ты, и хвала Тебе.","n":1,"src":["ad"],"t":{"en":"Lying down","ru":"Ложась спать","ar":"عند النوم"},"note":{"en":"The Prophet ﷺ said this when lying down to sleep.","ru":"Пророк ﷺ говорил это, ложась спать.","ar":""}}},"L":{"morning":["h0","h1","h2","h3","h4","h5","h6","h7","h8","h9","h10","h11","h12","h13","h14","h15","h16","h17","h18","h19","h20","h21","h22","h23","h24","h25","h26","h27","m_tahlil10","h28","h29","h30","b1","h157","b3","b4","d_afw","b6","b7","b8","b9","b10","b11"],"evening":["h31","h32","h33","h34","h35","h36","h37","h38","h39","h40","h41","h42","h43","h44","h45","h46","h47","h48","h49","h50","h51","h52","h53","h54","h55","h56","h57","m_tahlil10","h58","h59","h60","b1","h157","b3","b4","d_afw","b6","b7","b8","b9","b10","b11"],"sleep":["h135","h136","h137","h138","h139","h14 92","h293","h294","h295","h296","h297","h298","h299","h300","h301","h312","h313","h314","h316","h319","h320","h321","h322","h324","h328","h329","h330","h331","h332","h333","h334"],"surahs":[]},"S":[{"id":"s_kursi","title":["Ayat al-Kursi · 2:255","Аят аль-Курси · 2:255","آية الكرسي"],"src":["nasai","bukhari"],"noB":1,"ar":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾","en":"Allāh - there is no deity except Him, the Ever-Living, the Self-Sustaining. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursī extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.","ru":"Аллах — нет божества, кроме Него — Живой, Поддерживающий всё сущее. Его не одолевает ни дремота, ни сон. Ему принадлежит всё, что в небесах, и всё, что на земле. Кто же тот, кто заступится у Него иначе как с Его дозволения? Он знает, что перед ними и что после них, а они ничего не постигают из Его знания, кроме того, что Он пожелает. Подножие Его Трона[20] объемлет небеса и землю, и не тяготит Его охрана их. Он — Возвышенный, Великий.","when":{"en":"After every obligatory prayer, morning and evening, and before sleep.","ru":"После каждого обязательного намаза, утром и вечером и перед сном.","ar":"دبر كل صلاة، وفي الصباح والمساء، وعند النوم."}},{"id":"s_baq","title":["Al-Baqarah 2:285–286","аль-Бакара 2:285–286","خواتيم البقرة"],"src":["bm"],"noB":1,"ar":"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾","en":"The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allāh and His angels and His books and His messengers, [saying], \"We make no distinction between any of His messengers.\" And they say, \"We hear and we obey. [We seek] Your forgiveness, our Lord, and to You is the [final] destination.\" Allāh does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. \"Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.\"","ru":"Посланник уверовал в то, что было ниспослано ему от его Господа, и верующие. Каждый уверовал в Аллаха, в Его ангелов, в Его Писания и в Его посланников: «Мы не разделяем между кем-либо из Его посланников». Они сказали: «Мы услышали и повиновались. Твоего прощения [просим], Господь наш, и к Тебе — конечный исход». Аллах не возлагает на душу больше того, что она способна вынести. Ей — то, что она приобрела, и против неё — то, что она заслужила. «Господь наш! Не взыщи с нас, если мы забыли или ошиблись. Господь наш! Не возлагай на нас бремя, подобно тому, как Ты возложил его на тех, которые были до нас. Господь наш! Не возлагай на нас того, чего мы не в силах вынести. Будь снисходителен к нам, прости нам и помилуй нас. Ты — наш Покровитель, так помоги же нам против людей, отвергших веру».","when":{"en":"Every night. Whoever recites them at night, they will suffice him.","ru":"Каждую ночь. Кто прочтёт их ночью, тому их будет достаточно.","ar":"من قرأهما في ليلة كفتاه."}},{"id":"s1","sura":1,"title":["Al-Fatiha · 1","аль-Фатиха · 1","سورة الفاتحة"],"src":["bm"],"when":{"en":"In every rak’ah of every prayer. There is no prayer without it.","ru":"В каждом ракаате каждого намаза. Нет намаза без неё.","ar":"في كل ركعة؛ لا صلاة لمن لم يقرأ بفاتحة الكتاب."},"verses":7},{"id":"s67","sura":67,"title":["Al-Mulk · 67","аль-Мульк · 67","سورة الملك"],"src":["tir"],"when":{"en":"Every night before sleep. It intercedes for its reader and protects from the punishment of the grave.","ru":"Каждую ночь перед сном. Она заступится за читающего и защищает от мучений в могиле.","ar":"كل ليلة قبل النوم؛ تشفع لصاحبها وهي المانعة من عذاب القبر."},"verses":30},{"id":"s32","sura":32,"title":["As-Sajdah · 32","ас-Сажда · 32","سورة السجدة"],"src":["tir"],"when":{"en":"Before sleep with Al-Mulk, and in the Fajr prayer on Friday with Al-Insan.","ru":"Перед сном вместе с «аль-Мульк» и в утреннем намазе пятницы вместе с «аль-Инсан».","ar":"قبل النوم مع الملك، وفي فجر الجمعة مع الإنسان."},"verses":30},{"id":"s18","sura":18,"title":["Al-Kahf · 18","аль-Кахф · 18","سورة الكهف"],"src":["hakim","bayhaqi"],"when":{"en":"Every Friday: a light shines for its reader between the two Fridays. Memorising its first ten verses protects from the Dajjal (Muslim).","ru":"Каждую пятницу: читающему будет свет между двумя пятницами. Заучивание первых десяти аятов защищает от Даджаля (Муслим).","ar":"يوم الجمعة؛ أضاء له من النور ما بين الجمعتين. ومن حفظ عشر آيات من أولها عُصم من الدجال."},"verses":110},{"id":"s36","sura":36,"title":["Ya-Sin · 36","Ясин · 36","سورة يس"],"src":[],"when":{"en":"Many read it on Thursday night and for the dying. The specific hadiths about this are graded weak by many scholars, so read it as part of your regular Quran.","ru":"Многие читают её в ночь на пятницу и над умирающим. Конкретные хадисы об этом многие учёные считают слабыми, поэтому читайте её как часть обычного чтения Корана.","ar":"يقرؤها كثيرون ليلة الجمعة وعند المحتضر، والأحاديث الخاصة بذلك ضعّفها كثير من العلماء."},"verses":83},{"id":"s55","sura":55,"title":["Ar-Rahman · 55","ар-Рахман · 55","سورة الرحمن"],"src":["tir"],"when":{"en":"Any time. When the Prophet ﷺ recited it to the jinn, they answered each “Which of the favours of your Lord would you deny?” with: Nor any of Your favours do we deny, our Lord; to You is praise.","ru":"В любое время. Когда Пророк ﷺ прочитал её джиннам, на каждое «Какую же из милостей вашего Господа вы считаете ложью?» они отвечали: «Ни одну из Твоих милостей мы не отрицаем, Господь наш, и Тебе хвала».","ar":"كان الجن يقولون: لا بشيء من نعمك ربنا نكذب فلك الحمد."},"verses":78},{"id":"s56","sura":56,"title":["Al-Waqiah · 56","аль-Вакиа · 56","سورة الواقعة"],"src":[],"when":{"en":"Often read every night for provision. The hadith about this is graded weak by many scholars.","ru":"Её часто читают каждую ночь ради удела. Хадис об этом многие учёные считают слабым.","ar":"تُقرأ كثيراً كل ليلة، والحديث في ذلك ضعيف عند كثير من العلماء."},"verses":96},{"id":"s62","sura":62,"title":["Al-Jumuah · 62","аль-Джумуа · 62","سورة الجمعة"],"src":["muslim"],"when":{"en":"In the Friday (Jumu’ah) prayer, with Al-Munafiqun.","ru":"В пятничном намазе вместе с «аль-Мунафикун».","ar":"في صلاة الجمعة مع المنافقون."},"verses":11},{"id":"s63","sura":63,"title":["Al-Munafiqun · 63","аль-Мунафикун · 63","سورة المنافقون"],"src":["muslim"],"when":{"en":"In the F одь наш, и хвала Тебе; о Аллах, прости меня».","ar":"كان ﷺ يكثر أن يقول في ركوعه وسجوده: سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي."},"verses":3},{"id":"s111","sura":111,"title":["Al-Masad · 111","аль-Масад · 111","سورة المسد"],"src":[],"when":{"en":"In any prayer after Al-Fatiha. One of the surahs of Juz Amma most often recited in the five daily prayers.","ru":"В любом намазе после «аль-Фатихи». Одна из сур джуза Амма, которые чаще всего читают в пяти ежедневных намазах.","ar":"في أي صلاة بعد الفاتحة؛ من سور جزء عمّ التي تُقرأ كثيراً في الصلوات."},"verses":5},{"id":"s112","sura":112,"title":["Al-Ikhlas · 112","аль-Ихлас · 112","سورة الإخلاص"],"src":["bukhari","ad"],"when":{"en":"Equal to a third of the Quran. Three times morning and evening, before sleep, after every prayer, in the sunnah of Fajr and the last rak’ah of Witr.","ru":"Равна трети Корана. Трижды утром и вечером, перед сном, после каждого намаза, в сунне фаджра и последнем ракаате витра.","ar":"تعدل ثلث القرآن؛ ثلاثاً صباحاً ومساءً، وعند النوم، ودبر كل صلاة."},"verses":4},{"id":"s113","sura":113,"title":["Al-Falaq · 113","аль-Фаляк · 113","سورة الفلق"],"src":["ad","tir"],"when":{"en":"Three times morning and evening, before sleep and after every prayer, with Al-Ikhlas and An-Nas.","ru":"Трижды утром и вечером, перед сном и после каждого намаза, вместе с «аль-Ихлас» и «ан-Нас».","ar":"ثلاثاً صباحاً ومساءً، وعند النوم، ودبر كل صلاة."},"verses":5},{"id":"s114","sura":114,"title":["An-Nas · 114","ан-Нас · 114","سورة الناس"],"src":["ad","tir"],"when":{"en":"Three times morning and evening, before sleep and after every prayer, with Al-Ikhlas and Al-Falaq.","ru":"Трижды утром и вечером, перед сном и после каждого намаза, вместе с «аль-Ихлас» и «аль-Фаляк».","ar":"ثلاثاً صباحاً ومساءً، وعند النوم، ودبر كل صلاة."},"verses":6},{"id":"s_baqhome","title":["Al-Baqarah · 2","аль-Бакара · 2","سورة البقرة"],"src":["muslim"],"when":{"en":"Recite it at home: Satan flees from a house in which Al-Baqarah is recited. Al-Baqarah and Al Imran will come on the Day of Resurrection to argue for their companions.","ru":"Читайте её дома: шайтан убегает из дома, где читают «аль-Бакару». «Аль-Бакара» и «Али Имран» придут в День воскресения, заступаясь за своих чтецов.","ar":"إن الشيطان ينفر من البيت الذي تُقرأ فيه سورة البقرة، والزهراوان تحاجّان عن أصحابهما."}}],"QT":{"1":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ"],"en":["In the name of Allāh, the Entirely Merciful, the Especially Merciful.","[All] praise is [due] to Allāh, Lord of the worlds -","The Entirely Merciful, the Especially Merciful,","Sovereign of the Day of Recompense.","It is You we worship and You we ask for help.","Guide us to the straight path -","The path of those upon whom You have bestowed favor, not of those who have earned [Your] anger or of those who are astray."],"ru":["С именем Аллаха, Всемилостивого, Милующего[1].","Хвала Аллаху, Господу миров,","Всемилостивому, Милующему,","Владыке Дня Воздаяния.","Тебе одному мы поклоняемся, и Тебя одного просим о помощи.","Веди нас путём прямым —","путём тех, которых Ты облагодетельствовал, а не тех, на кого пал [Твой] гнев, и не заблудших."]},"67":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ","الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا وَهُوَ الْعَزِيزُ الْغَفُورُ","الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ","ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ","وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ","وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ وَبِئْسَ الْمَصِيرُ","إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ","قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ كَبِيرٍ","وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ","فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ","إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَبِيرٌ","وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ","أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ","هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ وَإِلَيْهِ النُّشُورُ","أَأَمِنتُم مَّن فِي السَّمَاءِ أَن يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ","أَمْ أَمِنتُم مَّن فِي السَّمَاءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ","وَلَقَدْ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ","أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَٰنُ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ","أَمَّنْ هَٰذَا الَّذِي هُوَ جُندٌ لَّكُمْ يَنصُرُكُم مِّن دُونِ الرَّحْمَٰنِ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ","أَمَّنْ هَٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ بَل لَّجُّوا فِي عُتُوٍّ وَنُفُورٍ","أَفَمَن يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ أَمَّن يَمْشِي سَوِيًّا عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ","قُلْ هُوَ الَّذِي أَنشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَّا تَشْكُرُونَ","قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ","وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ","قُلْ إِنَّمَا الْعِلْمُ عِندَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُّبِينٌ","فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا وَقِيلَ هَٰذَا الَّذِي كُنتُم بِهِ تَدَّعُونَ","قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا فَمَن يُجِيرُ الْكَافِرِينَ مِنْ عَذَابٍ أَلِيمٍ","قُلْ هُوَ الرَّحْمَٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا فَسَتَعْلَمُونَ مَنْ هُوَ فِي ضَلَالٍ مُّبِينٍ","قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ"],"en":["Blessed is He in whose hand is dominion, and He is over all things competent -","[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving -","[And] who created seven heavens in layers. You do not see in the creation of the Most Merciful any inconsistency. So return [your] vision [to the sky]; do you see any breaks?","Then return [your] vision twice again. [Your] vision will return to you humbled while it is fatigued.","And We have certainly beautified the nearest heaven with lamps [i.e., stars] and have made [from] them what is thrown at the devils and have prepared for them the punishment of the Blaze.","And for those who disbelieved in their Lord is the punishment of Hell, and wretched is the destination.","When they are thrown into it, they hear from it a [dreadful] inhaling while it boils up.","It almost bursts with rage. Every time a company is thrown into it, its keepers ask them, \"Did there not come to you a warner?\"","They will say, \"Yes, a warner had come to us, but we denied and said, 'Allāh has not sent down anything. You are not but in great error.'\"","And they will say, \"If only we had been listening or reasoning, we would not be among the companions of the Blaze.\"","And they will admit their sin, so [it is] alienation for the companions of the Blaze.","Indeed, those who fear their Lord unseen will have forgiveness and great reward.","And conceal your speech or publicize it; indeed, He is Knowing of that within the breasts.","Does He who created not know, while He is the Subtle, the Aware?","It is He who made the earth tame for you - so walk among its slopes and eat of His provision - and to Him is the resurrection.","Do you feel secure that He who is above would not cause the earth to swallow you and suddenly it would sway?","Or do you feel secure that He who is above would not send against you a storm of stones? Then you would know how [severe] was My warning.","And already had those before them denied, and how [terrible] was My reproach.","Do they not see the birds above them with wings outspread and [sometimes] folded in? None holds them [aloft] except the Most Merciful. Indeed He is, of all things, Seeing.","Or who is it that could be an army for you to aid you other than the Most Merciful? The disbelievers are not but in delusion.","Or who is it that could provide for you if He withheld His provision? But they have persisted in insolence and aversion.","Then is one who walks fallen on his face better guided or one who walks erect on a straight path?","Say, \"It is He who has produced you and made for you hearing and vision and hearts [i.e., intellect]; little are you grateful.\"","Say, \"It is He who has multiplied you throughout the earth, and to Him you will be gathered.\"","And they say, \"When is this promise, if you should be truthful?\"","Say, \"The knowledge is only with Allāh, and I am only a clear warner.\"","But when they see it approaching, the faces of those who disbelieve will be distressed, and it will be said, \"This is that for which you used to call.\"","Say, [O Muḥammad], \"Have you considered: whether Allāh should cause my death and those with me or have mercy upon us, who can protect the disbelievers from a painful punishment?\"","Say, \"He is the Most Merciful; we have believed in Him, and upon Him we have relied. And you will [come to] know who it is that is in clear error.\"","Say, \"Have you considered: if your water was to become sunken [into the earth], then who could bring you flowing water?\""],"ru":["Благословен Тот, в Чьей руке владычество[73], и Он всемогущ над всем сущим.","Тот, Кто сотворил смерть и жизнь, чтобы испытать вас, кто из вас лучше по деяниям. Он — Могущественный, Прощающий,","Тот, Кто сотворил семь небес, одно над другим. Ты не увидишь в творении Всемилостивого никакого изъяна. Так обрати свой взор снова: видишь ли ты какие-либо трещины?","Затем обрати свой взор ещё раз — он вернётся к тебе униженным, утомлённым.","Действительно, Мы украсили ближнее небо светильниками и сделали их для побивания шайтанов. И Мы уготовили для них наказание пылающего огня.","А для тех, которые отвергли веру в своего Господа — наказание Геенны, и сколь ужасен этот исход!","Когда они будут ввергнуты в неё, они услышат её рёв, и она будет клокотать.","Она едва не разрывается от ярости. Всякий раз, когда в неё ввергается толпа, её стражи спрашивают их: «Разве к вам не приходил предостерегающий?»","Они скажут: «Да, к нам приходил предостерегающий, но мы сочли его лжецом и сказали: “Аллах ничего не ниспосылал, а вы — не иначе как в большом заблуждении”».","И они скажут: «Если бы мы послушали или разумели, мы не оказались бы среди обитателей пылающего огня».","Они признались в своём грехе. Погибель обитателям пылающего огня!","Воистину, те, которые страшатся своего Господа втайне, — для них прощение и большая награда.","Скроете ли вы своё слово или произнесёте его вслух — Он знает сокровенное в сердцах.","Разве не знает Тот, Кто сотворил, тогда как Он — Проницательный, Сведущий?","Он — Тот, Кто сделал для вас землю покорной; так ходите же по её просторам и ешьте из Его удела. И к Нему — воскрешение.","Неужели вы чувствуете себя в безопасности от Того, Кто на небе, что Он заставит землю поглотить вас — и вот она приходит в движение?","Или же вы чувствуете себя в безопасности от Того, Кто на небе, что Он пошлёт на вас каменный вихрь? И вы узнаете, каково Моё предостережение!","Действительно, те, которые были до них, сочли истину ложью — так каково же было Моё негодование?","Разве они не видят птиц над собой, распростёрших и складывающих крылья? Не удерживает их никто, кроме Всемилостивого. Воистину, Он видит всё сущее.","Кто же это ваше воинство, которое поможет вам помимо Всемилостивого? Воистину, отвергшие веру пребывают лишь в самообольщении.","Кто же наделит вас уделом, если Он удержит Свой удел? Нет, напротив, они упорствуют в надменности и уклонении!","Неужели тот, кто идёт, падая лицом, — на более верном пути, чем тот, кто идёт прямо по прямому пути?","Скажи: «Он — Тот, Кто сотворил вас, и сделал для вас слух, зрение и сердца. Как же мало вы благодарите!»","Скажи: «Он — Тот, Кто расселил вас на земле. И к Нему вы будете собраны».","И они говорят: «Когда это обещание, если вы правдивы?»","Скажи: «Воистину, знание об этом — только у Аллаха, и я — лишь ясный предостерегающий».","Когда же они увидят его вблизи, помрачнеют лица тех, которые отвергли веру, и будет сказано: «Это то, что вы торопили!»","Скажи: «Как вы думаете, если Аллах погубит меня и тех, кто со мной, или помилует нас, то кто защитит отвергших веру от мучительного наказания?»","Скажи: «Он — Всемилостивый. Мы уверовали в Него и на Него уповаем. И вы скоро узнаете, кто же пребывает в явном заблуждении».","Скажи: «Как вы думаете, если ваша вода уйдёт вглубь [земли], то кто же придёт к вам с родниковой водой?»"]},"32":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الم","تَنزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِن رَّبِّ الْعَالَمِينَ","أَمْ يَقُولُونَ افْتَرَاهُ بَلْ هُوَ الْحَقُّ مِن رَّبِّكَ لِتُنذِرَ قَوْمًا مَّا أَتَاهُم مِّن نَّذِيرٍ مِّن قَبْلِكَ لَعَلَّهُمْ يَهْتَدُونَ","اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ مَا لَكُم مِّن دُونِهِ مِن وَلِيٍّ وَلَا شَفِيعٍ أَفَلَا تَتَذَكَّرُونَ","يُدَبِّرُ الْأَمْرَ مِنَ السَّمَاءِ إِلَى الْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ أَلْفَ سَنَةٍ مِّمَّا تَعُدُّونَ","ذَٰلِكَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْعَزِيزُ الرَّحِيمُ","الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ وَبَدَأَ خَلْقَ الْإِنسَانِ مِن طِينٍ","ثُمَّ جَعَلَ نَسْلَهُ مِن سُلَالَةٍ مِّن مَّاءٍ مَّهِينٍ","ثُمَّ سَوَّاهُ وَنَفَخَ فِيهِ مِن رُّوحِهِ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَّا تَشْكُرُونَ","وَقَالُوا أَإِذَا ضَلَلْنَا فِي الْأَرْضِ أَإِنَّا لَفِي خَلْقٍ جَدِيدٍ بَلْ هُم بِلِقَاءِ رَبِّهِمْ كَافِرُونَ","قُلْ يَتَوَفَّاكُم مَّلَكُ الْمَوْتِ الَّذِي وُكِّلَ بِكُمْ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَ","وَلَوْ تَرَىٰ إِذِ الْمُجْرِمُونَ نَاكِسُو رُءُوسِهِمْ عِندَ رَبِّهِمْ رَبَّنَا أَبْصَرْنَا وَسَمِعْنَا فَارْجِعْنَا نَعْمَلْ صَالِحًا إِنَّا مُوقِنُونَ","وَلَوْ شِئْنَا لَآتَيْنَا كُلَّ نَفْسٍ هُدَاهَا وَلَٰكِنْ حَقَّ الْقَوْلُ مِنِّي لَأَمْلَأَنَّ جَهَنَّمَ مِنَ الْجِنَّةِ وَالنَّاسِ أَجْمَعِينَ","فَذُوقُوا بِمَا نَسِيتُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا إِنَّا نَسِينَاكُمْ وَذُوقُوا عَذَابَ الْخُلْدِ بِمَا كُنتُمْ تَعْمَلُونَ","إِنَّمَا يُؤْمِنُ بِآيَاتِنَا الَّذِينَ إِذَا ذُكِّرُوا بِهَا خَرُّوا سُجَّدًا وَسَبَّحُوا بِحَمْدِ رَبِّهِمْ وَهُمْ لَا يَسْتَكْبِرُونَ","تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ","فَلَا تَعْلَمُ نَفْسٌ مَّا أُخْفِيَ لَهُم مِّن قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونَ","أَفَمَن كَانَ مُؤْمِنًا كَمَن كَانَ فَاسِقًا لَّا يَسْتَوُونَ","أَمَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ جَنَّاتُ الْمَأْوَىٰ نُزُلًا بِمَا كَانُوا يَعْمَلُونَ","وَأَمَّا الَّذِينَ فَسَقُوا فَمَأْوَاهُمُ النَّارُ كُلَّمَا أَرَادُوا أَن يَخْرُجُوا مِنْهَا أُعِيدُوا فِيهَا وَقِيلَ لَهُمْ ذُوقُوا عَذَابَ النَّارِ الَّذِي كُنتُم بِهِ تُكَذِّبُونَ","وَلَنُذِيقَنَّهُم مِّنَ الْعَذَابِ الْأَدْنَىٰ دُونَ الْعَذَابِ الْأَكْبَرِ لَعَلَّهُمْ يَرْجِعُونَ","وَمَنْ أَظْلَمُ مِمَّن ذُكِّرَ بِآيَاتِ رَبِّهِ ثُمَّ أَعْرَضَ عَنْهَا إِنَّا مِنَ الْمُجْرِمِينَ مُنتَقِمُونَ","وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ فَلَا تَكُن فِي مِرْيَةٍ مِّن لِّقَائِهِ وَجَعَلْنَاهُ هُدًى لِّبَنِي إِسْرَائِيلَ","وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُوا وَكَانُوا بِآيَاتِنَا يُوقِنُونَ","إ
