,"وَخَلَقَ الْجَانَّ مِن مَّارِجٍ مِّن نَّارٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","مَرَجَ الْبَحْرَيْنِ يَلْتَقِيَانِ","بَيْنَهُمَا بَرْزَخٌ لَّا يَبْغِيَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","يَخْرُجُ مِنْهُمَا اللُّؤْلُؤُ وَالْمَرْجَانُ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","وَلَهُ الْجَوَارِ الْمُنشَآتُ فِي الْبَحْرِ كَالْأَعْلَامِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","كُلُّ مَنْ عَلَيْهَا فَانٍ","وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","يَسْأَلُهُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ كُلَّ يَوْمٍ هُوَ فِي شَأْنٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","سَنَفْرُغُ لَكُمْ أَيُّهَ الثَّقَلَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","يَا مَعْشَرَ الْجِنِّ وَالْإِنسِ إِنِ اسْتَطَعْتُمْ أَن تَنفُذُوا مِنْ أَقْطَارِ السَّمَاوَاتِ وَالْأَرْضِ فَانفُذُوا لَا تَنفُذُونَ إِلَّا بِسُلْطَانٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","يُرْسَلُ عَلَيْكُمَا شُوَاظٌ مِّن نَّارٍ وَنُحَاسٌ فَلَا تَنتَصِرَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فَإِذَا انشَقَّتِ السَّمَاءُ فَكَانَتْ وَرْدَةً كَالدِّهَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فَيَوْمَئِذٍ لَّا يُسْأَلُ عَن ذَنبِهِ إِنسٌ وَلَا جَانٌّ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","يُعْرَفُ الْمُجْرِمُونَ بِسِيمَاهُمْ فَيُؤْخَذُ بِالنَّوَاصِي وَالْأَقْدَامِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","هَٰذِهِ جَهَنَّمُ الَّتِي يُكَذِّبُ بِهَا الْمُجْرِمُونَ","يَطُوفُونَ بَيْنَهَا وَبَيْنَ حَمِيمٍ آنٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","ذَوَاتَا أَفْنَانٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فِيهِمَا عَيْنَانِ تَجْرِيَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فِيهِمَا مِن كُلِّ فَاكِهَةٍ زَوْجَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","مُتَّكِئِينَ عَلَىٰ فُرُشٍ بَطَائِنُهَا مِنْ إِسْتَبْرَقٍ وَجَنَى الْجَنَّتَيْنِ دَانٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فِيهِنَّ قَاصِرَاتُ الطَّرْفِ لَمْ يَطْمِثْهُنَّ إِنسٌ قَبْلَهُمْ وَلَا جَانٌّ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","كَأَنَّهُنَّ الْيَاقُوتُ وَالْمَرْجَانُ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","وَمِن دُونِهِمَا جَنَّتَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","مُدْهَامَّتَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فِيهِمَا عَيْنَانِ نَضَّاخَتَانِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فِيهِمَا فَاكِهَةٌ وَنَخْلٌ وَرُمَّانٌ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","فِيهِنَّ خَيْرَاتٌ حِسَانٌ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","حُورٌ مَّقْصُورَاتٌ فِي الْخِيَامِ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","لَمْ يَطْمِثْهُنَّ إِنسٌ قَبْلَهُمْ وَلَا جَانٌّ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","مُتَّكِئِينَ عَلَىٰ رَفْرَفٍ خُضْرٍ وَعَبْقَرِيٍّ حِسَانٍ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","تَبَارَكَ اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ"],"en":["The Most Merciful","Taught the Qur’ān,","Created man,","[And] taught him eloquence.","The sun and the moon [move] by precise calculation,","And the stars and trees prostrate.","And the heaven He raised and imposed the balance","That you not transgress within the balance.","And establish weight in justice and do not make deficient the balance.","And the earth He laid [out] for the creatures.","Therein is fruit and palm trees having sheaths [of dates]","And grain having husks and scented plants.","So which of the favors of your Lord would you deny?","He created man from clay like [that of] pottery.","And He created the jinn from a smokeless flame of fire.","So which of the favors of your Lord would you deny?","[He is] Lord of the two sunrises and Lord of the two sunsets.","So which of the favors of your Lord would you deny?","He released the two seas, meeting [one another];","Between them is a barrier so neither of them transgresses.","So which of the favors of your Lord would you deny?","From both of them emerge pearl and coral.","So which of the favors of your Lord would you deny?","And to Him belong the ships [with sails] elevated in the sea like mountains.","So which of the favors of your Lord would you deny?","Everyone upon it [i.e., the earth] will perish,","And there will remain the Face of your Lord, Owner of Majesty and Honor.","So which of the favors of your Lord would you deny?","Whoever is within the heavens and earth asks Him; every day He is in [i.e., bringing about] a matter.","So which of the favors of your Lord would you deny?","We will attend to you, O prominent beings.","So which of the favors of your Lord would you deny?","O company of jinn and mankind, if you are able to pass beyond the regions of the heavens and the earth, then pass. You will not pass except by authority [from Allāh].","So which of the favors of your Lord would you deny?","There will be sent upon you a flame of fire and smoke, and you will not defend yourselves.","So which of the favors of your Lord would you deny?","And when the heaven is split open and becomes rose-colored like oil -","So which of the favors of your Lord would you deny? -","Then on that Day none will be asked about his sin among men or jinn.","So which of the favors of your Lord would you deny?","The criminals will be known by their marks, and they will be seized by the forelocks and the feet.","So which of the favors of your Lord would you deny?","This is Hell, which the criminals deny.","They will circulate between it and scalding water, heated [to the utmost degree].","So which of the favors of your Lord would you deny?","But for he who has feared the position of his Lord are two gardens -","So which of the favors of your Lord would you deny? -","Having [spreading] branches.","So which of the favors of your Lord would you deny?","In both of them are two springs, flowing.","So which of the favors of your Lord would you deny?","In both of them are of every fruit, two kinds.","So which of the favors of your Lord would you deny?","[They are] reclining on beds whose linings are of silk brocade, and the fruit of the two gardens is hanging low.","So which of the favors of your Lord would you deny?","In them are women limiting [their] glances, untouched before them by man or jinnī -","So which of the favors of your Lord would you deny? -","As if they were rubies and coral.","So which of the favors of your Lord would you deny?","Is the reward for good [anything] but good?","So which of the favors of your Lord would you deny?","And below them both [in excellence] are two [other] gardens -","So which of the favors of your Lord would you deny? -","Dark green [in color].","So which of the favors of your Lord would you deny?","In both of them are two springs, spouting.","So which of the favors of your Lord would you deny?","In both of them are fruit and palm trees and pomegranates.","So which of the favors of your Lord would you deny?","In them are good and beautiful women -","So which of the favors of your Lord would you deny? -","Fair ones reserved in pavilions -","So which of the favors of your Lord would you deny? -","Untouched before them by man or jinnī -","So which of the favors of your Lord would you deny? -","Reclining on green cushions and beautiful fine carpets.","So which of the favors of your Lord would you deny?","Blessed is the name of your Lord, Owner of Majesty and Honor."],"ru":["Всемилостивый,","научил Корану,","сотворил человека,","научил его ясной речи.","Солнце и луна — по исчислению,","а травы и деревья падают ниц.","И небо воздвиг Он и установил Весы,","чтобы вы не преступали меры в весах.","И соблюдайте меру по справедливости и не убавляйте вес.","И Он устроил землю для творений.","На ней — плоды и пальмы с покрывалами соцветий[68],","и злаки, имеющие солому, и душистые растения.","Так какое же из благ вашего Господа вы двое[69] сочтёте ложью?","Он сотворил человека из звенящей глины, подобной керамике,","и сотворил джинна из смешанного пламени огня.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Господь двух восходов и Господь двух закатов.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Он отпустил два моря, и они встречаются,","Между ними — преграда; они её не преступают.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Из них обоих происходят жемчуг и коралл.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Ему принадлежат [корабли], плывущие по морю, возвышающиеся подобно горам.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Всё, что на ней, — бренно,","И пребудет Лик твоего Господа, Обладателя величия и щедрости.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","У Него просят все, кто в небесах и на земле. Каждый день Он — в деле.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Вскоре Мы займёмся вами, о два отягощённых [рода][70].","Так какое же из благ вашего Господа вы двое сочтёте ложью?","О сонмище джиннов и людей! Если сможете проникнуть сквозь пределы небес и земли, то проникните. Не проникните вы иначе как с властью.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","На вас будут низвергнуты пламя огня и расплавленная медь — и вам не совладать.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","А когда расколется небо, оно станет алым, словно раскалённое масло.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В тот День о своём грехе не будет спрошен ни человек, ни джинн.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Преступных узнают по их приметам и схватят за чубы и стопы.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","[И будет сказано:] «Вот она — Геенна, которую преступные считали ложью!»","Они будут метаться между ней и раскалённым кипятком.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","А для того, кто боялся предстать перед своим Господом, — два сада.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","[Два сада] с раскидистыми ветвями.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В них — два источника, текущих полноводным потоком.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В них — по паре от каждого плода.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Возлежащие на ложах, подкладка которых — из парчи, и плоды обоих садов склонены близко.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В них — [девы,] сдерживающие взор, их прежде не касался ни человек, ни джинн.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Они подобны яхонту и кораллу.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Разве может быть воздаяние за добродетель иным, кроме добродетели?","Так какое же из проявлений милости вашего Господа вы сочтёте ложью?","А помимо этих двух — ещё два сада.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Густо-зелёные.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В них — два бьющих ключом источника.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В них — плоды, и финиковые пальмы, и гранаты.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","В них — [девы] благие и прекрасные.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Гурии, сокрытые в шатрах.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Их прежде не касался ни человек, ни джинн.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Возлежащие на зелёных подушках и прекрасных коврах.","Так какое же из благ вашего Господа вы двое сочтёте ложью?","Благословенно имя твоего Господа, Обладателя величия и щедрости."]},"56":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا وَقَعَتِ الْوَاقِعَةُ","لَيْسَ لِوَقْعَتِهَا كَاذِبَةٌ","خَافِضَةٌ رَّافِعَةٌ","إِذَا رُجَّتِ الْأَرْضُ رَجًّا","وَبُسَّتِ الْجِبَالُ بَسًّا","فَكَانَتْ مَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ","عَلَىٰ أَن نُّبَدِّلَ أَمْثَالَكُمْ وَنُنشِئَكُمْ فِي مَا لَا تَعْلَمُونَ","وَلَقَدْ عَلِمْتُمُ النَّشْأَةَ الْأُولَىٰ فَلَوْلَا تَذَكَّرُونَ","أَفَرَأَيْتُم مَّا تَحْرُثُونَ","أَأَنتُمْ تَزْرَعُونَهُ أَمْ نَحْنُ الزَّارِعُونَ","لَوْ نَشَاءُ لَجَعَلْنَاهُ حُطَامًا فَظَلْتُمْ تَفَكَّهُونَ","إِنَّا لَمُغْرَمُونَ","بَلْ نَحْنُ مَحْرُومُونَ","أَفَرَأَيْتُمُ الْمَاءَ الَّذِي تَشْرَبُونَ","أَأَنتُمْ أَنزَلْتُمُوهُ مِنَ الْمُزْنِ أَمْ نَحْنُ الْمُنزِلُونَ","لَوْ نَشَاءُ جَعَلْنَاهُ أُجَاجًا فَلَوْلَا تَشْكُرُونَ","أَفَرَأَيْتُمُ النَّارَ الَّتِي تُورُونَ","أَأَنتُمْ أَنشَأْتُمْ شَجَرَتَهَا أَمْ نَحْنُ الْمُنشِئُونَ","نَحْنُ جَعَلْنَاهَا تَذْكِرَةً وَمَتَاعًا لِّلْمُقْوِينَ","فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ","فَلَا أُقْسِمُ بِمَوَاقِعِ النُّجُومِ","وَإِنَّهُ لَقَسَمٌ لَّوْ تَعْلَمُونَ عَظِيمٌ","إِنَّهُ لَقُرْآنٌ كَرِيمٌ","فِي كِتَابٍ مَّكْنُونٍ","لَّا يَمَسُّهُ إِلَّا الْمُطَهَّرُونَ","تَنزِيلٌ مِّن رَّبِّ الْعَالَمِينَ","أَفَبِهَٰذَا الْحَدِيثِ أَنتُم مُّدْهِنُونَ","وَتَجْعَلُونَ رِزْقَكُمْ أَنَّكُمْ تُكَذِّبُونَ","فَلَوْلَا إِذَا بَلَغَتِ الْحُلْقُومَ","وَأَنتُمْ حِينَئِذٍ تَنظُرُونَ","وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنكُمْ وَلَٰكِن لَّا تُبْصِرُونَ","فَلَوْلَا إِن كُنتُمْ غَيْرَ مَدِينِينَ","تَرْجِعُونَهَا إِن كُنتُمْ صَادِقِينَ","فَأَمَّا إِن كَانَ مِنَ الْمُقَرَّبِينَ","فَرَوْحٌ وَرَيْحَانٌ وَجَنَّتُ نَعِيمٍ","وَأَمَّا إِن كَانَ مِنْ أَصْحَابِ الْيَمِينِ","فَسَلَامٌ لَّكَ مِنْ أَصْحَابِ الْيَمِينِ","وَأَمَّا إِن كَانَ مِنَ الْمُكَذِّبِينَ الضَّالِّينَ","فَنُزُلٌ مِّنْ حَمِيمٍ","وَتَصْلِيَةُ جَحِيمٍ","إِنَّ هَٰذَا لَهُوَ حَقُّ الْيَقِينِ","فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ"],"en":["When the Occurrence occurs,","There is, at its occurrence, no denial.","It will bring down [some] and raise up [others].","When the earth is shaken with convulsion","And the mountains are broken down, crumbling","And become dust dispersing,","And you become [of] three kinds:","Then the companions of the right - what are the companions of the right?","And the companions of the left - what are companions of the left?","And the forerunners, the forerunners -","Those are the ones brought near [to Allāh]","In the Gardens of Pleasure,","A [large] company of the former peoples","And a few of the later peoples,","On thrones woven [with ornament],","Reclining on them, facing each other.","There will circulate among them young boys made eternal","With vessels, pitchers and a cup [of wine] from a flowing spring -","No headache will they have therefrom, nor will they be intoxicated -","And fruit of what they select","And the meat of fowl, from whatever they desire.","And [for them are] fair women with large, [beautiful] eyes,","The likenesses of pearls well-protected,","As reward for what they used to do.","They will not hear therein ill speech or commission of sin -","Only a saying [of] peace, peace.","The companions of the right - what are the companions of the right?","[They will be] among lote trees with thorns removed","And [banana] trees layered [with fruit]","And shade extended","And water poured out","And fruit, abundant [and varied],","Neither limited [to season] nor forbidden,","And [upon] beds raised high.","Indeed, We have produced them [i.e., the women of Paradise] in a [new] creation","And made them virgins,","Devoted [to their husbands] and of equal age,","For the companions of the right [who are]","A company of the former peoples","And a company of the later peoples.","And the companions of the left - what are the companions of the left?","[They will be] in scorching fire and scalding water","And a shade of black smoke,","Neither cool nor beneficial.","Indeed they were, before that, indulging in affluence,","And they used to persist in the great violation,","And they used to say, \"When we die and become dust and bones, are we indeed to be resurrected?","And our forefathers [as well]?\"","Say, [O Muḥammad], \"Indeed, the former and later peoples","Are to be gathered together for the appointment of a known Day.\"","Then indeed you, O those astray [who are] deniers,","Will be eating from trees of zaqqūm","And filling with it your bellies","And drinking on top of it from scalding water","And will drink as the drinking of thirsty camels.","That is their accommodation on the Day of Recompense.","We have created you, so why do you not believe?","Have you seen that which you emit?","Is it you who creates it, or are We the Creator?","We have decreed death among you, and We are not to be outdone","In that We will change your likenesses and produce you in that [form] which you do not know.","And you have already known the first creation, so will you not remember?","And have you seen that [seed] which you sow?","Is it you who makes it grow, or are We the grower?","If We willed, We could make it [dry] debris, and you would remain in wonder,","[Saying], \"Indeed, we are [now] in debt;","Rather, we have been deprived.\"","And have you seen the water that you drink?","Is it you who brought it down from the clouds, or is it We who bring it down?","If We willed, We could make it bitter, so why are you not grateful?","And have you seen the fire that you ignite?","Is it you who produced its tree, or are We the producer?","We have made it a reminder and provision for the travelers,","So exalt the name of your Lord, the Most Great.","Then I swear by the setting of the stars,","And indeed, it is an oath - if you could know - [most] great.","Indeed, it is a noble Qur’ān.","In a Register well-protected;.","None touch it except the purified [i.e., the angels].","[It is] a revelation from the Lord of the worlds.","Then is it to this statement that you are indifferent","And make [the thanks for] your provision that you deny [the Provider]?","Then why, when it [i.e., the soul at death] reaches the throat","And you are at that time looking on -","And We [i.e., Our angels] are nearer to him than you, but you do not see -","Then why do you not, if you are not to be recompensed,","Bring it back, if you should be truthful?","And if he [i.e., the deceased] was of those brought near [to Allāh],","Then [for him is] rest and bounty and a garden of pleasure.","And if he was of the companions of the right,","Then [the angels will say], \"Peace for you; [you are] from the companions of the right.\"","But if he was of the deniers [who were] astray,","Then [for him is] accommodation of scalding water","And burning in Hellfire.","Indeed, this is the true certainty,","So exalt the name of your Lord, the Most Great."],"ru":["Когда произойдёт Событие —","ни одна [душа] не назовёт ложью его наступление.","Унижающее [одних], возвышающее [других].","Когда земля содрогнётся сильным сотрясением,","горы будут раздроблены в прах,","и станут развеянной пылью,","и вы станете тремя группами:","Те, кто на правой стороне, — каковы же те, кто на правой стороне!","И те, кто на левой стороне, — каковы же те, кто на левой стороне!","А опередившие — они и есть опередившие.","Такие и есть приближённые,","в Садах блаженства:","множество из первых,","и немного из последних —","на украшенных ложах,","возлежащие на них лицом друг к другу.","Их будут обходить вечно юные отроки","с кубками, кувшинами и чашей из источника.","От него не болит голова и не теряют разум.","И с плодами, которые они изберут,","и с мясом птиц, какое только пожелают.","И гурии с широкими очами,","подобные сокрытому жемчугу —","в награду за то, что они совершали.","Не услышат они там ни пустословия, ни побуждения к греху,","а только слова: «Мир! Мир!»","И те, кто на правой стороне, — каковы же те, кто на правой стороне!","Среди деревьев сидра, лишённых шипов,","и акаций с рядами [соцветий],","и в тени протяжённой,","и у воды, текущей непрерывным потоком,","и среди множества плодов —","не иссякающих и не недоступных,","и на ложах, воздвигнутых высоко.","Воистину, Мы сотворили их особым сотворением,","и сделали их девами,","ласковыми, сверстницами,","для тех, кто на правой стороне.","Множество из первых,","и множество из последних.","А те, кто на левой стороне, — каковы же те, кто на левой стороне!","Среди обжигающего ветра и кипятка,","и в тени густого чёрного дыма,","не прохладной и не благой.","Воистину, прежде они были погрязшими в роскоши,","и упорствовали в великом грехе,","и говорили: «Неужели, когда мы умрём и станем прахом и костями, — неужели мы будем воскрешены?","Неужели и наши первые праотцы?»","Скажи: «Воистину, и первые, и последние —","непременно будут собраны к установленному сроку, в известный день.","Затем, воистину, вы, о заблудшие, считающие истину ложью,","будете есть с дерева Закку́м","и наполнять им животы,","а после — запивать это кипятком,","и пить, как пьют верблюды, мучимые жаждой».","Это — уготованное им в День Суда.","Мы сотворили вас. Так почему бы вам не признать истину?","Видели ли вы семя, которое извергаете?","Вы ли его сотворяете, или это Мы — Творцы?","Мы предопределили среди вас смерть, и никому Нас не опередить,","чтобы Мы заменили вас вам подобными и сотворили вас в том, чего вы не знаете.","Действительно, вы уже знаете первое сотворение. Так почему бы вам не внять напоминанию?","Видели ли вы то, что сеете?","Вы ли взращиваете его, или же это Мы — взращивающие?","Если бы Мы пожелали, то превратили бы его в труху, и вы бы остались изумлённо недоумевать:","«Воистину, мы — обременённые долгами!","Нет, напротив, мы — лишённые [удела]!»","Видели ли вы воду, которую пьёте?","Вы ли низводите её из дождевых туч, или это Мы — низводящие?»","Если бы Мы пожелали, то сделали бы её горькой. Почему Так почему же бы вы вам не благодарить?","Видели ли вы огонь, который высекаете?","Вы ли взрастили его древо, или это Мы — взращивающие?","Мы сделали его напоминанием и пользой для путников [в пустыне].","Так прославляй же имя твоего Великого Господа.","Так нет же, клянусь местами захода звёзд.","И, воистину, это — великая клятва, если бы вы только знали.","Воистину, это — благородный Коран,","в сокрытой Книге.","Его касаются не иначе как очищенные.","[Это —] ниспослание от Господа миров.","Неужели вы относитесь к этому повествованию без должной серьёзности?","И делаете вашей благодарностью за ваш удел то, что вы считаете [истину] ложью?","Так почему же, когда она достигает горла,","и вы в этот момент смотрите,","тогда как Мы ближе к нему, чем вы, но вы этого не видите,","— так почему же, если вы не подвластны Суду,","вы не вернёте её, если вы правдивы?","А если он окажется из приближённых,","то — покой, и благоухание, и Сад Благодати.","А если он — из тех, кто на правой стороне,","то [ему будет сказано]: «Мир тебе!» — от тех, кто на правой стороне.","А если он из заблудших, считавших истину ложью,","то — угощение из кипятка","и сожжение в адском пекле.","Воистину, это и есть несомненная истина.","Так прославляй же имя своего Великого Господа."]},"62":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ يُسَبِّحُ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ الْمَلِكِ الْقُدُّوسِ الْعَزِيزِ الْحَكِيمِ","هُوَ الَّذِي بَعَثَ فِي الْأُمِّيِّينَ رَسُولًا مِّنْهُمْ يَتْلُو عَلَيْهِمْ آيَاتِهِ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَإِن كَانُوا مِن قَبْلُ لَفِي ضَلَالٍ مُّبِينٍ","وَآخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا بِهِمْ وَهُوَ الْعَزِيزُ الْحَكِيمُ","ذَٰلِكَ فَضْلُ اللَّهِ يُؤْتِيهِ مَن يَشَاءُ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ","مَثَلُ الَّذِينَ حُمِّلُوا التَّوْرَاةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ الْحِمَارِ يَحْمِلُ أَسْفَارًا بِئْسَ مَثَلُ الْقَوْمِ الَّذِينَ كَذَّبُوا بِآيَاتِ اللَّهِ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ","قُلْ يَا أَيُّهَا الَّذِينَ هَادُوا إِن زَعَمْتُمْ أَنَّكُمْ أَوْلِيَاءُ لِلَّهِ مِن دُونِ النَّاسِ فَتَمَنَّوُا الْمَوْتَ إِن كُنتُمْ صَادِقِينَ","وَلَا يَتَمَنَّوْنَهُ أَبَدًا بِمَا قَدَّمَتْ أَيْدِيهِمْ وَاللَّهُ عَلِيمٌ بِالظَّالِمِينَ","قُلْ إِنَّ الْمَوْتَ الَّذِي تَفِرُّونَ مِنْهُ فَإِنَّهُ مُلَاقِيكُمْ ثُمَّ تُرَدُّونَ إِلَىٰ عَالِمِ الْغَيْبِ وَالشَّهَادَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ","يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِن يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ","فَإِذَا قُضِيَتِ الصَّلَاةُ فَانتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِن فَضْلِ اللَّهِ وَاذْكُرُوا اللَّهَ كَثِيرًا لَّعَلَّكُمْ تُفْلِحُونَ","وَإِذَا رَأَوْا تِجَارَةً أَوْ لَهْوًا انفَضُّوا إِلَيْهَا وَتَرَكُوكَ قَائِمًا قُلْ مَا عِندَ اللَّهِ خَيْرٌ مِّنَ اللَّهْوِ وَمِنَ التِّجَارَةِ وَاللَّهُ خَيْرُ الرَّازِقِينَ"],"en":["Whatever is in the heavens and whatever is on the earth is exalting Allāh, the Sovereign, the Pure, the Exalted in Might, the Wise.","It is He who has sent among the unlettered [Arabs] a Messenger from themselves reciting to them His verses and purifying them and teaching them the Book [i.e., the Qur’ān] and wisdom [i.e., the sunnah] - although they were before in clear error -","And [to] others of them who have not yet joined them. And He is the Exalted in Might, the Wise.","That is the bounty of Allāh, which He gives to whom He wills, and Allāh is the possessor of great bounty.","The example of those who were entrusted with the Torah and then did not take it on is like that of a donkey who carries volumes [of books]. Wretched is the example of the people who deny the signs of Allāh. And Allāh does not guide the wrongdoing people.","Say, \"O you who are Jews, if you claim that you are allies of Allāh, excluding the [other] people, then wish for death, if you should be truthful.\"","But they will not wish for it, ever, because of what their hands have put forth. And Allāh is Knowing of the wrongdoers.","Say, \"Indeed, the death from which you flee - indeed, it will meet you. Then you will be returned to the Knower of the unseen and the witnessed, and He will inform you about what you used to do.\"","O you who have believed, when [the adhān] is called for the prayer on the day of Jumuʿah [Friday], then proceed to the remembrance of Allāh and leave trade. That is better for you, if you only knew.","And when the prayer has been concluded, disperse within the land and seek from the bounty of Allāh, and remember Allāh often that you may succeed.","But [on one occasion] when they saw a transaction or a diversion, [O Muḥammad], they rushed to it and left you standing. Say, \"What is with Allāh is better than diversion and than a transaction, and Allāh is the best of providers.\""],"ru":["Прославляет Аллаха всё, что в небесах, и всё, что на земле, — Владыку, Пресвятого, Могущественного, Мудрого.","Он — Тот, Кто отправил к неграмотным посланника из них же самих, который читает им Его аяты, очищает их и обучает их Писанию и Мудрости, — тогда как прежде они пребывали в явном заблуждении.","А [Он отправил его] и к другим из них, которые ещё не присоединились к ним. Он — Могущественный, Мудрый.","Такова милость Аллаха — Он дарует её, кому пожелает. Аллах — Обладатель великой милости.","Пример тех, на кого было возложено [следование] Таурату, но которые затем не понесли его, подобен ослу, несущему книги. Скверен пример людей, которые сочли ложью знамения Аллаха. И Аллах не наставляет на верный путь несправедливый народ.","Скажи: «О вы, которые исповедуют иудаизм! Если вы утверждаете, что вы — приближённые Аллаха, помимо остальных людей, то пожелайте себе смерти, если вы правдивы».","Но они никогда не пожелают её из-за того, что уготовили их руки. Аллах — знающий несправедливых.","Скажи: «Воистину, смерть, от которой вы убегаете, непременно встретит вас. Затем вы будете возвращены к Знающему сокровенное и явное, и Он поведает вам о том, что вы совершали».","О вы, которые уверовали! Когда прозвучит призыв на молитву в день пятницы, устремляйтесь к поминанию Аллаха и оставьте торговлю. Это лучше для вас, если бы вы только знали.","А когда молитва завершится, то расходитесь по земле и стремитесь к милости Аллаха, и поминайте Аллаха много — быть может, вы преуспеете.","Но когда они увидели торговлю или забаву, то бросились к ней и оставили тебя стоящим. Скажи: «То, что у Аллаха, лучше забавы и лучше торговли. Аллах — наилучший из наделяющих уделом»."]},"63":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا جَاءَكَ الْمُنَافِقُونَ قَالُوا نَشْهَدُ إِنَّكَ لَرَسُولُ اللَّهِ وَاللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُ وَاللَّهُ يَشْهَدُ إِنَّ الْمُنَافِقِينَ لَكَاذِبُونَ","اتَّخَذُوا أَيْمَانَهُمْ جُنَّةً فَصَدُّوا عَن سَبِيلِ اللَّهِ إِنَّهُمْ سَاءَ مَا كَانُوا يَعْمَلُونَ","ذَٰلِكَ بِأَنَّهُمْ آمَنُوا ثُمَّ كَفَرُوا فَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ","وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْ وَإِن يَقُولُوا تَسْمَعْ لِقَوْلِهِمْ كَأَنَّهُمْ خُشُبٌ مُّسَنَّدَةٌ يَحْسَبُونَ كُلَّ صَيْحَةٍ عَلَيْهِمْ هُمُ الْعَدُوُّ فَاحْذَرْهُمْ قَاتَلَهُمُ اللَّهُ أَنَّىٰ يُؤْفَكُونَ","وَإِذَا قِيلَ لَهُمْ تَعَالَوْا يَسْتَغْفِرْ لَكُمْ رَسُولُ اللَّهِ لَوَّوْا رُءُوسَهُمْ وَرَأَيْتَهُمْ يَصُدُّونَ وَهُم مُّسْتَكْبِرُونَ","سَوَاءٌ عَلَيْهِمْ أَسْتَغْفَرْتَ لَهُمْ أَمْ لَمْ تَسْتَغْفِرْ لَهُمْ لَن يَغْفِرَ اللَّهُ لَهُمْ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ","هُمُ الَّذِينَ يَقُولُونَ لَا تُنفِقُوا عَلَىٰ مَنْ عِندَ رَسُولِ اللَّهِ حَتَّىٰ يَنفَضُّوا وَلِلَّهِ خَزَائِنُ السَّمَاوَاتِ وَالْأَرْضِ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَفْقَهُونَ","يَقُولُونَ لَئِن رَّجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الْأَعَزُّ مِنْهَا الْأَذَلَّ وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ","يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُلْهِكُمْ أَمْوَالُكُمْ وَلَا أَوْلَادُكُمْ عَن ذِكْرِ اللَّهِ وَمَن يَفْعَلْ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ","وَأَنفِقُوا مِن مَّا رَزَقْنَاكُم مِّن قَبْلِ أَن يَأْتِيَ أَحَدَكُمُ الْمَوْتُ فَيَقُولَ رَبِّ لَوْلَا أَخَّرْتَنِي إِلَىٰ أَجَلٍ قَرِيبٍ فَأَصَّدَّقَ وَأَكُن مِّنَ الصَّالِحِينَ","وَلَن يُؤَخِّرَ اللَّهُ نَفْسًا إِذَا جَاءَ أَجَلُهَا وَاللَّهُ خَبِيرٌ بِمَا تَعْمَلُونَ"],"en":["When the hypocrites come to you, [O Muḥammad], they say, \"We testify that you are the Messenger of Allāh.\" And Allāh knows that you are His Messenger, and Allāh testifies that the hypocrites are liars.","They have taken their oaths as a cover, so they averted [people] from the way of Allāh. Indeed, it was evil that they were doing.","That is because they believed, and then they disbelieved; so their hearts were sealed over, and they do not understand.","And when you see them, their forms please you, and if they speak, you listen to their speech. [They are] as if they were pieces of wood propped up - they think that every shout is against them. They are the enemy, so beware of them. May Allāh destroy them; how are they deluded?","And when it is said to them, \"Come, the Messenger of Allāh will ask forgiveness for you,\" they turn their heads aside and you see them evading while they are arrogant.","It is all the same for them whether you ask forgiveness for them or do not ask forgiveness for them; never will Allāh forgive them. Indeed, Allāh does not guide the defiantly disobedient people.","They are the ones who say, \"Do not spend on those who are with the Messenger of Allāh until they disband.\" And to Allāh belong the depositories of the heavens and the earth, but the hypocrites do not understand.","They say, \"If we return to al-Madīnah, the more honored [for power] will surely expel therefrom the more humble.\" And to Allāh belongs [all] honor, and to His Messenger, and to the believers, but the hypocrites do not know.","O you who have believed, let not your wealth and your children divert you from the remembrance of Allāh. And whoever does that - then those are the losers.","And spend [in the way of Allāh] from what We have provided you before death approaches one of you and he says, \"My Lord, if only You would delay me for a brief term so I would give charity and be of the righteous.\"","But never will Allāh delay a soul when its time has come. And Allāh is Aware of what you do."],"ru":["Когда к тебе приходят лицемеры, они говорят: «Мы свидетельствуем, что ты — Посланник Аллаха». Аллах знает, что ты — Его Посланник. И Аллах свидетельствует, что лицемеры — лжецы.","Они сделали свои клятвы щитом и тем самым отвратили [людей] от пути Аллаха. Воистину, скверно то, что они совершали.","Это потому, что они уверовали, а затем отвергли веру, и на их сердца была наложена печать, так что они не разумеют.","Когда ты видишь их, их облик восхищает тебя, а когда они говорят, ты прислушиваешься к их словам. Они словно прислонённые брёвна. Они думают, что всякий окрик обращён против них. Они — враги, так остерегайся же их. Да погубит их Аллах! Как же они могут быть настолько отвращены [от истины]?","Когда им говорят: «Придите, чтобы Посланник Аллаха попросил для вас прощения», они отворачивают свои головы, и ты видишь, как они отвращаются, превозносясь.","Всё равно для них, попросишь ли ты для них прощения или не попросишь: Аллах никогда не простит их. Воистину, Аллах не наставляет нечестивый народ.","Они и есть те, которые говорят: «Не расходуйте на тех, кто находится при Посланнике Аллаха, чтобы они разошлись», — тогда как Аллаху принадлежат сокровищницы небес и земли. Однако лицемеры не разумеют.","Они говорят: «Если мы вернёмся в Медину, то могущественнейший непременно изгонит оттуда униженного». Но могущество принадлежит Аллаху, Его Посланнику и верующим, однако лицемеры не знают этого.","О вы, которые уверовали! Пусть ни ваше имущество, ни ваши дети не отвлекают вас от поминания Аллаха. А кто поступит так, такие — они и есть потерпевшие убыток.","И расходуйте из того, чем Мы наделили вас, прежде чем к кому-либо из вас придёт смерть и он скажет: «Господь мой! Если бы Ты дал мне отсрочку до близкого срока, я бы раздал пожертвования и стал бы одним из праведных».","Но Аллах никогда не даст отсрочки ни одной душе, когда наступит её срок. Аллах — сведущий о том, что вы совершаете."]},"76":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ هَلْ أَتَىٰ عَلَى الْإِنسَانِ حِينٌ مِّنَ الدَّهْرِ لَمْ يَكُن شَيْئًا مَّذْكُورًا","إِنَّا خَلَقْنَا الْإِنسَانَ مِن نُّطْفَةٍ أَمْشَاجٍ نَّبْتَلِيهِ فَجَعَلْنَاهُ سَمِيعًا بَصِيرًا","إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا","إِنَّا أَعْتَدْنَا لِلْكَافِرِينَ سَلَاسِلَ وَأَغْلَالًا وَسَعِيرًا","إِنَّ الْأَبْرَارَ يَشْرَبُونَ مِن كَأْسٍ كَانَ مِزَاجُهَا كَافُورًا","عَيْنًا يَشْرَبُ بِهَا عِبَادُ اللَّهِ يُفَجِّرُونَهَا تَفْجِيرًا","يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا","وَيُطْعِمُونَ الطَّعَامَ عَلَىٰ حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا","إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اللَّهِ لَا نُرِيدُ مِنكُمْ جَزَاءً وَلَا شُكُورًا","إِنَّا نَخَافُ مِن رَّبِّنَا يَوْمًا عَبُوسًا قَمْطَرِيرًا","فَوَقَاهُمُ اللَّهُ شَرَّ ذَٰلِكَ الْيَوْمِ وَلَقَّاهُمْ نَضْرَةً وَسُرُورًا","وَجَزَاهُم بِمَا صَبَرُوا جَنَّةً وَحَرِيرًا","مُّتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ لَا يَرَوْنَ فِيهَا شَمْسًا وَلَا زَمْهَرِيرًا","وَدَانِيَةً عَلَيْهِمْ ظِلَالُهَا وَذُلِّلَتْ قُطُوفُهَا تَذْلِيلًا","وَيُطَافُ عَلَيْهِم بِآنِيَةٍ مِّن فِضَّةٍ وَأَكْوَابٍ كَانَتْ قَوَارِيرَا","قَوَارِيرَ مِن فِضَّةٍ قَدَّرُوهَا تَقْدِيرًا","وَيُسْقَوْنَ فِيهَا كَأْسًا كَانَ مِزَاجُهَا زَنجَبِيلًا","عَيْنًا فِيهَا تُسَمَّىٰ سَلْسَبِيلًا","وَيَطُوفُ عَلَيْهِمْ وِلْدَانٌ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًا مَّنثُورًا","وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيمًا وَمُلْكًا كَبِيرًا","عَالِيَهُمْ ثِيَابُ سُندُسٍ خُضْرٌ وَإِسْتَبْرَقٌ وَحُلُّوا أَسَاوِرَ مِن فِضَّةٍ وَسَقَاهُمْ رَبُّهُمْ شَرَابًا طَهُورًا","إِنَّ هَٰذَا كَانَ لَكُمْ جَزَاءً وَكَانَ سَعْيُكُم مَّشْكُورًا","إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ الْقُرْآنَ تَنزِيلًا","فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمْ آثِمًا أَوْ كَفُورًا","وَاذْكُرِ اسْمَ رَبِّكَ بُكْرَةً وَأَصِيلًا","وَمِنَ اللَّيْلِ فَاسْجُدْ لَهُ وَسَبِّحْهُ لَيْلًا طَوِيلًا","إِنَّ هَٰؤُلَاءِ يُحِبُّونَ الْعَاجِلَةَ وَيَذَرُونَ وَرَاءَهُمْ يَوْمًا ثَقِيلًا","نَّحْنُ خَلَقْنَاهُمْ وَشَدَدْنَا أَسْرَهُمْ وَإِذَا شِئْنَا بَدَّلْنَا أَمْثَالَهُمْ تَبْدِيلًا","إِنَّ هَٰذِهِ تَذْكِرَةٌ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا","وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا","يُدْخِلُ مَن يَشَاءُ فِي رَحْمَتِهِ وَالظَّالِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًا"],"en":["Has there [not] come upon man a period of time when he was not a thing [even] mentioned?","Indeed, We created man from a sperm-drop mixture that We may try him; and We made him hearing and seeing.","Indeed, We guided him to the way, be he grateful or be he ungrateful.","Indeed, We have prepared for the disbelievers chains and shackles and a blaze.","Indeed, the righteous will drink from a cup [of wine] whose mixture is of Kāfūr,","A spring of which the [righteous] servants of Allāh will drink; they will make it gush forth in force [and abundance].","They [are those who] fulfill [their] vows and fear a Day whose evil will be widespread.","And they give food in spite of love for it to the needy, the orphan, and the captive,","[Saying], \"We feed you only for the face [i.e., approval] of Allāh. We wish not from you reward or gratitude.","Indeed, We fear from our Lord a Day austere and distressful.\"","So Allāh will protect them from the evil of that Day and give them radiance and happiness","And will reward them for what they patiently endured [with] a garden [in Paradise] and silk [garments].","[They will be] reclining therein on adorned couches. They will not see therein any [burning] sun or [freezing] cold.","And near above them are its shades, and its [fruit] to be picked will be lowered in compliance.","And there will be circulated among them vessels of silver and cups having been [created] clear [as glass],","Clear glasses [made] from silver of which they have determined the measure.","And they will be given to drink a cup [of wine] whose mixture is of ginger","[From] a fountain within it [i.e., Paradise] named Salsabeel.","There will circulate among them young boys made eternal. When you see them, you would think them [as beautiful as] scattered pearls.","And when you look there [in Paradise], you will see pleasure and great dominion.","Upon them [i.e., the inhabitants] will be green garments of fine silk and brocade. And they will be adorned with bracelets of silver, and their Lord will give them a purifying drink.","[And it will be said], \"Indeed, this is for you a reward, and your effort has been appreciated.\"","Indeed, it is We who have sent down to you, [O Muḥammad], the Qur’ān progressively.","So be patient for the decision of your Lord and do not obey from among them a sinner or ungrateful [disbeliever].","And mention the name of your Lord [in prayer] morning and evening","And during the night prostrate to Him and exalt [i.e., praise] Him a long [part of the] night.","Indeed, these [disbelievers] love the immediate and leave behind them a grave Day.","We have created them and strengthened their forms, and when We will, We can change their likenesses with [complete] alteration.","Indeed, this is a reminder, so he who wills may take to his Lord a way.","And you do not will except that Allāh wills. Indeed, Allāh is ever Knowing and Wise.","He admits whom He wills into His mercy; but the wrongdoers - He has prepared for them a painful punishment."],"ru":["Прошёл ли над человеком срок времени, когда он не был чем-то упоминаемым?","Воистину, Мы сотворили человека из смешанной капли, чтобы испытать его, и сделали его слышащим, видящим.","Воистину, Мы указали ему путь: [и он] либо благодарный, либо неблагодарный.","Воистину, Мы уготовили для отвергших веру цепи, оковы и пылающий огонь.","Воистину, благочестивые будут пить из кубка с примесью камфоры —","[из] источника, из которого пьют рабы Аллаха, и который они заставляют бить обильно.","Они выполняют обет и страшатся дня, зло которого распространится повсюду.","И они кормят едой — несмотря на любовь к ней — бедняка, сироту и пленника,","[говоря:] «Воистину, мы кормим вас лишь ради Лика Аллаха. Мы не желаем от вас ни воздаяния, ни благодарности","Воистину, мы боимся пред нашим Господом дня хмурого и сурового».","И Аллах уберёг их от зла того дня, и даровал им сияние и радость.","И Он воздал им за их терпение — садом и шёлком.","Возлежа там на ложах, они не увидят в нём ни солнца, ни пронизывающей стужи,","а тени [деревьев] будут близки к ним, и плоды его будут легко доступны для сбора.","Их будут обносить сосудами из серебра и кубками из хрусталя —","хрустальными [кубками] из серебра, меру которых они отмерили точнейшим образом.","И они будут напоены там из кубка с примесью имбиря,","[из] источника в нём, называемого Сальсабиль.","И будут обходить их там вечно юные отроки — если ты посмотришь на их, сочтёшь их рассыпанным жемчугом.","А когда ты взглянешь, то увидишь там блаженство и великое владычество.","На них будут зелёные одеяния из тонкого шёлка и парчи, и они будут украшены браслетами из серебра, и их Господь напоит их напитком чистейшим.","[Им будет сказано:] «Воистину, это и есть ваше воздаяние, и ваше усердие было принято с благодарностью».","Воистину, Мы низвели тебе Коран ниспосланием.","Так проявляй же терпение к решению твоего Господа и не повинуйся никому из них — ни грешнику, ни отвергшему веру.","И поминай имя своего Господа утром и перед закатом,","и ночью — пади ниц пред Ним и прославляй Его долгой ночью.","Воистину, они любят скоротечную жизнь, а позади себя оставляют тягостный день.","Мы сотворили их и укрепили их сложение, а если пожелаем — заменим их другими, подобными им.","Воистину, это — напоминание. И кто пожелает — изберёт путь к своему Господу.","Но вы не пожелаете иначе как по воле Аллаха. Воистину, Аллах всегда был [и пребудет] знающим, мудрым.","Он вводит, кого пожелает, в Свою милость. А несправедливые — Он уготовил им мучительное наказание."]},"50":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ق وَالْقُرْآنِ الْمَجِيدِ","بَلْ عَجِبُوا أَن جَاءَهُم مُّنذِرٌ مِّنْهُمْ فَقَالَ الْكَافِرُونَ هَٰذَا شَيْءٌ عَجِيبٌ","أَإِذَا مِتْنَا وَكُنَّا تُرَابًا ذَٰلِكَ رَجْعٌ بَعِيدٌ","قَدْ عَلِمْنَا مَا تَنقُصُ الْأَرْضُ مِنْهُمْ وَعِندَنَا كِتَابٌ حَفِيظٌ","بَلْ كَذَّبُوا بِالْحَقِّ لَمَّا جَاءَهُمْ فَهُمْ فِي أَمْرٍ مَّرِيجٍ","أَفَلَمْ يَنظُرُوا إِلَى السَّمَاءِ فَوْقَهُمْ كَيْفَ بَنَيْنَاهَا وَزَيَّنَّاهَا وَمَا لَهَا مِن فُرُوجٍ","وَالْأَرْضَ مَدَدْنَاهَا وَأَلْقَيْنَا فِيهَا رَوَاسِيَ وَأَنبَتْنَا فِيهَا مِن كُلِّ زَوْجٍ بَهِيجٍ","تَبْصِرَةً وَذِكْرَىٰ لِكُلِّ عَبْدٍ مُّنِيبٍ","وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً مُّبَارَكًا فَأَنبَتْنَا بِهِ جَنَّاتٍ وَحَبَّ الْحَصِيدِ","وَالنَّخْلَ بَاسِقَاتٍ لَّهَا طَلْعٌ نَّضِيدٌ","رِّزْقًا لِّلْعِبَادِ وَأَحْيَيْنَا بِهِ بَلْدَةً مَّيْتًا كَذَٰلِكَ الْخُرُوجُ","كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ وَأَصْحَابُ الرَّسِّ وَثَمُودُ","وَعَادٌ وَفِرْعَوْنُ وَإِخْوَانُ لُوطٍ","وَأَصْحَابُ الْأَيْكَةِ وَقَوْمُ تُبَّعٍ كُلٌّ كَذَّبَ الرُّسُلَ فَحَقَّ وَعِيدِ","أَفَعَيِينَا بِالْخَلْقِ الْأَوَّلِ بَلْ هُمْ فِي لَبْسٍ مِّنْ خَلْقٍ جَدِيدٍ","وَلَقَدْ خَلَقْنَا الْإِنسَانَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِ نَفْسُهُ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ","إِذْ يَتَلَقَّى الْمُتَلَقِّيَانِ عَنِ الْيَمِينِ وَعَنِ الشِّمَالِ قَعِيدٌ","مَّا يَلْفِظُ مِن قَوْلٍ إِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٌ","وَجَاءَتْ سَكْرَةُ الْمَوْتِ بِالْحَقِّ ذَٰلِكَ مَا كُنتَ مِنْهُ تَحِيدُ","وَنُفِخَ فِي الصُّورِ ذَٰلِكَ يَوْمُ الْوَعِيدِ","وَجَاءَتْ كُلُّ نَفْسٍ مَّعَهَا سَائِقٌ وَشَهِيدٌ","لَّقَدْ كُنتَ فِي غَفْلَةٍ مِّنْ هَٰذَا فَكَشَفْنَا عَنكَ غِطَاءَكَ فَبَصَرُكَ الْيَوْمَ حَدِيدٌ","وَقَالَ قَرِينُهُ هَٰذَا مَا لَدَيَّ عَتِيدٌ","أَلْقِيَا فِي جَهَنَّمَ كُلَّ كَفَّارٍ عَنِيدٍ","مَّنَّاعٍ لِّلْخَيْرِ مُعْتَدٍ مُّرِيبٍ","الَّذِي جَعَلَ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَأَلْقِيَاهُ فِي الْعَذَابِ الشَّدِيدِ","قَالَ قَرِينُهُ رَبَّنَا مَا أَطْغَيْتُهُ وَلَٰكِن كَانَ فِي ضَلَالٍ بَعِيدٍ","قَالَ لَا تَخْتَصِمُوا لَدَيَّ وَقَدْ قَدَّمْتُ إِلَيْكُم بِالْوَعِيدِ","مَا يُبَدَّلُ الْقَوْلُ لَدَيَّ وَمَا أَنَا بِظَلَّامٍ لِّلْعَبِيدِ","يَوْمَ نَقُولُ لِجَهَنَّمَ هَلِ امْتَلَأْتِ وَتَقُولُ هَلْ مِن مَّزِيدٍ","وَأُزْلِفَتِ الْجَنَّةُ لِلْمُتَّقِينَ غَيْرَ بَعِيدٍ","هَٰذَا مَا تُوعَدُونَ لِكُلِّ أَوَّابٍ حَفِيظٍ","مَّنْ خَشِيَ الرَّحْمَٰنَ بِالْغَيْبِ وَجَاءَ بِقَلْبٍ مُّنِيبٍ","ادْخُلُوهَا بِسَلَامٍ ذَٰلِكَ يَوْمُ الْخُلُودِ","لَهُم مَّا يَشَاءُونَ فِيهَا وَلَدَيْنَا مَزِيدٌ","وَكَمْ أَهْلَكْنَا قَبْلَهُم مِّن قَرْنٍ هُمْ أَشَدُّ مِنْهُم بَطْشًا فَنَقَّبُوا فِي الْبِلَادِ هَلْ مِن مَّحِيصٍ","إِنَّ فِي ذَٰلِكَ لَذِكْرَىٰ لِمَن كَانَ لَهُ قَلْبٌ أَوْ أَلْقَى السَّمْعَ وَهُوَ شَهِيدٌ","وَلَقَدْ خَلَقْنَا السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ وَمَا مَسَّنَا مِن لُّغُوبٍ","فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ الْغُرُوبِ","وَمِنَ اللَّيْلِ فَسَبِّحْهُ وَأَدْبَارَ السُّجُودِ","وَاسْتَمِعْ يَوْمَ يُنَادِ الْمُنَادِ مِن مَّكَانٍ قَرِيبٍ","يَوْمَ يَسْمَعُونَ الصَّيْحَةَ بِالْحَقِّ ذَٰلِكَ يَوْمُ الْخُرُوجِ","إِنَّا نَحْنُ نُحْيِي وَنُمِيتُ وَإِلَيْنَا الْمَصِيرُ","يَوْمَ تَشَقَّقُ الْأَرْضُ عَنْهُمْ سِرَاعًا ذَٰلِكَ حَشْرٌ عَلَيْنَا يَسِيرٌ","نَّحْنُ أَعْلَمُ بِمَا يَقُولُونَ وَمَا أَنتَ عَلَيْهِم بِجَبَّارٍ فَذَكِّرْ بِالْقُرْآنِ مَن يَخَافُ وَعِيدِ"],"en":["Qāf. By the honored Qur’ān...","But they wonder that there has come to them a warner from among themselves, and the disbelievers say, \"This is an amazing thing.","When we have died and have become dust, [we will return to life]? That is a distant [i.e., unlikely] return.\"","We know what the earth diminishes [i.e., consumes] of them, and with Us is a retaining record.","But they denied the truth when it came to them, so they are in a confused condition.","Have they not looked at the heaven above them - how We structured it and adorned it and [how] it has no rifts?","And the earth - We spread it out and cast therein firmly set mountains and made grow therein [something] of every beautiful kind,","Giving insight and a reminder for every servant who turns [to Allāh].","And We have sent down blessed rain from the sky and made grow thereby gardens and grain from the harvest","And lofty palm trees having fruit arranged in layers -","As provision for the servants, and We have given life thereby to a dead land. Thus is the emergence [i.e., resurrection].","The people of Noah denied before them, and the companions of the well and Thamūd","And ʿAad and Pharaoh and the brothers [i.e., people] of Lot","And the companions of the thicket and the people of Tubbaʿ. All denied the messengers, so My threat was justly fulfilled.","Did We fail in the first creation? But they are in confusion over a new creation.","And We have already created man and know what his soul whispers to him, and We are closer to him than [his] jugular vein.","When the two receivers [i.e., recording angels] receive, seated on the right and on the left.","He [i.e., man] utters no word except that with him is an observer prepared [to record].","And the intoxication of death will bring the truth; that is what you were trying to avoid.","And the Horn will be blown. That is the Day of [carrying out] the threat.","And every soul will come, with it a driver and a witness.","[It will be said], \"You were certainly in unmindfulness of this, and We have removed from you your cover, so your sight, this Day, is sharp.\"","And his companion, [the angel], will say, \"This [record] is what is with me, prepared.\"","[Allāh will say], \"Throw into Hell every obstinate disbeliever,","Preventer of good, aggressor, and doubter,","Who made [as equal] with Allāh another deity; then throw him into the severe punishment.\"","His [devil] companion will say, \"Our Lord, I did not make him transgress, but he [himself] was in extreme error.\"","[Allāh] will say, \"Do not dispute before Me, while I had already presented to you the threat [i.e., warning].","The word [i.e., decree] will not be changed with Me, and never will I be unjust to the servants.\"","On the Day We will say to Hell, \"Have you been filled?\" and it will say, \"Are there some more,\"","And Paradise will be brought near to the righteous, not far,","[It will be said], \"This is what you were promised - for every returner [to Allāh] and keeper [of His covenant].","Who feared the Most Merciful in the unseen and came with a heart returning [in repentance].","Enter it in peace. This is the Day of Eternity.\"","They will have whatever they wish therein, and with Us is more.","And how many a generation before them did We destroy who were greater than them in [striking] power and had explored throughout the lands. Is there any place of escape?","Indeed in that is a reminder for whoever has a heart or who listens while he is present [in mind].","And We did certainly create the heavens and earth and what is between them in six days, and there touched Us no weariness.","So be patient, [O Muḥammad], over what they say and exalt [Allāh] with praise of your Lord before the rising of the sun and before its setting,","And [in part] of the night exalt Him and after prostration [i.e., prayer].","And listen on the Day when the Caller will call out from a place that is near -","The Day they will hear the blast [of the Horn] in truth. That is the Day of Emergence [from the graves].","Indeed, it is We who give life and cause death, and to Us is the destination","On the Day the earth breaks away from them [and they emerge] rapidly; that is a gathering easy for Us.","We are most knowing of what they say, and you are not over them a tyrant. But remind by the Qur’ān whoever fears My threat."],"ru":["Каф. Клянусь славным Кораном.","Нет, напротив! Они удивились тому, что явился к ним предостерегающий из их числа, и отвергшие веру сказали: «Это — нечто удивительное!","Неужели, когда мы умрём и станем прахом? Это — далёкое возвращение!»","Мы знаем, что земля убавляет от них, и у Нас — хранящая Книга.","Нет, напротив! Они сочли истину ложью, когда она пришла к ним, и пребывают в смятении.","Неужели они не смотрели на небо над собой, как Мы воздвигли его и украсили, и нет в нём никаких расщелин?","И [посмотрели ли они на] землю, как Мы разостлали её, и водрузили на неё прочно стоящие горы, и взрастили на ней всякие прекрасные пары.","[Всё это —] в назидание и напоминание для каждого обращающегося раба.","И Мы ниспослали с небес благословенную воду и взрастили ею сады и зёрна урожая,","и высокие пальмы с нанизанными рядами плодов,","в удел для рабов. И Мы оживили ею мёртвую землю. Таким будет и выход [из могил].","До них сочли лжецами [посланников] народ Нуха, и обитатели ар-Ра́сса[64], и племя самуд,","и племя ‘ад, и Фараон, и братья Лута,","и обитатели аль-Айки, и народ Тубба‘а[65]. Все они считали посланников лжецами, и исполнилась Моя угроза.","Неужели Мы утомились при первом творении? Нет, напротив! Они пребывают в сомнении относительно нового сотворения.","Действительно, Мы сотворили человека и знаем, что нашёптывает ему его душа. И Мы ближе к нему, чем его яремная вена.","Вот два [ангела], записывающие [деяния], сидят: один по правую сторону, другой по левую.","Он не произнесёт ни единого слова, без того чтобы при нём не был бдительный наблюдатель.","Пришло опьянение смерти с истиной. Это то, от чего ты уклонялся!","И протрубят в Рог. Это — День обещанной угрозы.","И придёт каждая душа, а с ней — погонщик и свидетель.","«Действительно, ты пребывал в беспечности об этом. И Мы сняли с тебя покров, и сегодня твой взор стал проницательным».","И его спутник [из числа ангелов] скажет: «Вот то, что у меня наготове».","[И будет сказано:] «Бросьте в Геенну каждого упорного отвергшего веру,","препятствовавшего добру, преступавшего пределы, погружённого в сомнения,","того, кто избрал наряду с Аллахом другое божество, — ввергните его в суровое наказание».","Его спутник [шайтан] скажет: «Господь наш! Я не заставлял его преступать пределы, но он сам был в глубоком заблуждении».","[Аллах] скажет: «Не спорьте предо Мной, ведь Я уже направил к вам предостережение [о наказании].","Слово у Меня не меняется. И Я — вовсе не тиран для рабов».","В тот День Мы скажем Геенне: «Наполнилась ли ты?», а она ответит: «Есть ли ещё?»","И Рай будет приближен к богобоязненным — совсем близко.","[И будет сказано:] «Это — то, что вам было обещано, каждому кающемуся, хранящему,","кто страшился Всемилостивого втайне и пришёл с сердцем, обратившимся [к Аллаху].","Войдите в него с миром. Это — День вечности».","Для них там — всё, что они пожелают. А у Нас [есть] большее.","Сколь же много поколений Мы погубили до них! Они превосходили их мощью и проникали вглубь земель. Но разве нашлось для них какое-либо спасение?","Воистину, в этом — напоминание для того, у кого есть сердце, или кто прислушался, будучи присутствующим [сердцем].","Действительно, Мы сотворили небеса и землю, и всё, что между ними, за шесть дней, и Нас не коснулась усталость.","Так прояви же терпение к тому, что они говорят, и прославляй своего Господа хвалой перед восходом солнца и перед его заходом.","И ночью прославляй Его, и после преклонений ниц.","И прислушайся в тот День, когда глашатай воззовёт из близкого места.","В тот День они услышат Глас с истиной. Это — День выхода [из могил].","Воистину, Мы оживляем и умерщвляем, и к Нам — конечный исход.","В тот День земля расколется над ними [выпуская их], спешащих [на зов]. Это — сбор, который для Нас лёгок.","Мы лучше знаем, что они говорят. И ты вовсе над ними не тиран, так увещевай же Кораном того, кто боится Моей угрозы."]},"54":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ اقْتَرَبَتِ السَّاعَةُ وَانشَقَّ الْقَمَرُ","وَإِن يَرَوْا آيَةً يُعْرِضُوا وَيَقُولُوا سِحْرٌ مُّسْتَمِرٌّ","وَكَذَّبُوا وَاتَّبَعُوا أَهْوَاءَهُمْ وَكُلُّ أَمْرٍ مُّسْتَقِرٌّ","وَلَقَدْ جَاءَهُم مِّنَ الْأَنبَاءِ مَا فِيهِ مُزْدَجَرٌ","حِكْمَةٌ بَالِغَةٌ فَمَا تُغْنِ النُّذُرُ","فَتَوَلَّ عَنْهُمْ يَوْمَ يَدْعُ الدَّاعِ إِلَىٰ شَيْءٍ نُّكُرٍ","خُشَّعًا أَبْصَارُهُمْ يَخْرُجُونَ مِنَ الْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌ مُّنتَشِرٌ","مُّهْطِعِينَ إِلَى الدَّاعِ يَقُولُ الْكَافِرُونَ هَٰذَا يَوْمٌ عَسِرٌ","كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ فَكَذَّبُوا عَبْدَنَا وَقَالُوا مَجْنُونٌ وَازْدُجِرَ","فَدَعَا رَبَّهُ أَنِّي مَغْلُوبٌ فَانتَصِرْ","فَفَتَحْنَا أَبْوَابَ السَّمَاءِ بِمَاءٍ مُّنْهَمِرٍ","وَفَجَّرْنَا الْأَرْضَ عُيُونًا فَالْتَقَى الْمَاءُ عَلَىٰ أَمْرٍ قَدْ قُدِرَ","وَحَمَلْنَاهُ عَلَىٰ ذَاتِ أَلْوَاحٍ وَدُسُرٍ","تَجْرِي بِأَعْيُنِنَا جَزَاءً لِّمَن كَانَ كُفِرَ","وَلَقَد تَّرَكْنَاهَا آيَةً فَهَلْ مِن مُّدَّكِرٍ","فَكَيْفَ كَانَ عَذَابِي وَنُذُرِ","وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ","كَذَّبَتْ عَادٌ فَكَيْفَ كَانَ عَذَابِي وَنُذُرِ","إِنَّا أَرْسَلْنَا عَلَيْهِمْ رِيحًا صَرْصَرًا فِي يَوْمِ نَحْسٍ مُّسْتَمِرٍّ","تَنزِعُ النَّاسَ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ مُّنقَعِرٍ","فَكَيْفَ كَانَ عَذَابِي وَنُذُرِ","وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ","كَذَّبَتْ ثَمُودُ بِالنُّذُرِ","فَقَالُوا أَبَشَرًا مِّنَّا وَاحِدًا نَّتَّبِعُهُ إِنَّا إِذًا لَّفِي ضَلَالٍ وَسُعُرٍ","أَأُلْقِيَ الذِّكْرُ عَلَيْهِ مِن بَيْنِنَا بَلْ هُوَ كَذَّابٌ أَشِرٌ","سَيَعْلَمُونَ غَدًا مَّنِ الْكَذَّابُ الْأَشِرُ","إِنَّا مُرْسِلُو النَّاقَةِ فِتْنَةً لَّهُمْ فَارْتَقِبْهُمْ وَاصْطَبِرْ","وَنَبِّئْهُمْ أَنَّ الْمَاءَ قِسْمَةٌ بَيْنَهُمْ كُلُّ شِرْبٍ مُّحْتَضَرٌ","فَنَادَوْا صَاحِبَهُمْ فَتَعَاطَىٰ فَعَقَرَ","فَكَيْفَ كَانَ عَذَابِي وَنُذُرِ","إِنَّا أَرْسَلْنَا عَلَيْهِمْ صَيْحَةً وَاحِدَةً فَكَانُوا كَهَشِيمِ الْمُحْتَظِرِ","وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ","كَذَّبَتْ قَوْمُ لُوطٍ بِالنُّذُرِ","إِنَّا أَرْسَلْنَا عَلَيْهِمْ حَاصِبًا إِلَّا آلَ لُوطٍ نَّجَّيْنَاهُم بِسَحَرٍ","نِّعْمَةً مِّنْ عِندِنَا كَذَٰلِكَ نَجْزِي مَن شَكَرَ","وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا بِالنُّذُرِ","وَلَقَدْ رَاوَدُوهُ عَن ضَيْفِهِ فَطَمَسْنَا أَعْيُنَهُمْ فَذُوقُوا عَذَابِي وَنُذُرِ","وَلَقَدْ صَبَّحَهُم بُكْرَةً عَذَابٌ مُّسْتَقِرٌّ","فَذُوقُوا عَذَابِي وَنُذُرِ","وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ","وَلَقَدْ جَاءَ آلَ فِرْعَوْنَ النُّذُرُ","كَذَّبُوا بِآيَاتِنَا كُلِّهَا فَأَخَذْنَاهُمْ أَخْذَ عَزِيزٍ مُّقْتَدِرٍ","أَكُفَّارُكُمْ خَيْرٌ مِّنْ أُولَٰئِكُمْ أَمْ لَكُم بَرَاءَةٌ فِي الزُّبُرِ","أَمْ يَقُولُونَ نَحْنُ جَمِيعٌ مُّنتَصِرٌ","سَيُهْزَمُ الْجَمْعُ وَيُوَلُّونَ الدُّبُرَ","بَلِ السَّاعَةُ مَوْعِدُهُمْ وَالسَّاعَةُ أَدْهَىٰ وَأَمَرُّ","إِنَّ الْمُجْرِمِينَ فِي ضَلَالٍ وَسُعُرٍ","يَوْمَ يُسْحَبُونَ فِي النَّارِ عَلَىٰ وُجُوهِهِمْ ذُوقُوا مَسَّ سَقَرَ","إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ","وَمَا أَمْرُنَا إِلَّا وَاحِدَةٌ كَلَمْحٍ بِالْبَصَرِ","وَلَقَدْ أَهْلَكْنَا أَشْيَاعَكُمْ فَهَلْ مِن مُّدَّكِرٍ","وَكُلُّ شَيْءٍ فَعَلُوهُ فِي الزُّبُرِ","وَكُلُّ صَغِيرٍ وَكَبِيرٍ مُّسْتَطَرٌ","إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَنَهَرٍ","فِي مَقْعَدِ صِدْقٍ عِندَ مَلِيكٍ مُّقْتَدِرٍ"],"en":["The Hour has come near, and the moon has split [in two].","And if they see a sign [i.e., miracle], they turn away and say, \"Passing magic.\"","And they denied and followed their inclinations. But for every matter is a [time of] settlement.","And there has already come to them of information that in which there is deterrence.","Extensive wisdom - but warning does not avail [them].","So leave them, [O Muḥammad]. The Day the Caller calls to something forbidding,","Their eyes humbled, they will emerge from the graves as if they were locusts spreading,","Racing ahead toward the Caller. The disbelievers will say, \"This is a difficult Day.\"","The people of Noah denied before them, and they denied Our servant and said, \"A madman,\" and he was repelled.","So he invoked his Lord, \"Indeed, I am overpowered, so help.\"","Then We opened the gates of the heaven with rain pouring down","And caused the earth to burst with springs, and the waters met for a matter already predestined.","And We carried him on a [construction of] planks and nails,","Sailing under Our observation as reward for he who had been denied.","And We left it as a sign, so is there any who will remember?","And how [severe] were My punishment and warning.","And We have certainly made the Qur’ān easy for remembrance, so is there any who will remember?","ʿAad denied; and how [severe] were My punishment and warning.","Indeed, We sent upon them a screaming wind on a day of continuous misfortune,","Extracting the people as if they were trunks of palm trees uprooted.","And how [severe] were My punishment and warning.","And We have certainly made the Qur’ān easy for remembrance, so is there any who will remember?","Thamūd denied the warning.","And said, \"Is it one human being among us that we should follow? Indeed, we would then be in error and madness.","Has the message been sent down upon him from among us? Rather, he is an insolent liar.\"","They will know tomorrow who is the insolent liar.","Indeed, We are sending the she-camel as trial for them, so watch them and be patient.","And inform them that the water is shared between them, each [day of] drink attended [by turn].","But they called their companion, and he dared and hamstrung [her].","And how [severe] were My punishment and warning.","Indeed, We sent upon them one shriek [i.e., blast from the sky], and they became like the dry twig fragments of an [animal] pen.","And We have certainly made the Qur’ān easy for remembrance, so is there any who will remember?","The people of Lot denied the warning.","Indeed, We sent upon them a storm of stones, except the family of Lot - We saved them before dawn.","As favor from Us. Thus do We reward he who is grateful.","And he had already warned them of Our assault, but they disputed the warning.","And they had demanded from him his guests, but We obliterated their eyes, [saying], \"Taste My punishment and warning.\"","And there came upon them by morning an abiding punishment.","So taste My punishment and warning.","And We have certainly made the Qur’ān easy for remembrance, so is there any who will remember?","And there certainly came to the people of Pharaoh warning.","They denied Our signs, all of them, so We seized them with a seizure of one Exalted in Might and Perfect in Ability.","Are your disbelievers better than those [former ones], or have you immunity in the scriptures?","Or do they say, \"We are an assembly supporting [each other]\"?","[Their] assembly will be defeated, and they will turn their backs [in retreat].","But the Hour is their appointment [for due punishment], and the Hour is more disastrous and more bitter.","Indeed, the criminals are in error and madness..","The Day they are dragged into the Fire on their faces [it will be said], \"Taste the touch of Saqar.\"","Indeed, all things We created with predestination.","And Our command is but one, like a glance of the eye.","And We have already destroyed your kinds, so is there any who will remember?","And everything they did is in written records.","And every small and great [thing] is inscribed.","Indeed, the righteous will be among gardens and rivers,","In a seat of honor near a Sovereign, Perfect in Ability."],"ru":["Приблизился Час, и раскололась луна.","А если они видят знамение, то отворачиваются и говорят: «Продолжающееся колдовство».","Они сочли истину ложью и последовали своим прихотям, и у каждого дела — своё завершение.","[И клянусь], действительно, дошли до них вести, в которых — удерживающее предостережение:","совершенная мудрость. Но не помогают предостережения.","Так отвернись же от них. В тот день, когда призывающий призовёт к чему-то ужасному,","они выйдут из могил с опущенными взорами, словно рассыпанная саранча,","устремляясь к призывающему. Отвергшие веру скажут: «Это тяжкий день!»","Народ Нуха до них счёл ложью [истину]: они сочли Нашего раба лжецом и сказали: «Одержимый!», — и его грубо осадили.","Тогда он воззвал к своему Господу: «Воистину, они одолели меня, помоги же мне!»","И Мы распахнули врата небес с низвергающейся водой,","и заставили землю источать потоки, и воды соединились по велению, которое было предопределено.","И Мы понесли его на [ковчеге], [сбитом] из досок и гвоздей,","который плыл на Наших глазах — в воздаяние тому, кто был отвергнут.","Действительно, Мы оставили это как знамение. И есть ли тот, кто внемлет напоминанию?","И каковы же были Моё наказание и предостережения!","Действительно, Мы облегчили Коран для поминания. И есть ли тот, кто внемлет напоминанию?","Племя ‘ад сочло истину ложью. И каковы же были Моё наказание и предостережения!","Воистину, Мы наслали на них пронизывающий ветер в злосчастный, нескончаемый день,","который сметал людей, словно они — вырванные с корнем пальмы.","И каковы же были Моё наказание и предостережения!","Действительно, Мы облегчили Коран для поминания. И есть ли тот, кто внемлет напоминанию?","Племя самуд сочло ложью предостережения,","и они сказали: «Неужели мы последуем за одним-единственным человеком из нас? Тогда, воистину, мы оказались бы в заблуждении и безумии.","Неужели Напоминание ниспослано ему одному среди нас? Нет, напротив! Он — дерзкий лжец».","Скоро они узнают, кто дерзкий лжец!","Воистину, Мы пошлём им верблюдицу как испытание. Так наблюдай же за ними и будь терпелив.","И сообщи им, что вода поделена между ними: каждому — его черёд питья.","Но они позвали своего соплеменника, и он взялся [за дело] и подсёк [ей] поджилки.","И каковы же были Моё наказание и предостережения!","Воистину, Мы наслали на них один-единственный Глас, и они стали подобны сухому хворосту для изгороди.","Действительно, Мы облегчили Коран для поминания. И есть ли тот, кто внемлет напоминанию?","Народ Лута счёл предостережения ложью.","Воистину, Мы послали на них каменный вихрь, кроме семьи Лута — Мы спасли их в предрассветное время,","благодеянием от Нас. Так Мы воздаём тем, кто благодарен.","Действительно, он предупреждал их о Нашей хватке, но они стали оспаривать предостережения.","Действительно, они домогались его гостей, и тогда Мы лишили их зрения: «Вкусите же Моё наказание и Мои предостережения!»","Действительно, рано утром их постигло непреходящее наказание.","«Вкусите же Моё наказание и Мои предостережения!»","И несомненно Мы облегчили Коран для поминания. И есть ли тот, кто внемлет напоминанию?","Действительно, предостережения приходили к роду Фараона.","Они сочли Наши знамения ложью, все до единого, и Мы схватили их хваткой могущественного, всесильного.","Неужели ваши отвергшие веру лучше, чем они? Или же у вас есть в Писаниях запись об освобождении?","Или же они скажут: «Мы — сплочённая группа, и мы одержим победу»?","Сборище это будет повержено, и они обратятся вспять.","Нет, напротив! Час — их срок, и Час этот — страшнее и мучительнее.","Воистину, преступные — в заблуждении и безумии.","В тот день, когда они будут влачимы в адский огонь на своих лицах: «Вкусите же прикосновение Преисподней!»","Воистину, всё сущее Мы сотворили по предопределению.","И повеление Наше — не иначе как одно [лишь слово], подобное мгновению ока.","Действительно, Мы погубили подобных вам. И есть ли тот, кто внемлет напоминанию?","И всё, что они совершили, — записано в свитках,","и всякое малое и великое записано.","Воистину, богобоязненные — среди садов и рек,","в Обители правды, у Всесильного Владыки."]},"17":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ سُبْحَانَ الَّذِي أَسْرَىٰ بِعَبْدِهِ لَيْلًا مِّنَ الْمَسْجِدِ الْحَرَامِ إِلَى الْمَسْجِدِ الْأَقْصَى الَّذِي بَارَكْنَا حَوْلَهُ لِنُرِيَهُ مِنْ آيَاتِنَا إِنَّهُ هُوَ السَّمِيعُ الْبَصِيرُ","وَآتَيْنَا مُوسَى الْكِتَابَ وَجَعَلْنَاهُ هُدًى لِّبَنِي إِسْرَائِيلَ أَلَّا تَتَّخِذُوا مِن دُونِي وَكِيلًا","ذُرِّيَّةَ مَنْ حَمَلْنَا مَعَ نُوحٍ إِنَّهُ كَانَ عَبْدًا شَكُورًا","وَقَضَيْنَا إِلَىٰ بَنِي إِسْرَائِيلَ فِي الْكِتَابِ لَتُفْسِدُنَّ فِي الْأَرْضِ مَرَّتَيْنِ وَلَتَعْلُنَّ عُلُوًّا كَبِيرًا","فَإِذَا جَاءَ وَعْدُ أُولَاهُمَا بَعَثْنَا عَلَيْكُمْ عِبَادًا لَّنَا أُولِي بَأْسٍ شَدِيدٍ فَجَاسُوا خِلَالَ الدِّيَارِ وَكَانَ وَعْدًا مَّفْعُولًا","ثُمَّ رَدَدْنَا لَكُمُ الْكَرَّةَ عَلَيْهِمْ وَأَمْدَدْنَاكُم بِأَمْوَالٍ وَبَنِينَ وَجَعَلْنَاكُمْ أَكْثَرَ نَفِيرًا","إِنْ أَحْسَنتُمْ أَحْسَنتُمْ لِأَنفُسِكُمْ وَإِنْ أَسَأْتُمْ فَلَهَا فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ لِيَسُوءُوا وُجُوهَكُمْ وَلِيَدْخُلُوا الْمَسْجِدَ كَمَا دَخَلُوهُ أَوَّلَ مَرَّةٍ وَلِيُتَبِّرُوا مَا عَلَوْا تَتْبِيرًا","عَسَىٰ رَبُّكُمْ أَن يَرْحَمَكُمْ وَإِنْ عُدتُّمْ عُدْنَا وَجَعَلْنَا جَهَنَّمَ لِلْكَافِرِينَ حَصِيرًا","إِنَّ هَٰذَا الْقُرْآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ وَيُبَشِّرُ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا كَبِيرًا","وَأَنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ أَعْتَدْنَا لَهُمْ عَذَابًا أَلِيمًا","وَيَدْعُ الْإِنسَانُ بِالشَّرِّ دُعَاءَهُ بِالْخَيْرِ وَكَانَ الْإِنسَانُ عَجُولًا","وَجَعَلْنَا اللَّيْلَ وَالنَّهَارَ آيَتَيْنِ فَمَحَوْنَا آيَةَ اللَّيْلِ وَجَعَلْنَا آيَةَ النَّهَارِ مُبْصِرَةً لِّتَبْتَغُوا فَضْلًا مِّن رَّبِّكُمْ وَلِتَعْلَمُوا عَدَدَ السِّنِينَ وَالْحِسَابَ وَكُلَّ شَيْءٍ فَصَّلْنَاهُ تَفْصِيلًا","وَكُلَّ إِنسَانٍ أَلْزَمْنَاهُ طَائِرَهُ فِي عُنُقِهِ وَنُخْرِجُ لَهُ يَوْمَ الْقِيَامَةِ كِتَابًا يَلْقَاهُ مَنشُورًا","اقْرَأْ كِتَابَكَ كَفَىٰ بِنَفْسِكَ الْيَوْمَ عَلَيْكَ حَسِيبًا","مَّنِ اهْتَدَىٰ فَإِنَّمَا يَهْتَدِي لِنَفْسِهِ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا","وَإِذَا أَرَدْنَا أَن نُّهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا فَفَسَقُوا فِيهَا فَحَقَّ عَلَيْهَا الْقَوْلُ فَدَمَّرْنَاهَا تَدْمِيرًا","وَكَمْ أَهْلَكْنَا مِنَ الْقُرُونِ مِن بَعْدِ نُوحٍ وَكَفَىٰ بِرَبِّكَ بِذُنُوبِ عِبَادِهِ خَبِيرًا بَصِيرًا","مَّن كَانَ يُرِيدُ الْعَاجِلَةَ عَجَّلْنَا لَهُ فِيهَا مَا نَشَاءُ لِمَن نُّرِيدُ ثُمَّ جَعَلْنَا لَهُ جَهَنَّمَ يَصْلَاهَا مَذْمُومًا مَّدْحُورًا","وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُم مَّشْكُورًا","كُلًّا نُّمِدُّ هَٰؤُلَاءِ وَهَٰؤُلَاءِ مِنْ عَطَاءِ رَبِّكَ وَمَا كَانَ عَطَاءُ رَبِّكَ مَحْظُورًا","انظُرْ كَيْفَ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ وَلَلْآخِرَةُ أَكْبَرُ دَرَجَاتٍ وَأَكْبَرُ تَفْضِيلًا","لَّا تَجْعَلْ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَتَقْعُدَ مَذْمُومًا مَّخْذُولًا","وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا إِمَّا يَبْلُغَنَّ عِندَكَ الْكِبَرَ أَحَدُهُمَا أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا وَقُل لَّهُمَا قَوْلًا كَرِيمًا","وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا","رَّبُّكُمْ أَعْلَمُ بِمَا فِي نُفُوسِكُمْ إِن تَكُونُوا صَالِحِينَ فَإِنَّهُ كَانَ لِلْأَوَّابِينَ غَفُورًا","وَآتِ ذَا الْقُرْبَىٰ حَقَّهُ وَالْمِسْكِينَ وَابْنَ السَّبِيلِ وَلَا تُبَذِّرْ تَبْذِيرًا","إِنَّ الْمُبَذِّرِينَ كَانُوا إِخْوَانَ الشَّيَاطِينِ وَكَانَ الشَّيْطَانُ لِرَبِّهِ كَفُورًا","وَإِمَّا تُعْرِضَنَّ عَنْهُمُ ابْتِغَاءَ رَحْمَةٍ مِّن رَّبِّكَ تَرْجُوهَا فَقُل لَّهُمْ قَوْلًا مَّيْسُورًا","وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً إِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ الْبَسْطِ فَتَقْعُدَ مَلُومًا مَّحْسُورًا","إِنَّ رَبَّكَ يَبْسُطُ الرِّزْقَ لِمَن يَشَاءُ وَيَقْدِرُ إِنَّهُ كَانَ بِعِبَادِهِ خَبِيرًا بَصِيرًا","وَلَا تَقْتُلُوا أَوْلَادَكُمْ خَشْيَةَ إِمْلَاقٍ نَّحْنُ نَرْزُقُهُمْ وَإِيَّاكُمْ إِنَّ قَتْلَهُمْ كَانَ خِطْئًا كَبِيرًا","وَلَا تَقْرَبُوا الزِّنَىٰ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا","وَلَا تَقْتُلُوا النَّفْسَ الَّتِي حَرَّمَ اللَّهُ إِلَّا بِالْحَقِّ وَمَن قُتِلَ مَظْلُومًا فَقَدْ جَعَلْنَا لِوَلِيِّهِ سُلْطَانًا فَلَا يُسْرِف فِّي الْقَتْلِ إِنَّهُ كَانَ مَنصُورًا","وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُ وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا","وَأَوْفُوا الْكَيْلَ إِذَا كِلْتُمْ وَزِنُوا بِالْقِسْطَاسِ الْمُسْتَقِيمِ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا","وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا","وَلَا تَمْشِ فِي الْأَرْضِ مَرَحًا إِنَّكَ لَن تَخْرِقَ الْأَرْضَ وَلَن تَبْلُغَ الْجِبَالَ طُولًا","كُلُّ ذَٰلِكَ كَانَ سَيِّئُهُ عِندَ رَبِّكَ مَكْرُوهًا","ذَٰلِكَ مِمَّا أَوْحَىٰ إِلَيْكَ رَبُّكَ مِنَ الْحِكْمَةِ وَلَا تَجْعَلْ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَتُلْقَىٰ فِي جَهَنَّمَ مَلُومًا مَّدْحُورًا","أَفَأَصْفَاكُمْ رَبُّكُم بِالْبَنِينَ وَاتَّخَذَ مِنَ الْمَلَائِكَةِ إِنَاثًا إِنَّكُمْ لَتَقُولُونَ قَوْلًا عَظِيمًا","وَلَقَدْ صَرَّفْنَا فِي هَٰذَا الْقُرْآنِ لِيَذَّكَّرُوا وَمَا يَزِيدُهُمْ إِلَّا نُفُورًا","قُل لَّوْ كَانَ مَعَهُ آلِهَةٌ كَمَا يَقُولُونَ إِذًا لَّابْتَغَوْا إِلَىٰ ذِي الْعَرْشِ سَبِيلًا","سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يَقُولُونَ عُلُوًّا كَبِيرًا","تُسَبِّحُ لَهُ السَّمَاوَاتُ السَّبْعُ وَالْأَرْضُ وَمَن فِيهِنَّ وَإِن مِّن شَيْءٍ إِلَّا يُسَبِّحُ بِحَمْدِهِ وَلَٰكِن لَّا تَفْقَهُونَ تَسْبِيحَهُمْ إِنَّهُ كَانَ حَلِيمًا غَفُورًا","وَإِذَا قَرَأْتَ الْقُرْآنَ جَعَلْنَا بَيْنَكَ وَبَيْنَ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ حِجَابًا مَّسْتُورًا","وَجَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْرًا وَإِذَا ذَكَرْتَ رَبَّكَ فِي الْقُرْآنِ وَحْدَهُ وَلَّوْا عَلَىٰ أَدْبَارِهِمْ نُفُورًا","نَّحْنُ أَعْلَمُ بِمَا يَسْتَمِعُونَ بِهِ إِذْ يَسْتَمِعُونَ إِلَيْكَ وَإِذْ هُمْ نَجْوَىٰ إِذْ يَقُولُ الظَّالِمُونَ إِن تَتَّبِعُونَ إِلَّا رَجُلًا مَّسْحُورًا","انظُرْ كَيْفَ ضَرَبُوا لَكَ الْأَمْثَالَ فَضَلُّوا فَلَا يَسْتَطِيعُونَ سَبِيلًا","وَقَالُوا أَإِذَا كُنَّا عِظَامًا وَرُفَاتًا أَإِنَّا لَمَبْعُوثُونَ خَلْقًا جَدِيدًا","قُلْ كُونُوا حِجَارَةً أَوْ حَدِيدًا","أَوْ خَلْقًا مِّمَّا يَكْبُرُ فِي صُدُورِكُمْ فَسَيَقُولُونَ مَن يُعِيدُنَا قُلِ الَّذِي فَطَرَكُمْ أَوَّلَ مَرَّةٍ فَسَيُنْغِضُونَ إِلَيْكَ رُءُوسَهُمْ وَيَقُولُونَ مَتَىٰ هُوَ قُلْ عَسَىٰ أَن يَكُونَ قَرِيبًا","يَوْمَ يَدْعُوكُمْ فَتَسْتَجِيبُونَ بِحَمْدِهِ وَتَظُنُّونَ إِن لَّبِثْتُمْ إِلَّا قَلِيلًا","وَقُل لِّعِبَادِي يَقُولُوا الَّتِي هِيَ أَحْسَنُ إِنَّ الشَّيْطَانَ يَنزَغُ بَيْنَهُمْ إِنَّ الشَّيْطَانَ كَانَ لِلْإِنسَانِ عَدُوًّا مُّبِينًا","رَّبُّكُمْ أَعْلَمُ بِكُمْ إِن يَشَأْ يَرْحَمْكُمْ أَوْ إِن يَشَأْ يُعَذِّبْكُمْ وَمَا أَرْسَلْنَاكَ عَلَيْهِمْ وَكِيلًا","وَرَبُّكَ أَعْلَمُ بِمَن فِي السَّمَاوَاتِ وَالْأَرْضِ وَلَقَدْ فَضَّلْنَا بَعْضَ النَّبِيِّينَ عَلَىٰ بَعْضٍ وَآتَيْنَا دَاوُودَ زَبُورًا","قُلِ ادْعُوا الَّذِينَ زَعَمْتُم مِّن دُونِهِ فَلَا يَمْلِكُونَ كَشْفَ الضُّرِّ عَنكُمْ وَلَا تَحْوِيلًا","أُولَٰئِكَ الَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُ وَيَخَافُونَ عَذَابَهُ إِنَّ عَذَابَ رَبِّكَ كَانَ مَحْذُورًا","وَإِن مِّن قَرْيَةٍ إِلَّا نَحْنُ مُهْلِكُوهَا قَبْلَ يَوْمِ الْقِيَامَةِ أَوْ مُعَذِّبُوهَا عَذَابًا شَدِيدًا كَانَ ذَٰلِكَ فِي الْكِتَابِ مَسْطُورًا","وَمَا مَنَعَنَا أَن نُّرْسِلَ بِالْآيَاتِ إِلَّا أَن كَذَّبَ بِهَا الْأَوَّلُونَ وَآتَيْنَا ثَمُودَ النَّاقَةَ مُبْصِرَةً فَظَلَمُوا بِهَا وَمَا نُرْسِلُ بِالْآيَاتِ إِلَّا تَخْوِيفًا","وَإِذْ قُلْنَا لَكَ إِنَّ رَبَّكَ أَحَاطَ بِالنَّاسِ وَمَا جَعَلْنَا الرُّؤْيَا الَّتِي أَرَيْنَاكَ إِلَّا فِتْنَةً لِّلنَّاسِ وَالشَّجَرَةَ الْمَلْعُونَةَ فِي الْقُرْآنِ وَنُخَوِّفُهُمْ فَمَا يَزِيدُهُمْ إِلَّا طُغْيَانًا كَبِيرًا","وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ قَالَ أَأَسْجُدُ لِمَنْ خَلَقْتَ طِينًا","قَالَ أَرَأَيْتَكَ هَٰذَا الَّذِي كَرَّمْتَ عَلَيَّ لَئِنْ أَخَّرْتَنِ إِلَىٰ يَوْمِ الْقِيَامَةِ لَأَحْتَنِكَنَّ ذُرِّيَّتَهُ إِلَّا قَلِيلًا","قَالَ اذْهَبْ فَمَن تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَاؤُكُمْ جَزَاءً مَّوْفُورًا","وَاسْتَفْزِزْ مَنِ اسْتَطَعْتَ مِنْهُم بِصَوْتِكَ وَأَجْلِبْ عَلَيْهِم بِخَيْلِكَ وَرَجِلِكَ وَشَارِكْهُمْ فِي الْأَمْوَالِ وَالْأَوْلَادِ وَعِدْهُمْ وَمَا يَعِدُهُمُ الشَّيْطَانُ إِلَّا غُرُورًا","إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ وَكَفَىٰ بِرَبِّكَ وَكِيلًا","رَّبُّكُمُ الَّذِي يُزْجِي لَكُمُ الْفُلْكَ فِي الْبَحْرِ لِتَبْتَغُوا مِن فَضْلِهِ إِنَّهُ كَانَ بِكُمْ رَحِيمًا","وَإِذَا مَسَّكُمُ الضُّرُّ فِي الْبَحْرِ ضَلَّ مَن تَدْعُونَ إِلَّا إِيَّاهُ فَلَمَّا نَجَّاكُمْ إِلَى الْبَرِّ أَعْرَضْتُمْ وَكَانَ الْإِنسَانُ كَفُورًا","أَفَأَمِنتُمْ أَن يَخْسِفَ بِكُمْ جَانِبَ الْبَرِّ أَوْ يُرْسِلَ عَلَيْكُمْ حَاصِبًا ثُمَّ لَا تَجِدُوا لَكُمْ وَكِيلًا","أَمْ أَمِنتُمْ أَن يُعِيدَكُمْ فِيهِ تَارَةً أُخْرَىٰ فَيُرْسِلَ عَلَيْكُمْ قَاصِفًا مِّنَ الرِّيحِ فَيُغْرِقَكُم بِمَا كَفَرْتُمْ ثُمَّ لَا تَجِدُوا لَكُمْ عَلَيْنَا بِهِ تَبِيعًا","وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُم مِّنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَىٰ كَثِيرٍ مِّمَّنْ خَلَقْنَا تَفْضِيلًا","يَوْمَ نَدْعُو كُلَّ أُنَاسٍ بِإِمَامِهِمْ فَمَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ فَأُولَٰئِكَ يَقْرَءُونَ كِتَابَهُمْ وَلَا يُظْلَمُونَ فَتِيلًا","وَمَن كَانَ فِي هَٰذِهِ أَعْمَىٰ فَهُوَ فِي الْآخِرَةِ أَعْمَىٰ وَأَضَلُّ سَبِيلًا","وَإِن كَادُوا لَيَفْتِنُونَكَ عَنِ الَّذِي أَوْحَيْنَا إِلَيْكَ لِتَفْتَرِيَ عَلَيْنَا غَيْرَهُ وَإِذًا لَّاتَّخَذُوكَ خَلِيلًا","وَلَوْلَا أَن ثَبَّتْنَاكَ لَقَدْ كِدتَّ تَرْكَنُ إِلَيْهِمْ شَيْئًا قَلِيلًا","إِذًا لَّأَذَقْنَاكَ ضِعْفَ الْحَيَاةِ وَضِعْفَ الْمَمَاتِ ثُمَّ لَا تَجِدُ لَكَ عَلَيْنَا نَصِيرًا","وَإِن كَادُوا لَيَسْتَفِزُّونَكَ مِنَ الْأَرْضِ لِيُخْرِجُوكَ مِنْهَا وَإِذًا لَّا يَلْبَثُونَ خِلَافَكَ إِلَّا قَلِيلًا","سُنَّةَ مَن قَدْ أَرْسَلْنَا قَبْلَكَ مِن رُّسُلِنَا وَلَا تَجِدُ لِسُنَّتِنَا تَحْوِيلًا","أَقِمِ الصَّلَاةَ لِدُلُوكِ الشَّمْسِ إِلَىٰ غَسَقِ اللَّيْلِ وَقُرْآنَ الْفَجْرِ إِنَّ قُرْآنَ الْفَجْرِ كَانَ مَشْهُودًا","وَمِنَ اللَّيْلِ فَتَهَجَّدْ بِهِ نَافِلَةً لَّكَ عَسَىٰ أَن يَبْعَثَكَ رَبُّكَ مَقَامًا مَّحْمُودًا","وَقُل رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَل لِّي مِن لَّدُنكَ سُلْطَانًا نَّصِيرًا","وَقُلْ جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ إِنَّ الْبَاطِلَ كَانَ زَهُوقًا","وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ وَلَا يَزِيدُ الظَّالِمِينَ إِلَّا خَسَارًا","وَإِذَا أَنْعَمْنَا عَلَى الْإِنسَانِ أَعْرَضَ وَنَأَىٰ بِجَانِبِهِ وَإِذَا مَسَّهُ الشَّرُّ كَانَ يَئُوسًا","قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ فَرَبُّكُمْ أَعْلَمُ بِمَنْ هُوَ أَهْدَىٰ سَبِيلًا","وَيَسْأَلُونَكَ عَنِ الرُّوحِ قُلِ الرُّوحُ مِنْ أَمْرِ رَبِّي وَمَا أُوتِيتُم مِّنَ الْعِلْمِ إِلَّا قَلِيلًا","وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِالَّذِي أَوْحَيْنَا إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِ عَلَيْنَا وَكِيلًا","إِلَّا رَحْمَةً مِّن رَّبِّكَ إِنَّ فَضْلَهُ كَانَ عَلَيْكَ كَبِيرًا","قُل لَّئِنِ اجْتَمَعَتِ الْإِنسُ وَالْجِنُّ عَلَىٰ أَن يَأْتُوا بِمِثْلِ هَٰذَا الْقُرْآنِ لَا يَأْتُونَ بِمِثْلِهِ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٍ ظَهِيرًا","وَلَقَدْ صَرَّفْنَا لِلنَّاسِ فِي هَٰذَا الْقُرْآنِ مِن كُلِّ مَثَلٍ فَأَبَىٰ أَكْثَرُ النَّاسِ إِلَّا كُفُورًا","وَقَالُوا لَن نُّؤْمِنَ لَكَ حَتَّىٰ تَفْجُرَ لَنَا مِنَ الْأَرْضِ يَنبُوعًا","أَوْ تَكُونَ لَكَ جَنَّةٌ مِّن نَّخِيلٍ وَعِنَبٍ فَتُفَجِّرَ الْأَنْهَارَ خِلَالَهَا تَفْجِيرًا","أَوْ تُسْقِطَ السَّمَاءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِيَ بِاللَّهِ وَالْمَلَائِكَةِ قَبِيلًا","أَوْ يَكُونَ لَكَ بَيْتٌ مِّن زُخْرُفٍ أَوْ تَرْقَىٰ فِي السَّمَاءِ وَلَن نُّؤْمِنَ لِرُقِيِّكَ حَتَّىٰ تُنَزِّلَ عَلَيْنَا كِتَابًا نَّقْرَؤُهُ قُلْ سُبْحَانَ رَبِّي هَلْ كُنتُ إِلَّا بَشَرًا رَّسُولًا","وَمَا مَنَعَ النَّاسَ أَن يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ إِلَّا أَن قَالُوا أَبَعَثَ اللَّهُ بَشَرًا رَّسُولًا","قُل لَّوْ كَانَ فِي الْأَرْضِ مَلَائِكَةٌ يَمْشُونَ مُطْمَئِنِّينَ لَنَزَّلْنَا عَلَيْهِم مِّنَ السَّمَاءِ مَلَكًا رَّسُولًا","قُلْ كَفَىٰ بِاللَّهِ شَهِيدًا بَيْنِي وَبَيْنَكُمْ إِنَّهُ كَانَ بِعِبَادِهِ خَبِيرًا بَصِيرًا","وَمَن يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُمْ أَوْلِيَاءَ مِن دُونِهِ وَنَحْشُرُهُمْ يَوْمَ الْقِيَامَةِ عَلَىٰ وُجُوهِهِمْ عُمْيًا وَبُكْمًا وَصُمًّا مَّأْوَاهُمْ جَهَنَّمُ كُلَّمَا خَبَتْ زِدْنَاهُمْ سَعِيرًا","ذَٰلِكَ جَزَاؤُهُم بِأَنَّهُمْ كَفَرُوا بِآيَاتِنَا وَقَالُوا أَإِذَا كُنَّا عِظَامًا وَرُفَاتًا أَإِنَّا لَمَبْعُوثُونَ خَلْقًا جَدِيدًا","أَوَلَمْ يَرَوْا أَنَّ اللَّهَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ قَادِرٌ عَلَىٰ أَن يَخْلُقَ مِثْلَهُمْ وَجَعَلَ لَهُمْ أَجَلًا لَّا رَيْبَ فِيهِ فَأَبَى الظَّالِمُونَ إِلَّا كُفُورًا","قُل لَّوْ أَنتُمْ تَمْلِكُونَ خَزَائِنَ رَحْمَةِ رَبِّي إِذًا لَّأَمْسَكْتُمْ خَشْيَةَ الْإِنفَاقِ وَكَانَ الْإِنسَانُ قَتُورًا","وَلَقَدْ آتَيْنَا مُوسَىٰ تِسْعَ آيَاتٍ بَيِّنَاتٍ فَاسْأَلْ بَنِي إِسْرَائِيلَ إِذْ جَاءَهُمْ فَقَالَ لَهُ فِرْعَوْنُ إِنِّي لَأَظُنُّكَ يَا مُوسَىٰ مَسْحُورًا","قَالَ لَقَدْ عَلِمْتَ مَا أَنزَلَ هَٰؤُلَاءِ إِلَّا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ بَصَائِرَ وَإِنِّي لَأَظُنُّكَ يَا فِرْعَوْنُ مَثْبُورًا","فَأَرَادَ أَن يَسْتَفِزَّهُم مِّنَ الْأَرْضِ فَأَغْرَقْنَاهُ وَمَن مَّعَهُ جَمِيعًا","وَقُلْنَا مِن بَعْدِهِ لِبَنِي إِسْرَائِيلَ اسْكُنُوا الْأَرْضَ فَإِذَا جَاءَ وَعْدُ الْآخِرَةِ جِئْنَا بِكُمْ لَفِيفًا","وَبِالْحَقِّ أَنزَلْنَاهُ وَبِالْحَقِّ نَزَلَ وَمَا أَرْسَلْنَاكَ إِلَّا مُبَشِّرًا وَنَذِيرًا","وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَىٰ مُكْثٍ وَنَزَّلْنَاهُ تَنزِيلًا","قُلْ آمِنُوا بِهِ أَوْ لَا تُؤْمِنُوا إِنَّ الَّذِينَ أُوتُوا الْعِلْمَ مِن قَبْلِهِ إِذَا يُتْلَىٰ عَلَيْهِمْ يَخِرُّونَ لِلْأَذْقَانِ سُجَّدًا","وَيَقُولُونَ سُبْحَانَ رَبِّنَا إِن كَانَ وَعْدُ رَبِّنَا لَمَفْعُولًا","وَيَخِرُّونَ لِلْأَذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعًا","قُلِ ادْعُوا اللَّهَ أَوِ ادْعُوا الرَّحْمَٰنَ أَيًّا مَّا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ وَلَا تَجْهَرْ بِصَلَاتِكَ وَلَا تُخَافِتْ بِهَا وَابْتَغِ بَيْنَ ذَٰلِكَ سَبِيلًا","وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُن لَّهُ وَلِيٌّ مِّنَ الذُّلِّ وَكَبِّرْهُ تَكْبِيرًا"],"en":["Exalted is He who took His Servant [i.e., Prophet Muḥammad (ﷺ)] by night from al-Masjid al-Ḥarām to al-Masjid al-Aqṣā, whose surroundings We have blessed, to show him of Our signs. Indeed, He is the Hearing, the Seeing.","And We gave Moses the Scripture and made it a guidance for the Children of Israel that you not take other than Me as Disposer of affairs,","O descendants of those We carried [in the ship] with Noah. Indeed, he was a grateful servant.","And We conveyed to the Children of Israel in the Scripture that, \"You will surely cause corruption on the earth twice, and you will surely reach [a degree of] great haughtiness.\"","So when the [time of] promise came for the first of them, We sent against you servants of Ours - those of great military might, and they probed [even] into the homes, and it was a promise fulfilled.","Then We gave back to you a return victory over them. And We reinforced you with wealth and sons and made you more numerous in manpower.","[And said], \"If you do good, you do good for yourselves; and if you do evil, [you do it] to them [i.e., yourselves].\" Then when the final [i.e., second] promise came, [We sent your en
