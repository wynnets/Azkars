emies] to sadden your faces and to enter the masjid [i.e., the temple in Jerusalem], as they entered it the first time, and to destroy what they had taken over with [total] destruction.","[Then Allāh said], \"It is expected, [if you repent], that your Lord will have mercy upon you. But if you return [to sin], We will return [to punishment]. And We have made Hell, for the disbelievers, a prison-bed.\"","Indeed, this Qur’ān guides to that which is most suitable and gives good tidings to the believers who do righteous deeds that they will have a great reward","And that those who do not believe in the Hereafter - We have prepared for them a painful punishment.","And man supplicates for evil [when angry] as he supplicates for good, and man is ever hasty.","And We have made the night and day two signs, and We erased the sign of the night and made the sign of the day visible that you may seek bounty from your Lord and may know the number of years and the account [of time]. And everything We have set out in detail.","And [for] every person We have imposed his fate upon his neck, and We will produce for him on the Day of Resurrection a record which he will encounter spread open.","[It will be said], \"Read your record. Sufficient is yourself against you this Day as accountant.\"","Whoever is guided is only guided for [the benefit of] his soul. And whoever errs only errs against it. And no bearer of burdens will bear the burden of another. And never would We punish until We sent a messenger.","And when We intend to destroy a city, We command its affluent but they defiantly disobey therein; so the word [i.e., deserved decree] comes into effect upon it, and We destroy it with [complete] destruction.","And how many have We destroyed from the generations after Noah. And sufficient is your Lord, concerning the sins of His servants, as Aware and Seeing.","Whoever should desire the immediate - We hasten for him from it what We will to whom We intend. Then We have made for him Hell, which he will [enter to] burn, censured and banished.","But whoever desires the Hereafter and exerts the effort due to it while he is a believer - it is those whose effort is ever appreciated [by Allāh].","To each [category] We extend - to these and to those - from the gift of your Lord. And never has the gift of your Lord been restricted.","Look how We have favored [in provision] some of them over others. But the Hereafter is greater in degrees [of difference] and greater in distinction.","Do not make [as equal] with Allāh another deity and [thereby] become censured and forsaken.","And your Lord has decreed that you worship not except Him, and to parents, good treatment. Whether one or both of them reach old age [while] with you, say not to them [so much as], \"uff,\" and do not repel them but speak to them a noble word.","And lower to them the wing of humility out of mercy and say, \"My Lord, have mercy upon them as they brought me up [when I was] small.\"","Your Lord is most knowing of what is within yourselves. If you should be righteous [in intention] - then indeed He is ever, to the often returning [to Him], Forgiving.","And give the relative his right, and [also] the poor and the traveler, and do not spend wastefully.","Indeed, the wasteful are brothers of the devils, and ever has Satan been to his Lord ungrateful.","And if you [must] turn away from them [i.e., the needy] awaiting mercy from your Lord which you expect, then speak to them a gentle word.","And do not make your hand [as] chained to your neck or extend it completely and [thereby] become blamed and insolvent.","Indeed, your Lord extends provision for whom He wills and restricts [it]. Indeed He is ever, concerning His servants, Aware and Seeing.","And do not kill your children for fear of poverty. We provide for them and for you. Indeed, their killing is ever a great sin.","And do not approach unlawful sexual intercourse. Indeed, it is ever an immorality and is evil as a way.","And do not kill the soul [i.e., person] which Allāh has forbidden, except by right. And whoever is killed unjustly - We have given his heir authority, but let him not exceed limits in [the matter of] taking life. Indeed, he has been supported [by the law].","And do not approach the property of an orphan, except in the way that is best, until he reaches maturity. And fulfill [every] commitment. Indeed, the commitment is ever [that about which one will be] questioned.","And give full measure when you measure, and weigh with an even [i.e., honest] balance. That is the best [way] and best in result.","And do not pursue that of which you have no knowledge. Indeed, the hearing, the sight and the heart - about all those [one] will be questioned.","And do not walk upon the earth exultantly. Indeed, you will never tear the earth [apart], and you will never reach the mountains in height.","All that [i.e., the aforementioned] - its evil is ever, in the sight of your Lord, detested.","That is from what your Lord has revealed to you, [O Muḥammad], of wisdom. And, [O mankind], do not make [as equal] with Allāh another deity, lest you be thrown into Hell, blamed and banished.","Then, has your Lord chosen you for [having] sons and taken [i.e., adopted] from among the angels daughters? Indeed, you say a grave saying.","And We have certainly diversified [the contents] in this Qur’ān that they [i.e., mankind] may be reminded, but it does not increase them [i.e., the disbelievers] except in aversion.","Say, [O Muḥammad], \"If there had been with Him [other] gods, as they say, then they [each] would have sought to the Owner of the Throne a way.\"","Exalted is He and high above what they say by great sublimity.","The seven heavens and the earth and whatever is in them exalt Him. And there is not a thing except that it exalts [Allāh] by His praise, but you do not understand their [way of] exalting. Indeed, He is ever Forbearing and Forgiving.","And when you recite the Qur’ān, We put between you and those who do not believe in the Hereafter a concealed partition.","And We have placed over their hearts coverings, lest they understand it, and in their ears deafness. And when you mention your Lord alone in the Qur’ān, they turn back in aversion.","We are most knowing of how they listen to it when they listen to you and [of] when they are in private conversation, when the wrongdoers say, \"You follow not but a man affected by magic.\"","Look how they strike for you comparisons; but they have strayed, so they cannot [find] a way.","And they say, \"When we are bones and crumbled particles, will we [truly] be resurrected as a new creation?\"","Say, \"Be you stones or iron","Or [any] creation of that which is great within your breasts.\" And they will say, \"Who will restore us?\" Say, \"He who brought you forth the first time.\" Then they will nod their heads toward you and say, \"When is that?\" Say, \"Perhaps it will be soon -","On the Day He will call you and you will respond with praise of Him and think that you had not remained [in the world] except for a little.\"","And tell My servants to say that which is best. Indeed, Satan induces [dissension] among them. Indeed Satan is ever, to mankind, a clear enemy.","Your Lord is most knowing of you. If He wills, He will have mercy upon you; or if He wills, He will punish you. And We have not sent you, [O Muḥammad], over them as a manager.","And your Lord is most knowing of whoever is in the heavens and the earth. And We have made some of the prophets exceed others [in various ways], and to David We gave the book [of Psalms].","Say, \"Invoke those you have claimed [as gods] besides Him, for they do not possess the [ability for] removal of adversity from you or [for its] transfer [to someone else].\"","Those whom they invoke seek means of access to their Lord, [striving as to] which of them would be nearest, and they hope for His mercy and fear His punishment. Indeed, the punishment of your Lord is ever feared.","And there is no city but that We will destroy it before the Day of Resurrection or punish it with a severe punishment. That has ever been in the Register inscribed.","And nothing has prevented Us from sending signs [i.e., miracles] except that the former peoples denied them. And We gave Thamūd the she-camel as a visible sign, but they wronged her. And We send not the signs except as a warning.","And [remember, O Muḥammad], when We told you, \"Indeed, your Lord has encompassed the people.\" And We did not make the sight which We showed you except as a trial for the people, as was the accursed tree [mentioned] in the Qur’ān. And We threaten [i.e., warn] them, but it increases them not except in great transgression.","And [mention] when We said to the angels, \"Prostrate to Adam,\" and they prostrated, except for Iblees. He said, \"Should I prostrate to one You created from clay?\"","[Iblees] said, \"Do You see this one whom You have honored above me? If You delay me [i.e., my death] until the Day of Resurrection, I will surely destroy his descendants, except for a few.\"","[Allāh] said, \"Go, for whoever of them follows you, indeed Hell will be the recompense of [all of] you - an ample recompense.","And incite [to senselessness] whoever you can among them with your voice and assault them with your horses and foot soldiers and become a partner in their wealth and their children and promise them.\" But Satan does not promise them except delusion.","Indeed, over My [believing] servants there is for you no authority. And sufficient is your Lord as Disposer of affairs.","It is your Lord who drives the ship for you through the sea that you may seek of His bounty. Indeed, He is ever, to you, Merciful.","And when adversity touches you at sea, lost are [all] those you invoke except for Him. But when He delivers you to the land, you turn away [from Him]. And ever is man ungrateful.","Then do you feel secure that [instead] He will not cause a part of the land to swallow you or send against you a storm of stones? Then you would not find for yourselves an advocate.","Or do you feel secure that He will not send you back into it [i.e., the sea] another time and send upon you a hurricane of wind and drown you for what you denied? Then you would not find for yourselves against Us an avenger.","And We have certainly honored the children of Adam and carried them on the land and sea and provided for them of the good things and preferred them over much of what We have created, with [definite] preference.","[Mention, O Muḥammad], the Day We will call forth every people with their record [of deeds]. Then whoever is given his record in his right hand - those will read their records, and injustice will not be done to them, [even] as much as a thread [inside the date seed].","And whoever is blind in this [life] will be blind in the Hereafter and more astray in way.","And indeed, they were about to tempt you away from that which We revealed to you in order to [make] you invent about Us something else; and then they would have taken you as a friend.","And if We had not strengthened you, you would have almost inclined to them a little.","Then [if you had], We would have made you taste double [punishment in] life and double [after] death. Then you would not find for yourself against Us a helper.","And indeed, they were about to provoke [i.e., drive] you from the land [i.e., Makkah] to evict you therefrom. And then [when they do], they will not remain [there] after you, except for a little.","[That is Our] established way for those We had sent before you of Our messengers; and you will not find in Our way any alteration.","Establish prayer at the decline of the sun [from its meridian] until the darkness of the night and [also] the Qur’ān [i.e., recitation] of dawn. Indeed, the recitation of dawn is ever witnessed.","And from [part of] the night, pray with it [i.e., recitation of the Qur’ān] as additional [worship] for you; it is expected that your Lord will resurrect you to a praised station.","And say, \"My Lord, cause me to enter a sound entrance and to exit a sound exit and grant me from Yourself a supporting authority.\"","And say, \"Truth has come, and falsehood has departed. Indeed is falsehood, [by nature], ever bound to depart.\"","And We send down of the Qur’ān that which is healing and mercy for the believers, but it does not increase the wrongdoers except in loss.","And when We bestow favor upon man [i.e., the disbeliever], he turns away and distances himself; and when evil touches him, he is ever despairing.","Say, \"Each works according to his manner, but your Lord is most knowing of who is best guided in way.\"","And they ask you, [O Muḥammad], about the soul. Say, \"The soul is of the affair [i.e., concern] of my Lord. And you [i.e., mankind] have not been given of knowledge except a little.\"","And if We willed, We could surely do away with that which We revealed to you. Then you would not find for yourself concerning it an advocate against Us.","Except [We have left it with you] as a mercy from your Lord. Indeed, His favor upon you has ever been great.","Say, \"If mankind and the jinn gathered in order to produce the like of this Qur’ān, they could not produce the like of it, even if they were to each other assistants.\"","And We have certainly diversified for the people in this Qur’ān from every [kind of] example, but most of the people refused except disbelief.","And they say, \"We will not believe you until you break open for us from the ground a spring","Or [until] you have a garden of palm trees and grapes and make rivers gush forth within them in force [and abundance]","Or you make the heaven fall upon us in fragments as you have claimed or you bring Allāh and the angels before [us]","Or you have a house of ornament [i.e., gold] or you ascend into the sky. And [even then], we will not believe in your ascension until you bring down to us a book we may read.\" Say, \"Exalted is my Lord! Was I ever but a human messenger?\"","And what prevented the people from believing when guidance came to them except that they said, \"Has Allāh sent a human messenger?\"","Say, \"If there were upon the earth angels walking securely, We would have sent down to them from the heaven an angel [as a] messenger.\"","Say, \"Sufficient is Allāh as Witness between me and you. Indeed He is ever, concerning His servants, Aware and Seeing.\"","And whoever Allāh guides - he is the [rightly] guided; and whoever He sends astray - you will never find for them protectors besides Him, and We will gather them on the Day of Resurrection [fallen] on their faces - blind, dumb and deaf. Their refuge is Hell; every time it subsides, We increase [for] them blazing fire.","That is their recompense because they disbelieved in Our verses and said, \"When we are bones and crumbled particles, will we [truly] be resurrected [in] a new creation?\"","Do they not see that Allāh, who created the heavens and earth, is [the one] Able to create the likes of them? And He has appointed for them a term, about which there is no doubt. But the wrongdoers refuse except disbelief.","Say [to them], \"If you possessed the depositories of the mercy of my Lord, then you would withhold out of fear of spending.\" And ever has man been stingy.","And We had certainly given Moses nine evident signs, so ask the Children of Israel [about] when he came to them and Pharaoh said to him, \"Indeed I think, O Moses, that you are affected by magic.\"","[Moses] said, \"You have already known that none has sent down these [signs] except the Lord of the heavens and the earth as evidence, and indeed I think, O Pharaoh, that you are destroyed.\"","So he intended to drive them from the land, but We drowned him and those with him all together.","And We said after him [i.e., Pharaoh] to the Children of Israel, \"Dwell in the land, and when there comes the promise [i.e., appointment] of the Hereafter, We will bring you forth in [one] gathering.\"","And with the truth We have sent it [i.e., the Qur’ān] down, and with the truth it has descended. And We have not sent you, [O Muḥammad], except as a bringer of good tidings and a warner.","And [it is] a Qur’ān which We have separated [by intervals] that you might recite it to the people over a prolonged period. And We have sent it down progressively.","Say, \"Believe in it or do not believe.\" Indeed, those who were given knowledge before it - when it is recited to them, they fall upon their faces in prostration,","And they say, \"Exalted is our Lord! Indeed, the promise of our Lord has been fulfilled.\"","And they fall upon their faces weeping, and it [i.e., the Qur’ān] increases them in humble submission.","Say, \"Call upon Allāh or call upon the Most Merciful [ar-Raḥmān]. Whichever [name] you call - to Him belong the best names.\" And do not recite [too] loudly in your prayer or [too] quietly but seek between that an [intermediate] way.","And say, \"Praise to Allāh, who has not taken a son and has had no partner in [His] dominion and has no [need of a] protector out of weakness; and glorify Him with [great] glorification.\""],"ru":["Пречист Тот, Кто перенёс ночью Своего раба из Заповедной мечети в мечеть Отдаленнейшую, окрестности которой Мы благословили, дабы показать ему часть из Наших знамений. Воистину, Он — Слышащий, Видящий.","Мы даровали Мусе Писание и сделали его руководством для сынов Исраила: «Не берите помимо Меня покровителя,","о потомки тех, кого Мы перенесли вместе с Нухом! Воистину, он был благодарным рабом».","И Мы предначертали сынам Исраила в Писании: «Вы непременно дважды сотворите беззаконие на земле и непременно впадёте в великое высокомерие!»","Когда же наступил срок первого из них, Мы послали против вас Наших рабов, обладающих суровой мощью, и они прошли среди жилищ. И это было обещанием исполненным.","Затем Мы вернули вам перевес над ними и укрепили вас богатством и сыновьями, и сделали вас более многочисленными.","Если вы поступали добродетельно, то поступали добродетельно для самих себя, а если творили зло, то во вред себе. Когда же наступил срок последнего, [они пришли] чтобы покрыть ваши лица позором, войти в Храм, подобно тому, как вошли в него в первый раз, и до основания разрушить всё, чем завладели.","Может быть, ваш Господь помилует вас. Но если вы вернётесь, то и Мы вернёмся. И Мы сделали Геенну для отвергших веру местом заточения.","Воистину, этот Коран ведёт к тому, что является самым верным, и возвещает благую весть верующим, которые совершают праведные деяния, о том, что для них — великая награда,","и что те, которые не веруют в Последнюю жизнь — Мы уготовили им мучительное наказание.","Человек молит о зле так же, как молит о добре, ибо человек тороплив.","Мы сделали ночь и день двумя знамениями. И Мы стерли знамение ночи и сделали знамение дня дающим видеть, дабы вы искали милости от своего Господа и знали число лет и счёт. И Мы подробно разъяснили каждую вещь.","И каждому человеку Мы привязали его жребий к его шее. А в День воскресения Мы вынесем ему книгу, которую он встретит раскрытой:","«Читай свою книгу! Сегодня достаточно тебя самого, чтобы подвести счёт своим деяниям».","Кто следует прямым путём, тот следует прямым путём лишь для самого себя; а кто заблуждается, тот заблуждается во вред себе. И не понесёт несущая ношу бремя другой. И Мы не наказывали, пока не посылали посланника.","Когда Мы желали погубить селение, Мы повелевали его погрязшим в роскоши [повиноваться], но они предавались в нём нечестию; и тогда сбывалось над ним Слово, и Мы истребляли его полностью.","И сколько поколений Мы погубили после Нуха! И довольно твоего Господа как Сведущего и Видящего о грехах Своих рабов.","Кто желает быстротечной, тому Мы ускоряем в ней то, что пожелаем, — для кого пожелаем. Затем Мы сделали для него Геенну [местом], где он будет гореть, будучи презренным, отверженным.","А кто желает Последней жизни, старается ради неё должным старанием, будучи верующим, — такие: их старание будет отблагодарено.","Всех Мы поддерживаем — и этих, и тех — из даров твоего Господа. И дары твоего Господа не бывают запретны.","Посмотри, как Мы дали преимущество одним из них над другими. А Последняя жизнь — больше по степеням и значительнее по преимуществам.","Не устанавливай наряду с Аллахом другого бога, иначе останешься порицаемым, покинутым.","Твой Господь предписал, чтобы вы не поклонялись никому, кроме Него, и к родителям — добродетельное отношение. Если один из них или оба достигнут при тебе старости, то не говори им: «Уф!», не кричи на них и говори им слово почтительное.","И склони пред ними крыло смирения из милосердия и говори: «Господь мой! Помилуй их, ведь они растили меня, когда я был маленьким».","Ваш Господь лучше знает то, что в ваших душах. Если вы будете праведны, то воистину, Он всегда был [и пребудет] для кающихся прощающим.","И давай родственнику его должное, а также бедняку и путнику, и не расточай безрассудно.","Воистину, расточители — братья шайтанов, а шайтан неблагодарен своему Господу.","А если ты отворачиваешься от них в ожидании милости от твоего Господа, на которую надеешься, то скажи им мягкое слово.","И не держи свою руку скованной у своей шеи, и не простирай её полностью, иначе окажешься порицаемым, опустошённым.","Воистину, твой Господь увеличивает удел кому пожелает и ограничивает его. Воистину, Он всегда был [и пребудет] о Своих рабах сведущим, видящим.","И не убивайте своих детей из страха нищеты — Мы даруем пропитание им и вам. Воистину, убивать их — великий грех.","И не приближайтесь к прелюбодеянию. Воистину, это — мерзость и скверный путь.","И не убивайте душу, которую Аллах запретил, иначе как по праву. А кто убит несправедливо — Мы даровали его близкому власть [возмездия]; и пусть он не преступает меры в убийстве. Воистину, ему оказана помощь.","И не приближайтесь к имуществу сироты, иначе как наилучшим образом, пока он не достигнет зрелости. И будьте верны договору: воистину, о договоре будет спрошено.","Наполняйте меру сполна, когда отмеряете, и взвешивайте верными весами. Это — лучше и прекраснее по исходу.","И не следуй тому, о чём у тебя нет знания. Воистину, слух, и зрение, и сердце — за всё это призовут к ответу.","И не ходи по земле надменно: воистину, ты никогда не расколешь землю и не достигнешь гор высотой..","Зло всего этого ненавистно твоему Господу.","Это — из того, что твой Господь внушил тебе из мудрости. И не устанавливай вместе с Аллахом другого бога, иначе будешь ввергнут в Геенну, порицаемым, отверженным.","Неужели ваш Господь избрал для вас сыновей, а Себе взял из числа ангелов дочерей? Воистину, вы говорите великое слово.","Действительно, Мы разъяснили в этом Коране [истину] разными способами, чтобы они вняли напоминанию, но это лишь усиливает в них отвращение.","Скажи: «Если бы наряду с Ним были боги, как они говорят, то они непременно стали бы искать путь к Обладателю Трона».","Пречист Он и превыше того, что они говорят, — высоко превознесён.","Его прославляют семь небес, и земля, и все, кто в них. И нет ничего, что бы ни прославляло Его хвалой, но вы не понимаете их прославления. Воистину, Он всегда был [и пребудет] сдержанным, прощающим.","Когда ты читаешь Коран, Мы воздвигаем между тобой и теми, которые не веруют в Последнюю жизнь, сокрытую завесу.","Мы наложили на их сердца покровы, чтобы они не постигли его, а в их ушах — тяжесть. Когда же ты поминаешь в Коране своего Господа Единым, они отворачиваются с отвращением.","Мы лучше знаем, что именно они слушают, когда слушают тебя; и вот они тайно совещаются, и вот несправедливые говорят: «Вы следуете не иначе как за околдованным человеком!»","Посмотри, какие сравнения они приводят тебе! Они впали в заблуждение и не могут найти пути.","И они сказали: «Неужели, когда мы станем костями и прахом, — неужели мы будем воскрешены — новым творением?»","Скажи: «Будь вы хоть камнями, хоть железом,","или любым [другим] творением из тех, что кажутся великими в ваших сердцах». Они скажут: «Кто же нас вернет [к жизни]?» Скажи: «Тот, Кто сотворил вас в первый раз». Тогда они станут покачивать перед тобой своими головами и спрашивать: «Когда же это [произойдет]?» Скажи: «Возможно это случится скоро!»","В тот День, когда Он призовёт вас, вы откликнетесь, восхваляя Его, и подумаете, что пробыли совсем недолго.","Скажи Моим рабам: пусть они говорят то, что лучше. Воистину, шайтан вносит между ними раздор. Воистину, шайтан для человека — явный враг.","Ваш Господь лучше знает вас. Если пожелает, Он смилуется над вами, а если пожелает — накажет вас. И Мы не посылали тебя над ними поручителем.","И твой Господь лучше знает тех, кто на небесах и на земле. И Мы возвысили одних пророков над другими и даровали Дауду Псалтырь.","Скажи: «Взывайте к тем, о которых вы утверждали помимо Него: они не властны ни устранить от вас беду, ни отвести её.","Те, к которым они взывают, сами ищут средство приближения к своему Господу — кто из них ближе — и надеются на Его милость, и боятся Его наказания. Воистину, наказание твоего Господа — то, чего надлежит остерегаться.","Нет ни одного селения, которое Мы не уничтожим до Дня воскресения или не подвергнем тяжкому наказанию. Это начертано в Писании.","И ничто не удерживало Нас от того, чтобы послать знамения, кроме того, что прежние поколения сочли их ложью. И Мы даровали племени самуд верблюдицу как наглядное знамение, но они поступили с ней несправедливо. И Мы посылаем знамения не иначе как для устрашения.","Вот Мы сказали тебе: «Воистину, твой Господь объемлет людей». И видение, которое Мы показали тебе, и дерево, проклятое в Коране, Мы сделали не иначе как искушением для людей. Мы устрашаем их, но это лишь приумножает их великое бесчинство.","И вот Мы сказали ангелам: «Падите ниц пред Адамом!» — и они пали ниц, кроме Иблиса. Он сказал: «Неужели я паду ниц пред тем, кого Ты сотворил глиной?»","Он сказал: «Скажи мне, это тот, кого Ты возвысил надо мной? Если Ты дашь мне отсрочку до Дня воскресения, я непременно взнуздаю его потомков, за исключением немногих».","Он сказал: «Ступай! А кто из них последует за тобой, то, воистину, Геенна — ваше воздаяние, воздаяние сполна.","И подстрекай своим голосом, кого сможешь из них, и пошли на них свою конницу и пехоту, дели с ними имущество и детей и давай им обещания. Но шайтан не обещает им ничего, кроме обольщения.","Воистину, Мои рабы — нет у тебя над ними власти. И достаточно твоего Господа как попечителя».","Ваш Господь — Тот, Кто движет для вас корабли по морю, чтобы вы искали от Его щедрот. Воистину, Он всегда [был и пребудет] к вам милующим.","А когда в море вас касается бедствие, исчезают те, к кому вы взываете, кроме Него. Когда же Он спасает вас на сушу, вы отворачиваетесь. И человек бывает крайне неблагодарен.","Неужели вы чувствуете себя в безопасности от того, что Он заставит провалиться под вами край суши или пошлёт на вас каменный вихрь, — и тогда вы не найдёте себе покровителя?","Или же вы обезопасились от того, что Он вернёт вас в него ещё раз, и пошлёт на вас сокрушительный ветер, и потопит вас за то, что вы были неблагодарны, — и тогда вы не найдёте против Нас в этом взыскателя?","Действительно, Мы оказали честь сынам Адама и переносили их по суше и по морю, и наделили их из благого, и отдали им предпочтение над многими из тех, кого Мы сотворили, — явным предпочтением.","В День, когда Мы призовём каждую группу людей с их предводителем, те, кому будет вручена их книга в правую руку, будут читать свою книгу, и с ними не поступят несправедливо даже на ниточку финиковой косточки.","А кто был слеп в этой [жизни], тот и в Последней будет слеп — и ещё более сбившимся с пути.","Они едва не отвратили тебя от того, что Мы внушили тебе, чтобы ты измыслил Нас нечто иное; и тогда они непременно сделали бы тебя своим близким другом.","И если бы Мы не укрепили тебя, ты был бы близок к тому, чтобы склониться к ним немного.","Тогда Мы дали бы тебе вкусить двойное [в этой] жизни и двойное [после] смерти, — и тогда ты не нашёл бы себе против Нас помощника.","И они едва не вынудили тебя уйти с этой земли, чтобы изгнать тебя из неё; и тогда они не задержались бы после тебя иначе как недолго.","Таков неизменный порядок тех, кого Мы посылали до тебя из Наших посланников; и ты не найдёшь для Нашего порядка изменения.","Выстаивай молитву от склонения солнца и до мрака ночи, и [читай] Коран на заре. Воистину, [чтение] Корана на заре имеет свидетелей.","И в часть ночи бодрствуй с ним, совершая это для себя как дополнительное, — может быть, твой Господь возведёт тебя на место достохвальное.","И скажи: «Господь мой! Введи меня входом истины и выведи меня выходом истины, и даруй мне от Себя власть, [что будет] помощником».","И скажи: «Пришла истина, и исчезла ложь. Воистину, ложное обречено исчезнуть».","И Мы ниспосылаем из Корана то, что является исцелением и милостью для верующих; а несправедливым он не прибавляет ничего, кроме убытка.","И когда Мы даруем человеку благо, он отворачивается и удаляется в сторону; а когда его касается зло, он впадает в отчаяние.","Скажи: «Каждый поступает по своему устроению, но ваш Господь лучше знает, кто следует более верным путём».","Они спрашивают тебя о духе. Скажи: «Дух — от повеления моего Господа, тогда как вам даровано из знания лишь немного».","А если бы Мы пожелали, то непременно забрали бы то, что внушили тебе, — и тогда ты не нашёл бы себе в этом против Нас попечителя,","если только не по милости от твоего Господа. Воистину, Его щедрость к тебе велика.","Скажи: «Если бы люди и джинны объединились, чтобы явить подобное этому Корану, они бы не явили подобного ему, даже если бы одни из них были помощниками другим».","Действительно, Мы приводили людям в этом Коране всевозможные притчи разными способами; но большинство людей не пожелало ничего, кроме неверия.","И они сказали: «Мы ни за что не поверим тебе, пока ты не заставишь забить для нас из земли родник.","Или [пока] не будет у тебя сада из пальм и винограда, и ты не заставишь реки обильно течь между ними.","Или [пока] ты не обрушишь на нас небо кусками, как ты утверждал, или не явишься с Аллахом и ангелами лицом к лицу.","Или [пока] у тебя не будет дома из золота, или же ты не вознесёшься на небо. И мы не поверим твоему вознесению, пока ты не низведёшь нам писание, которое мы будем читать!» Скажи: «Пречист мой Господь! Разве я был кем-либо иным, кроме человека-посланника?»","Ничто не удержало людей от того, чтобы уверовать, когда к ним пришло верное руководство, кроме того, что они сказали: «Неужели Аллах отправил посланника-человека?»","Скажи: «Если бы на земле были ангелы, ходящие [по ней] спокойно, то Мы непременно низвели бы к ним с неба посланника-ангела».","Скажи: «Достаточно Аллаха свидетелем между мной и вами. Воистину, Он всегда был [и пребудет] о Своих рабах сведущим, видящим».","Тот, кого Аллах ведёт [прямым путём], — тот и следует верным путём. А для тех, кого Он вводит в заблуждение, ты не найдёшь покровителей помимо Него. В День воскресения Мы соберём их [влачимыми] на лицах — слепыми, немыми и глухими. Их пристанищем будет Геенна. Всякий раз, как она станет угасать, Мы будем прибавлять им пламени.","Таково их воздаяние за то, что они отвергли Наши знамения и сказали: «Неужели после того, как мы станем костями и прахом, мы будем воскрешены — новым творением?»","Неужели они не видят, что Аллах, Который сотворил небеса и землю, властен сотворить подобных им, и что Он назначил им срок, в котором нет сомнения? Но несправедливые не пожелали ничего, кроме неверия.","Скажи: «Если бы вы владели сокровищницами милости моего Господа, то непременно удерживали бы их из боязни растратить. И человек крайне скуп».","Действительно, Мы даровали Мусе девять ясных знамений. Спроси же сынов Исраила о том, как он явился к ним, и как Фараон сказал ему: «Я думаю, о Муса, что ты околдован».","Он сказал: «Он сказал: «Ты ведь знаешь, что ниспослал их не кто иной, как Господь небес и земли — как наглядные доказательства. И я думаю, о Фараон, что ты обречён на гибель».","И он вознамерился изгнать их из этой земли, но Мы потопили его и всех, кто был с ним, — всех до единого.","А после него Мы сказали сынам Исраила: «Поселяйтесь на земле. Когда же настанет срок Последнего обещания, Мы соберём вас всех вместе [единым собранием]».","И с истиной Мы ниспослали его, и с истиной он снизошёл. И Мы послали тебя не иначе, как благовестником и предостерегающим.","И Коран — Мы разделили его, чтобы ты читал его людям неспешно; и Мы ниспосылали его постепенно.","Скажи: «Веруйте в него или не веруйте. Воистину, те, которым было даровано знание до него, когда он читается им — они падают ниц, на подбородки».","И они говорят: «Пречист наш Господь! Воистину, обещание нашего Господа непременно будет исполнено».","И они падают ниц — на подбородки, плача, и это прибавляет им смирения.","Скажи: «Призывайте Аллаха или призывайте Всемилостивого. Каким бы [именем] вы ни взывали, у Него — прекраснейшие имена». И не произноси громко свою молитву и не произноси её слишком тихо, а ищи между этим путь.","И скажи: «Хвала Аллаху, Который не взял Себе дитя, и нет у Него сотоварища во владычестве, и нет у Него покровителя от унижения». И возвеличь Его премного."]},"39":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ تَنزِيلُ الْكِتَابِ مِنَ اللَّهِ الْعَزِيزِ الْحَكِيمِ","إِنَّا أَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ فَاعْبُدِ اللَّهَ مُخْلِصًا لَّهُ الدِّينَ","أَلَا لِلَّهِ الدِّينُ الْخَالِصُ وَالَّذِينَ اتَّخَذُوا مِن دُونِهِ أَوْلِيَاءَ مَا نَعْبُدُهُمْ إِلَّا لِيُقَرِّبُونَا إِلَى اللَّهِ زُلْفَىٰ إِنَّ اللَّهَ يَحْكُمُ بَيْنَهُمْ فِي مَا هُمْ فِيهِ يَخْتَلِفُونَ إِنَّ اللَّهَ لَا يَهْدِي مَنْ هُوَ كَاذِبٌ كَفَّارٌ","لَّوْ أَرَادَ اللَّهُ أَن يَتَّخِذَ وَلَدًا لَّاصْطَفَىٰ مِمَّا يَخْلُقُ مَا يَشَاءُ سُبْحَانَهُ هُوَ اللَّهُ الْوَاحِدُ الْقَهَّارُ","خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِالْحَقِّ يُكَوِّرُ اللَّيْلَ عَلَى النَّهَارِ وَيُكَوِّرُ النَّهَارَ عَلَى اللَّيْلِ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ كُلٌّ يَجْرِي لِأَجَلٍ مُّسَمًّى أَلَا هُوَ الْعَزِيزُ الْغَفَّارُ","خَلَقَكُم مِّن نَّفْسٍ وَاحِدَةٍ ثُمَّ جَعَلَ مِنْهَا زَوْجَهَا وَأَنزَلَ لَكُم مِّنَ الْأَنْعَامِ ثَمَانِيَةَ أَزْوَاجٍ يَخْلُقُكُمْ فِي بُطُونِ أُمَّهَاتِكُمْ خَلْقًا مِّن بَعْدِ خَلْقٍ فِي ظُلُمَاتٍ ثَلَاثٍ ذَٰلِكُمُ اللَّهُ رَبُّكُمْ لَهُ الْمُلْكُ لَا إِلَٰهَ إِلَّا هُوَ فَأَنَّىٰ تُصْرَفُونَ","إِن تَكْفُرُوا فَإِنَّ اللَّهَ غَنِيٌّ عَنكُمْ وَلَا يَرْضَىٰ لِعِبَادِهِ الْكُفْرَ وَإِن تَشْكُرُوا يَرْضَهُ لَكُمْ وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ","وَإِذَا مَسَّ الْإِنسَانَ ضُرٌّ دَعَا رَبَّهُ مُنِيبًا إِلَيْهِ ثُمَّ إِذَا خَوَّلَهُ نِعْمَةً مِّنْهُ نَسِيَ مَا كَانَ يَدْعُو إِلَيْهِ مِن قَبْلُ وَجَعَلَ لِلَّهِ أَندَادًا لِّيُضِلَّ عَن سَبِيلِهِ قُلْ تَمَتَّعْ بِكُفْرِكَ قَلِيلًا إِنَّكَ مِنْ أَصْحَابِ النَّارِ","أَمَّنْ هُوَ قَانِتٌ آنَاءَ اللَّيْلِ سَاجِدًا وَقَائِمًا يَحْذَرُ الْآخِرَةَ وَيَرْجُو رَحْمَةَ رَبِّهِ قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ إِنَّمَا يَتَذَكَّرُ أُولُو الْأَلْبَابِ","قُلْ يَا عِبَادِ الَّذِينَ آمَنُوا اتَّقُوا رَبَّكُمْ لِلَّذِينَ أَحْسَنُوا فِي هَٰذِهِ الدُّنْيَا حَسَنَةٌ وَأَرْضُ اللَّهِ وَاسِعَةٌ إِنَّمَا يُوَفَّى الصَّابِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٍ","قُلْ إِنِّي أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ مُخْلِصًا لَّهُ الدِّينَ","وَأُمِرْتُ لِأَنْ أَكُونَ أَوَّلَ الْمُسْلِمِينَ","قُلْ إِنِّي أَخَافُ إِنْ عَصَيْتُ رَبِّي عَذَابَ يَوْمٍ عَظِيمٍ","قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي","فَاعْبُدُوا مَا شِئْتُم مِّن دُونِهِ قُلْ إِنَّ الْخَاسِرِينَ الَّذِينَ خَسِرُوا أَنفُسَهُمْ وَأَهْلِيهِمْ يَوْمَ الْقِيَامَةِ أَلَا ذَٰلِكَ هُوَ الْخُسْرَانُ الْمُبِينُ","لَهُم مِّن فَوْقِهِمْ ظُلَلٌ مِّنَ النَّارِ وَمِن تَحْتِهِمْ ظُلَلٌ ذَٰلِكَ يُخَوِّفُ اللَّهُ بِهِ عِبَادَهُ يَا عِبَادِ فَاتَّقُونِ","وَالَّذِينَ اجْتَنَبُوا الطَّاغُوتَ أَن يَعْبُدُوهَا وَأَنَابُوا إِلَى اللَّهِ لَهُمُ الْبُشْرَىٰ فَبَشِّرْ عِبَادِ","الَّذِينَ يَسْتَمِعُونَ الْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ أُولَٰئِكَ الَّذِينَ هَدَاهُمُ اللَّهُ وَأُولَٰئِكَ هُمْ أُولُو الْأَلْبَابِ","أَفَمَنْ حَقَّ عَلَيْهِ كَلِمَةُ الْعَذَابِ أَفَأَنتَ تُنقِذُ مَن فِي النَّارِ","لَٰكِنِ الَّذِينَ اتَّقَوْا رَبَّهُمْ لَهُمْ غُرَفٌ مِّن فَوْقِهَا غُرَفٌ مَّبْنِيَّةٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ وَعْدَ اللَّهِ لَا يُخْلِفُ اللَّهُ الْمِيعَادَ","أَلَمْ تَرَ أَنَّ اللَّهَ أَنزَلَ مِنَ السَّمَاءِ مَاءً فَسَلَكَهُ يَنَابِيعَ فِي الْأَرْضِ ثُمَّ يُخْرِجُ بِهِ زَرْعًا مُّخْتَلِفًا أَلْوَانُهُ ثُمَّ يَهِيجُ فَتَرَاهُ مُصْفَرًّا ثُمَّ يَجْعَلُهُ حُطَامًا إِنَّ فِي ذَٰلِكَ لَذِكْرَىٰ لِأُولِي الْأَلْبَابِ","أَفَمَن شَرَحَ اللَّهُ صَدْرَهُ لِلْإِسْلَامِ فَهُوَ عَلَىٰ نُورٍ مِّن رَّبِّهِ فَوَيْلٌ لِّلْقَاسِيَةِ قُلُوبُهُم مِّن ذِكْرِ اللَّهِ أُولَٰئِكَ فِي ضَلَالٍ مُّبِينٍ","اللَّهُ نَزَّلَ أَحْسَنَ الْحَدِيثِ كِتَابًا مُّتَشَابِهًا مَّثَانِيَ تَقْشَعِرُّ مِنْهُ جُلُودُ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ ثُمَّ تَلِينُ جُلُودُهُمْ وَقُلُوبُهُمْ إِلَىٰ ذِكْرِ اللَّهِ ذَٰلِكَ هُدَى اللَّهِ يَهْدِي بِهِ مَن يَشَاءُ وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ","أَفَمَن يَتَّقِي بِوَجْهِهِ سُوءَ الْعَذَابِ يَوْمَ الْقِيَامَةِ وَقِيلَ لِلظَّالِمِينَ ذُوقُوا مَا كُنتُمْ تَكْسِبُونَ","كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَأَتَاهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ","فَأَذَاقَهُمُ اللَّهُ الْخِزْيَ فِي الْحَيَاةِ الدُّنْيَا وَلَعَذَابُ الْآخِرَةِ أَكْبَرُ لَوْ كَانُوا يَعْلَمُونَ","وَلَقَدْ ضَرَبْنَا لِلنَّاسِ فِي هَٰذَا الْقُرْآنِ مِن كُلِّ مَثَلٍ لَّعَلَّهُمْ يَتَذَكَّرُونَ","قُرْآنًا عَرَبِيًّا غَيْرَ ذِي عِوَجٍ لَّعَلَّهُمْ يَتَّقُونَ","ضَرَبَ اللَّهُ مَثَلًا رَّجُلًا فِيهِ شُرَكَاءُ مُتَشَاكِسُونَ وَرَجُلًا سَلَمًا لِّرَجُلٍ هَلْ يَسْتَوِيَانِ مَثَلًا الْحَمْدُ لِلَّهِ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ","إِنَّكَ مَيِّتٌ وَإِنَّهُم مَّيِّتُونَ","ثُمَّ إِنَّكُمْ يَوْمَ الْقِيَامَةِ عِندَ رَبِّكُمْ تَخْتَصِمُونَ","فَمَنْ أَظْلَمُ مِمَّن كَذَبَ عَلَى اللَّهِ وَكَذَّبَ بِالصِّدْقِ إِذْ جَاءَهُ أَلَيْسَ فِي جَهَنَّمَ مَثْوًى لِّلْكَافِرِينَ","وَالَّذِي جَاءَ بِالصِّدْقِ وَصَدَّقَ بِهِ أُولَٰئِكَ هُمُ الْمُتَّقُونَ","لَهُم مَّا يَشَاءُونَ عِندَ رَبِّهِمْ ذَٰلِكَ جَزَاءُ الْمُحْسِنِينَ","لِيُكَفِّرَ اللَّهُ عَنْهُمْ أَسْوَأَ الَّذِي عَمِلُوا وَيَجْزِيَهُمْ أَجْرَهُم بِأَحْسَنِ الَّذِي كَانُوا يَعْمَلُونَ","أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ وَيُخَوِّفُونَكَ بِالَّذِينَ مِن دُونِهِ وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ","وَمَن يَهْدِ اللَّهُ فَمَا لَهُ مِن مُّضِلٍّ أَلَيْسَ اللَّهُ بِعَزِيزٍ ذِي انتِقَامٍ","وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ قُلْ أَفَرَأَيْتُم مَّا تَدْعُونَ مِن دُونِ اللَّهِ إِنْ أَرَادَنِيَ اللَّهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّهِ أَوْ أَرَادَنِي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِهِ قُلْ حَسْبِيَ اللَّهُ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ","قُلْ يَا قَوْمِ اعْمَلُوا عَلَىٰ مَكَانَتِكُمْ إِنِّي عَامِلٌ فَسَوْفَ تَعْلَمُونَ","مَن يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُّقِيمٌ","إِنَّا أَنزَلْنَا عَلَيْكَ الْكِتَابَ لِلنَّاسِ بِالْحَقِّ فَمَنِ اهْتَدَىٰ فَلِنَفْسِهِ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَا وَمَا أَنتَ عَلَيْهِم بِوَكِيلٍ","اللَّهُ يَتَوَفَّى الْأَنفُسَ حِينَ مَوْتِهَا وَالَّتِي لَمْ تَمُتْ فِي مَنَامِهَا فَيُمْسِكُ الَّتِي قَضَىٰ عَلَيْهَا الْمَوْتَ وَيُرْسِلُ الْأُخْرَىٰ إِلَىٰ أَجَلٍ مُّسَمًّى إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يَتَفَكَّرُونَ","أَمِ اتَّخَذُوا مِن دُونِ اللَّهِ شُفَعَاءَ قُلْ أَوَلَوْ كَانُوا لَا يَمْلِكُونَ شَيْئًا وَلَا يَعْقِلُونَ","قُل لِّلَّهِ الشَّفَاعَةُ جَمِيعًا لَّهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ ثُمَّ إِلَيْهِ تُرْجَعُونَ","وَإِذَا ذُكِرَ اللَّهُ وَحْدَهُ اشْمَأَزَّتْ قُلُوبُ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ وَإِذَا ذُكِرَ الَّذِينَ مِن دُونِهِ إِذَا هُمْ يَسْتَبْشِرُونَ","قُلِ اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ أَنتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِي مَا كَانُوا فِيهِ يَخْتَلِفُونَ","وَلَوْ أَنَّ لِلَّذِينَ ظَلَمُوا مَا فِي الْأَرْضِ جَمِيعًا وَمِثْلَهُ مَعَهُ لَافْتَدَوْا بِهِ مِن سُوءِ الْعَذَابِ يَوْمَ الْقِيَامَةِ وَبَدَا لَهُم مِّنَ اللَّهِ مَا لَمْ يَكُونُوا يَحْتَسِبُونَ","وَبَدَا لَهُمْ سَيِّئَاتُ مَا كَسَبُوا وَحَاقَ بِهِم مَّا كَانُوا بِهِ يَسْتَهْزِئُونَ","فَإِذَا مَسَّ الْإِنسَانَ ضُرٌّ دَعَانَا ثُمَّ إِذَا خَوَّلْنَاهُ نِعْمَةً مِّنَّا قَالَ إِنَّمَا أُوتِيتُهُ عَلَىٰ عِلْمٍ بَلْ هِيَ فِتْنَةٌ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَ","قَدْ قَالَهَا الَّذِينَ مِن قَبْلِهِمْ فَمَا أَغْنَىٰ عَنْهُم مَّا كَانُوا يَكْسِبُونَ","فَأَصَابَهُمْ سَيِّئَاتُ مَا كَسَبُوا وَالَّذِينَ ظَلَمُوا مِنْ هَٰؤُلَاءِ سَيُصِيبُهُمْ سَيِّئَاتُ مَا كَسَبُوا وَمَا هُم بِمُعْجِزِينَ","أَوَلَمْ يَعْلَمُوا أَنَّ اللَّهَ يَبْسُطُ الرِّزْقَ لِمَن يَشَاءُ وَيَقْدِرُ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ لِّقَوْمٍ يُؤْمِنُونَ","قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ","وَأَنِيبُوا إِلَىٰ رَبِّكُمْ وَأَسْلِمُوا لَهُ مِن قَبْلِ أَن يَأْتِيَكُمُ الْعَذَابُ ثُمَّ لَا تُنصَرُونَ","وَاتَّبِعُوا أَحْسَنَ مَا أُنزِلَ إِلَيْكُم مِّن رَّبِّكُم مِّن قَبْلِ أَن يَأْتِيَكُمُ الْعَذَابُ بَغْتَةً وَأَنتُمْ لَا تَشْعُرُونَ","أَن تَقُولَ نَفْسٌ يَا حَسْرَتَىٰ عَلَىٰ مَا فَرَّطتُ فِي جَنبِ اللَّهِ وَإِن كُنتُ لَمِنَ السَّاخِرِينَ","أَوْ تَقُولَ لَوْ أَنَّ اللَّهَ هَدَانِي لَكُنتُ مِنَ الْمُتَّقِينَ","أَوْ تَقُولَ حِينَ تَرَى الْعَذَابَ لَوْ أَنَّ لِي كَرَّةً فَأَكُونَ مِنَ الْمُحْسِنِينَ","بَلَىٰ قَدْ جَاءَتْكَ آيَاتِي فَكَذَّبْتَ بِهَا وَاسْتَكْبَرْتَ وَكُنتَ مِنَ الْكَافِرِينَ","وَيَوْمَ الْقِيَامَةِ تَرَى الَّذِينَ كَذَبُوا عَلَى اللَّهِ وُجُوهُهُم مُّسْوَدَّةٌ أَلَيْسَ فِي جَهَنَّمَ مَثْوًى لِّلْمُتَكَبِّرِينَ","وَيُنَجِّي اللَّهُ الَّذِينَ اتَّقَوْا بِمَفَازَتِهِمْ لَا يَمَسُّهُمُ السُّوءُ وَلَا هُمْ يَحْزَنُونَ","اللَّهُ خَالِقُ كُلِّ شَيْءٍ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ وَكِيلٌ","لَّهُ مَقَالِيدُ السَّمَاوَاتِ وَالْأَرْضِ وَالَّذِينَ كَفَرُوا بِآيَاتِ اللَّهِ أُولَٰئِكَ هُمُ الْخَاسِرُونَ","قُلْ أَفَغَيْرَ اللَّهِ تَأْمُرُونِّي أَعْبُدُ أَيُّهَا الْجَاهِلُونَ","وَلَقَدْ أُوحِيَ إِلَيْكَ وَإِلَى الَّذِينَ مِن قَبْلِكَ لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ وَلَتَكُونَنَّ مِنَ الْخَاسِرِينَ","بَلِ اللَّهَ فَاعْبُدْ وَكُن مِّنَ الشَّاكِرِينَ","وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ وَالْأَرْضُ جَمِيعًا قَبْضَتُهُ يَوْمَ الْقِيَامَةِ وَالسَّمَاوَاتُ مَطْوِيَّاتٌ بِيَمِينِهِ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ","وَنُفِخَ فِي الصُّورِ فَصَعِقَ مَن فِي السَّمَاوَاتِ وَمَن فِي الْأَرْضِ إِلَّا مَن شَاءَ اللَّهُ ثُمَّ نُفِخَ فِيهِ أُخْرَىٰ فَإِذَا هُمْ قِيَامٌ يَنظُرُونَ","وَأَشْرَقَتِ الْأَرْضُ بِنُورِ رَبِّهَا وَوُضِعَ الْكِتَابُ وَجِيءَ بِالنَّبِيِّينَ وَالشُّهَدَاءِ وَقُضِيَ بَيْنَهُم بِالْحَقِّ وَهُمْ لَا يُظْلَمُونَ","وَوُفِّيَتْ كُلُّ نَفْسٍ مَّا عَمِلَتْ وَهُوَ أَعْلَمُ بِمَا يَفْعَلُونَ","وَسِيقَ الَّذِينَ كَفَرُوا إِلَىٰ جَهَنَّمَ زُمَرًا حَتَّىٰ إِذَا جَاءُوهَا فُتِحَتْ أَبْوَابُهَا وَقَالَ لَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ رُسُلٌ مِّنكُمْ يَتْلُونَ عَلَيْكُمْ آيَاتِ رَبِّكُمْ وَيُنذِرُونَكُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا قَالُوا بَلَىٰ وَلَٰكِنْ حَقَّتْ كَلِمَةُ الْعَذَابِ عَلَى الْكَافِرِينَ","قِيلَ ادْخُلُوا أَبْوَابَ جَهَنَّمَ خَالِدِينَ فِيهَا فَبِئْسَ مَثْوَى الْمُتَكَبِّرِينَ","وَسِيقَ الَّذِينَ اتَّقَوْا رَبَّهُمْ إِلَى الْجَنَّةِ زُمَرًا حَتَّىٰ إِذَا جَاءُوهَا وَفُتِحَتْ أَبْوَابُهَا وَقَالَ لَهُمْ خَزَنَتُهَا سَلَامٌ عَلَيْكُمْ طِبْتُمْ فَادْخُلُوهَا خَالِدِينَ","وَقَالُوا الْحَمْدُ لِلَّهِ الَّذِي صَدَقَنَا وَعْدَهُ وَأَوْرَثَنَا الْأَرْضَ نَتَبَوَّأُ مِنَ الْجَنَّةِ حَيْثُ نَشَاءُ فَنِعْمَ أَجْرُ الْعَامِلِينَ","وَتَرَى الْمَلَائِكَةَ حَافِّينَ مِنْ حَوْلِ الْعَرْشِ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ وَقُضِيَ بَيْنَهُم بِالْحَقِّ وَقِيلَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ"],"en":["The revelation of the Book [i.e., the Qur’ān] is from Allāh, the Exalted in Might, the Wise.","Indeed, We have sent down to you the Book, [O Muḥammad], in truth. So worship Allāh, [being] sincere to Him in religion.","Unquestionably, for Allāh is the pure religion. And those who take protectors besides Him [say], \"We only worship them that they may bring us nearer to Allāh in position.\" Indeed, Allāh will judge between them concerning that over which they differ. Indeed, Allāh does not guide he who is a liar and [confirmed] disbeliever.","If Allāh had intended to take a son, He could have chosen from what He creates whatever He willed. Exalted is He; He is Allāh, the One, the Prevailing.","He created the heavens and earth in truth. He wraps the night over the day and wraps the day over the night and has subjected the sun and the moon, each running [its course] for a specified term. Unquestionably, He is the Exalted in Might, the Perpetual Forgiver.","He created you from one soul. Then He made from it its mate, and He produced for you from the grazing livestock eight mates. He creates you in the wombs of your mothers, creation after creation, within three darknesses. That is Allāh, your Lord; to Him belongs dominion. There is no deity except Him, so how are you averted?","If you disbelieve - indeed, Allāh is Free from need of you. And He does not approve for His servants disbelief. And if you are grateful, He approves [i.e., likes] it for you; and no bearer of burdens will bear the burden of another. Then to your Lord is your return, and He will inform you about what you used to do. Indeed, He is Knowing of that within the breasts.","And when adversity touches man, he calls upon his Lord, turning to Him [alone]; then when He bestows on him a favor from Himself, he forgets Him whom he called upon before, and he attributes to Allāh equals to mislead [people] from His way. Say, \"Enjoy your disbelief for a little; indeed, you are of the companions of the Fire.\"","Is one who is devoutly obedient during periods of the night, prostrating and standing [in prayer], fearing the Hereafter and hoping for the mercy of his Lord, [like one who does not]? Say, \"Are those who know equal to those who do not know?\" Only they will remember [who are] people of understanding.","Say, \"O My servants who have believed, fear your Lord. For those who do good in this world is good, and the earth of Allāh is spacious. Indeed, the patient will be given their reward without account [i.e., limit].\"","Say, [O Muḥammad], \"Indeed, I have been commanded to worship Allāh, [being] sincere to Him in religion.","And I have been commanded to be the first [among you] of the Muslims.\"","Say, \"Indeed I fear, if I should disobey my Lord, the punishment of a tremendous Day.\"","Say, \"Allāh [alone] do I worship, sincere to Him in my religion,","So worship what you will besides Him.\" Say, \"Indeed, the losers are the ones who will lose themselves and their families on the Day of Resurrection. Unquestionably, that is the manifest loss.\"","They will have canopies [i.e., layers] of fire above them and below them, canopies. By that Allāh threatens [i.e., warns] His servants. O My servants, then fear Me.","But those who have avoided ṭāghūt, lest they worship it, and turned back to Allāh - for them are good tidings. So give good tidings to My servants","Who listen to speech and follow the best of it. Those are the ones Allāh has guided, and those are people of understanding.","Then, is one who has deserved the decree of punishment [to be guided]? Then, can you save one who is in the Fire?","But those who have feared their Lord - for them are chambers, above them chambers built high, beneath which rivers flow. [This is] the promise of Allāh. Allāh does not fail in [His] promise.","Do you not see that Allāh sends down rain from the sky and makes it flow as springs [and rivers] in the earth; then He produces thereby crops of varying colors; then they dry and you see them turned yellow; then He makes them [scattered] debris. Indeed in that is a reminder for those of understanding.","So is one whose breast Allāh has expanded to [accept] Islām and he is upon [i.e., guided by] a light from his Lord [like one whose heart rejects it]? Then woe to those whose hearts are hardened against the remembrance of Allāh. Those are in manifest error.","Allāh has sent down the best statement: a consistent Book wherein is reiteration. The skins shiver therefrom of those who fear their Lord; then their skins and their hearts relax at the remembrance [i.e., mention] of Allāh. That is the guidance of Allāh by which He guides whom He wills. And one whom Allāh sends astray - for him there is no guide.","Then is he who will shield with his face the worst of the punishment on the Day of Resurrection [like one secure from it]? And it will be said to the wrongdoers, \"Taste what you used to earn.\"","Those before them denied, and punishment came upon them from where they did not perceive.","So Allāh made them taste disgrace in worldly life. But the punishment of the Hereafter is greater, if they only knew.","And We have certainly presented for the people in this Qur’ān from every [kind of] example - that they might remember.","[It is] an Arabic Qur’ān, without any deviance that they might become righteous.","Allāh presents an example: a man [i.e., slave] owned by quarreling partners and another belonging exclusively to one man - are they equal in comparison? Praise be to Allāh! But most of them do not know.","Indeed, you are to die, and indeed, they are to die.","Then indeed you, on the Day of Resurrection, before your Lord, will dispute.","So who is more unjust than one who lies about Allāh and denies the truth when it has come to him? Is there not in Hell a residence for the disbelievers?","And the one who has brought the truth [i.e., the Prophet (ﷺ)] and [they who] believed in it - those are the righteous.","They will have whatever they desire with their Lord. That is the reward of the doers of good -","That Allāh may remove from them the worst of what they did and reward them their due for the best of what they used to do.","Is not Allāh sufficient for His Servant [i.e., Prophet Muḥammad (ﷺ)]? And [yet], they threaten you with those [they worship] other than Him. And whoever Allāh leaves astray - for him there is no guide.","And whoever Allāh guides - for him there is no misleader. Is not Allāh Exalted in Might and Owner of Retribution?","And if you asked them, \"Who created the heavens and the earth?\" they would surely say, \"Allāh.\" Say, \"Then have you considered what you invoke besides Allāh? If Allāh intended me harm, are they removers of His harm; or if He intended me mercy, are they withholders of His mercy?\" Say, \"Sufficient for me is Allāh; upon Him [alone] rely the [wise] reliers.\"","Say, \"O my people, work according to your position, [for] indeed, I am working; and you are going to know","To whom will come a torment disgracing him and on whom will descend an enduring punishment.\"","Indeed, We sent down to you the Book for the people in truth. So whoever is guided - it is for [the benefit of] his soul; and whoever goes astray only goes astray to its detriment. And you are not a manager [i.e., authority] over them.","Allāh takes the souls at the time of their death, and those that do not die [He takes] during their sleep. Then He keeps those for which He has decreed death and releases the others for a specified term. Indeed in that are signs for a people who give thought.","Or have they taken other than Allāh as intercessors? Say, \"Even though they do not possess [power over] anything, nor do they reason?\"","Say, \"To Allāh belongs [the right to allow] intercession entirely. To Him belongs the dominion of the heavens and the earth. Then to Him you will be returned.\"","And when Allāh is mentioned alone, the hearts of those who do not believe in the Hereafter shrink with aversion, but when those [worshipped] other than Him are mentioned, immediately they rejoice.","Say, \"O Allāh, Creator of the heavens and the earth, Knower of the unseen and the witnessed, You will judge between your servants concerning that over which they used to differ.\"","And if those who did wrong had all that is in the earth entirely and the like of it with it, they would [attempt to] ransom themselves thereby from the worst of the punishment on the Day of Resurrection. And there will appear to them from Allāh that which they had not taken into account.","And there will appear to them the evils they had earned, and they will be enveloped by what they used to ridicule.","And when adversity touches man, he calls upon Us; then when We bestow on him a favor from Us, he says, \"I have only been given it because of [my] knowledge.\" Rather, it is a trial, but most of them do not know.","Those before them had already said it, but they were not availed by what they used to earn.","And the evil consequences of what they earned struck them. And those who have wronged of these [people] will be struck [i.e., afflicted] by the evil consequences of what they earned; and they will not cause failure.","Do they not know that Allāh extends provision for whom He wills and restricts [it]? Indeed in that are signs for a people who believe.","Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allāh. Indeed, Allāh forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.\"","And return [in repentance] to your Lord and submit to Him before the punishment comes upon you; then you will not be helped.","And follow the best of what was revealed to you from your Lord [i.e., the Qur’ān] before the punishment comes upon you suddenly while you do not perceive,","Lest a soul should say, \"Oh, [how great is] my regret over what I neglected in regard to Allāh and that I was among the mockers.\"","Or [lest] it say, \"If only Allāh had guided me, I would have been among the righteous.\"","Or [lest] it say when it sees the punishment, \"If only I had another turn so I could be among the doers of good.\"","But yes, there had come to you My verses, but you denied them and were arrogant, and you were among the disbelievers.","And on the Day of Resurrection you will see those who lied about Allāh [with] their faces blackened. Is there not in Hell a residence for the arrogant?","And Allāh will save those who feared Him by their attainment; no evil will touch them, nor will they grieve.","Allāh is the Creator of all things, and He is, over all things, Disposer of affairs.","To Him belong the keys of the heavens and the earth. And they who disbelieve in the verses of Allāh - it is those who are the losers.","Say, [O Muḥammad], \"Is it other than Allāh that you order me to worship, O ignorant ones?\"","And it was already revealed to you and to those before you that if you should associate [anything] with Allāh, your work would surely become worthless, and you would surely be among the losers.","Rather, worship [only] Allāh and be among the grateful.","They have not appraised Allāh with true appraisal, while the earth entirely will be [within] His grip on the Day of Resurrection, and the heavens will be folded in His right hand. Exalted is He and high above what they associate with Him.","And the Horn will be blown, and whoever is in the heavens and whoever is on the earth will fall dead except whom Allāh wills. Then it will be blown again, and at once they will be standing, looking on.","And the earth will shine with the light of its Lord, and the record [of deeds] will be placed, and the prophets and the witnesses will be brought, and it will be judged between them in truth, and they will not be wronged.","And every soul will be fully compensated [for] what it did; and He is most knowing of what they do.","And those who disbelieved will be driven to Hell in groups until, when they reach it, its gates are opened and its keepers will say, \"Did there not come to you messengers from yourselves, reciting to you the verses of your Lord and warning you of the meeting of this Day of yours?\" They will say, \"Yes, but the word [i.e., decree] of punishment has come into effect upon the disbelievers.\"","[To them] it will be said, \"Enter the gates of Hell to abide eternally therein, and wretched is the residence of the arrogant.\"","But those who feared their Lord will be driven to Paradise in groups until, when they reach it while its gates have been opened and its keepers say, \"Peace be upon you; you have become pure; so enter it to abide eternally therein,\" [they will enter].","And they will say, \"Praise to Allāh, who has fulfilled for us His promise and made us inherit the earth [so] we may settle in Paradise wherever we will. And excellent is the reward of [righteous] workers.\"","And you will see the angels surrounding the Throne, exalting [Allāh] with praise of their Lord. And it will be judged between them in truth, and it will be said, \"[All] praise to Allāh, Lord of the worlds.\""],"ru":["[Это —] ниспослание Писания от Аллаха, Могущественного, Мудрого.","Воистину, Мы ниспослали тебе Писание с истиной, так поклоняйся же Аллаху, искренне посвящая Ему свою религию.","Знайте: Аллаху принадлежит чистая религия! А те, которые избрали себе покровителей помимо Него, [говорят]: «Мы поклоняемся им лишь для того, чтобы они приблизили нас к Аллаху как можно ближе». Воистину, Аллах рассудит между ними в том, в чём они пребывают в разногласиях. Воистину, Аллах не наставляет того, кто лжив и упорно неблагодарен.","Если бы Аллах пожелал взять Себе дитя, то выбрал бы из того, что творит, то, что пожелает. Пречист Он! Он — Аллах, Единственный, Всепобеждающий.","Он сотворил небеса и землю с истиной. Он облекает ночью день и облекает днём ночь, и подчинил солнце и луну — каждый движется к назначенному сроку. Знайте же: Он — Могущественный, Всепрощающий!","Он сотворил вас из одной души, затем создал из неё её пару. И Он ниспослал вам из скота восемь пар. Он творит вас в утробах ваших матерей, творение за творением, в трёх мраках. Таков Аллах, ваш Господь. Ему принадлежит владычество. Нет божества, кроме Него. Так как же вы можете быть настолько отклонены от истины?","Воистину, Аллах не нуждается в вас, если вы отвергнете веру, но Он не доволен неверием Своих рабов. Если же вы будете благодарны, Он будет доволен этим для вас. И несущая не понесёт ноши другой. Затем — ваше возвращение к вашему Господу, и Он возвестит вам о том, что вы совершали. Воистину, Он — знающий то, что таится в сердцах.","Когда человека постигает бедствие, он взывает к своему Господу, обращаясь к Нему. Затем, когда Он дарует ему от Себя благо, человек забывает то, о чём взывал к Нему прежде, и придаёт Аллаху равных, чтобы сбивать [других] с Его пути. Скажи: «Наслаждайся своим неверием недолго: воистину, ты — из обитателей адского огня».","Неужели тот, кто поклоняется в часы ночи — падая ниц и стоя [в молитве], опасаясь Последней жизни и надеясь на милость своего Господа, [подобен тому, кто не таков]? Скажи: «Неужели равны те, которые знают, и те, которые не знают?» Воистину, внемлют напоминанию лишь обладатели разума.","Скажи: «О Мои рабы, которые уверовали! Бойтесь вашего Господа. Тем, кто был добродетелен в этом мире — благо. А земля Аллаха — обширна. Воистину, терпеливые получат свою награду сполна — без счёта».","Скажи: «Воистину, мне велено поклоняться Аллаху, искренне посвящая Ему свою религию,","и мне велено быть первым из числа мусульман».","Скажи: «Воистину, я боюсь — если ослушаюсь своего Господа — наказания великого дня».","Скажи: «Я поклоняюсь Аллаху, искренне посвящая Ему свою религию».","Так поклоняйтесь же, чему пожелаете, помимо Него! Скажи: «Воистину, потерпевшие убыток — это те, которые погубили самих себя и свои семьи в День воскресения. Знайте же: это и есть явный убыток!","Над ними — навесы из огня, и под ними — навесы. Этим Аллах устрашает Своих рабов. О Мои рабы, бойтесь же Меня!","А те, которые сторонились тагу́та, чтобы не поклоняться ему, и обратились к Аллаху, — для них радостная весть. Так обрадуй же Моих рабов,","которые внимают сказанному и следуют наилучшему из этого. Такие и есть те, кого Аллах наставил, и такие и есть обладатели разума.","Так неужели тот, над кем уже обязательным стало слово наказания — неужели ты спасёшь того, кто в адском огне?","Но те, которые боялись своего Господа — для них высокие чертоги, выше которых [ещё] воздвигнутые чертоги, внизу которых текут реки. [Таково] обещание Аллаха. Аллах не нарушает обещания.","Разве ты не видел, что Аллах ниспослал с неба воду и провёл её в виде источников в земле, а затем посредством неё взращивает посевы различных цветов? Но затем они увядают, и ты видишь их пожелтевшими, а после Он превращает их в рассыпающуюся труху. Воистину, в этом — напоминание для обладателей разума.","Неужели тот, чью грудь Аллах раскрыл для ислама, и кто озарён светом от своего Господа [подобен жестокосердному]? Горе же жестокосердным, отвратившимся от поминания Аллаха! Такие — в явном заблуждении.","Аллах ниспослал наилучшее из речей — Книгу, [аяты которой] схожи и часто повторяются. От неё содрогаются кожи тех, которые боятся своего Господа. А затем их кожи и сердца смягчаются при поминании Аллаха. Это — руководство Аллаха, которым Он ведёт, кого пожелает. Кого Аллах оставит в заблуждении — тому нет наставляющего [на путь].","Неужели тот, кто заслоняется своим лицом от ужаса наказания в День воскресения, [подобен спасённому]? И будет сказано несправедливым: «Вкушайте то, что вы приобретали!»","Те, которые были до них, сочли [истину] ложью — и наказание пришло к ним оттуда, откуда они не осознавали.","И Аллах дал им вкусить унижение в мирской жизни, а наказание Последней жизни — ещё более велико, если бы они только знали!","Действительно, Мы привели в этом Коране людям всевозможные притчи, — быть может, они внемлют напоминанию.","[Это —] Коран на арабском языке, лишённый всякой несообразности, — быть может, они будут богобоязненны.","Аллах приводит притчу о человеке, у которого несколько несговорчивых совладельцев, и человеке, который всецело принадлежит одному. Разве они равны как пример? Хвала Аллаху! Нет, напротив, большинство из них не знает.","Воистину, ты смертен, и, воистину, они [тоже] смертны.","Затем, воистину, в День воскресения вы будете пререкаться пред своим Господом.","И кто же более несправедлив, чем тот, кто возвёл ложь на Аллаха и счёл ложью истину, когда она пришла к нему? А разве не в Геенне прибежище для отвергших веру?","Тот, кто явился с истиной и подтвердил её — такие и есть богобоязненные.","Для них — всё, что они пожелают у своего Господа. Это — воздаяние добродетельным,","чтобы Аллах искупил им худшее из того, что они совершали, и воздал им их награду — по наилучшему из того, что они совершали.","Разве Аллах не достаточен Своему рабу? А они пугают тебя теми, которые помимо Него. Кого Аллах введёт в заблуждение — тому нет наставляющего [на путь].","А кого Аллах наставит на верный путь — тому нет вводящего в заблуждение. Разве Аллах — не Могущественный, Обладатель возмездия?","И если ты спросишь их: «Кто сотворил небеса и землю?» — они непременно скажут: «Аллах». Скажи: «Видите ли вы то, к чему взываете помимо Аллаха? Если Аллах пожелает мне бедствия — избавят ли они от Его бедствия? Или если Он пожелает мне милость — удержат ли они Его милость?» Скажи: «Мне достаточно Аллаха. На Него одного уповают уповающие».","Скажи: «О народ мой! Действуйте сообразно вашему положению, а я [буду действовать] сообразно своему. И вскоре вы узнаете,","к кому придёт наказание, которое унизит его, и на кого обрушится непрекращающееся наказание».","Воистину, Мы ниспослали тебе Писание для людей с истиной. И кто последовал верным путём — самому себе во благо, а кто впал в заблуждение — воистину, тот заблуждается лишь против самого себя. И ты для них — вовсе не попечитель.","Аллах забирает души в момент их смерти, а [души] тех, кто не умер, — во время их сна. Он удерживает ту, для которой предопределил смерть, а другую отпускает до назначенного срока. Воистину, в этом — знамения для людей, которые размышляют.","Или же они взяли себе, помимо Аллаха, заступников? Скажи: «Неужели, даже если они ни над чем не властны и не разумеют?»","Скажи: «Всё заступничество полностью принадлежит Аллаху. Ему принадлежит владычество небес и земли. Затем к Нему вы будете возвращены».","И когда упоминается один лишь Аллах, сердца тех, которые не веруют в Последнюю жизнь, содрогаются от отвращения. А когда упоминаются те, которые помимо Него, — они радуются этому.","Скажи: «О Аллах, изначально сотворивший небеса и землю, знающий сокровенное и явное! Ты рассудишь между Твоими рабами в том, о чём они пребывали в разногласиях».","Если бы у тех, которые поступали несправедливо, было всё, что на земле, и ещё столько же в придачу к этому, — они непременно откупились бы этим от ужасного наказания в День воскресения. И откроется им от Аллаха то, чего они не ожидали.","И откроются им дурные последствия того, что они приобрели, и охватит их то, над чем они насмехались.","И когда человека коснётся бедствие — он взывает к Нам. Затем, когда Мы одариваем его благом от Нас, он говорит: «Воистину, это даровано мне лишь благодаря знанию». Нет, напротив! Это — испытание, но большинство их не знает.","Уже говорили это те, которые были до них, — но не принесло им пользы то, что они приобретали.","И постигли их дурные последствия того, что они приобрели. А тех из этих, которые поступали несправедливо, также постигнет зло того, что они приобрели, — и они не смогут избежать [наказания].","Неужели они не знали, что Аллах увеличивает удел, кому пожелает, и ограничивает? Воистину, в этом — знамения для людей, которые веруют.","Скажи [от имени Аллаха]: «О Мои рабы, которые излишествовали против самих себя! Не отчаивайтесь в милости Аллаха. Воистину, Аллах прощает все грехи. Воистину, Он — Прощающий, Милующий.","Обратитесь к своему Господу и покоритесь Ему, прежде чем придёт к вам наказание, и тогда вам уже не будет оказана помощь.","И следуйте наилучшему из того, что было ниспослано вам от вашего Господа, прежде чем наказание придёт к вам внезапно, — когда вы не знаете.","Чтобы не сказала ни одна душа: «О горе мне за то, что я был нерадив по отношению к Аллаху! И, воистину, я был из числа насмехающихся!»","Или не сказала: «Если бы Аллах наставил меня, я был бы из числа богобоязненных!»","Или не сказала, когда увидит наказание: «Если бы мне было позволено вернуться обратно, я непременно был бы из числа добродетельных!»","Напротив. К тебе уже пришли Мои знамения, но ты счёл их ложью, превознёсся — и оказался из числа отвергших веру.","В День воскресения ты увидишь тех, которые возвели ложь на Аллаха — их лица будут почерневшими. Разве не в Геенне пристанище для возгордившихся?","И Аллах спасёт тех, которые были богобоязненны, [приведя их] к их месту триумфа. Зло не коснётся их, и они не будут опечалены.","Аллах — Творец всего сущего, и Он попечитель над всем сущим.","Ему принадлежат ключи небес и земли. Те, которые отвергли знамения Аллаха — такие и есть потерпевшие убыток.","Скажи: «Неужели кому-то другому, помимо Аллаха, вы велите мне поклоняться, о невежественные?»","Действительно, тебе и тем, которые были до тебя, было внушено откровением: «Если ты придашь Аллаху сотоварищей, — непременно станет тщетным твоё деяние, и ты непременно окажешься из числа потерпевших убыток».","Нет, напротив — поклоняйся Аллаху и будь из числа благодарных.","Они не воздали Аллаху должного величия, — а ведь вся земля в День воскресения будет в Его длани, а небеса — свёрнуты в Его деснице. Преславен Он и превыше того, что они придают Ему в сотоварищи.","И затрубят в Рог. И падут поражёнными все, кто в небесах, и все, кто на земле, кроме тех, кого пожелает [оставить] Аллах. Затем затрубят в него ещё раз — и вот, они стоят, взирают.","И озарится земля светом своего Господа, и будет положена книга. И приведут пророков и свидетелей, и между ними рассудят согласно истине, и с ними не поступят несправедливо.","И каждой душе сполна воздастся за то, что она совершила. Он лучше знает о том, что они совершают.","А тех, которые отвергли веру, погонят к Геенне толпами. И когда они придут к ней — её врата откроются, и её стражи скажут им: «Неужели не приходили к вам посланники из вас самих, которые читали вам знамения вашего Господа и предостерегали вас о встрече с этим вашим днём?» Они скажут: «Напротив!» Но Слово о наказании уже сбылось над отвергшими веру.","Им скажут: «Войдите во врата Геенны, пребывая там вечно!» Сколь же скверно пристанище возгордившихся!","А тех, которые боялись своего Господа, поведут к Раю толпами. И когда они придут к нему и его врата откроются, его стражи скажут им: «Мир вам! Вы обрели благо — войдите же в него, пребывая вечно!»","И они скажут: «Хвала Аллаху, Который исполнил нам Своё обещание и даровал нам землю в наследие, чтобы мы поселились в Раю там, где пожелаем!» Сколь же прекрасна награда совершавших деяния!","Ты увидишь ангелов, окружающих Трон, прославляющих хвалой своего Господа. И будет решено между ними согласно истине и сказано: «Хвала Аллаху, Господу миров!»"]},"78":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ عَمَّ يَتَسَاءَلُونَ","عَنِ النَّبَإِ الْعَظِيمِ","الَّذِي هُمْ فِيهِ مُخْتَلِفُونَ","كَلَّا سَيَعْلَمُونَ","ثُمَّ كَلَّا سَيَعْلَمُونَ","أَلَمْ نَجْعَلِ الْأَرْضَ مِهَادًا","وَالْجِبَالَ أَوْتَادًا","وَخَلَقْنَاكُمْ أَزْوَاجًا","وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا","وَجَعَلْنَا اللَّيْلَ لِبَاسًا","وَجَعَلْنَا النَّهَارَ مَعَاشًا","وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا","وَجَعَلْنَا سِرَاجًا وَهَّاجًا","وَأَنزَلْنَا مِنَ الْمُعْصِرَاتِ مَاءً ثَجَّاجًا","لِّنُخْرِجَ بِهِ حَبًّا وَنَبَاتًا","وَجَنَّاتٍ أَلْفَافًا","إِنَّ يَوْمَ الْفَصْلِ كَانَ مِيقَاتًا","يَوْمَ يُنفَخُ فِي الصُّورِ فَتَأْتُونَ أَفْوَاجًا","وَفُتِحَتِ السَّمَاءُ فَكَانَتْ أَبْوَابًا","وَسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًا","إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا","لِّلطَّاغِينَ مَآبًا","لَّابِثِينَ فِيهَا أَحْقَابًا","لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا","إِلَّا حَمِيمًا وَغَسَّاقًا","جَزَاءً وِفَاقًا","إِنَّهُمْ كَانُوا لَا يَرْجُونَ حِسَابًا","وَكَذَّبُوا بِآيَاتِنَا كِذَّابًا","وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ كِتَابًا","فَذُوقُوا فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا","إِنَّ لِلْمُتَّقِينَ مَفَازًا","حَدَائِقَ وَأَعْنَابًا","وَكَوَاعِبَ أَتْرَابًا","وَكَأْسًا دِهَاقًا","لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّابًا","جَزَاءً مِّن رَّبِّكَ عَطَاءً حِسَابًا","رَّبِّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الرَّحْمَٰنِ لَا يَمْلِكُونَ مِنْهُ خِطَابًا","يَوْمَ يَقُومُ الرُّوحُ وَالْمَلَائِكَةُ صَفًّا لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ الرَّحْمَٰنُ وَقَالَ صَوَابًا","ذَٰلِكَ الْيَوْمُ الْحَقُّ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ مَآبًا","إِنَّا أَنذَرْنَاكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ الْكَافِرُ يَا لَيْتَنِي كُنتُ تُرَابًا"],"en":["About what are they asking one another?","About the great news -","That over which they are in disagreement.","No! They are going to know.","Then, no! They are going to know.","Have We not made the earth a resting place?","And the mountains as stakes?","And We created you in pairs","And made your sleep [a means for] rest","And made the night as clothing","And made the day for livelihood","And constructed above you seven strong [heavens]","And made [therein] a burning lamp","And sent down from the rain clouds pouring water","That We may bring forth thereby grain and vegetation","And gardens of entwined growth.","Indeed, the Day of Judgement is an appointed time -","The Day the Horn is blown and you will come forth in multitudes","And the heaven is opened and will become gateways","And the mountains are removed and will be [but] a mirage.","Indeed, Hell has been lying in wait","For the transgressors, a place of return,","In which they will remain for ages [unending].","They will not taste therein [any] coolness or drink.","Except scalding water and [foul] purulence -","An appropriate recompense.","Indeed, they were not expecting an account","And denied Our verses with [emphatic] denial.","But all things We have enumerated in writing.","\"So taste [the penalty], and never will We increase you except in torment.\"","Indeed, for the righteous is attainment -","Gardens and grapevines","And young women [companions] of equal age.","And a full cup.","No ill speech will they hear therein or any falsehood -","[As] reward from your Lord, [a generous] gift [made due by] account,","[From] the Lord of the heavens and the earth and whatever is between them, the Most Merciful. They possess not from Him [authority for] speech.","The Day that the Spirit [i.e., Gabriel] and the angels will stand in rows, they will not speak except for one whom the Most Merciful permits, and he will say what is correct.","That is the True [i.e., certain] Day; so he who wills may take to his Lord a [way of] return.","Indeed, We have warned you of an impending punishment on the Day when a man will observe what his hands have put forth and the disbeliever will say, \"Oh, I wish that I were dust!\""],"ru":["О чём же они вопрошают друг друга?","О великой вести,","о которой они пребывают в разногласиях.","Отнюдь! Скоро они узнают.","И ещё раз: отнюдь! Скоро они узнают.","Разве Мы не сделали землю ложем,","а горы — [устойчивыми] кольями?","И Мы сотворили вас парами,","и сделали ваш сон отдыхом,","и сделали ночь одеянием,","и сделали день временем для добывания средств [к жизни].","И Мы воздвигли над вами семь прочных [небесных] сводов,","и сделали светильник пылающим,","и низвели из дождевых облаков обильную воду,","чтобы взрастить ею зёрна и растения","и сады густой листвы.","Воистину, День разделения был назначенным сроком.","В тот день затрубят в Рог, и вы придёте толпами.","Небо будет раскрыто и станет вратами,","а горы будут сдвинуты и станут миражом.","Воистину, Геенна — засада,","место возврата для преступивших границы.","Они пробудут там долгие века,","не вкушая в ней ни прохлады, ни питья,","кроме кипятка и гноя —","в воздаяние, соответствующее [их деяниям].","Воистину, они не надеялись на расчёт,","и упорно считали Наши знамения ложью.","Но Мы уже исчислили всё сущее в Писании.","«Так вкушайте же! Мы не прибавим вам ничего, кроме мучения».","Воистину, для богобоязненных — место спасения:","сады и виноградники,","и полногрудые сверстницы,","и кубки, полные до краёв.","Они не услышат там ни пустословия, ни лжи —","в воздаяние от твоего Господа, даром, [отмеренным] сполна,","Господа небес и земли и всего, что между ними, — Всемилостивого, пред Которым они не властны заговорить.","В тот день Дух и ангелы встанут рядами. Не заговорят они, кроме того, кому позволит Всемилостивый, — и он скажет верное.","Это — День истины. Так пусть тот, кто пожелает, найдёт путь возвращения к своему Господу.","Воистину, Мы предостерегли вас от близкого наказания — в тот день, когда человек увидит то, что уготовили его руки, и скажет отвергший веру: «О, если бы я был прахом...»"]},"79":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالنَّازِعَاتِ غَرْقًا","وَالنَّاشِطَاتِ نَشْطًا","وَالسَّابِحَاتِ سَبْحًا","فَالسَّابِقَاتِ سَبْقًا","فَالْمُدَبِّرَاتِ أَمْرًا","يَوْمَ تَرْجُفُ الرَّاجِفَةُ","تَتْبَعُهَا الرَّادِفَةُ","قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ","أَبْصَارُهَا خَاشِعَةٌ","يَقُولُونَ أَإِنَّا لَمَرْدُودُونَ فِي الْحَافِرَةِ","أَإِذَا كُنَّا عِظَامًا نَّخِرَةً","قَالُوا تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ","فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ","فَإِذَا هُم بِالسَّاهِرَةِ","هَلْ أَتَاكَ حَدِيثُ مُوسَىٰ","إِذْ نَادَاهُ رَبُّهُ بِالْوَادِ الْمُقَدَّسِ طُوًى","اذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ","فَقُلْ هَل لَّكَ إِلَىٰ أَن تَزَكَّىٰ","وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ","فَأَرَاهُ الْآيَةَ الْكُبْرَىٰ","فَكَذَّبَ وَعَصَىٰ","ثُمَّ أَدْبَرَ يَسْعَىٰ","فَحَشَرَ فَنَادَىٰ","فَقَالَ أَنَا رَبُّكُمُ الْأَعْلَىٰ","فَأَخَذَهُ اللَّهُ نَكَالَ الْآخِرَةِ وَالْأُولَىٰ","إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰ","أَأَنتُمْ أَشَدُّ خَلْقًا أَمِ السَّمَاءُ بَنَاهَا","رَفَعَ سَمْكَهَا فَسَوَّاهَا","وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَاهَا","وَالْأَرْضَ بَعْدَ ذَٰلِكَ دَحَاهَا","أَخْرَجَ مِنْهَا مَاءَهَا وَمَرْعَاهَا","وَالْجِبَالَ أَرْسَاهَا","مَتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ","فَإِذَا جَاءَتِ الطَّامَّةُ الْكُبْرَىٰ","يَوْمَ يَتَذَكَّرُ الْإِنسَانُ مَا سَعَىٰ","وَبُرِّزَتِ الْجَحِيمُ لِمَن يَرَىٰ","فَأَمَّا مَن طَغَىٰ","وَآثَرَ الْحَيَاةَ الدُّنْيَا","فَإِنَّ الْجَحِيمَ هِيَ الْمَأْوَىٰ","وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ","فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ","يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا","فِيمَ أَنتَ مِن ذِكْرَاهَا","إِلَىٰ رَبِّكَ مُنتَهَاهَا","إِنَّمَا أَنتَ مُنذِرُ مَن يَخْشَاهَا","كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا"],"en":["By those [angels] who extract with violence","And [by] those who remove with ease","And [by] those who glide [as if] swimming","And those who race each other in a race","And those who arrange [each] matter,","On the Day the blast [of the Horn] will convulse [creation],","There will follow it the subsequent [one].","Hearts, that Day, will tremble,","Their eyes humbled.","They are [presently] saying, \"Will we indeed be returned to [our] former state [of life]?","Even if we should be decayed bones?\"","They say, \"That, then, would be a losing return.\"","Indeed, it will be but one shout,","And suddenly they will be [alert] upon the earth's surface.","Has there reached you the story of Moses? -","When his Lord called to him in the sacred valley of Ṭuwā,","\"Go to Pharaoh. Indeed, he has transgressed.","And say to him, 'Would you [be willing to] purify yourself","And let me guide you to your Lord so you would fear [Him]?'\"","And he showed him the greatest sign,","But he [i.e., Pharaoh] denied and disobeyed.","Then he turned his back, striving [i.e., plotting].","And he gathered [his people] and called out","And said, \"I am your most exalted lord.\"","So Allāh seized him in exemplary punishment for the last and the first [transgression]..","Indeed in that is a lesson [i.e., warning] for whoever would fear [Allāh].","Are you a more difficult creation or is the heaven? He [i.e., Allāh] constructed it.","He raised its ceiling and proportioned it.","And He darkened its night and extracted its brightness.","And after that He spread the earth.","He extracted from it its water and its pasture,","And the mountains He set firmly","As enjoyment [i.e., provision] for you and your grazing livestock.","But when there comes the greatest Overwhelming Calamity -","The Day when man will remember that for which he strove,","And Hellfire will be exposed for [all] those who see -","So as for he who transgressed","And preferred the life of the world,","Then indeed, Hellfire will be [his] refuge.","But as for he who feared the position of his Lord and prevented the soul from [unlawful] inclination,","Then indeed, Paradise will be [his] refuge.","They ask you, [O Muḥammad], about the Hour: when is its arrival?","In what [position] are you that you should mention it?","To your Lord is its finality.","You are only a warner for those who fear it.","It will be, on the Day they see it, as though they had not remained [in the world] except for an afternoon or a morning thereof."],"ru":["Клянусь вырывающими неистово,","и извлекающими мягко,","и скользящими плавно,","и устремляющимися стремительно,","и распоряжающимися делами.","В тот день содрогнётся Содрогающаяся,","за этим последует Последующее.","Сердца в тот день будут трепещущими,","а их взоры — смиренными.","Они говорят: «Неужели мы будем возвращены к прежнему состоянию?","Неужели, когда станем истлевшими костями?»","Они говорят: «Тогда это было бы убыточное возвращение!»","Но, воистину, это — лишь один грозный окрик,","и вот они уже на поверхности [земли].","Дошло ли до тебя повествование о Мусе?","Когда его Господь воззвал к нему в священной долине Ту́ва:","«Ступай к Фараону — воистину, он преступил предел,","и скажи: “Не желаешь ли очиститься","и чтобы я повёл тебя к твоему Господу, — и ты устрашился?”»","И он показал ему величайшее знамение.","Но тот счёл ложью и ослушался.","Затем он отвернулся, устремившись прочь.","И собрал [людей] и воззвал,","и сказал: «Я — ваш высочайший господь!»","И Аллах схватил его устрашающим наказанием Последней жизни и первой [жизни].","Воистину, в этом — поучительный пример для того, кто страшится.","Вас ли труднее создать — или небо? Он воздвиг его,","возвысил его свод и придал ему сов
