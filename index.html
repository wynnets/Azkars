ِنَّ رَبَّكَ هُوَ يَفْصِلُ بَيْنَهُمْ يَوْمَ الْقِيَامَةِ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ","أَوَلَمْ يَهْدِ لَهُمْ كَمْ أَهْلَكْنَا مِن قَبْلِهِم مِّنَ الْقُرُونِ يَمْشُونَ فِي مَسَاكِنِهِمْ إِنَّ فِي ذَٰلِكَ لَآيَاتٍ أَفَلَا يَسْمَعُونَ","أَوَلَمْ يَرَوْا أَنَّا نَسُوقُ الْمَاءَ إِلَى الْأَرْضِ الْجُرُزِ فَنُخْرِجُ بِهِ زَرْعًا تَأْكُلُ مِنْهُ أَنْعَامُهُمْ وَأَنفُسُهُمْ أَفَلَا يُبْصِرُونَ","وَيَقُولُونَ مَتَىٰ هَٰذَا الْفَتْحُ إِن كُنتُمْ صَادِقِينَ","قُلْ يَوْمَ الْفَتْحِ لَا يَنفَعُ الَّذِينَ كَفَرُوا إِيمَانُهُمْ وَلَا هُمْ يُنظَرُونَ","فَأَعْرِضْ عَنْهُمْ وَانتَظِرْ إِنَّهُم مُّنتَظِرُونَ"],"en":["Alif, Lām, Meem.","[This is] the revelation of the Book about which there is no doubt from the Lord of the worlds.","Or do they say, \"He invented it\"? Rather, it is the truth from your Lord, [O Muḥammad], that you may warn a people to whom no warner has come before you [so] perhaps they will be guided.","It is Allāh who created the heavens and the earth and whatever is between them in six days; then He established Himself above the Throne. You have not besides Him any protector or any intercessor; so will you not be reminded?","He arranges [each] matter from the heaven to the earth; then it will ascend to Him in a Day, the extent of which is a thousand years of those which you count.","That is the Knower of the unseen and the witnessed, the Exalted in Might, the Merciful,","Who perfected everything which He created and began the creation of man from clay.","Then He made his posterity out of the extract of a liquid disdained.","Then He proportioned him and breathed into him from His [created] soul and made for you hearing and vision and hearts [i.e., intellect]; little are you grateful.","And they say, \"When we are lost [i.e., disintegrated] within the earth, will we indeed be [recreated] in a new creation?\" Rather, they are, in the meeting with their Lord, disbelievers.","Say, \"The angel of death who has been entrusted with you will take you. Then to your Lord you will be returned.\"","If you could but see when the criminals are hanging their heads before their Lord, [saying], \"Our Lord, we have seen and heard, so return us [to the world]; we will work righteousness. Indeed, we are [now] certain.\"","And if We had willed, We could have given every soul its guidance, but the word from Me will come into effect [that] \"I will surely fill Hell with jinn and people all together.","So taste [punishment] because you forgot the meeting of this, your Day; indeed, We have [accordingly] forgotten you. And taste the punishment of eternity for what you used to do.\"","Only those believe in Our verses who, when they are reminded by them, fall down in prostration and exalt [Allāh] with praise of their Lord, and they are not arrogant.","Their sides part [i.e., they arise] from [their] beds; they supplicate their Lord in fear and aspiration, and from what We have provided them, they spend.","And no soul knows what has been hidden for them of comfort for eyes [i.e., satisfaction] as reward for what they used to do.","Then is one who was a believer like one who was defiantly disobedient? They are not equal.","As for those who believed and did righteous deeds, for them will be the Gardens of Refuge as accommodation for what they used to do.","But as for those who defiantly disobeyed, their refuge is the Fire. Every time they wish to emerge from it, they will be returned to it while it is said to them, \"Taste the punishment of the Fire which you used to deny.\"","And We will surely let them taste the nearer punishment short of the greater punishment that perhaps they will return [i.e., repent].","And who is more unjust than one who is reminded of the verses of his Lord; then he turns away from them? Indeed We, from the criminals, will take retribution.","And We certainly gave Moses the Scripture, so do not be in doubt over his meeting. And We made it [i.e., the Torah] guidance for the Children of Israel.","And We made from among them leaders guiding by Our command when they were patient and [when] they were certain of Our signs.","Indeed, your Lord will judge between them on the Day of Resurrection concerning that over which they used to differ.","Has it not become clear to them how many generations We destroyed before them, [as] they walk among their dwellings? Indeed in that are signs; then do they not hear?","Have they not seen that We drive water [in clouds] to barren land and bring forth thereby crops from which their livestock eat and [they] themselves? Then do they not see?","And they say, \"When will be this conquest, if you should be truthful?\"","Say, [O Muḥammad], \"On the Day of Conquest the belief of those who had disbelieved will not benefit them, nor will they be reprieved.\"","So turn away from them and wait. Indeed, they are waiting."],"ru":["Алиф. Лям. Мим.","[Это —] ниспослание Писания, в котором нет сомнения, от Господа миров.","Или же они говорят: «Он измыслил его!»? Нет, напротив! Он — истина от твоего Господа, чтобы ты предостерёг народ, к которому до тебя не приходил предостерегающий, — быть может, они последуют верным путём.","Аллах — Тот, Кто сотворил небеса и землю и всё, что между ними, за шесть дней, затем вознёсся на Трон. Нет у вас, помимо Него, ни покровителя, ни заступника. Неужели вы не внемлете напоминанию?","Он управляет делами с небес до земли, затем они восходят к Нему в день, продолжительность которого — тысяча лет из того, что вы исчисляете.","Таков Знающий сокровенное и явное, Могущественный, Милующий,","Тот, Кто сделал прекрасным всё, что сотворил, и начал сотворение человека из глины.","Затем Он создал его потомство из сгустка презренной жидкости.","Затем Он придал ему соразмерный облик, вдохнул в него от Своего духа, и создал вам слух, зрение и сердца. Как же мало вы благодарите!","Они сказали: «Неужели, когда мы затеряемся в земле, мы непременно будем в новом творении?» Нет, напротив, — они отвергают встречу со своим Господом.","Скажи: «Упокоит вас ангел смерти, которому вы поручены, затем к своему Господу вы будете возвращены».","И если бы ты только видел, как преступные, склонив головы перед своим Господом, [взмолятся]: «Господь наш! Мы теперь видим и слышим, так верни же нас, — мы совершим праведное! Воистину, мы [теперь] убеждены!»","А если бы Мы пожелали, то даровали бы каждой душе её руководство, но свершилось Моё слово: «Я непременно наполню Геенну джиннами и людьми, всеми до одного».","Так вкусите же за то, что вы забыли о встрече с этим вашим днём. Воистину, Мы предали вас забвению. И вкусите наказание вечности за то, что вы совершали.","Воистину, в Наши знамения веруют лишь те, которые, когда напоминают им о них, падают, преклоняясь ниц, и прославляют своего Господа хвалой, не превозносясь.","Их бока отдаляются от своих лож. Они взывают к своему Господу со страхом и надеждой и расходуют из того, чем Мы наделили их.","И ни одна душа не знает, что скрыто для них из услады очей в награду за то, что они совершали.","Неужели тот, кто был верующим, подобен тому, кто был нечестивцем?! Они не равны!","Что же касается тех, которые уверовали и совершали праведные деяния, то им уготованы Сады Прибежища — как уготованное им за то, что они совершали.","А что касается тех, которые проявляли нечестие, то их прибежище — адский огонь. Всякий раз, как они пожелают выйти оттуда, их возвращают в него, и им будет сказано: «Вкусите наказание адского огня, который вы считали ложью!»","И Мы непременно дадим им вкусить ближайшего наказания прежде наказания величайшего, — быть может, они вернутся [к истине].","Кто же несправедливее того, кому было напомнено о знамениях его Господа, но затем он отвратился от них? Воистину, Мы отомстим преступным.","Действительно, Мы даровали Мусе Писание. Так не питай же сомнений во встрече с ним, и Мы сделали его руководством для сынов Исраила.","И Мы сделали из них предводителей, которые вели прямым путём по Нашему велению, за то, что они проявляли терпение и были твёрдо убеждены в Наших знамениях.","Воистину, твой Господь рассудит их в День воскресения в том, в чём они пребывали в разногласиях.","Неужели не стало для них ясным, сколько поколений Мы погубили до них, тогда как они ходят по их жилищам? Воистину, в этом — знамения. Неужели они не слышат?","Неужели они не видят, как Мы направляем воду на иссохшую землю и взращиваем ею посевы, которыми питается их скот и они сами? Неужели они не видят?","Они говорят: «Когда же это решение, если вы правдивы?»","Скажи: «В день [того] решения не принесёт пользы тем, которые отвергли веру, их вера и не будет им дано отсрочки».","Так отвернись же от них и жди. Воистину, ждут и они."]},"18":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الْحَمْدُ لِلَّهِ الَّذِي أَنزَلَ عَلَىٰ عَبْدِهِ الْكِتَابَ وَلَمْ يَجْعَل لَّهُ عِوَجًا","قَيِّمًا لِّيُنذِرَ بَأْسًا شَدِيدًا مِّن لَّدُنْهُ وَيُبَشِّرَ الْمُؤْمِنِينَ الَّذِينَ يَعْمَلُونَ الصَّالِحَاتِ أَنَّ لَهُمْ أَجْرًا حَسَنًا","مَّاكِثِينَ فِيهِ أَبَدًا","وَيُنذِرَ الَّذِينَ قَالُوا اتَّخَذَ اللَّهُ وَلَدًا","مَّا لَهُم بِهِ مِنْ عِلْمٍ وَلَا لِآبَائِهِمْ كَبُرَتْ كَلِمَةً تَخْرُجُ مِنْ أَفْوَاهِهِمْ إِن يَقُولُونَ إِلَّا كَذِبًا","فَلَعَلَّكَ بَاخِعٌ نَّفْسَكَ عَلَىٰ آثَارِهِمْ إِن لَّمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا","إِنَّا جَعَلْنَا مَا عَلَى الْأَرْضِ زِينَةً لَّهَا لِنَبْلُوَهُمْ أَيُّهُمْ أَحْسَنُ عَمَلًا","وَإِنَّا لَجَاعِلُونَ مَا عَلَيْهَا صَعِيدًا جُرُزًا","أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ آيَاتِنَا عَجَبًا","إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا","فَضَرَبْنَا عَلَىٰ آذَانِهِمْ فِي الْكَهْفِ سِنِينَ عَدَدًا","ثُمَّ بَعَثْنَاهُمْ لِنَعْلَمَ أَيُّ الْحِزْبَيْنِ أَحْصَىٰ لِمَا لَبِثُوا أَمَدًا","نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِالْحَقِّ إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى","وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا فَقَالُوا رَبُّنَا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ لَن نَّدْعُوَ مِن دُونِهِ إِلَٰهًا لَّقَدْ قُلْنَا إِذًا شَطَطًا","هَٰؤُلَاءِ قَوْمُنَا اتَّخَذُوا مِن دُونِهِ آلِهَةً لَّوْلَا يَأْتُونَ عَلَيْهِم بِسُلْطَانٍ بَيِّنٍ فَمَنْ أَظْلَمُ مِمَّنِ افْتَرَىٰ عَلَى اللَّهِ كَذِبًا","وَإِذِ اعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا اللَّهَ فَأْوُوا إِلَى الْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًا","وَتَرَى الشَّمْسَ إِذَا طَلَعَت تَّزَاوَرُ عَن كَهْفِهِمْ ذَاتَ الْيَمِينِ وَإِذَا غَرَبَت تَّقْرِضُهُمْ ذَاتَ الشِّمَالِ وَهُمْ فِي فَجْوَةٍ مِّنْهُ ذَٰلِكَ مِنْ آيَاتِ اللَّهِ مَن يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُ وَلِيًّا مُّرْشِدًا","وَتَحْسَبُهُمْ أَيْقَاظًا وَهُمْ رُقُودٌ وَنُقَلِّبُهُمْ ذَاتَ الْيَمِينِ وَذَاتَ الشِّمَالِ وَكَلْبُهُم بَاسِطٌ ذِرَاعَيْهِ بِالْوَصِيدِ لَوِ اطَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَارًا وَلَمُلِئْتَ مِنْهُمْ رُعْبًا","وَكَذَٰلِكَ بَعَثْنَاهُمْ لِيَتَسَاءَلُوا بَيْنَهُمْ قَالَ قَائِلٌ مِّنْهُمْ كَمْ لَبِثْتُمْ قَالُوا لَبِثْنَا يَوْمًا أَوْ بَعْضَ يَوْمٍ قَالُوا رَبُّكُمْ أَعْلَمُ بِمَا لَبِثْتُمْ فَابْعَثُوا أَحَدَكُم بِوَرِقِكُمْ هَٰذِهِ إِلَى الْمَدِينَةِ فَلْيَنظُرْ أَيُّهَا أَزْكَىٰ طَعَامًا فَلْيَأْتِكُم بِرِزْقٍ مِّنْهُ وَلْيَتَلَطَّفْ وَلَا يُشْعِرَنَّ بِكُمْ أَحَدًا","إِنَّهُمْ إِن يَظْهَرُوا عَلَيْكُمْ يَرْجُمُوكُمْ أَوْ يُعِيدُوكُمْ فِي مِلَّتِهِمْ وَلَن تُفْلِحُوا إِذًا أَبَدًا","وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوا أَنَّ وَعْدَ اللَّهِ حَقٌّ وَأَنَّ السَّاعَةَ لَا رَيْبَ فِيهَا إِذْ يَتَنَازَعُونَ بَيْنَهُمْ أَمْرَهُمْ فَقَالُوا ابْنُوا عَلَيْهِم بُنْيَانًا رَّبُّهُمْ أَعْلَمُ بِهِمْ قَالَ الَّذِينَ غَلَبُوا عَلَىٰ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًا","سَيَقُولُونَ ثَلَاثَةٌ رَّابِعُهُمْ كَلْبُهُمْ وَيَقُولُونَ خَمْسَةٌ سَادِسُهُمْ كَلْبُهُمْ رَجْمًا بِالْغَيْبِ وَيَقُولُونَ سَبْعَةٌ وَثَامِنُهُمْ كَلْبُهُمْ قُل رَّبِّي أَعْلَمُ بِعِدَّتِهِم مَّا يَعْلَمُهُمْ إِلَّا قَلِيلٌ فَلَا تُمَارِ فِيهِمْ إِلَّا مِرَاءً ظَاهِرًا وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمْ أَحَدًا","وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَٰلِكَ غَدًا","إِلَّا أَن يَشَاءَ اللَّهُ وَاذْكُر رَّبَّكَ إِذَا نَسِيتَ وَقُلْ عَسَىٰ أَن يَهْدِيَنِ رَبِّي لِأَقْرَبَ مِنْ هَٰذَا رَشَدًا","وَلَبِثُوا فِي كَهْفِهِمْ ثَلَاثَ مِائَةٍ سِنِينَ وَازْدَادُوا تِسْعًا","قُلِ اللَّهُ أَعْلَمُ بِمَا لَبِثُوا لَهُ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ أَبْصِرْ بِهِ وَأَسْمِعْ مَا لَهُم مِّن دُونِهِ مِن وَلِيٍّ وَلَا يُشْرِكُ فِي حُكْمِهِ أَحَدًا","وَاتْلُ مَا أُوحِيَ إِلَيْكَ مِن كِتَابِ رَبِّكَ لَا مُبَدِّلَ لِكَلِمَاتِهِ وَلَن تَجِدَ مِن دُونِهِ مُلْتَحَدًا","وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا","وَقُلِ الْحَقُّ مِن رَّبِّكُمْ فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ إِنَّا أَعْتَدْنَا لِلظَّالِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا وَإِن يَسْتَغِيثُوا يُغَاثُوا بِمَاءٍ كَالْمُهْلِ يَشْوِي الْوُجُوهَ بِئْسَ الشَّرَابُ وَسَاءَتْ مُرْتَفَقًا","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا","أُولَٰئِكَ لَهُمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهِمُ الْأَنْهَارُ يُحَلَّوْنَ فِيهَا مِنْ أَسَاوِرَ مِن ذَهَبٍ وَيَلْبَسُونَ ثِيَابًا خُضْرًا مِّن سُندُسٍ وَإِسْتَبْرَقٍ مُّتَّكِئِينَ فِيهَا عَلَى الْأَرَائِكِ نِعْمَ الثَّوَابُ وَحَسُنَتْ مُرْتَفَقًا","وَاضْرِبْ لَهُم مَّثَلًا رَّجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنْ أَعْنَابٍ وَحَفَفْنَاهُمَا بِنَخْلٍ وَجَعَلْنَا بَيْنَهُمَا زَرْعًا","كِلْتَا الْجَنَّتَيْنِ آتَتْ أُكُلَهَا وَلَمْ تَظْلِم مِّنْهُ شَيْئًا وَفَجَّرْنَا خِلَالَهُمَا نَهَرًا","وَكَانَ لَهُ ثَمَرٌ فَقَالَ لِصَاحِبِهِ وَهُوَ يُحَاوِرُهُ أَنَا أَكْثَرُ مِنكَ مَالًا وَأَعَزُّ نَفَرًا","وَدَخَلَ جَنَّتَهُ وَهُوَ ظَالِمٌ لِّنَفْسِهِ قَالَ مَا أَظُنُّ أَن تَبِيدَ هَٰذِهِ أَبَدًا","وَمَا أَظُنُّ السَّاعَةَ قَائِمَةً وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّي لَأَجِدَنَّ خَيْرًا مِّنْهَا مُنقَلَبًا","قَالَ لَهُ صَاحِبُهُ وَهُوَ يُحَاوِرُهُ أَكَفَرْتَ بِالَّذِي خَلَقَكَ مِن تُرَابٍ ثُمَّ مِن نُّطْفَةٍ ثُمَّ سَوَّاكَ رَجُلًا","لَّٰكِنَّا هُوَ اللَّهُ رَبِّي وَلَا أُشْرِكُ بِرَبِّي أَحَدًا","وَلَوْلَا إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِ إِن تَرَنِ أَنَا أَقَلَّ مِنكَ مَالًا وَوَلَدًا","فَعَسَىٰ رَبِّي أَن يُؤْتِيَنِ خَيْرًا مِّن جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَانًا مِّنَ السَّمَاءِ فَتُصْبِحَ صَعِيدًا زَلَقًا","أَوْ يُصْبِحَ مَاؤُهَا غَوْرًا فَلَن تَسْتَطِيعَ لَهُ طَلَبًا","وَأُحِيطَ بِثَمَرِهِ فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلَىٰ مَا أَنفَقَ فِيهَا وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَا لَيْتَنِي لَمْ أُشْرِكْ بِرَبِّي أَحَدًا","وَلَمْ تَكُن لَّهُ فِئَةٌ يَنصُرُونَهُ مِن دُونِ اللَّهِ وَمَا كَانَ مُنتَصِرًا","هُنَالِكَ الْوَلَايَةُ لِلَّهِ الْحَقِّ هُوَ خَيْرٌ ثَوَابًا وَخَيْرٌ عُقْبًا","وَاضْرِبْ لَهُم مَّثَلَ الْحَيَاةِ الدُّنْيَا كَمَاءٍ أَنزَلْنَاهُ مِنَ السَّمَاءِ فَاخْتَلَطَ بِهِ نَبَاتُ الْأَرْضِ فَأَصْبَحَ هَشِيمًا تَذْرُوهُ الرِّيَاحُ وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقْتَدِرًا","الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا","وَيَوْمَ نُسَيِّرُ الْجِبَالَ وَتَرَى الْأَرْضَ بَارِزَةً وَحَشَرْنَاهُمْ فَلَمْ نُغَادِرْ مِنْهُمْ أَحَدًا","وَعُرِضُوا عَلَىٰ رَبِّكَ صَفًّا لَّقَدْ جِئْتُمُونَا كَمَا خَلَقْنَاكُمْ أَوَّلَ مَرَّةٍ بَلْ زَعَمْتُمْ أَلَّن نَّجْعَلَ لَكُم مَّوْعِدًا","وَوُضِعَ الْكِتَابُ فَتَرَى الْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِ وَيَقُولُونَ يَا وَيْلَتَنَا مَالِ هَٰذَا الْكِتَابِ لَا يُغَادِرُ صَغِيرَةً وَلَا كَبِيرَةً إِلَّا أَحْصَاهَا وَوَجَدُوا مَا عَمِلُوا حَاضِرًا وَلَا يَظْلِمُ رَبُّكَ أَحَدًا","وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ كَانَ مِنَ الْجِنِّ فَفَسَقَ عَنْ أَمْرِ رَبِّهِ أَفَتَتَّخِذُونَهُ وَذُرِّيَّتَهُ أَوْلِيَاءَ مِن دُونِي وَهُمْ لَكُمْ عَدُوٌّ بِئْسَ لِلظَّالِمِينَ بَدَلًا","مَّا أَشْهَدتُّهُمْ خَلْقَ السَّمَاوَاتِ وَالْأَرْضِ وَلَا خَلْقَ أَنفُسِهِمْ وَمَا كُنتُ مُتَّخِذَ الْمُضِلِّينَ عَضُدًا","وَيَوْمَ يَقُولُ نَادُوا شُرَكَائِيَ الَّذِينَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُوا لَهُمْ وَجَعَلْنَا بَيْنَهُم مَّوْبِقًا","وَرَأَى الْمُجْرِمُونَ النَّارَ فَظَنُّوا أَنَّهُم مُّوَاقِعُوهَا وَلَمْ يَجِدُوا عَنْهَا مَصْرِفًا","وَلَقَدْ صَرَّفْنَا فِي هَٰذَا الْقُرْآنِ لِلنَّاسِ مِن كُلِّ مَثَلٍ وَكَانَ الْإِنسَانُ أَكْثَرَ شَيْءٍ جَدَلًا","وَمَا مَنَعَ النَّاسَ أَن يُؤْمِنُوا إِذْ جَاءَهُمُ الْهُدَىٰ وَيَسْتَغْفِرُوا رَبَّهُمْ إِلَّا أَن تَأْتِيَهُمْ سُنَّةُ الْأَوَّلِينَ أَوْ يَأْتِيَهُمُ الْعَذَابُ قُبُلًا","وَمَا نُرْسِلُ الْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَ وَيُجَادِلُ الَّذِينَ كَفَرُوا بِالْبَاطِلِ لِيُدْحِضُوا بِهِ الْحَقَّ وَاتَّخَذُوا آيَاتِي وَمَا أُنذِرُوا هُزُوًا","وَمَنْ أَظْلَمُ مِمَّن ذُكِّرَ بِآيَاتِ رَبِّهِ فَأَعْرَضَ عَنْهَا وَنَسِيَ مَا قَدَّمَتْ يَدَاهُ إِنَّا جَعَلْنَا عَلَىٰ قُلُوبِهِمْ أَكِنَّةً أَن يَفْقَهُوهُ وَفِي آذَانِهِمْ وَقْرًا وَإِن تَدْعُهُمْ إِلَى الْهُدَىٰ فَلَن يَهْتَدُوا إِذًا أَبَدًا","وَرَبُّكَ الْغَفُورُ ذُو الرَّحْمَةِ لَوْ يُؤَاخِذُهُم بِمَا كَسَبُوا لَعَجَّلَ لَهُمُ الْعَذَابَ بَل لَّهُم مَّوْعِدٌ لَّن يَجِدُوا مِن دُونِهِ مَوْئِلًا","وَتِلْكَ الْقُرَىٰ أَهْلَكْنَاهُمْ لَمَّا ظَلَمُوا وَجَعَلْنَا لِمَهْلِكِهِم مَّوْعِدًا","وَإِذْ قَالَ مُوسَىٰ لِفَتَاهُ لَا أَبْرَحُ حَتَّىٰ أَبْلُغَ مَجْمَعَ الْبَحْرَيْنِ أَوْ أَمْضِيَ حُقُبًا","فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ سَرَبًا","فَلَمَّا جَاوَزَا قَالَ لِفَتَاهُ آتِنَا غَدَاءَنَا لَقَدْ لَقِينَا مِن سَفَرِنَا هَٰذَا نَصَبًا","قَالَ أَرَأَيْتَ إِذْ أَوَيْنَا إِلَى الصَّخْرَةِ فَإِنِّي نَسِيتُ الْحُوتَ وَمَا أَنسَانِيهُ إِلَّا الشَّيْطَانُ أَنْ أَذْكُرَهُ وَاتَّخَذَ سَبِيلَهُ فِي الْبَحْرِ عَجَبًا","قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِ فَارْتَدَّا عَلَىٰ آثَارِهِمَا قَصَصًا","فَوَجَدَا عَبْدًا مِّنْ عِبَادِنَا آتَيْنَاهُ رَحْمَةً مِّنْ عِندِنَا وَعَلَّمْنَاهُ مِن لَّدُنَّا عِلْمًا","قَالَ لَهُ مُوسَىٰ هَلْ أَتَّبِعُكَ عَلَىٰ أَن تُعَلِّمَنِ مِمَّا عُلِّمْتَ رُشْدًا","قَالَ إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا","وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِ خُبْرًا","قَالَ سَتَجِدُنِي إِن شَاءَ اللَّهُ صَابِرًا وَلَا أَعْصِي لَكَ أَمْرًا","قَالَ فَإِنِ اتَّبَعْتَنِي فَلَا تَسْأَلْنِي عَن شَيْءٍ حَتَّىٰ أُحْدِثَ لَكَ مِنْهُ ذِكْرًا","فَانطَلَقَا حَتَّىٰ إِذَا رَكِبَا فِي السَّفِينَةِ خَرَقَهَا قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَيْئًا إِمْرًا","قَالَ أَلَمْ أَقُلْ إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا","قَالَ لَا تُؤَاخِذْنِي بِمَا نَسِيتُ وَلَا تُرْهِقْنِي مِنْ أَمْرِي عُسْرًا","فَانطَلَقَا حَتَّىٰ إِذَا لَقِيَا غُلَامًا فَقَتَلَهُ قَالَ أَقَتَلْتَ نَفْسًا زَكِيَّةً بِغَيْرِ نَفْسٍ لَّقَدْ جِئْتَ شَيْئًا نُّكْرًا","قَالَ أَلَمْ أَقُل لَّكَ إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا","قَالَ إِن سَأَلْتُكَ عَن شَيْءٍ بَعْدَهَا فَلَا تُصَاحِبْنِي قَدْ بَلَغْتَ مِن لَّدُنِّي عُذْرًا","فَانطَلَقَا حَتَّىٰ إِذَا أَتَيَا أَهْلَ قَرْيَةٍ اسْتَطْعَمَا أَهْلَهَا فَأَبَوْا أَن يُضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَارًا يُرِيدُ أَن يَنقَضَّ فَأَقَامَهُ قَالَ لَوْ شِئْتَ لَاتَّخَذْتَ عَلَيْهِ أَجْرًا","قَالَ هَٰذَا فِرَاقُ بَيْنِي وَبَيْنِكَ سَأُنَبِّئُكَ بِتَأْوِيلِ مَا لَمْ تَسْتَطِع عَّلَيْهِ صَبْرًا","أَمَّا السَّفِينَةُ فَكَانَتْ لِمَسَاكِينَ يَعْمَلُونَ فِي الْبَحْرِ فَأَرَدتُّ أَنْ أَعِيبَهَا وَكَانَ وَرَاءَهُم مَّلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا","وَأَمَّا الْغُلَامُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَا أَن يُرْهِقَهُمَا طُغْيَانًا وَكُفْرًا","فَأَرَدْنَا أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِّنْهُ زَكَاةً وَأَقْرَبَ رُحْمًا","وَأَمَّا الْجِدَارُ فَكَانَ لِغُلَامَيْنِ يَتِيمَيْنِ فِي الْمَدِينَةِ وَكَانَ تَحْتَهُ كَنزٌ لَّهُمَا وَكَانَ أَبُوهُمَا صَالِحًا فَأَرَادَ رَبُّكَ أَن يَبْلُغَا أَشُدَّهُمَا وَيَسْتَخْرِجَا كَنزَهُمَا رَحْمَةً مِّن رَّبِّكَ وَمَا فَعَلْتُهُ عَنْ أَمْرِي ذَٰلِكَ تَأْوِيلُ مَا لَمْ تَسْطِع عَّلَيْهِ صَبْرًا","وَيَسْأَلُونَكَ عَن ذِي الْقَرْنَيْنِ قُلْ سَأَتْلُو عَلَيْكُم مِّنْهُ ذِكْرًا","إِنَّا مَكَّنَّا لَهُ فِي الْأَرْضِ وَآتَيْنَاهُ مِن كُلِّ شَيْءٍ سَبَبًا","فَأَتْبَعَ سَبَبًا","حَتَّىٰ إِذَا بَلَغَ مَغْرِبَ الشَّمْسِ وَجَدَهَا تَغْرُبُ فِي عَيْنٍ حَمِئَةٍ وَوَجَدَ عِندَهَا قَوْمًا قُلْنَا يَا ذَا الْقَرْنَيْنِ إِمَّا أَن تُعَذِّبَ وَإِمَّا أَن تَتَّخِذَ فِيهِمْ حُسْنًا","قَالَ أَمَّا مَن ظَلَمَ فَسَوْفَ نُعَذِّبُهُ ثُمَّ يُرَدُّ إِلَىٰ رَبِّهِ فَيُعَذِّبُهُ عَذَابًا نُّكْرًا","وَأَمَّا مَنْ آمَنَ وَعَمِلَ صَالِحًا فَلَهُ جَزَاءً الْحُسْنَىٰ وَسَنَقُولُ لَهُ مِنْ أَمْرِنَا يُسْرًا","ثُمَّ أَتْبَعَ سَبَبًا","حَتَّىٰ إِذَا بَلَغَ مَطْلِعَ الشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٍ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْرًا","كَذَٰلِكَ وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًا","ثُمَّ أَتْبَعَ سَبَبًا","حَتَّىٰ إِذَا بَلَغَ بَيْنَ السَّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْمًا لَّا يَكَادُونَ يَفْقَهُونَ قَوْلًا","قَالُوا يَا ذَا الْقَرْنَيْنِ إِنَّ يَأْجُوجَ وَمَأْجُوجَ مُفْسِدُونَ فِي الْأَرْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجًا عَلَىٰ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سَدًّا","قَالَ مَا مَكَّنِّي فِيهِ رَبِّي خَيْرٌ فَأَعِينُونِي بِقُوَّةٍ أَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْمًا","آتُونِي زُبَرَ الْحَدِيدِ حَتَّىٰ إِذَا سَاوَىٰ بَيْنَ الصَّدَفَيْنِ قَالَ انفُخُوا حَتَّىٰ إِذَا جَعَلَهُ نَارًا قَالَ آتُونِي أُفْرِغْ عَلَيْهِ قِطْرًا","فَمَا اسْطَاعُوا أَن يَظْهَرُوهُ وَمَا اسْتَطَاعُوا لَهُ نَقْبًا","قَالَ هَٰذَا رَحْمَةٌ مِّن رَّبِّي فَإِذَا جَاءَ وَعْدُ رَبِّي جَعَلَهُ دَكَّاءَ وَكَانَ وَعْدُ رَبِّي حَقًّا","وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍ يَمُوجُ فِي بَعْضٍ وَنُفِخَ فِي الصُّورِ فَجَمَعْنَاهُمْ جَمْعًا","وَعَرَضْنَا جَهَنَّمَ يَوْمَئِذٍ لِّلْكَافِرِينَ عَرْضًا","الَّذِينَ كَانَتْ أَعْيُنُهُمْ فِي غِطَاءٍ عَن ذِكْرِي وَكَانُوا لَا يَسْتَطِيعُونَ سَمْعًا","أَفَحَسِبَ الَّذِينَ كَفَرُوا أَن يَتَّخِذُوا عِبَادِي مِن دُونِي أَوْلِيَاءَ إِنَّا أَعْتَدْنَا جَهَنَّمَ لِلْكَافِرِينَ نُزُلًا","قُلْ هَلْ نُنَبِّئُكُم بِالْأَخْسَرِينَ أَعْمَالًا","الَّذِينَ ضَلَّ سَعْيُهُمْ فِي الْحَيَاةِ الدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا","أُولَٰئِكَ الَّذِينَ كَفَرُوا بِآيَاتِ رَبِّهِمْ وَلِقَائِهِ فَحَبِطَتْ أَعْمَالُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ الْقِيَامَةِ وَزْنًا","ذَٰلِكَ جَزَاؤُهُمْ جَهَنَّمُ بِمَا كَفَرُوا وَاتَّخَذُوا آيَاتِي وَرُسُلِي هُزُوًا","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا","خَالِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلًا","قُل لَّوْ كَانَ الْبَحْرُ مِدَادًا لِّكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا","قُلْ إِنَّمَا أَنَا بَشَرٌ مِّثْلُكُمْ يُوحَىٰ إِلَيَّ أَنَّمَا إِلَٰهُكُمْ إِلَٰهٌ وَاحِدٌ فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا"],"en":["[All] praise is [due] to Allāh, who has sent down upon His Servant [Muḥammad (ﷺ)] the Book and has not made therein any deviance.","[He has made it] straight, to warn of severe punishment from Him and to give good tidings to the believers who do righteous deeds that they will have a good reward [i.e., Paradise]","In which they will remain forever","And to warn those who say, \"Allāh has taken a son.\"","They have no knowledge of it, nor had their fathers. Grave is the word that comes out of their mouths; they speak not except a lie.","Then perhaps you would kill yourself through grief over them, [O Muḥammad], if they do not believe in this message, [and] out of sorrow.","Indeed, We have made that which is on the earth adornment for it that We may test them [as to] which of them is best in deed.","And indeed, We will make that which is upon it [into] a barren ground.","Or have you thought that the companions of the cave and the inscription were, among Our signs, a wonder?","[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.\"","So We cast [a cover of sleep] over their ears within the cave for a number of years.","Then We awakened them that We might show which of the two factions was most precise in calculating what [extent] they had remained in time.","It is We who relate to you, [O Muḥammad], their story in truth. Indeed, they were youths who believed in their Lord, and We increased them in guidance.","And We bound [i.e., made firm] their hearts when they stood up and said, \"Our Lord is the Lord of the heavens and the earth. Never will we invoke besides Him any deity. We would have certainly spoken, then, an excessive transgression.","These, our people, have taken besides Him deities. Why do they not bring for [worship of] them a clear evidence? And who is more unjust than one who invents about Allāh a lie?\"","[The youths said to one another], \"And when you have withdrawn from them and that which they worship other than Allāh, retreat to the cave. Your Lord will spread out for you of His mercy and will prepare for you from your affair facility.\"","And [had you been present], you would see the sun when it rose, inclining away from their cave on the right, and when it set, passing away from them on the left, while they were [lying] within an open space thereof. That was from the signs of Allāh. He whom Allāh guides is the [rightly] guided, but he whom He sends astray - never will you find for him a protecting guide.","And you would think them awake, while they were asleep. And We turned them to the right and to the left, while their dog stretched his forelegs at the entrance. If you had looked at them, you would have turned from them in flight and been filled by them with terror.","And similarly, We awakened them that they might question one another. Said a speaker from among them, \"How long have you remained [here]?\" They said, \"We have remained a day or part of a day.\" They said, \"Your Lord is most knowing of how long you remained. So send one of you with this silver coin of yours to the city and let him look to which is the best of food and bring you provision from it and let him be cautious. And let no one be aware of you.","Indeed, if they come to know of you, they will stone you or return you to their religion. And never would you succeed, then - ever.\"","And similarly, We caused them to be found that they [who found them] would know that the promise of Allāh is truth and that of the Hour there is no doubt. [That was] when they disputed among themselves about their affair and [then] said, \"Construct over them a structure. Their Lord is most knowing about them.\" Said those who prevailed in the matter, \"We will surely take [for ourselves] over them a masjid.\"","They [i.e., people] will say there were three, the fourth of them being their dog; and they will say there were five, the sixth of them being their dog - guessing at the unseen; and they will say there were seven, and the eighth of them was their dog. Say, [O Muḥammad], \"My Lord is most knowing of their number. None knows them except a few. So do not argue about them except with an obvious argument and do not inquire about them among [the speculators] from anyone.\"","And never say of anything, \"Indeed, I will do that tomorrow,\"","Except [when adding], \"If Allāh wills.\" And remember your Lord when you forget [it] and say, \"Perhaps my Lord will guide me to what is nearer than this to right conduct.\"","And they remained in their cave for three hundred years and exceeded by nine.","Say, \"Allāh is most knowing of how long they remained. He has [knowledge of] the unseen [aspects] of the heavens and the earth. How Seeing is He and how Hearing! They have not besides Him any protector, and He shares not His legislation with anyone.\"","And recite, [O Muḥammad], what has been revealed to you of the Book of your Lord. There is no changer of His words, and never will you find in other than Him a refuge.","And keep yourself patient [by being] with those who call upon their Lord in the morning and the evening, seeking His face [i.e., acceptance]. And let not your eyes pass beyond them, desiring adornments of the worldly life, and do not obey one whose heart We have made heedless of Our remembrance and who follows his desire and whose affair is ever [in] neglect.","And say, \"The truth is from your Lord, so whoever wills - let him believe; and whoever wills - let him disbelieve.\" Indeed, We have prepared for the wrongdoers a fire whose walls will surround them. And if they call for relief, they will be relieved with water like murky oil, which scalds [their] faces. Wretched is the drink, and evil is the resting place.","Indeed, those who have believed and done righteous deeds - indeed, We will not allow to be lost the reward of any who did well in deeds.","Those will have gardens of perpetual residence; beneath them rivers will flow. They will be adorned therein with bracelets of gold and will wear green garments of fine silk and brocade, reclining therein on adorned couches. Excellent is the reward, and good is the resting place.","And present to them an example of two men: We granted to one of them two gardens of grapevines, and We bordered them with palm trees and placed between them [fields of] crops.","Each of the two gardens produced its fruit and did not fall short thereof in anything. And We caused to gush forth within them a river.","And he had fruit, so he said to his companion while he was conversing with him, \"I am greater than you in wealth and mightier in [numbers of] men.\"","And he entered his garden while he was unjust to himself. He said, \"I do not think that this will perish - ever.","And I do not think the Hour will occur. And even if I should be brought back to my Lord, I will surely find better than this as a return.\"","His companion said to him while he was conversing with him, \"Have you disbelieved in He who created you from dust and then from a sperm-drop and then proportioned you [as] a man?","But as for me, He is Allāh, my Lord, and I do not associate with my Lord anyone.","And why did you, when you entered your garden, not say, 'What Allāh willed [has occurred]; there is no power except in Allāh'? Although you see me less than you in wealth and children,","It may be that my Lord will give me [something] better than your garden and will send upon it a [disastrous] penalty from the sky, and it will become a smooth, dusty ground,","Or its water will become sunken [into the earth], so you would never be able to seek it.\"","And his fruits were encompassed [by ruin], so he began to turn his hands about [in dismay] over what he had spent on it, while it had collapsed upon its trellises, and said, \"Oh, I wish I had not associated with my Lord anyone.\"","And there was for him no company to aid him other than Allāh, nor could he defend himself.","There the authority is [completely] for Allāh, the Truth. He is best in reward and best in outcome.","And present to them the example of the life of this world, [its being] like rain which We send down from the sky, and the vegetation of the earth mingles with it and [then] it becomes dry remnants, scattered by the winds. And Allāh is ever, over all things, Perfect in Ability.","Wealth and children are [but] adornment of the worldly life. But the enduring good deeds are better to your Lord for reward and better for [one's] hope.","And [warn of] the Day when We will remove the mountains and you will see the earth exposed, and We will gather them and not leave behind from them anyone.","And they will be presented before your Lord in rows, [and He will say], \"You have certainly come to Us just as We created you the first time. But you claimed that We would never make for you an appointment.\"","And the record [of deeds] will be placed [open], and you will see the criminals fearful of that within it, and they will say, \"Oh, woe to us! What is this book that leaves nothing small or great except that it has enumerated it?\" And they will find what they did present [before them]. And your Lord does injustice to no one.","And [mention] when We said to the angels, \"Prostrate to Adam,\" and they prostrated, except for Iblees. He was of the jinn and departed from [i.e., disobeyed] the command of his Lord. Then will you take him and his descendants as allies other than Me while they are enemies to you? Wretched it is for the wrongdoers as an exchange.","I did not make them witness to the creation of the heavens and the earth or to the creation of themselves, and I would not have taken the misguiders as assistants.","And [warn of] the Day when He will say, \"Call My 'partners' whom you claimed,\" and they will invoke them, but they will not respond to them. And We will put between them [a valley of] destruction.","And the criminals will see the Fire and will be certain that they are to fall therein. And they will not find from it a way elsewhere.","And We have certainly diversified in this Qur’ān for the people from every [kind of] example; but man has ever been, most of anything, [prone to] dispute.","And nothing has prevented the people from believing when guidance came to them and from asking forgiveness of their Lord except that there [must] befall them the [accustomed] precedent of the former peoples or that the punishment should come [directly] before them.","And We send not the messengers except as bringers of good tidings and warners. And those who disbelieve dispute by [using] falsehood to [attempt to] invalidate thereby the truth and have taken My verses, and that of which they are warned, in ridicule.","And who is more unjust than one who is reminded of the verses of his Lord but turns away from them and forgets what his hands have put forth? Indeed, We have placed over their hearts coverings, lest they understand it, and in their ears deafness. And if you invite them to guidance - they will never be guided, then - ever.","And your Lord is the Forgiving, the possessor of mercy. If He were to impose blame upon them for what they earned, He would have hastened for them the punishment. Rather, for them is an appointment from which they will never find an escape.","And those cities - We destroyed them when they wronged, and We made for their destruction an appointed time.","And [mention] when Moses said to his boy [i.e., servant], \"I will not cease [traveling] until I reach the junction of the two seas or continue for a long period.\"","But when they reached the junction between them, they forgot their fish, and it took its course into the sea, slipping away.","So when they had passed beyond it, [Moses] said to his boy, \"Bring us our morning meal. We have certainly suffered in this, our journey, [much] fatigue.\"","He said, \"Did you see when we retired to the rock? Indeed, I forgot [there] the fish. And none made me forget it except Satan - that I should mention it. And it took its course into the sea amazingly.\"","[Moses] said, \"That is what we were seeking.\" So they returned, following their footprints.","And they found a servant from among Our servants [i.e., al-Khiḍr] to whom We had given mercy from Us and had taught him from Us a [certain] knowledge.","Moses said to him, \"May I follow you on [the condition] that you teach me from what you have been taught of sound judgement?\"","He said, \"Indeed, with me you will never be able to have patience.","And how can you have patience for what you do not encompass in knowledge?\"","[Moses] said, \"You will find me, if Allāh wills, patient, and I will not disobey you in [any] order.\"","He said, \"Then if you follow me, do not ask me about anything until I make to you about it mention [i.e., explanation].\"","So they set out, until when they had embarked on the ship, he [i.e., al-Khiḍr] tore it open. [Moses] said, \"Have you torn it open to drown its people? You have certainly done a grave thing.\"","[Al-Khiḍr] said, \"Did I not say that with me you would never be able to have patience?\"","[Moses] said, \"Do not blame me for what I forgot and do not overwhelm me in my matter with difficulty.\"","So they set out, until when they met a boy, he [i.e., al-Khiḍr] killed him. [Moses] said, \"Have you killed a pure soul for other than [having killed] a soul? You have certainly done a deplorable thing.\"","[Al-Khiḍr] said, \"Did I not tell you that with me you would never be able to have patience?\"","[Moses] said, \"If I should ask you about anything after this, then do not keep me as a companion. You have obtained from me an excuse.\"","So they set out, until when they came to the people of a town, they asked its people for food, but they refused to offer them hospitality. And they found therein a wall about to collapse, so he [i.e., al-Khiḍr] restored it. [Moses] said, \"If you wished, you could have taken for it a payment.\"","[Al-Khiḍr] said, \"This is parting between me and you. I will inform you of the interpretation of that about which you could not have patience.","As for the ship, it belonged to poor people working at sea. So I intended to cause defect in it as there was after them a king who seized every [good] ship by force.","And as for the boy, his parents were believers, and we feared that he would overburden them by transgression and disbelief.","So we intended that their Lord should substitute for them one better than him in purity and nearer to mercy.","And as for the wall, it belonged to two orphan boys in the city, and there was beneath it a treasure for them, and their father had been righteous. So your Lord intended that they reach maturity and extract their treasure, as a mercy from your Lord. And I did it not of my own accord. That is the interpretation of that about which you could not have patience.\"","And they ask you, [O Muḥammad], about Dhul-Qarnayn. Say, \"I will recite to you about him a report.\"","Indeed, We established him upon the earth, and We gave him from everything a way [i.e., means].","So he followed a way","Until, when he reached the setting of the sun [i.e., the west], he found it [as if] setting in a body of dark water, and he found near it a people. We [i.e., Allāh] said, \"O Dhul-Qarnayn, either you punish [them] or else adopt among them [a way of] goodness.\"","He said, \"As for one who wrongs, we will punish him. Then he will be returned to his Lord, and He will punish him with a terrible punishment [i.e., Hellfire].","But as for one who believes and does righteousness, he will have a reward of the best [i.e., Paradise], and we [i.e., Dhul-Qarnayn] will speak to him from our command with ease.\"","Then he followed a way","Until, when he came to the rising of the sun [i.e., the east], he found it rising on a people for whom We had not made against it any shield.","Thus. And We had encompassed [all] that he had in knowledge.","Then he followed a way","Until, when he reached [a pass] between two mountains, he found beside them a people who could hardly understand [his] speech.","They said, \"O Dhul-Qarnayn, indeed Gog and Magog are [great] corrupters in the land. So may we assign for you an expenditure that you might make between us and them a barrier?\"","He said, \"That in which my Lord has established me is better [than what you offer], but assist me with strength [i.e., manpower]; I will make between you and them a dam.","Bring me bars of iron\" - until, when he had leveled [them] between the two mountain walls, he said, \"Blow [with bellows],\" until when he had made it [like] fire, he said, \"Bring me, that I may pour over it molten copper.\"","So they [i.e., Gog and Magog] were unable to pass over it, nor were they able [to effect] in it any penetration.","[Dhul-Qarnayn] said, \"This is a mercy from my Lord; but when the promise of my Lord comes [i.e., approaches], He will make it level, and ever is the promise of my Lord true.\"","And We will leave them that day surging over each other, and [then] the Horn will be blown, and We will assemble them in [one] assembly.","And We will present Hell that Day to the disbelievers, on display -","Those whose eyes had been within a cover [removed] from My remembrance, and they were not able to hear.","Then do those who disbelieve think that they can take My servants instead of Me as allies? Indeed, We have prepared Hell for the disbelievers as a lodging.","Say, [O Muḥammad], \"Shall we [believers] inform you of the greatest losers as to [their] deeds?","[They are] those whose effort is lost in worldly life, while they think that they are doing well in work.\"","Those are the ones who disbelieve in the verses of their Lord and in [their] meeting Him, so their deeds have become worthless; and We will not assign to them on the Day of Resurrection any weight [i.e., importance].","That is their recompense - Hell - for what they denied and [because] they took My signs and My messengers in ridicule.","Indeed, those who have believed and done righteous deeds - they will have the Gardens of Paradise as a lodging,","Wherein they abide eternally. They will not desire from it any transfer.","Say, \"If the sea were ink for [writing] the words of my Lord, the sea would be exhausted before the words of my Lord were exhausted, even if We brought the like of it in [continual] supplement.\"","Say, \"I am only a man like you, to whom has been revealed that your god is one God. So whoever would hope for the meeting with his Lord - let him do righteous work and not associate in the worship of his Lord anyone.\""],"ru":["Хвала Аллаху, Который ниспослал Своему рабу Писание и не сделал в нём никакой кривизны,","[а сделал его] прямым, чтобы предостеречь о суровой каре от Него и обрадовать верующих, которые совершают праведные деяния, тем, что для них — прекрасная награда,","в которой они пребудут вечно,","и чтобы предостеречь тех, которые сказали: «Аллах взял Себе дитя».","Нет у них об этом никакого знания, ни у их отцов. Велики слова, выходящие из их уст: они говорят не иначе как ложь.","Быть может, ты погубишь себя от скорби по их следам, если они не уверуют в это повествование?","Воистину, Мы сделали всё, что на земле, украшением для неё, чтобы испытать их — кто из них лучше по деяниям.","И, воистину, Мы непременно превратим всё, что на ней, в бесплодную равнину.","Или же ты считал, что обитатели пещеры и ар-Ракима[47] были чудом среди Наших знамений?","Вот юноши укрылись в пещере и сказали: «Господь наш! Даруй нам от Себя милость и устрой нам в нашем деле верный путь».","И тогда Мы наложили покров на их уши в пещере на долгие годы.","Затем Мы пробудили их, чтобы узнать, какая из двух групп точнее подсчитает срок их пребывания.","Мы рассказываем тебе их весть с истиной. Воистину, они — юноши, которые уверовали в своего Господа, и Мы приумножили им руководство.","И Мы укрепили их сердца, когда они встали и сказали: «Господь наш — Господь небес и земли! Мы не призовём помимо Него никакого бога: ведь тогда мы сказали бы нечто чрезмерное»","«Этот наш народ взял себе [иных] богов вместо Него. Почему бы им не привести в их пользу ясного довода? Так кто же несправедливее того, кто возвёл на Аллаха ложь?»","«И когда вы отстранились от них и от того, чему они поклоняются, кроме Аллаха, то укройтесь в пещере: ваш Господь прострёт для вас Свою милость и устроит для вас в вашем деле облегчение».","Ты увидел бы, как солнце, когда оно восходит, уклоняется от их пещеры к правой стороне, а когда заходит — минуя их, отклоняется к левой стороне, а они находятся в её просторной части. Это — из знамений Аллаха. Кого Аллах наставит, тот ведом прямым путём; а кого Он введёт в заблуждение — тому ты не найдёшь ни покровителя, ни наставника.","Ты счёл бы их бодрствующими, а они — спящие. И Мы переворачиваем их то на правый бок, то на левый, а их собака лежит у входа, вытянув лапы. Если бы ты взглянул на них, ты непременно обратился бы в бегство и преисполнился бы из-за них ужасом.","И так Мы пробудили их, чтобы они расспрашивали друг друга. Один из них сказал: «Сколько вы пробыли?» Они сказали: «Мы пробыли день или часть дня». Они сказали: «Ваш Господь лучше знает, сколько вы пробыли. Пошлите одного из вас с этой вашей серебряной монетой в город; пусть посмотрит, у кого еда чище, и пусть принесёт вам из неё пропитание; и пусть будет осторожен и не даст никому узнать о вас.","Воистину, если они обнаружат вас, то забросают вас камнями или вернут вас в своё вероучение, и тогда вы никогда не преуспеете».","Так Мы дали [людям] обнаружить их, чтобы они узнали, что обещание Аллаха — истина и что в Часе нет сомнения, — когда они спорили между собой о своём деле. И они сказали: «Возведите над ними строение. Их Господь лучше знает о них». Те же, которые одержали верх в их деле, сказали: «Мы непременно устроим над ними место поклонения».","Одни скажут: «Трое, а четвёртый у них — их пёс», и скажут [другие]: «Пятеро, а шестой у них — их пёс», строя догадки о сокровенном. Иные скажут: «Семеро, а восьмой у них — их пёс». Скажи: «Мой Господь лучше знает их число; не знает его никто, кроме немногих». Так не спорь о них иначе как на основе явного [знания] и не спрашивай о них ни у кого из них.","И никогда не говори о чём бы то ни было: «Я сделаю это завтра»,","[не добавив] «Если только Аллах не пожелает». И поминай своего Господа, когда забудешь, и говори: «Быть может, мой Господь наставит меня к тому, что ближе к правому пути, чем это».","Они пробыли в своей пещере триста лет, прибавив к ним девять.","Скажи: «Аллах лучше знает, сколько они пробыли. Ему принадлежит сокровенное небес и земли. Сколь же прекрасно Он видит и слышит! Нет у них покровителя помимо Него, и никого не приобщает Он к Своему решению.","И читай то, что ниспослано тебе откровением из Писания твоего Господа. Никто не изменит Его слов, и ты ни за что не найдёшь помимо Него прибежища.","И терпеливо держись с теми, которые взывают к своему Господу утром и вечером, стремясь к Его Лику. И не отводи своих глаз от них, желая украшений мирской жизни. И не повинуйся тому, чьё сердце Мы сделали беспечным к Нашему поминанию, кто последовал собственной прихоти и чьё дело пришло в расстройство.","И скажи: «Истина — от вашего Господа. Кто хочет, пусть верует, а кто хочет, пусть отвергнет веру». Воистину, Мы приготовили для несправедливых адский огонь, стены которого окружат их. А если они взмолятся о помощи, их напоят водой, подобной расплавленному металлу, которая обжигает лица. Скверно питьё, и скверно их пристанище!","Воистину, те, которые уверовали и совершали праведные деяния, —Мы не дадим пропасть награде тех, кто поступает добродетельно.","Такие, для них — сады Вечного Пребывания, внизу которых текут реки. Там их украсят браслетами из золота, и они облачатся в зелёные одежды из атласа и парчи, возлежа там на ложах. Прекрасна награда, и прекрасно их пристанище!","И приведи им притчу о двух мужчинах: одному из них Мы устроили два сада из виноградников, окружили их пальмами и устроили между ними посевы.","Оба сада принесли свои плоды, не убавив из них ничего. И Мы пустили между ними реку.","И были у него плоды, и сказал он своему товарищу, беседуя с ним: «Я богаче тебя и сильнее числом людей».","И он вошёл в свой сад, будучи несправедливым к самому себе, и сказал: «Не думаю, что он когда-нибудь исчезнет.","И я не думаю, что Час наступит. А если я буду возвращён к своему Господу, то непременно найду лучшее, чем это, по исходу».","Его товарищ сказал ему, беседуя с ним: «Неужели ты отверг Того, Кто сотворил тебя из праха, затем из капли, а затем сформировал тебя мужчиной?","Но я [говорю]: Он — Аллах, мой Господь, и я никого не приобщаю к своему Господу.","И почему бы тебе, когда ты вошёл в свой сад, не сказать: «Так пожелал Аллах; нет силы ни у кого, кроме как от Аллаха»? Если ты видишь, что у меня меньше богатства и детей,","то, может быть, мой Господь дарует мне лучшее, чем твой сад, и пошлёт на него кару с неба, и он станет скользкой равниной,","или его вода уйдёт вглубь земли, и ты никак не сможешь её отыскать».","И его плоды были охвачены [погибелью], и он стал заламывать руки, [сокрушаясь] о том, что израсходовал на него, когда тот лежал в руинах, обрушившись на свои опоры, и говорил: «О если бы я не придавал своему Господу в сотоварищи никого!»","И не было у него никого, кто помог бы ему помимо Аллаха, и он не мог помочь себе.","Там власть принадлежит Аллаху, Истинному; Он — лучший в награде и лучший в исходе.","И приведи им притчу о мирской жизни: она подобна воде, которую Мы ниспослали с неба; и с нею смешалась растительность земли, а затем стала сухим сором, который развеивают ветры. Аллах всегда был [и пребудет] всевластным над всем сущим.","Богатство и сыновья — украшение мирской жизни, а нетленные праведные деяния — лучше у твоего Господа по награде и лучше по надежде.","В тот День Мы приведём в движение горы, и ты увидишь землю обнажённой; и Мы соберём их, не оставив из них никого.","И они предстанут пред твоим Господом рядами: «Действительно, вы пришли к Нам такими, какими Мы сотворили вас в первый раз. Нет, напротив, вы утверждали, что Мы не назначим вам срока».","И будет положена Книга, и ты увидишь преступных в страхе от того, что в ней; и они скажут: «Горе нам! Что это за Книга: она не оставляет ни малого, ни великого, не перечислив его». И они найдут то, что совершили, представленным; и твой Господь ни с кем не поступает несправедливо.","И вот Мы сказали ангелам: «Падите ниц пред Адамом!» — и они пали ниц, кроме Иблиса: он был из джиннов и вышел из повиновения повелению своего Господа. Неужели вы возьмёте его и его потомство покровителями помимо Меня, а они — враги вам? Скверная замена для несправедливых!","Я не делал их свидетелями сотворения небес и земли и не [делал их свидетелями] сотворения их самих; и Я не стану брать сбивающих с пути в помощники.","В тот День Он скажет: «Позовите Моих сотоварищей, о которых вы утверждали!» — и они позовут их, но те не откликнутся им; и Мы сделали между ними пропасть погибели.","И преступные увидели адский огонь и осознали, что они неминуемо низвергнутся в него, и не нашли от него никакого исхода.","Действительно, Мы разъяснили людям в этом Коране всякого рода примеры, но человек более всего склонен к спорам.","И ничто не удержало людей от того, чтобы уверовать, когда к ним пришло верное руководство, и просить прощения у своего Господа, кроме того, что их должна постигнуть участь прежних народов или наказание явится к ним лицом к лицу.","Мы не посылаем посланцев иначе как благовествующими и предостерегающими. Те же, которые отвергли веру, ведут споры, опираясь на ложное, чтобы этим опровергнуть истину; и они обратили Мои знамения и то, о чём были предостережены, в предмет насмешек.","Кто же несправедливее того, кому напомнили о знамениях его Господа, а он отвернулся от них и забыл то, что уготовили его руки? Воистину, Мы наложили на их сердца покровы, чтобы они не понимали его, а в их ушах — глухота. И если ты призовёшь их к верному руководству, они никогда не последуют этим путём.","Твой Господь — Прощающий, Обладатель милости. Если бы Он взыскивал с них за то, что они приобрели, Он ускорил бы для них наказание. Нет, напротив, у них есть назначенный срок, и они не найдут помимо него убежища.","И те селения — Мы погубили их, когда они поступили несправедливо, и Мы установили для их гибели назначенный срок.","Вот Муса сказал своему юноше: «Я не остановлюсь, пока не достигну слияния двух морей, или же буду идти долгие годы».","И когда они достигли места их слияния, они забыли свою рыбину, и она проложила свой путь в море, словно по проходу. .","Когда же они прошли дальше, он сказал своему юноше: «Принеси нам наш обед, воистину, мы уже ощутили усталость от нашего пути».","Он сказал: «Видишь ли, когда мы укрылись у скалы, — я забыл рыбу, и заставил меня забыть упомянуть о ней не иначе как шайтан; и она избрала себе путь в море — удивительным образом».","Он сказал: «Это то, что мы искали!» И они вернулись назад по своим следам.","Там они нашли раба из числа Наших рабов, которому Мы даровали милость от Нас и которого обучили знанию от Себя.","Муса сказал ему: «Могу ли я последовать за тобой, чтобы ты научил меня тому из верного знания, которому ты обучен?»","Он сказал: «Воистину, ты не сможешь сохранять со мной терпение.","Да и как ты стерпишь то, чего не объемлешь знанием?»","Он сказал: «Ты найдёшь меня, если пожелает Аллах, терпеливым, и я не ослушаюсь твоего повеления».","Он сказал: «Если ты последуешь за мной, то не спрашивай меня ни о чём, пока я не упомяну тебе об этом».","Они отправились в путь, а когда они взошли на корабль, он сделал в нём пробоину. [Муса] воскликнул: «Неужели ты сделал в нём пробоину, чтобы потопить тех, кто на нём? Действительно, ты совершил нечто страшное!»","Он сказал: «Разве я не говорил тебе, что ты не сможешь сохранять со мной терпение?»","Он сказал: «Не взыщи с меня за то, что я забыл, и не возлагай на меня в моём деле тяжкого бремени».","И они отправились, и когда они встретили мальчика, он убил его. [Муса] сказал: «Неужели ты убил чистую душу не за душу? Действительно, ты совершил нечто чудовищное!»","Он сказал: «Разве я не говорил тебе, что ты не сможешь сохранять со мной терпение?»","Он сказал: «Если я спрошу тебя о чём-либо после этого, то не держи меня своим спутником: у тебя уже есть от меня оправдание».","И они отправились в путь, пока не пришли к жителям селения и не попросили накормить их, но те отказались оказать им гостеприимство. И они нашли там стену, готовую обрушиться, и он выправил её. [Муса] сказал: «Если бы ты пожелал, то взял бы за это плату». \n.","Он сказал: «Это — разлука между мной и тобой. Я поведаю тебе толкование того, в чём ты не смог сохранять терпение.","Что касается корабля, то он принадлежал беднякам, которые трудились в море; и я захотел нанести ему изъян, ибо впереди их ожидал царь, силой отнимавший каждый корабль.","А что касается мальчика, то его родители были верующими, и мы побоялись, что он доведёт их до беззакония и неверия.","И мы пожелали, чтобы их Господь заменил им его тем, кто будет лучше его чистотой и ближе милосердием.","А что касается стены, то она принадлежала двум мальчикам-сиротам в городе; под ней был их клад, а отец их был праведным. Твой Господь пожелал, чтобы они достигли зрелости и извлекли свой клад — как милость от твоего Господа. Я не совершил этого по своему усмотрению. Таково толкование того, в чём ты не смог сохранять терпение».","Они спрашивают тебя о Зу-ль-Карнайне. Скажи: «Я прочту вам сказание о нём».","Воистину, Мы наделили его властью на земле и даровали ему путь ко всему.","И он последовал [одним] путём,","пока он не достиг места захода солнца и не увидел, что оно заходит в илистый источник, и не нашёл возле него людей. Мы сказали: «О Зу-ль-Карнайн! Либо подвергни [их] наказанию, либо поступи с ними по-доброму».","Он сказал: «Что касается того, кто поступал несправедливо, то мы подвергнем его наказанию; затем он будет возвращён к своему Господу, и Он подвергнет его страшному наказанию.","А что касается того, кто уверовал и совершал праведное, то наилучшее будет ему воздаянием, и мы скажем ему из нашего повеления то, что легко».","Затем он последовал [другим] путём,","пока он не достиг места восхода солнца и не увидел, что оно восходит над народом, для которого Мы не сделали никакой завесы от него.","Так это было! И Мы уже охватили знанием всё, что у него.","Затем он последовал [ещё одним] путём,","пока не достиг места между двумя преградами и обнаружил перед ними народ, который едва понимал речь.","Они сказали: «О Зу-ль-Карнайн! Воистину, йа’джудж и ма’джудж творят беззаконие на земле. Можем ли мы назначить тебе плату за то, чтобы ты сделал между нами и ними преграду?»","Он сказал: «То, чем наделил меня мой Господь, лучше. Помогите же мне силой, и я воздвигну между вами и ними преграду.","Несите мне куски железа». Когда же он сравнял между двумя склонами, то сказал: «Раздувайте!» А когда он раскалил его, то сказал: «Принесите мне — я вылью на него расплавленную медь».","И они не смогли взобраться на неё и не смогли проделать в ней дыру.","Он сказал: «Это — милость от моего Господа. А когда придёт обещание моего Господа, Он обратит её в прах. И обещание моего Господа истинно».","В тот день Мы оставим их смешиваться друг с другом, словно волны. И будет протрублено в Рог, и Мы соберём их всех вместе.","И в тот день Мы представим Геенну отвергшим веру явственно —","тем, чьи глаза были под покровом от Моего напоминания и которые не могли слушать.","Неужели те, которые отвергли веру, полагали, что [смогут] взять Моих рабов покровителями помимо Меня? Воистину, Мы приготовили Геенну для отвергших веру — как уготованное им.","Скажи: «Поведать ли вам о тех, кто понёс наибольший убыток в своих деяниях?","О тех, чьи усилия пропали в мирской жизни, а они полагают, что поступают хорошо».","Такие — те, которые отвергли знамения своего Господа и встречу с Ним; и тщетными стали их деяния, и Мы не установим для них в День воскресения никакого веса.","Таково их воздаяние — Геенна — за то, что они отвергли веру и обратили Мои знамения и Моих посланников в предмет насмешек.","Воистину, те, которые уверовали и совершали праведные деяния, — для них будут сады Фирдауса как уготованное им,","где они пребудут вечно, не желая уходить оттуда.","Скажи: «Если бы море было чернилами для слов моего Господа, то море иссякло бы прежде, чем иссякнут слова моего Господа, даже если бы Мы принесли в помощь столько же».","Скажи: «Воистину, я — лишь человек, подобный вам; мне внушается, что ваш Бог — Бог единственный. Так пусть же тот, кто надеется на встречу со своим Господом, совершает праведное и не придаёт никого в сотоварищи в поклонении своему Господу»."]},"36":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ يس","وَالْقُرْآنِ الْحَكِيمِ","إِنَّكَ لَمِنَ الْمُرْسَلِينَ","عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ","تَنزِيلَ الْعَزِيزِ الرَّحِيمِ","لِتُنذِرَ قَوْمًا مَّا أُنذِرَ آبَاؤُهُمْ فَهُمْ غَافِلُونَ","لَقَدْ حَقَّ الْقَوْلُ عَلَىٰ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ","إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلَالًا فَهِيَ إِلَى الْأَذْقَانِ فَهُم مُّقْمَحُونَ","وَجَعَلْنَا مِن بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لَا يُبْصِرُونَ","وَسَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ","إِنَّمَا تُنذِرُ مَنِ اتَّبَعَ الذِّكْرَ وَخَشِيَ الرَّحْمَٰنَ بِالْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وَأَجْرٍ كَرِيمٍ","إِنَّا نَحْنُ نُحْيِي الْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ فِي إِمَامٍ مُّبِينٍ","وَاضْرِبْ لَهُم مَّثَلًا أَصْحَابَ الْقَرْيَةِ إِذْ جَاءَهَا الْمُرْسَلُونَ","إِذْ أَرْسَلْنَا إِلَيْهِمُ اثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍ فَقَالُوا إِنَّا إِلَيْكُم مُّرْسَلُونَ","قَالُوا مَا أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا وَمَا أَنزَلَ الرَّحْمَٰنُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ","قَالُوا رَبُّنَا يَعْلَمُ إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ","وَمَا عَلَيْنَا إِلَّا الْبَلَاغُ الْمُبِينُ","قَالُوا إِنَّا تَطَيَّرْنَا بِكُمْ لَئِن لَّمْ تَنتَهُوا لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌ","قَالُوا طَائِرُكُم مَّعَكُمْ أَئِن ذُكِّرْتُم بَلْ أَنتُمْ قَوْمٌ مُّسْرِفُونَ","وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ قَالَ يَا قَوْمِ اتَّبِعُوا الْمُرْسَلِينَ","اتَّبِعُوا مَن لَّا يَسْأَلُكُمْ أَجْرًا وَهُم مُّهْتَدُونَ","وَمَا لِيَ لَا أَعْبُدُ الَّذِي فَطَرَنِي وَإِلَيْهِ تُرْجَعُونَ","أَأَتَّخِذُ مِن دُونِهِ آلِهَةً إِن يُرِدْنِ الرَّحْمَٰنُ بِضُرٍّ لَّا تُغْنِ عَنِّي شَفَاعَتُهُمْ شَيْئًا وَلَا يُنقِذُونِ","إِنِّي إِذًا لَّفِي ضَلَالٍ مُّبِينٍ","إِنِّي آمَنتُ بِرَبِّكُمْ فَاسْمَعُونِ","قِيلَ ادْخُلِ الْجَنَّةَ قَالَ يَا لَيْتَ قَوْمِي يَعْلَمُونَ","بِمَا غَفَرَ لِي رَبِّي وَجَعَلَنِي مِنَ الْمُكْرَمِينَ","وَمَا أَنزَلْنَا عَلَىٰ قَوْمِهِ مِن بَعْدِهِ مِن جُندٍ مِّنَ السَّمَاءِ وَمَا كُنَّا مُنزِلِينَ","إِن كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ خَامِدُونَ","يَا حَسْرَةً عَلَى الْعِبَادِ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ","أَلَمْ يَرَوْا كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ الْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ","وَإِن كُلٌّ لَّمَّا جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ","وَآيَةٌ لَّهُمُ الْأَرْضُ الْمَيْتَةُ أَحْيَيْنَاهَا وَأَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُونَ","وَجَعَلْنَا فِيهَا جَنَّاتٍ مِّن نَّخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا مِنَ الْعُيُونِ","لِيَأْكُلُوا مِن ثَمَرِهِ وَمَا عَمِلَتْهُ أَيْدِيهِمْ أَفَلَا يَشْكُرُونَ","سُبْحَانَ الَّذِي خَلَقَ الْأَزْوَاجَ كُلَّهَا مِمَّا تُنبِتُ الْأَرْضُ وَمِنْ أَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ","وَآيَةٌ لَّهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُم مُّظْلِمُونَ","وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَا ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ","وَالْقَمَرَ قَدَّرْنَاهُ مَنَازِلَ حَتَّىٰ عَادَ كَالْعُرْجُونِ الْقَدِيمِ","لَا الشَّمْسُ يَنبَغِي لَهَا أَن تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سَابِقُ النَّهَارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ","وَآيَةٌ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِي الْفُلْكِ الْمَشْحُونِ","وَخَلَقْنَا لَهُم مِّن مِّثْلِهِ مَا يَرْكَبُونَ","وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ","إِلَّا رَحْمَةً مِّنَّا وَمَتَاعًا إِلَىٰ حِينٍ","وَإِذَا قِيلَ لَهُمُ اتَّقُوا مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ","وَمَا تَأْتِيهِم مِّنْ آيَةٍ مِّنْ آيَاتِ رَبِّهِمْ إِلَّا كَانُوا عَنْهَا مُعْرِضِينَ","وَإِذَا قِيلَ لَهُمْ أَنفِقُوا مِمَّا رَزَقَكُمُ اللَّهُ قَالَ الَّذِينَ كَفَرُوا لِلَّذِينَ آمَنُوا أَنُطْعِمُ مَن لَّوْ يَشَاءُ اللَّهُ أَطْعَمَهُ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ مُّبِينٍ","وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ","مَا يَنظُرُونَ إِلَّا صَيْحَةً وَاحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ","فَلَا يَسْتَطِيعُونَ تَوْصِيَةً وَلَا إِلَىٰ أَهْلِهِمْ يَرْجِعُونَ","وَنُفِخَ فِي الصُّورِ فَإِذَا هُم مِّنَ الْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ","قَالُوا يَا وَيْلَنَا مَن بَعَثَنَا مِن مَّرْقَدِنَا هَٰذَا مَا وَعَدَ الرَّحْمَٰنُ وَصَدَقَ الْمُرْسَلُونَ","إِن كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ","فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْئًا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ","إِنَّ أَصْحَابَ الْجَنَّةِ الْيَوْمَ فِي شُغُلٍ فَاكِهُونَ","هُمْ وَأَزْوَاجُهُمْ فِي ظِلَالٍ عَلَى الْأَرَائِكِ مُتَّكِئُونَ","لَهُمْ فِيهَا فَاكِهَةٌ وَلَهُم مَّا يَدَّعُونَ","سَلَامٌ قَوْلًا مِّن رَّبٍّ رَّحِيمٍ","وَامْتَازُوا الْيَوْمَ أَيُّهَا الْمُجْرِمُونَ","أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي آدَمَ أَن لَّا تَعْبُدُوا الشَّيْطَانَ إِنَّهُ لَكُمْ عَدُوٌّ مُّبِينٌ","وَأَنِ اعْبُدُونِي هَٰذَا صِرَاطٌ مُّسْتَقِيمٌ","وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّا كَثِيرًا أَفَلَمْ تَكُونُوا تَعْقِلُونَ","هَٰذِهِ جَهَنَّمُ الَّتِي كُنتُمْ تُوعَدُونَ","اصْلَوْهَا الْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ","الْيَوْمَ نَخْتِمُ عَلَىٰ أَفْوَاهِهِمْ وَتُكَلِّمُنَا أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا يَكْسِبُونَ","وَلَوْ نَشَاءُ لَطَمَسْنَا عَلَىٰ أَعْيُنِهِمْ فَاسْتَبَقُوا الصِّرَاطَ فَأَنَّىٰ يُبْصِرُونَ","وَلَوْ نَشَاءُ لَمَسَخْنَاهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا اسْتَطَاعُوا مُضِيًّا وَلَا يَرْجِعُونَ","وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِي الْخَلْقِ أَفَلَا يَعْقِلُونَ","وَمَا عَلَّمْنَاهُ الشِّعْرَ وَمَا يَنبَغِي لَهُ إِنْ هُوَ إِلَّا ذِكْرٌ وَقُرْآنٌ مُّبِينٌ","لِّيُنذِرَ مَن كَانَ حَيًّا وَيَحِقَّ الْقَوْلُ عَلَى الْكَافِرِينَ","أَوَلَمْ يَرَوْا أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَا أَنْعَامًا فَهُمْ لَهَا مَالِكُونَ","وَذَلَّلْنَاهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ","وَلَهُمْ فِيهَا مَنَافِعُ وَمَشَارِبُ أَفَلَا يَشْكُرُونَ","وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً لَّعَلَّهُمْ يُنصَرُونَ","لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌ مُّحْضَرُونَ","فَلَا يَحْزُنكَ قَوْلُهُمْ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ","أَوَلَمْ يَرَ الْإِنسَانُ أَنَّا خَلَقْنَاهُ مِن نُّطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُّبِينٌ","وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ","قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ","الَّذِي جَعَلَ لَكُم مِّنَ الشَّجَرِ الْأَخْضَرِ نَارًا فَإِذَا أَنتُم مِّنْهُ تُوقِدُونَ","أَوَلَيْسَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِقَادِرٍ عَلَىٰ أَن يَخْلُقَ مِثْلَهُم بَلَىٰ وَهُوَ الْخَلَّاقُ الْعَلِيمُ","إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ","فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ"],"en":["Yā, Seen.","By the wise Qur’ān,","Indeed you, [O Muḥammad], are from among the messengers,","On a straight path.","[This is] a revelation of the Exalted in Might, the Merciful,","That you may warn a people whose forefathers were not warned, so they are unaware.","Already the word [i.e., decree] has come into effect upon most of them, so they do not believe.","Indeed, We have put shackles on their necks, and they are to their chins, so they are with heads [kept] aloft.","And We have put before them a barrier and behind them a barrier and covered them, so they do not see.","And it is all the same for them whether you warn them or do not warn them - they will not believe.","You can only warn one who follows the message and fears the Most Merciful unseen. So give him good tidings of forgiveness and noble reward.","Indeed, it is We who bring the dead to life and record what they have put forth and what they left behind, and all things We have enumerated in a clear register.","And present to them an example: the people of the city, when the messengers came to it -","When We sent to them two but they denied them, so We strengthened [them] with a third, and they said, \"Indeed, we are messengers to you.\"","They said, \"You are not but human beings like us, and the Most Merciful has not revealed a thing. You are only telling lies.\"","They said, \"Our Lord knows that we are messengers to you,","And we are not responsible except for clear notification.\"","They said, \"Indeed, we consider you a bad omen. If you do not desist, we will surely stone you, and there will surely touch you, from us, a painful punishment.\"","They said, \"Your omen [i.e., fate] is with yourselves. Is it because you were reminded? Rather, you are a transgressing people.\"","And there came from the farthest end of the city a man, running. He said, \"O my people, follow the messengers.","Follow those who do not ask of you [any] payment, and they are [rightly] guided.","And why should I not worship He who created me and to whom you will be returned?","Should I take other than Him [false] deities [while], if the Most Merciful intends for me some adversity, their intercession will not avail me at all, nor can they save me?","Indeed, I would then be in manifest error.","Indeed, I have believed in your Lord, so listen to me.\"","It was said, \"Enter Paradise.\" He said, \"I wish my people could know","Of how my Lord has forgiven me and placed me among the honored.\"","And We did not send down upon his people after him any soldiers from the heaven, nor would We have done so.","It was not but one shout, and immediately they were extinguished.","How regretful for the servants. There did not come to them any messenger except that they used to ridicule him.","Have they not considered how many generations We destroyed before them - that they to them will not return?","And indeed, all of them will yet be brought present before Us.","And a sign for them is the dead earth. We have brought it to life and brought forth from it grain, and from it they eat.","And We placed therein gardens of palm trees and grapevines and caused to burst forth therefrom some springs -","That they may eat of His fruit. And their hands have not produced it, so will they not be grateful?","Exalted is He who created all pairs - from what the earth grows and from themselves and from that which they do not know.","And a sign for them is the night. We remove from it the [light of] day, so they are [left] in darkness.","And the sun runs [on course] toward its stopping point. That is the determination of the Exalted in Might, the Knowing.","And the moon - We have determined for it phases, until it returns [appearing] like the old date stalk.","It is not allowable [i.e., possible] for the sun to reach the moon, nor does the night overtake the day, but each, in an orbit, is swimming.","And a sign for them is that We carried their forefathers in a laden ship.","And We created for them from the likes of it that which they ride.","And if We should will, We could drown them; then no one responding to a cry would there be for them, nor would they be saved","Except as a mercy from Us and provision for a time.","But when it is said to them, \"Beware of what is before you and what is behind you; perhaps you will receive mercy...\"","And no sign comes to them from the signs of their Lord except that they are from it turning away.","And when it is said to them, \"Spend from that which Allāh has provided for you,\" those who disbelieve say to those who believe, \"Should we feed one whom, if Allāh had willed, He would have fed? You are not but in clear error.\"","And they say, \"When is this promise, if you should be truthful?\"","They do not await except one blast which will seize them while they are disputing.","And they will not be able [to give] any instruction, nor to their people can they return.","And the Horn will be blown; and at once from the graves to their Lord they will hasten.","They will say, \"O woe to us! Who has raised us up from our sleeping place?\" [The reply will be], \"This is what the Most Merciful had promised, and the messengers told the truth.\"","It will not be but one blast, and at once they are all brought present before Us.","So today [i.e., the Day of Judgement] no soul will be wronged at all, and you will not be recompensed except for what you used to do.","Indeed the companions of Paradise, that Day, will be amused in [joyful] occupation -","They and their spouses - in shade, reclining on adorned couches.","For them therein is fruit, and for them is whatever they request [or wish]","[And] \"Peace,\" a word from a Merciful Lord.","[Then He will say], \"But stand apart today, you criminals.","Did I not enjoin upon you, O children of Adam, that you not worship Satan - [for] indeed, he is to you a clear enemy -","And that you worship [only] Me? This is a straight path.","And he had already led astray from among you much of creation, so did you not use reason?","This is the Hellfire which you were promised.","[Enter to] burn therein today for what you used to deny.\"","That Day, We will seal over their mouths, and their hands will speak to Us, and their feet will testify about what they used to earn.","And if We willed, We could have obliterated their eyes, and they would race to [find] the path, and how could they see?","And if We willed, We could have deformed them, [paralyzing them] in their places so they would not be able to proceed, nor could they return.","And he to whom We grant long life We reverse in creation; so will they not understand?","And We did not give him [i.e., Prophet Muḥammad (ﷺ)] knowledge of poetry, nor is it befitting for him. It is not but a message and a clear Qur’ān","To warn whoever is alive and justify the word [i.e., decree] against the disbelievers.","Do they not see that We have created for them from what Our hands have made, grazing livestock, and [then] they are their owners?","And We have tamed them for them, so some of them they ride, and some of them they eat.","And for them therein are [other] benefits and drinks, so will they not be grateful?","But they have taken besides Allāh [false] deities that perhaps they would be helped.","They are not able to help them, and they [themselves] are for them soldiers in attendance.","So let not their speech grieve you. Indeed, We know what they conceal and what they declare.","Does man not consider that We created him from a [mere] sperm-drop - then at once he is a clear adversary?","And he presents for Us an example and forgets his [own] creation. He says, \"Who will give life to bones while they are disintegrated?\"","Say, \"He will give them life who produced them the first time; and He is, of all creation, Knowing.\"","[It is] He who made for you from the green tree, fire, and then from it you ignite.","Is not He who created the heavens and the earth Able to create the likes of them? Yes, [it is so]; and He is the Knowing Creator.","His command is only when He intends a thing that He says to it, \"Be,\" and it is.","So exalted is He in whose hand is the realm of all things, and to Him you will be returned."],"ru":["Йа. Син.","Клянусь мудрым Кораном.","Воистину, ты — из числа посланников,","на прямом пути,","[Это] ниспослание от Могущественного, Милующего,","чтобы ты предостерёг народ, отцы которого не были предостережены, и потому они пребывают в беспечности.","Действительно, сбылось Слово над большинством из них, и потому они не веруют.","Воистину, Мы наложили на их шеи оковы, доходящие до подбородков, так что их головы запрокинуты.","И Мы воздвигли перед ними преграду и позади них преграду, и накрыли их, так что они не видят.","Всё равно им: предостерёг ли ты их или не предостерёг, — они не веруют.","Воистину, ты предостерегаешь лишь того, кто последовал Напоминанию и устрашился Всемилостивого втайне. Так обрадуй же его прощением и щедрой наградой.","Воистину, Мы оживляем мёртвых и записываем то, что они совершили прежде, и их следы. И всё Мы подсчитали в ясном Писании.","Приведи им в пример жителей селения, когда к ним явились посланцы.","Вот Мы послали к ним двоих, но они сочли их лжецами, и Мы подкрепили их третьим. И те сказали: «Воистину, мы посланы к вам».","Они сказали: «Вы — лишь люди, подобные нам, а Всемилостивый ничего не ниспослал. Вы лишь лжёте!»","Они сказали: «Наш Господь знает, что мы, воистину, посланы к вам.","И на нас — лишь ясное доведение».","Они сказали: «Воистину, мы видим в вас дурное предзнаменование. Если вы не прекратите, мы непременно побьём вас камнями, и вас непременно постигнет от нас мучительное наказание!»","Они сказали: «Ваше дурное предзнаменование — с вами самими. Неужели [вы так говорите] потому, что вас увещевают? Нет, напротив, вы — народ, преступающий всякую меру!»","И с окраины города пришёл человек, спеша, и сказал: «О народ мой! Последуйте за посланцами.","Последуйте за теми, кто не просит у вас награды и сами следуют верным путём.","И почему мне не поклоняться Тому, Кто сотворил меня, и к Кому вы будете возвращены?","Неужели я возьму себе божеств помимо Него? Если Всемилостивый пожелает мне вреда, то их заступничество ничем мне не поможет, и они не спасут меня.","Воистину, тогда я окажусь в явном заблуждении.","Воистину, я уверовал в вашего Господа, послушайте же меня!»","Было сказано [уверовавшему]: «Войди в Рай!» Он сказал: «О, если бы мой народ только знал,","о том, что мой Господь простил меня и сделал меня одним из почтённых!»","И Мы не ниспослали на его народ после него никакого войска с небес, и не таковы Мы, чтобы ниспосылать.","Это был всего лишь один-единственный Глас, и вот — они безжизненны.","О горе рабам! Не приходил к ним ни один посланник, без того чтобы они над ним не насмехались.","Разве они не видели, сколько поколений Мы погубили до них и что они уже не вернутся к ним?","И, воистину, все они вместе будут приведены к Нам.","Знамение для них — мёртвая земля: Мы оживили её и вывели из неё зёрна, и они ими питаются.","И Мы устроили на ней сады из пальм и виноградников и заставили течь в ней источники,","чтобы они ели из его плодов и из того, что сделали их руки. Неужели они не будут благодарны?","Пречист Тот, Кто сотворил все пары — из того, что взращивает земля, и из них самих, и из того, чего они не знают.","И знамение для них — ночь: Мы отделяем от неё день, и вот они оказываются во мраке.","И солнце движется к своему местопребыванию. Таково предустановление Могущественного, Знающего.","И луну — Мы установили для неё стоянки, пока она не станет подобна старой пальмовой ветви.","Ни солнцу не подобает догонять луну, ни ночь не опережает день. И каждый из них плывёт по своему небосводу.","И знамение для них — то, что Мы несли их потомков в наполненном ковчеге.","И Мы сотворили для них подобия этого, на чём они передвигаются.","А если Мы пожелаем — потопим их, и не будет для них никого, кто воззовёт на помощь, и не будут они спасены,","разве что по милости от Нас и для пользования [благами] до поры.","Когда им говорится: «Берегитесь того, что перед вами, и того, что позади вас — быть может, вы будете помилованы!» [— они отворачиваются].","И какое бы знамение из знамений их Господа ни приходило к ним, они непременно отворачивались от него.","А когда им говорится: «Расходуйте из того, чем наделил вас Аллах», те, которые отвергли веру, говорят тем, которые уверовали: «Неужели мы станем кормить того, кого Аллах, если бы пожелал, накормил [Сам]? Вы не иначе как в явном заблуждении!»","Они говорят: «Когда же это обещание, если вы говорите правду?»","Они не ожидают ничего, кроме одного-единственного Гласа, который поразит их, когда они будут препираться.","И они не смогут ни оставить завещание, ни вернуться к своей семье.","Будет затрублено в Рог, и вот — они устремляются потоком из могил к своему Господу.","Они скажут: «О горе нам! Кто поднял нас с нашего ложа?» — «Это то, что обещал Всемилостивый, и посланцы говорили правду!»","Это был всего лишь один-единственный Глас, и вот — все они предстанут перед Нами.","Сегодня ни с одной душой ни в чём не поступят несправедливо, и воздастся вам лишь за то, что вы совершали.","Воистину, обитатели Рая сегодня будут заняты, ликуя и блаженствуя.","Они и их супруги — в тени на ложах, облокотившись.","Для них там — плоды, и для них всё, чего они пожелают.","«Мир!» — слово от милующего Господа.","И [будет сказано]: «Отделитесь сегодня, о преступные!","Разве Я не заповедал вам, о сыны Адама, чтобы вы не поклонялись шайтану? Воистину, он — для вас явный враг!","И чтобы вы поклонялись Мне. Это и есть прямой путь».","Действительно, он ввёл в заблуждение множество из вас. Неужели вы не разумеете?","Это — Геенна, которая была вам обещана.","Войдите же в неё сегодня за то, что вы отвергали веру!»","Сегодня Мы запечатаем их уста, и заговорят с Нами их руки, и засвидетельствуют их ноги о том, что они приобретали.","А если бы Мы пожелали, то затмили бы их глаза, и они бросились бы наперегонки к пути, но откуда им видеть?","А если бы Мы пожелали, то превратили бы их на месте, и они не смогли бы ни идти вперёд, ни вернуться.","Кому Мы даруем долгую жизнь, того Мы поворачиваем вспять в творении. Неужели они не разумеют?","Мы не обучали его поэзии, и не подобает ему это. Это — не что иное, как напоминание и ясный Коран,","чтобы он предостерегал тех, кто жив, и чтобы сбылось Слово над отвергшими веру.","И разве они не видят, что Мы сотворили для них скот из того, что создали Наши руки, и они владеют им?","И Мы подчинили его им: на одних из них они ездят, а других едят.","И в нём для них — многие пользы и питьё. Неужели они не будут благодарны?","И они взяли себе божеств помимо Аллаха — быть может, те помогут им!","Они не способны помочь им, тогда как сами они для них — приведённое воинство.","Пусть же их речи не печалят тебя. Воистину, Мы знаем и то, что они утаивают, и то, что они являют открыто.","Неужели человек не видит, что Мы сотворили его из капли — и вот он уже явный спорщик?","И он привёл Нам притчу и позабыл о своём сотворении. Он говорит: «Кто оживит кости, когда они истлели?»","Скажи: «Оживит их Тот, Кто создал их в первый раз. Он — знающий о всяком творении,","Тот, Кто сотворил для вас из зелёного дерева огонь, и вот — вы от него возжигаете».","Неужели Тот, Кто сотворил небеса и землю, не способен сотворить подобных им? Отнюдь! Он — Многотворящий, Знающий!","Воистину, Его повеление, когда Он желает чего-либо, — лишь сказать ему: «Будь!» — и оно бывает.","И пречист в Тот, в Чьей длани владычество над всем сущим, и к Нему вы будете возвращены!"]},"55":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الرَّحْمَٰنُ","عَلَّمَ الْقُرْآنَ","خَلَقَ الْإِنسَانَ","عَلَّمَهُ الْبَيَانَ","الشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ","وَالنَّجْمُ وَالشَّجَرُ يَسْجُدَانِ","وَالسَّمَاءَ رَفَعَهَا وَوَضَعَ الْمِيزَانَ","أَلَّا تَطْغَوْا فِي الْمِيزَانِ","وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ","وَالْأَرْضَ وَضَعَهَا لِلْأَنَامِ","فِيهَا فَاكِهَةٌ وَالنَّخْلُ ذَاتُ الْأَكْمَامِ","وَالْحَبُّ ذُو الْعَصْفِ وَالرَّيْحَانُ","فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ","خَلَقَ الْإِنسَانَ مِن صَلْصَالٍ كَالْفَخَّارِ"
