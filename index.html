 إِنْ شَاءَ اللَّهُ بِكُمْ لاَحِقُونَ، وَيَرْحَمُ اللَّهُ الْمُسْتَقدِمِينَ مِنَّا وَالْمُسْتأْخِرِينَ أَسْاَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ.","en":"Peace be upon you, O inhabitants of these dwellings, from among the believers and the Muslims. We will join you, if Allah wills. May Allah have mercy on those of us who went before and those who come later. I ask Allah for well-being for us and for you.","ru":"Мир вам, обитатели этих жилищ, верующие и мусульмане! Мы, если пожелает Аллах, присоединимся к вам. Да помилует Аллах тех из нас, кто ушёл раньше, и тех, кто уйдёт позже. Прошу у Аллаха благополучия для нас и для вас.","n":1,"src":["muslim"],"note":{"en":"When visiting graves.","ru":"При посещении кладбища."},"t":{"en":"Visiting graves","ru":"Посещая кладбище","ar":"دعاء زيارة القبور"}},"h202":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا.","en":"O Allah, I ask You for its good and I seek refuge in You from its evil.","ru":"О Аллах, прошу Тебя о его благе и прибегаю к Тебе от его зла.","n":1,"src":["ad"],"note":{"en":"When the wind blows.","ru":"При сильном ветре."},"t":{"en":"Wind","ru":"Ветер","ar":"دعاء الريح"}},"h203":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا فِيهَا، وَخَيْرَ مَا أُرْسِلَتْ بِهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا فِيهَا، وَشَرِّ مَا أُرْسِلَتْ بِهِ.","en":"O Allah, I ask You for its good, the good within it and the good it was sent with, and I seek refuge in You from its evil, the evil within it and the evil it was sent with.","ru":"О Аллах, прошу Тебя о его благе, о благе того, что в нём, и благе того, с чем он послан, и прибегаю к Тебе от его зла, от зла того, что в нём, и зла того, с чем он послан.","n":1,"src":["muslim"],"t":{"en":"Wind","ru":"Ветер","ar":"دعاء الريح"}},"h204":{"ar":"سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلاَئِكةُ مِنْ خِيفَتِهِ.","en":"Glory be to the One whom the thunder glorifies with praise, and the angels out of awe of Him.","ru":"Пречист Тот, кого славит хвалой гром, и ангелы — из страха перед Ним.","n":1,"src":["malik"],"note":{"en":"When hearing thunder.","ru":"Услышав гром."},"t":{"en":"Thunder","ru":"Гром","ar":"دعاء الرعد"}},"h205":{"ar":"اللَّهُمَّ اسْقِنَا غَيْثاً مُغِيثاً مَرِيئاً مَرِيعاً، نَافِعاً غَيْرَ ضَارٍّ، عَاجِلاً غَيْرَ آجِلٍ.","en":"O Allah, give us rain that relieves, wholesome and fertile, beneficial and not harmful, soon and not delayed.","ru":"О Аллах, напои нас дождём спасительным, благотворным, обильным, полезным, а не вредным, скорым, а не поздним.","n":1,"src":["ad"],"note":{"en":"Asking for rain.","ru":"Мольба о дожде."},"t":{"en":"Asking for rain","ru":"Мольба о дожде","ar":"من أدعية الاستسقاء"}},"h206":{"ar":"اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا، اللَّهُمَّ أَغِثْنَا.","en":"O Allah, send us rain. O Allah, send us rain. O Allah, send us rain.","ru":"О Аллах, ниспошли нам дождь! О Аллах, ниспошли нам дождь! О Аллах, ниспошли нам дождь!","n":1,"src":["bm"],"t":{"en":"Asking for rain","ru":"Мольба о дожде","ar":"من أدعية الاستسقاء"}},"h207":{"ar":"اللَّهُمَّ اسْقِ عِبَادَكَ، وَبَهَائِمَكَ، وَانْشُرْ رَحْمَتَكَ، وَأَحْيِي بَلَدَكَ الْمَيِّتَ.","en":"O Allah, give water to Your servants and Your animals, spread Your mercy and revive Your dead land.","ru":"О Аллах, напои Своих рабов и Своих животных, распространи Свою милость и оживи Свою мёртвую землю.","n":1,"src":["ad"],"t":{"en":"Asking for rain","ru":"Мольба о дожде","ar":"من أدعية الاستسقاء"}},"h208":{"ar":"اللَّهُمَّ صَيِّباً نَافِعاً.","en":"O Allah, make it a beneficial rain.","ru":"О Аллах, пусть это будет полезный дождь.","n":1,"src":["bukhari"],"note":{"en":"When it rains.","ru":"Во время дождя."},"t":{"en":"When it rains","ru":"Во время дождя","ar":"الدعاء إذا نزل المطر"}},"h209":{"ar":"مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ.","en":"We have been given rain by the grace and mercy of Allah.","ru":"Нам ниспослан дождь по милости и благодати Аллаха.","n":1,"src":["bm"],"note":{"en":"After the rain.","ru":"После дождя."},"t":{"en":"After rain","ru":"После дождя","ar":"الذكر بعد نزول المطر"}},"h210":{"ar":"اللَّهُمَّ حَوَالَيْنَا وَلاَ عَلَيْنَا، اللَّهُمَّ عَلَى الآكَامِ وَالظِّرَابِ، وَبُطُونِ الْأَوْدِيَةِ، وَمَنَابِتِ الشَّجَرِ.","en":"O Allah, around us and not upon us. O Allah, upon the hills and mountains, the valleys and the places where trees grow.","ru":"О Аллах, вокруг нас, а не над нами! О Аллах, на холмы и возвышенности, в долины и туда, где растут деревья!","n":1,"src":["bm"],"note":{"en":"Asking for the rain to stop when it is too much.","ru":"Мольба о прекращении слишком сильного дождя."},"t":{"en":"Too much rain","ru":"Слишком сильный дождь","ar":"من أدعية الاستصحاء"}},"h211":{"ar":"اللَّهُ أَكْبَرُ، اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالْأَمْنِ وَالْإِيمَانِ، وَالسَّلاَمَةِ وَالْإِسْلاَمِ، وَالتَّوْفِيقِ لِمَا تُحِبُّ رَبَّنَا وَتَرْضَى، رَبُّنَا وَرَبُّكَ اللَّهُ.","en":"Allah is the Greatest. O Allah, let it rise over us with security and faith, with safety and Islam, and with success in what You love and are pleased with, our Lord. Our Lord and your Lord is Allah.","ru":"Аллах велик! О Аллах, пусть он взойдёт над нами с безопасностью и верой, со спокойствием и исламом, с успехом в том, что Ты любишь и чем доволен, Господь наш. Наш Господь и твой Господь — Аллах.","n":1,"src":["tir"],"note":{"en":"On seeing the new crescent moon.","ru":"Увидев новый месяц."},"t":{"en":"The new moon","ru":"Новый месяц","ar":"دعاء رؤية الهلال"}},"h212":{"ar":"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ العُرُوقُ، وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ.","en":"The thirst is gone, the veins are moistened, and the reward is confirmed, if Allah wills.","ru":"Ушла жажда, увлажнились жилы, и утвердилась награда, если пожелает Аллах.","n":1,"src":["ad"],"note":{"en":"When breaking the fast.","ru":"При разговении."},"t":{"en":"Breaking the fast","ru":"Ифтар","ar":"الدعاء عند إفطار الصائم"}},"h213":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ أَنْ تَغْفِرَ لِي.","en":"O Allah, I ask You by Your mercy which encompasses all things to forgive me.","ru":"О Аллах, прошу Тебя Твоей милостью, объемлющей всё сущее, прости меня.","n":1,"src":["ibm"],"note":{"en":"When breaking the fast.","ru":"При разговении."},"t":{"en":"Breaking the fast","ru":"Ифтар","ar":"الدعاء عند إفطار الصائم"}},"h214":{"ar":"إِذَا أَكَلَ أَحَدُكُمْ طَعَاماً فَلْيَقُلْ بِسْمِ اللَّهِ، فَإِنْ نَسِيَ فِي أَوَّلِهِ فَلْيَقُلْ بسمِ اللَّهِ فِي أَوَّلِهِ وَآخِرِهِ.","en":"When one of you eats, let him say: In the name of Allah. If he forgets at the beginning, let him say: In the name of Allah at its beginning and its end.","ru":"Когда кто-то из вас ест, пусть скажет: «С именем Аллаха». А если забудет в начале, пусть скажет: «С именем Аллаха в начале и в конце».","n":1,"src":["ad","tir"],"t":{"en":"Before eating","ru":"Перед едой","ar":"الدعاء قبل الطعام"}},"h215":{"ar":"مَنْ أَطْعَمَهُ اللَّهُ الطَّعَامَ فَلْيَقُلْ: اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَأَطْعِمْنَا خَيْراً مِنْهُ، وَمَنْ سَقَاهُ اللَّهُ لَبَناً فَلْيَقُلْ اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَزِدْنَا مِنْهُ.","en":"Whoever Allah feeds, let him say: O Allah, bless it for us and feed us with better than it. Whoever Allah gives milk to drink, let him say: O Allah, bless it for us and give us more of it.","ru":"Кого Аллах накормил, пусть скажет: «О Аллах, благослови нам это и накорми нас лучшим». А кого Аллах напоил молоком, пусть скажет: «О Аллах, благослови нам это и дай нам больше».","n":1,"src":["tir"],"t":{"en":"Before eating","ru":"Перед едой","ar":"الدعاء قبل الطعام"}},"h216":{"ar":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ، مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّةٍ.","en":"Praise be to Allah who fed me this and provided it for me without any might or power on my part.","ru":"Хвала Аллаху, который накормил меня этим и наделил меня этим без какой-либо силы и мощи с моей стороны.","n":1,"src":["ad","tir"],"note":{"en":"His past sins are forgiven.","ru":"Ему прощаются прошлые грехи."},"t":{"en":"After eating","ru":"После еды","ar":"الدعاء عند الفراغ من الطعام"}},"h217":{"ar":"الْحَمْدُ لِلَّهِ حَمْداً كَثِيراً طَيِّباً مُبَارَكاً فِيهِ، غَيْرَ مَكْفِيٍّ وَلاَ مُوَدَّعٍ، وَلاَ مُسْتَغْنَىً عَنْهُ رَبَّنَا.","en":"Praise be to Allah, abundant, good and blessed praise, praise that is never enough, never abandoned and never dispensed with, our Lord.","ru":"Хвала Аллаху, хвала обильная, благая и благословенная, хвала неисчерпаемая, которую не оставляют и без которой не обойтись, о Господь наш.","n":1,"src":["bukhari"],"t":{"en":"After eating","ru":"После еды","ar":"الدعاء عند الفراغ من الطعام"}},"h218":{"ar":"اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُم، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ.","en":"O Allah, bless them in what You have provided for them, forgive them and have mercy on them.","ru":"О Аллах, благослови их в том, чем Ты их наделил, прости их и помилуй.","n":1,"src":["muslim"],"note":{"en":"A guest’s supplication for the host.","ru":"Мольба гостя за хозяина."},"t":{"en":"Guest for the host","ru":"Гость — хозяину","ar":"دعاء الضيف لصاحب الطعام"}},"h219":{"ar":"اللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِي، وَاسْقِ مَنْ سَقَانِي.","en":"O Allah, feed whoever feeds me and give drink to whoever gives me drink.","ru":"О Аллах, накорми того, кто накормил меня, и напои того, кто напоил меня.","n":1,"src":["muslim"],"t":{"en":"For whoever feeds you","ru":"За того, кто накормил","ar":"التعريض بالدعاء لطلب الطعام أو الشراب"}},"h220":{"ar":"أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ، وَأَكَلَ طَعَامَكُمُ الْأَبْرَارُ، وَصَلَّتْ عَلَيْكُمُ الْمَلاَئِكَةُ.","en":"May fasting people break their fast with you, may the righteous eat your food, and may the angels pray for you.","ru":"Пусть разговляются у вас постящиеся, пусть едят вашу пищу праведники, и пусть ангелы молятся за вас.","n":1,"src":["ad"],"note":{"en":"When breaking the fast at someone’s home.","ru":"Разговляясь в чужом доме."},"t":{"en":"Iftar at someone’s home","ru":"Ифтар в гостях","ar":"الدعاء إذا أفطر عند أهل بيت"}},"h221":{"ar":"إِذَا دُعِيَ أَحَدُكُمْ فَلْيُجِبْ، فَإِنْ كَانَ صَائِماً فَلْيُصَلِّ، وَإِنْ كَانَ مُفْطِراً فَلْيَطْعَمْ، وَمَعْنَى فَلْيُصَلِّ أَيْ فَلْيَدْعُ.","en":"If one of you is invited, let him accept. If he is fasting, let him supplicate for them, and if he is not fasting, let him eat.","ru":"Если кого-то из вас пригласили, пусть примет приглашение. Если он постится — пусть помолится за хозяев, а если не постится — пусть поест.","n":1,"src":["muslim"],"t":{"en":"Invited while fasting","ru":"Приглашён во время поста","ar":"دعاء الصائم إذا حضر الطعام ولم يفطر"}},"h222":{"ar":"إِنِّي صَائِمٌ، إِنِّي صَائِمٌ.","en":"I am fasting, I am fasting.","ru":"Я пощусь, я пощусь.","n":1,"src":["bm"],"note":{"en":"What a fasting person says when insulted.","ru":"Что говорит постящийся, если его оскорбили."},"t":{"en":"Insulted while fasting","ru":"Оскорбили во время поста","ar":"ما يقول الصائم إذا سابه أحد"}},"h223":{"ar":"اللَّهُمَّ بَارِكْ لَنَا فِي ثَمَرِنَا، وَبَارِكْ لَنَا فِي مَدِينَتِنَا، وَبَارِكْ لَنَا فِي صَاعِنَا، وَبَارِكْ لَنَا فِي مُدِّنَا.","en":"O Allah, bless us in our fruit, bless us in our city, bless us in our sa’ and bless us in our mudd.","ru":"О Аллах, благослови нам наши плоды, благослови нам наш город, благослови нам наш са’ и наш мудд.","n":1,"src":["muslim"],"note":{"en":"On seeing the first fruits of the season.","ru":"Увидев первые плоды сезона."},"t":{"en":"First fruits","ru":"Первые плоды","ar":"الدعاء عند رؤية باكورة الثمر"}},"h224":{"ar":"إِذَا عَطَسَ أَحَدُكُم فَلْيَقُلِ الْحَمْدُ لِلَّهِ، وَلْيَقُلْ لَهُ أَخُوهُ أَوْ صَاحِبُهُ: يَرْحَمُكَ اللَّهُ، فَإِذَا قَالَ لَهُ: يَرحَمُكَ اللَّهُ، فَلْيَقُلْ: يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.","en":"When one of you sneezes, let him say: Praise be to Allah. Let his brother or companion say to him: May Allah have mercy on you. When he says that, let the sneezer reply: May Allah guide you and set your affairs right.","ru":"Когда кто-то из вас чихнёт, пусть скажет: «Хвала Аллаху». А его брат или товарищ пусть скажет ему: «Да помилует тебя Аллах». Когда тот скажет это, чихнувший пусть ответит: «Да наставит вас Аллах и приведёт в порядок ваши дела».","n":1,"src":["bukhari"],"t":{"en":"Sneezing","ru":"Чихание","ar":"دعاء العطاس"}},"h225":{"ar":"يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.","en":"May Allah guide you and set your affairs right.","ru":"Да наставит вас Аллах и приведёт в порядок ваши дела.","n":1,"src":["tir"],"note":{"en":"Said to a non-Muslim who sneezes and praises Allah.","ru":"Говорится немусульманину, если он чихнул и восхвалил Аллаха."},"t":{"en":"A non-Muslim sneezes","ru":"Чихнул немусульманин","ar":"ما يقال للكافر إذا عطس فحمد الله"}},"h226":{"ar":"بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ.","en":"May Allah bless you, shower His blessings upon you, and bring you together in goodness.","ru":"Да благословит тебя Аллах, да ниспошлёт тебе благодать и да соединит вас в благе.","n":1,"src":["ad","tir"],"note":{"en":"Congratulating newlyweds.","ru":"Поздравление новобрачных."},"t":{"en":"Newlyweds","ru":"Новобрачным","ar":"الدعاء للمتزوج"}},"h227":{"ar":"إِذَا تَزَوَّجَ أَحَدُكُمُ امْرَأَةً، أَوْ إِذَا اشْتَرَى خَادِماً فَلْيَقُلْ: اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَخَيْرَ مَا جَبَلْتَهَا عَلَيْهِ، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ مَا جَبَلْتَهَا عَلَيْهِ، وَإِذَا اشْتَرَى بَعِيراً فَلْيَأْخُذْ بِذِرْوَةِ سَنَامِهِ وَلْيَقُلْ مِثْلَ ذَلِكَ.","en":"When one of you marries, let him say: O Allah, I ask You for her good and the good of the nature You created her with, and I seek refuge in You from her evil and the evil of the nature You created her with.","ru":"Когда кто-то из вас женится, пусть скажет: «О Аллах, прошу Тебя о её благе и благе того, к чему Ты её предрасположил, и прибегаю к Тебе от её зла и зла того, к чему Ты её предрасположил».","n":1,"src":["ad"],"t":{"en":"Marriage","ru":"Женитьба","ar":"دعاء المتزوج و شراء الدابة"}},"h228":{"ar":"بِسْمِ اللَّهِ، اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ، وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا.","en":"In the name of Allah. O Allah, keep Satan away from us and keep Satan away from what You bestow upon us.","ru":"С именем Аллаха. О Аллах, отдали от нас шайтана и отдали шайтана от того, чем Ты нас наделишь.","n":1,"src":["bm"],"note":{"en":"Before intimacy with one’s spouse.","ru":"Перед близостью с супругой."},"t":{"en":"Spouses","ru":"Супругам","ar":"الدعاء قبل إتيان الزوجة"}},"h229":{"ar":"أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.","en":"I seek refuge in Allah from Satan, the accursed.","ru":"Прибегаю к Аллаху от шайтана, побиваемого камнями.","n":1,"src":["bm"],"note":{"en":"When angry.","ru":"При гневе."},"t":{"en":"Anger","ru":"Гнев","ar":"دعاء الغضب"}},"h230":{"ar":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلاَكَ بِهِ، وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلاً.","en":"Praise be to Allah who has spared me what He has afflicted you with and has favoured me greatly over much of His creation.","ru":"Хвала Аллаху, который избавил меня от того, чем испытал тебя, и дал мне великое превосходство над многими из Своих созданий.","n":1,"src":["tir"],"note":{"en":"Said quietly on seeing someone in trial; that affliction will not befall him.","ru":"Говорится про себя, увидев испытываемого; эта беда не постигнет сказавшего."},"t":{"en":"Seeing someone afflicted","ru":"Увидев испытываемого","ar":"دعاء من رأى مبتلى"}},"h231":{"ar":"عَنِ ابْنِ عُمَرَ رضي الله عنه قَاَلَ: كَانَ يُعَدُّ لِرَسُولِ اللَّهِ صلى الله عليه وسلم فِي الْمَجْلِسِ الوَاحِدِ مِائَةُ مَرَّةٍ مِنْ قَبْلِ أَنْ يَقُومَ: رَبِّ اغْفِرْ لِي، وَتُبْ عَلَيَّ، إِنَّكَ أَنْتَ التَّوَّابُ الغَفُورُ.","en":"My Lord, forgive me and accept my repentance; You are the Accepter of repentance, the Forgiving.","ru":"Господи, прости меня и прими моё покаяние, ведь Ты — Принимающий покаяние, Прощающий.","n":100,"src":["tir"],"note":{"en":"Ibn Umar counted the Prophet ﷺ saying it a hundred times in a single gathering.","ru":"Ибн Умар насчитывал, что Пророк ﷺ говорил это сто раз за одно собрание."},"t":{"en":"In a gathering","ru":"На собрании","ar":"ما يقال في المجلس"}},"h232":{"ar":"سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.","en":"Glory be to You, O Allah, and praise. I bear witness that there is no deity but You. I seek Your forgiveness and turn to You in repentance.","ru":"Пречист Ты, о Аллах, и хвала Тебе. Свидетельствую, что нет божества, кроме Тебя. Прошу у Тебя прощения и приношу Тебе покаяние.","n":1,"src":["ad","tir"],"note":{"en":"Expiation of a gathering: whatever idle talk happened in it is forgiven.","ru":"Искупление собрания: прощается лишнее, сказанное на нём."},"t":{"en":"Leaving a gathering","ru":"В конце собрания","ar":"كفارة المجلس"}},"h233":{"ar":"وَلَكَ.","en":"And you.","ru":"И тебе.","n":1,"src":["ahmad"],"note":{"en":"Reply to someone who says: May Allah forgive you.","ru":"Ответ тому, кто сказал: «Да простит тебя Аллах»."},"t":{"en":"Reply to “May Allah forgive you”","ru":"Ответ на «Да простит тебя Аллах»","ar":"الدعاء لمن قال غفر الله لك"}},"h234":{"ar":"جَزَاكَ اللَّهُ خَيْراً.","en":"May Allah reward you with good.","ru":"Да воздаст тебе Аллах благом.","n":1,"src":["tir"],"note":{"en":"Whoever says this has praised in the fullest way.","ru":"Кто сказал так, тот поблагодарил наилучшим образом."},"t":{"en":"Thanking someone","ru":"Благодаря человека","ar":"الدعاء لمن صنع إليك معروفا"}},"h235":{"ar":"مَنْ حَفِظَ عَشْرَ آيَاتٍ مِنْ أَوَّلِ سُورَةِ الْكَهْفِ عُصِمَ مِنَ الدَّجَّالِ، وَالْاسْتِعَاذَةُ بِاللَّهِ مِنْ فِتْنَتِهِ عَقِبَ التَّشَهُّدِ الْأَخِيرِ مِنْ كُلِّ صَلاَةٍ.","en":"Whoever memorises ten verses from the beginning of Surah Al-Kahf is protected from the Dajjal. Also seek refuge from his trial after the final tashahhud of every prayer.","ru":"Кто выучит десять аятов из начала суры «аль-Кахф», будет защищён от Даджаля. Также просите защиты от его искушения после последнего ташаххуда в каждом намазе.","n":1,"src":["muslim"],"t":{"en":"Protection from the Dajjal","ru":"Защита от Даджаля","ar":"ما يعصم الله به من الدجال"}},"h236":{"ar":"أَحَبَّكَ الَّذِي أَحْبَبْتَنِي لَهُ.","en":"May the One for whose sake you love me love you.","ru":"Да полюбит тебя Тот, ради Кого ты полюбил меня.","n":1,"src":["ad"],"note":{"en":"Reply to someone who says: I love you for the sake of Allah.","ru":"Ответ тому, кто сказал: «Я люблю тебя ради Аллаха»."},"t":{"en":"“I love you for Allah’s sake”","ru":"«Люблю тебя ради Аллаха»","ar":"الدعاء لمن قال إني أحبك في الله"}},"h237":{"ar":"بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ.","en":"May Allah bless you in your family and your wealth.","ru":"Да благословит тебя Аллах в твоей семье и имуществе.","n":1,"src":["bukhari"],"note":{"en":"To someone who offers you his wealth.","ru":"Тому, кто предложил вам своё имущество."},"t":{"en":"Offered wealth","ru":"Вам предложили имущество","ar":"الدعاء لمن عرض عليك ماله"}},"h238":{"ar":"بارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ، إِنَّمَا جَزَاءُ السَّلَفِ الْحَمْدُ وَالأَدَاءُ.","en":"May Allah bless you in your family and your wealth. The reward for a loan is only praise and repayment.","ru":"Да благословит тебя Аллах в твоей семье и имуществе. Воздаяние за долг — лишь благодарность и возврат.","n":1,"src":["nasai"],"note":{"en":"When repaying a loan.","ru":"Возвращая долг."},"t":{"en":"Repaying a loan","ru":"Возвращая долг","ar":"الدعاء لمن أقرض عند القضاء"}},"h239":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لاَ أَعْلَمُ.","en":"O Allah, I seek refuge in You from knowingly associating partners with You, and I seek Your forgiveness for what I do not know.","ru":"О Аллах, прибегаю к Тебе от того, чтобы сознательно придавать Тебе сотоварищей, и прошу у Тебя прощения за то, чего не знаю.","n":1,"src":["ahmad"],"t":{"en":"Fear of shirk","ru":"Страх многобожия","ar":"دعاء الخوف من الشرك"}},"h240":{"ar":"وَفِيكَ بَارَكَ اللَّهُ.","en":"And may Allah bless you.","ru":"И тебя да благословит Аллах.","n":1,"src":["ibnsunni"],"note":{"en":"Reply to someone who says: May Allah bless you.","ru":"Ответ тому, кто сказал: «Да благословит тебя Аллах»."},"t":{"en":"Reply to “Barak Allahu fik”","ru":"Ответ на «Бараки-ллаху фик»","ar":"الدعاء لمن قال بارك الله فيك"}},"h241":{"ar":"اللَّهُمَّ لاَ طَيْرَ إِلاَّ طَيْرُكَ، وَلاَ خَيْرَ إِلاَّ خَيْرُكَ، وَلاَ إِلَهَ غَيْرُكَ.","en":"O Allah, there is no omen but Your decree, no good but Your good, and no deity besides You.","ru":"О Аллах, нет предзнаменования, кроме Твоего, нет блага, кроме Твоего блага, и нет божества, кроме Тебя.","n":1,"src":["ahmad"],"note":{"en":"Against superstition about bad omens.","ru":"Против суеверия о дурных приметах."},"t":{"en":"Bad omens","ru":"Дурные приметы","ar":"دعاء كراهية الطيرة"}},"h242":{"ar":"بِسْمِ اللَّهِ، وَالْحَمْدُ للَّهِ ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ﴾، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، الْحَمْدُ لِلَّهِ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، سُبْحَانَكَ اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي؛ فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ.","en":"In the name of Allah. Praise be to Allah. Glory be to the One who has subjected this to us, for we could never have done it ourselves, and to our Lord we will surely return. Praise be to Allah (×3). Allah is the Greatest (×3). Glory be to You, O Allah; I have wronged myself, so forgive me, for none forgives sins but You.","ru":"С именем Аллаха. Хвала Аллаху. Пречист Тот, кто подчинил нам это, ведь мы сами не смогли бы этого сделать, и мы непременно вернёмся к нашему Господу. Хвала Аллаху (×3). Аллах велик (×3). Пречист Ты, о Аллах, я был несправедлив к себе, прости же меня, ведь никто не прощает грехов, кроме Тебя.","n":1,"src":["ad","tir"],"note":{"en":"When getting into a vehicle or mounting.","ru":"Садясь в транспорт."},"t":{"en":"Getting into a vehicle","ru":"Садясь в транспорт","ar":"دعاء الركوب"}},"h243":{"ar":"اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، ﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ﴾ اللَّهُمَّ إِنّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا البِرَّ وَالتَّقْوَى، وَمِنَ الْعَمَلِ مَا تَرْضَى، اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالْخَليفَةُ فِي الْأَهْلِ، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ الْمَنْظَرِ، وَسُوءِ الْمُنْقَلَبِ فِي الْمَالِ وَالْأَهْلِ، وإذا رَجَعَ قَالَهُنَّ وَزَادَ فِيهِنَّ: آيِبُونَ، تائِبُونَ، عَابِدُونَ، لِرَبِّنَا حَامِدُونَ.","en":"Allah is the Greatest (×3). Glory be to the One who has subjected this to us, for we could never have done it ourselves, and to our Lord we will surely return. O Allah, we ask You on this journey for righteousness and piety, and for deeds that please You. O Allah, make this journey easy for us and shorten its distance. O Allah, You are the Companion on the journey and the Guardian of the family. O Allah, I seek refuge in You from the hardships of travel, from a distressing sight, and from an evil return to wealth and family. On returning, say the same and add: Returning, repenting, worshipping, and praising our Lord.","ru":"Аллах велик (×3). Пречист Тот, кто подчинил нам это, ведь мы сами не смогли бы этого сделать, и мы непременно вернёмся к нашему Господу. О Аллах, просим Тебя в этой поездке о благочестии и богобоязненности и о делах, которыми Ты доволен. О Аллах, облегчи нам эту поездку и сократи её расстояние. О Аллах, Ты — Спутник в пути и Хранитель семьи. О Аллах, прибегаю к Тебе от тягот пути, от удручающего зрелища и от дурного возвращения к имуществу и семье. Возвращаясь, говорят то же и добавляют: «Возвращаемся, каемся, поклоняемся и восхваляем нашего Господа».","n":1,"src":["muslim"],"t":{"en":"Travel","ru":"В путешествии","ar":"دعاء السفر"}},"h244":{"ar":"اللَّهُمَّ رَبَّ السَّمَوَاتِ السَّبْعِ وَمَا أَظْلَلْنَ، وَرَبَّ الأَرَضِينَ السَّبْعِ وَمَا أَقْلَلْنَ، وَرَبَّ الشَّياطِينِ وَمَا أَضْلَلْنَ، وَرَبَّ الرِّيَاحِ وَمَا ذَرَيْنَ، أَسْأَلُكَ خَيْرَ هَذِهِ الْقَرْيَةِ، وَخَيْرَ أَهْلِهَا، وَخَيْرَ مَا فِيهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا، وَشَرِّ أَهْلِهَا، وَشَرِّ مَا فِيهَا.","en":"O Allah, Lord of the seven heavens and all they shade, Lord of the seven earths and all they carry, Lord of the devils and all they mislead, Lord of the winds and all they scatter, I ask You for the good of this town, the good of its people and the good within it, and I seek refuge in You from its evil, the evil of its people and the evil within it.","ru":"О Аллах, Господь семи небес и того, что они осеняют, Господь семи земель и того, что они несут, Господь шайтанов и тех, кого они сбили с пути, Господь ветров и того, что они развеяли! Прошу Тебя о благе этого селения, благе его жителей и благе того, что в нём, и прибегаю к Тебе от его зла, зла его жителей и зла того, что в нём.","n":1,"src":["hakim"],"note":{"en":"On entering a town or city.","ru":"Въезжая в город или селение."},"t":{"en":"Entering a town","ru":"Въезжая в город","ar":"دعاء دخول القرية أو البلدة"}},"h245":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ حَيٌّ لاِ يَمُوتُ، بِيَدِهِ الْخَيْرُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","en":"There is no deity but Allah alone, without partner. His is the dominion and His is the praise. He gives life and causes death, and He is Ever-Living and does not die. In His hand is all good, and He is over all things capable.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он оживляет и умерщвляет, Он — Живой и не умирает, в Его руке благо, и Он всё может.","n":1,"src":["tir"],"note":{"en":"On entering the market. The chain of this hadith is debated; Tirmidhi recorded it.","ru":"Входя на рынок. Достоверность хадиса обсуждается; его приводит ат-Тирмизи."},"t":{"en":"The market","ru":"На рынке","ar":"دعاء دخول السوق"}},"h246":{"ar":"بِسْمِ اللَّهِ.","en":"In the name of Allah.","ru":"С именем Аллаха.","n":1,"src":["ad"],"note":{"en":"When your mount or vehicle stumbles; do not curse Satan, for that makes him swell with pride.","ru":"Когда споткнулось животное или подвёл транспорт; не проклинайте шайтана, от этого он лишь возгордится."},"t":{"en":"When the vehicle stumbles","ru":"Если транспорт подвёл","ar":"الدعاء إذا تعس المركوب"}},"h247":{"ar":"أَسْتَوْدِعُكُمُ اللَّهَ الَّذِي لاَ تَضِيعُ وَدَائِعُهُ.","en":"I entrust you to Allah, whose trusts are never lost.","ru":"Оставляю вас на попечение Аллаха, у Которого ничто доверенное не пропадает.","n":1,"src":["ahmad"],"note":{"en":"The traveller to those staying behind.","ru":"Путешественник — остающимся."},"t":{"en":"Traveller to those staying","ru":"Путник — остающимся","ar":"دعاء المسافر للمقيم"}},"h248":{"ar":"أَسْتَوْدِعُ اللَّهَ دِينَكَ، وَأَمَانَتَكَ، وَخَوَاتِيمَ عَمَلِكَ.","en":"I entrust to Allah your religion, your trust and the conclusion of your deeds.","ru":"Поручаю Аллаху твою религию, то, что тебе доверено, и завершение твоих дел.","n":1,"src":["tir"],"note":{"en":"Those staying behind to the traveller.","ru":"Остающиеся — путешественнику."},"t":{"en":"Seeing off a traveller","ru":"Провожая путника","ar":"دعاء المقيم للمسافر"}},"h249":{"ar":"زَوَّدَكَ اللَّهُ التَّقْوَى، وَغَفَرَ ذَنْبَكَ، وَيَسَّرَ لَكَ الخَيْرَ حَيْثُ ما كُنْتَ.","en":"May Allah give you piety as your provision, forgive your sins and make good easy for you wherever you are.","ru":"Да сделает Аллах богобоязненность твоим припасом, да простит тебе грехи и да облегчит тебе благо, где бы ты ни был.","n":1,"src":["tir"],"t":{"en":"Seeing off a traveller","ru":"Провожая путника","ar":"دعاء المقيم للمسافر"}},"h250":{"ar":"قَالَ جَابِرٌ رضي الله عنه: كُنَّا إِذَا صَعَدْنَا كَبَّرْنَا، وَإِذَا نَزَلْنَا سَبَّحْنَا.","en":"Jabir said: When we went up we said “Allah is the Greatest”, and when we went down we said “Glory be to Allah”.","ru":"Джабир сказал: «Поднимаясь, мы говорили „Аллах велик“, а спускаясь — „Пречист Аллах“».","n":1,"src":["bukhari"],"note":{"en":"Dhikr while travelling.","ru":"Поминание в пути."},"t":{"en":"On the road","ru":"В дороге","ar":"التكبير و التسبيح في سير السفر"}},"h251":{"ar":"سَمَّعَ سَامِعٌ بِحَمْدِ اللَّهِ، وَحُسْنِ بَلاَئِهِ عَلَيْنَا، رَبَّنَا صاحِبْنَا، وَأَفْضِلْ عَلَيْنَا، عَائِذاً بِاللَّهِ مِنَ النَّارِ.","en":"A witness has heard of our praise of Allah and His good favours upon us. Our Lord, accompany us and bestow Your bounty upon us, seeking refuge in Allah from the Fire.","ru":"Пусть слышащий услышит, как мы восхваляем Аллаха за Его прекрасные милости к нам. Господь наш, будь с нами и окажи нам милость. Прибегаем к Аллаху от Огня.","n":1,"src":["muslim"],"note":{"en":"Said by a traveller at the time before dawn.","ru":"Говорит путник перед рассветом."},"t":{"en":"Traveller before dawn","ru":"Путник перед рассветом","ar":"دعاء المسافر إذا أسحر"}},"h252":{"ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.","en":"I seek refuge in the perfect words of Allah from the evil of what He has created.","ru":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","n":1,"src":["muslim"],"note":{"en":"Whoever stops at a place and says this, nothing will harm him until he leaves.","ru":"Кто остановится где-то и скажет это, тому ничто не повредит, пока он не уйдёт оттуда."},"t":{"en":"Stopping at a place","ru":"Остановившись где-то","ar":"الدعاء إذا نزل مترلا في سفر أو غيره"}},"h253":{"ar":"يُكَبِّرُ عَلَى كُلِّ شَرَفٍ ثَلاَثَ تَكْبِيرَاتٍ ثُمَّ يَقُولُ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، آيِبُونَ، تَائِبُونَ، عَابِدُونَ، لِرَبِّنا حَامِدُونَ، صَدَقَ اللَّهُ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزابَ وَحْدَهُ.","en":"Say “Allah is the Greatest” three times on every high place, then say: There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. Returning, repenting, worshipping, and praising our Lord. Allah fulfilled His promise, helped His servant and alone defeated the confederates.","ru":"На каждой возвышенности трижды говорят «Аллах велик», а затем: «Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. Возвращаемся, каемся, поклоняемся и восхваляем нашего Господа. Аллах исполнил Своё обещание, помог Своему рабу и один разбил союзные племена».","n":1,"src":["bm"],"note":{"en":"Returning from a journey.","ru":"При возвращении из поездки."},"t":{"en":"Returning from travel","ru":"Возвращаясь из поездки","ar":"ذكر الرجوع من السفر"}},"h254":{"ar":"كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا أَتَاهُ الْأَمْرُ يَسُرُّهُ قَالَ: الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ وَإِذَا أَتَاهُ الْأَمْرُ يَكْرَهُهُ قَالَ: الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ.","en":"When something pleasing came to the Prophet ﷺ he said: Praise be to Allah, by whose grace good things are completed. When something displeasing came to him he said: Praise be to Allah in every circumstance.","ru":"Когда Пророку ﷺ случалось что-то радостное, он говорил: «Хвала Аллаху, по милости которого завершаются благие дела». А когда случалось неприятное, говорил: «Хвала Аллаху при любом положении».","n":1,"src":["ibm"],"t":{"en":"Good or bad news","ru":"Хорошая или плохая весть","ar":"ما يقول من أتاه أمر يسره أو يكرهه"}},"h264":{"ar":"إِذَا سَمِعْتُمْ صِيَاحَ الدِّيَكَةِ فَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ؛ فَإِنَّهَا رَأَتْ مَلَكاً وَإِذَا سَمِعْتُمْ نَهِيقَ الْحِمَارِ فَتَعَوَّذُوا بِاللَّهِ مِنَ الشَّيطَانِ؛ فَإِنَّهُ رَأَى شَيْطَاناً.","en":"When you hear roosters crowing, ask Allah of His bounty, for they have seen an angel. When you hear a donkey braying, seek refuge in Allah from Satan, for it has seen a devil.","ru":"Услышав крик петуха, просите Аллаха о Его милости, ведь он увидел ангела. Услышав рёв осла, просите у Аллаха защиты от шайтана, ведь он увидел шайтана.","n":1,"src":["bm"],"t":{"en":"Rooster or donkey","ru":"Петух или осёл","ar":"الدعاء عند سماع صياح الديك ونهيق الحمار"}},"h265":{"ar":"إِذَا سَمِعْتُمْ نُبَاحَ الْكِلاَبِ وَنَهِيقَ الْحَمِيرِ بِاللَّيْلِ فَتَعَوَّذُوا بِاللَّهِ مِنْهُنَّ؛ فَإِنَّهُنَّ يَرَيْنَ مَا لاَ تَرَوْنَ.","en":"When you hear dogs barking or donkeys braying at night, seek refuge in Allah from them, for they see what you do not see.","ru":"Услышав ночью лай собак или рёв ослов, просите у Аллаха защиты от них, ведь они видят то, чего не видите вы.","n":1,"src":["ad"],"t":{"en":"Dogs barking at night","ru":"Лай собак ночью","ar":"دعاء نباح الكلب بالليل"}},"h266":{"ar":"قَالَ النَّبِيُّ صلى الله عليه وسلم: اللَّهُمَّ فَأَيُّمَا مُؤْمِنٍ سَبَبْتُهُ فَاجْعَلْ ذَلِكَ لَهُ قُرْبَةً إِلَيْكَ يَوْمَ الْقِيَامَةِ.","en":"The Prophet ﷺ said: O Allah, whichever believer I have insulted, make that a means of drawing near to You on the Day of Resurrection.","ru":"Пророк ﷺ сказал: «О Аллах, любого верующего, которого я обругал, приблизь благодаря этому к Тебе в День воскресения».","n":1,"src":["bm"],"t":{"en":"For someone you insulted","ru":"За того, кого обругал","ar":"الدعاء لمن سببته"}},"h267":{"ar":"قَالَ النَّبِيُّ صلى الله عليه وسلم: إِذَا كَانَ أَحَدُكُم مَادِحاً صَاحِبَهُ لاَ مَحَالَةَ فَلْيَقُلْ: أَحْسِبُ فُلاَناً وَاللَّهُ حَسِيبُهُ، وَلاَ أُزَكِّي عَلَى اللَّهِ أَحَداً، أَحْسِبُهُ – إِنْ كَانَ يَعْلَمُ ذَاكَ – كَذَا وَكَذَا.","en":"If one of you must praise his companion, let him say: I consider him to be so, and Allah is his Reckoner, and I do not vouch for anyone before Allah — I think he is such and such, if he knows that.","ru":"Если кому-то из вас непременно нужно похвалить товарища, пусть скажет: «Я считаю его таким-то, а Аллах — его Судья, и я никого не обеляю перед Аллахом», если он действительно это знает.","n":1,"src":["muslim"],"t":{"en":"Praising someone","ru":"Хваля человека","ar":"ما يقول المسلم إذا مدح المسلم"}},"h268":{"ar":"اللَّهُمَّ لاَ تُؤَاخِذْنِي بِمَا يَقُولُونَ، وَاغْفِرْ لِي مَا لاَ يَعْلَمُونَ، وَاجْعَلْنِي خَيْراً مِمَّا يَظُّنُّونَ.","en":"O Allah, do not hold me accountable for what they say, forgive me for what they do not know, and make me better than they think.","ru":"О Аллах, не взыщи с меня за то, что они говорят, прости мне то, о чём они не знают, и сделай меня лучше, чем они думают.","n":1,"src":["bukhari"],"note":{"en":"When you are praised.","ru":"Когда вас хвалят."},"t":{"en":"When you are praised","ru":"Когда хвалят вас","ar":"ما يقول المسلم إذا زكي"}},"h269":{"ar":"لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لاَ شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ، وَالنِّعْمَةَ، لَكَ وَالْمُلْكَ، لاَ شَرِيكَ لَكَ.","en":"Here I am, O Allah, here I am. Here I am, You have no partner, here I am. Indeed, all praise, blessing and dominion are Yours. You have no partner.","ru":"Вот я перед Тобой, о Аллах, вот я перед Тобой! Вот я перед Тобой, нет у Тебя сотоварища, вот я перед Тобой! Поистине, хвала, милость и власть принадлежат Тебе, нет у Тебя сотоварища.","n":1,"src":["bm"],"note":{"en":"The talbiyah of the pilgrim in Hajj or Umrah.","ru":"Тальбия паломника в хадже или умре."},"t":{"en":"Talbiyah","ru":"Тальбия","ar":"كيف يلبي المحرم في الحج أو العمرة ؟"}},"h271":{"ar":"﴿رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ﴾.","en":"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","ru":"Господь наш! Даруй нам в этом мире добро и в Последней жизни добро и защити нас от мучений в Огне.","n":1,"src":["ad"],"note":{"en":"Between the Yemeni corner and the Black Stone during tawaf.","ru":"Между Йеменским углом и Чёрным камнем во время тавафа."},"t":{"en":"During tawaf","ru":"Во время тавафа","ar":"الدعاء بين الركن اليماني والحجر الأسود"}},"h272":{"ar":"لَمَّا دَنَا النَّبِيُّ صلى الله عليه وسلم مِنَ الصَّفَا قَرَأَ: ﴿إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَآئِرِ اللَّهِ﴾ أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ فَبَدَأَ بِالصَّفَا فَرَقِيَ عَلَيْهِ حَتَّى رَأَى الْبَيْتَ، فَاسْتَقْبَلَ الْقِبْلَةَ، فَوَحَّدَ اللَّهَ وَكبَّرَهُ وَقَالَ: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الْأَحْزَابَ وَحْدَهُ، ثُمَّ دَعَا بَيْنَ ذلكَ. قَالَ مِثْلَ هَذَا ثَلاَثَ مَرَّاتٍ الْحَدِيثُ. وَفِيهِ: فَفَعَلَ عَلَى الْمَرْوَةِ كَمَا فَعَلَ عَلَى الصَّفَا.","en":"Approaching Safa, the Prophet ﷺ recited: Indeed, Safa and Marwah are among the symbols of Allah — and said: I begin with what Allah began with. He climbed Safa until he saw the House, faced the qiblah, declared Allah’s oneness and greatness, and said: There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. There is no deity but Allah alone; He fulfilled His promise, helped His servant and alone defeated the confederates. Then he supplicated, repeating this three times, and did the same at Marwah.","ru":"Приближаясь к Сафе, Пророк ﷺ прочитал: «Поистине, ас-Сафа и аль-Марва — из обрядовых знамений Аллаха» — и сказал: «Начинаю с того, с чего начал Аллах». Он поднялся на Сафу, пока не увидел Каабу, обратился к кибле, возвестил единство и величие Аллаха и сказал: «Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. Нет божества, кроме одного лишь Аллаха, Он исполнил Своё обещание, помог Своему рабу и один разбил союзные племена». Затем он молился, повторив это трижды, и так же поступил на Марве.","n":1,"src":["muslim"],"t":{"en":"Safa and Marwah","ru":"Сафа и Марва","ar":"دعاء الوقوف على الصفا والمروة"}},"h273":{"ar":"قَالَ النَّبِيُّ صلى الله عليه وسلم: خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ، وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبيُّونَ مِنْ قَبْلِي: لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","en":"The best supplication is the supplication of the Day of Arafah, and the best that I and the prophets before me have said is: There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable.","ru":"Лучшая мольба — мольба в день Арафа, и лучшее из сказанного мной и пророками до меня: «Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может».","n":1,"src":["tir"],"t":{"en":"Day of Arafah","ru":"День Арафа","ar":"الدعاء يوم عرفة"}},"h276":{"ar":"سُبْحَانَ اللَّهِ!.","en":"Glory be to Allah!","ru":"Пречист Аллах!","n":1,"src":["bm"],"note":{"en":"Said in amazement.","ru":"Говорится при удивлении."},"t":{"en":"Amazement","ru":"Удивление","ar":"دعاء التعجب والأمر السار"}},"h277":{"ar":"اللَّهُ أَكْبَرُ!.","en":"Allah is the Greatest!","ru":"Аллах велик!","n":1,"src":["bukhari"],"note":{"en":"Said on good news or something amazing.","ru":"Говорится при радостной вести или чём-то удивительном."},"t":{"en":"Amazement","ru":"Удивление","ar":"دعاء التعجب والأمر السار"}},"h278":{"ar":"كَانَ النَّبيُّ صلى الله عليه وسلم إِذَا أَتَاهُ أَمْرٌ يَسُرُّهُ أَوْ يُسَرُّ بِهِ خَرَّ سَاجِداً شُكْراً لِلَّهِ تَبَارَكَ وَتَعَالَى.","en":"When something pleasing came to the Prophet ﷺ, he fell into prostration in gratitude to Allah.","ru":"Когда Пророку ﷺ случалось что-то радостное, он падал ниц в благодарность Аллаху.","n":1,"src":["ad","tir"],"note":{"en":"The prostration of gratitude (sujud ash-shukr).","ru":"Земной поклон благодарности (суджуд шукр)."},"t":{"en":"Good news","ru":"Радостная весть","ar":"ما يفعل من أتاه أمر يسره"}},"h279":{"ar":"ضَعْ يَدَكَ عَلَى الَّذِي تَألَّمَ مِنْ جَسَدِكَ وَقُلْ: بِسْمِ اللَّهِ، ثَلاَثاً، وَقُلْ سَبْعَ مَرَّاتٍ: أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ.","en":"Place your hand where your body hurts and say: In the name of Allah (×3), then say seven times: I seek refuge in Allah and His power from the evil of what I feel and what I fear.","ru":"Положите руку на место боли и скажите: «С именем Аллаха» (×3), а затем семь раз: «Прибегаю к Аллаху и Его могуществу от зла того, что я чувствую и чего опасаюсь».","n":1,"src":["muslim"],"t":{"en":"Pain in the body","ru":"Боль в теле","ar":"ما يقول من أحس وجعا في جسده"}},"h280":{"ar":"إِذَا رَأَى أَحَدُكُم مِنْ أَخِيهِ، أَوْ مِنْ نَفْسِهِ، أَوْ مِنْ مَالِهِ مَا يُعْجِبُهُ فَلْيَدْعُ لَهُ بِالْبَرَكَةِ فَإِنَّ الْعَيْنَ حَقٌّ.","en":"If one of you sees something he admires in his brother, himself or his property, let him pray for blessing on it, for the evil eye is real.","ru":"Если кто-то увидит у брата, у себя или в своём имуществе то, что ему понравилось, пусть попросит для этого благословения, ведь сглаз — истина.","n":1,"src":["ahmad"],"note":{"en":"Say: Ma sha Allah, barak Allahu fih.","ru":"Скажите: «Ма ша Аллах, барака-ллаху фих»."},"t":{"en":"The evil eye","ru":"Сглаз","ar":"دعاء من خشي أن يصيب شيئا بعينه"}},"h281":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ!.","en":"There is no deity but Allah!","ru":"Нет божества, кроме Аллаха!","n":1,"src":["bm"],"note":{"en":"Said when startled or frightened.","ru":"Говорится при испуге."},"t":{"en":"Startled","ru":"Испуг","ar":"ما يقال عند الفزع"}},"h282":{"ar":"بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ اللَّهُمَّ مِنْكَ وَلَكَ اللَّهُمَّ تَقَبَّلْ مِنِّي.","en":"In the name of Allah, and Allah is the Greatest. O Allah, it is from You and for You. O Allah, accept it from me.","ru":"С именем Аллаха, Аллах велик. О Аллах, это от Тебя и для Тебя. О Аллах, прими от меня.","n":1,"src":["muslim"],"note":{"en":"When slaughtering a sacrifice.","ru":"При жертвоприношении."},"t":{"en":"Sacrifice","ru":"Жертвоприношение","ar":"ما يقول عند الذبح أو النحر"}},"h283":{"ar":"أَعُوذُ بكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِي لاَ يُجَاوِزُهُنَّ بَرٌّ وَلاَ فَاجِرٌ: مِنْ شَرِّ مَا خَلَقَ، وَبَرَأَ وَذَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ، وَمِنْ شَرِّ مَا يَعْرُجُ فيهَا، وَمِنْ شَرِّ مَا ذَرَأَ فِي الْأَرْضِ، وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلاَّ طَارِقاً يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ.","en":"I seek refuge in the perfect words of Allah, which neither the righteous nor the wicked can exceed, from the evil of what He created, made and spread; from the evil of what descends from the sky and what ascends to it; from the evil of what He has spread on the earth and what comes out of it; from the evil of the trials of night and day; and from the evil of every night visitor, except one who comes with good, O Most Merciful.","ru":"Прибегаю к совершенным словам Аллаха, которых не превзойдут ни праведник, ни нечестивец, от зла того, что Он сотворил, создал и рассеял; от зла того, что нисходит с неба и что восходит на него; от зла того, что Он рассеял на земле и что выходит из неё; от зла искушений ночи и дня и от зла всякого ночного пришельца, кроме того, кто приходит с добром, о Милостивый.","n":1,"src":["ahmad"],"note":{"en":"To repel the schemes of rebellious devils.","ru":"Против козней непокорных шайтанов."},"t":{"en":"Against devils","ru":"От шайтанов","ar":"ما يقول لرد كيد مردة الشياطين"}},"salawat0":{"ar":"اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ","n":0,"src":["muslim"],"t":{"en":"Blessings on the Prophet ﷺ","ru":"Салават Пророку ﷺ","ar":"الصلاة على النبي ﷺ"},"en":"O Allah, send blessings and peace upon our Prophet Muhammad.","ru":"О Аллах, благослови и приветствуй нашего пророка Мухаммада.","note":{"en":"Whoever sends one blessing upon me, Allah sends ten upon him.","ru":"Кто благословит меня один раз, того Аллах благословит десять раз.","ar":"من صلى عليّ صلاة صلى الله عليه بها عشراً"}},"p_takbir":{"ar":"اللَّهُ أَكْبَرُ","en":"Allah is the Greatest.","ru":"Аллах велик.","n":1,"src":["bm"],"t":{"en":"Opening takbir","ru":"Начальный такбир","ar":"تكبيرة الإحرام"},"note":{"en":"The prayer begins with the takbir, raising the hands.","ru":"Намаз начинается с такбира, поднимая руки.","ar":""}},"p_istiftah2":{"ar":"الْحَمْدُ لِلَّهِ حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ","en":"Praise be to Allah, abundant, good and blessed praise.","ru":"Хвала Аллаху, хвала обильная, благая и благословенная.","n":1,"src":["muslim"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"},"note":{"en":"A man said this at the start of prayer and the Prophet ﷺ saw twelve angels racing to take it up.","ru":"Человек сказал это в начале намаза, и Пророк ﷺ видел двенадцать ангелов, спешивших вознести эти слова.","ar":""}},"p_istiftah3":{"ar":"اللَّهُ أَكْبَرُ كَبِيرًا، وَالْحَمْدُ لِلَّهِ كَثِيرًا، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلًا","en":"Allah is the Greatest, truly great; praise be to Allah, abundantly; and glory be to Allah, morning and evening.","ru":"Аллах велик безмерно, хвала Аллаху обильная, и пречист Аллах утром и вечером.","n":1,"src":["muslim"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"},"note":{"en":"The Prophet ﷺ said: the gates of heaven were opened for it.","ru":"Пророк ﷺ сказал: ради этих слов открылись врата небес.","ar":""}},"p_isti":{"ar":"أَعُوذُ بِاللَّهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ، مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ","en":"I seek refuge in Allah, the All-Hearing, the All-Knowing, from Satan the accursed, from his madness, his pride and his poetry.","ru":"Прибегаю к Аллаху Слышащему, Знающему от шайтана, побиваемого камнями, от его безумия, высокомерия и стихов.","n":1,"src":["ad","tir"],"t":{"en":"Before reciting","ru":"Перед чтением Корана","ar":"الاستعاذة قبل القراءة"}},"p_amin":{"ar":"آمِين","en":"Amin (O Allah, answer).","ru":"Амин (о Аллах, ответь).","n":1,"src":["bm"],"t":{"en":"After Al-Fatiha","ru":"После «аль-Фатихи»","ar":"التأمين"},"note":{"en":"Whoever’s amin coincides with the amin of the angels, his past sins are forgiven.","ru":"У того, чьё «амин» совпадёт с «амин» ангелов, прощаются прошлые грехи.","ar":""}},"p_ruku2":{"ar":"سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ","en":"Glory be to my Lord, the Most Great, and praise be to Him.","ru":"Пречист мой Господь Великий, и хвала Ему.","n":3,"src":["ad"],"t":{"en":"In ruku (bowing)","ru":"В поясном поклоне","ar":"دعاء الركوع"}},"p_sujud2":{"ar":"سُبْحَانَ رَبِّيَ الْأَعْلَى وَبِحَمْدِهِ","en":"Glory be to my Lord, the Most High, and praise be to Him.","ru":"Пречист мой Господь Всевышний, и хвала Ему.","n":3,"src":["ad"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"p_sujud3":{"ar":"سُبْحَانَكَ وَبِحَمْدِكَ، لَا إِلَٰهَ إِلَّا أَنْتَ","en":"Glory be to You and praise; there is no deity but You.","ru":"Пречист Ты, и хвала Тебе, нет божества, кроме Тебя.","n":1,"src":["muslim"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"},"note":{"en":"Aishah found the Prophet ﷺ saying this in prostration at night.","ru":"Аиша застала Пророка ﷺ ночью в земном поклоне, когда он говорил это.","ar":""}},"p_rafa2":{"ar":"اللَّهُمَّ رَبَّنَا وَلَكَ الْحَمْدُ","en":"O Allah, our Lord, and to You is praise.","ru":"О Аллах, Господь наш, Тебе хвала.","n":1,"src":["bukhari"],"t":{"en":"Rising from ruku","ru":"Выпрямляясь после поклона","ar":"دعاء الرفع من الركوع"},"note":{"en":"Whoever’s words coincide with those of the angels, his past sins are forgiven.","ru":"У того, чьи слова совпадут со словами ангелов, прощаются прошлые грехи.","ar":""}},"p_tash2":{"ar":"التَّحِيَّاتُ الْمُبَارَكَاتُ، الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ","en":"Blessed greetings, good prayers are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no deity but Allah, and I bear witness that Muhammad is the Messenger of Allah.","ru":"Благословенные приветствия, благие молитвы — Аллаху. Мир тебе, о Пророк, милость Аллаха и Его благословение. Мир нам и праведным рабам Аллаха. Свидетельствую, что нет божества, кроме Аллаха, и свидетельствую, что Мухаммад — посланник Аллаха.","n":1,"src":["muslim"],"t":{"en":"Tashahhud (Ibn Abbas)","ru":"Ташаххуд (Ибн Аббас)","ar":"تشهد ابن عباس"}},"p_taslim":{"ar":"السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ","en":"Peace be upon you and the mercy of Allah.","ru":"Мир вам и милость Аллаха.","n":2,"src":["ad","tir"],"t":{"en":"Ending the prayer","ru":"Завершение намаза","ar":"التسليم"},"note":{"en":"Turning the head to the right, then to the left.","ru":"Поворачивая голову направо, затем налево.","ar":""}},"p_tsb":{"ar":"سُبْحَانَ اللَّهِ","en":"Glory be to Allah.","ru":"Пречист Аллах.","n":33,"src":["muslim"],"t":{"en":"After the salam","ru":"После саляма","ar":"بعد السلام"}},"p_hmd":{"ar":"الْحَمْدُ لِلَّهِ","en":"Praise be to Allah.","ru":"Хвала Аллаху.","n":33,"src":["muslim"],"t":{"en":"After the salam","ru":"После саляма","ar":"بعد السلام"}},"p_akb":{"ar":"اللَّهُ أَكْبَرُ","en":"Allah is the Greatest.","ru":"Аллах велик.","n":33,"src":["muslim"],"t":{"en":"After the salam","ru":"После саляма","ar":"بعد السلام"}},"p_tahlil":{"ar":"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","en":"There is no deity but Allah alone, without partner. His is the dominion and His is the praise, and He is over all things capable.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может.","n":1,"src":["muslim"],"t":{"en":"Completing the hundred","ru":"Завершение сотни","ar":"تمام المائة"},"note":{"en":"Sins are forgiven even if they are like the foam of the sea.","ru":"Грехи прощаются, даже если их столько, сколько пены морской.","ar":""}},"p_ten":{"ar":"سُبْحَانَ اللَّهِ ۞ الْحَمْدُ لِلَّهِ ۞ اللَّهُ أَكْبَرُ","en":"Glory be to Allah, praise be to Allah, Allah is the Greatest — ten times each.","ru":"«Пречист Аллах», «Хвала Аллаху», «Аллах велик» — по десять раз.","n":30,"src":["ad","tir"],"t":{"en":"Short version","ru":"Короткий вариант","ar":"عشراً عشراً"},"note":{"en":"Another authentic form of tasbih after prayer: ten of each.","ru":"Ещё один достоверный вариант тасбиха после намаза: по десять раз.","ar":""}},"p_kufr":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ، وَالْفَقْرِ، وَعَذَابِ الْقَبْرِ","en":"O Allah, I seek refuge in You from disbelief, poverty and the punishment of the grave.","ru":"О Аллах, прибегаю к Тебе от неверия, бедности и мучений в могиле.","n":1,"src":["nasai"],"t":{"en":"After the salam","ru":"После саляма","ar":"بعد السلام"},"note":{"en":"Abu Bakrah heard the Prophet ﷺ say it after every prayer.","ru":"Абу Бакра слышал, как Пророк ﷺ говорил это после каждого намаза.","ar":""}},"p_qini":{"ar":"رَبِّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ","en":"My Lord, protect me from Your punishment on the Day You resurrect Your servants.","ru":"Господи, защити меня от Твоего наказания в тот день, когда Ты воскресишь Своих рабов.","n":1,"src":["muslim"],"t":{"en":"After the salam","ru":"После саляма","ar":"بعد السلام"},"note":{"en":"Said by the Prophet ﷺ after prayer, turning to face the people.","ru":"Пророк ﷺ говорил это после намаза, поворачиваясь к людям.","ar":""}},"m_tahlil10":{"ar":"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ","en":"There is no deity but Allah alone, without partner. His is the dominion and His is the praise, and He is over all things capable.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может.","n":10,"src":["ahmad"],"t":{"en":"Ten times","ru":"Десять раз","ar":"عشر مرات"},"note":{"en":"Ten times in the morning: ten good deeds written, ten sins erased, raised ten degrees, like freeing ten slaves, and protected until evening; likewise in the evening.","ru":"Десять раз утром: записывается десять добрых дел, стирается десять грехов, степень возвышается на десять, словно освобождены десять рабов, и защита до вечера; так же и вечером.","ar":""}},"q0":{"ar":"وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ ﴿١٢٧﴾","en":"And [mention] when Abraham was raising the foundations of the House and [with him] Ishmael, [saying], \"Our Lord, accept [this] from us. Indeed, You are the Hearing, the Knowing.","ru":"И вот Ибрахим и Исма‘ил возводили основания Дома, [говоря]: «Господь наш! Прими от нас, воистину, Ты — Слышащий, Знающий.","n":1,"src":[],"q":"2:127","t":{"en":"Acceptance of deeds","ru":"О принятии дел","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim & Ismail","ru":"Ибрахим и Исмаил","ar":""}},"q1":{"ar":"رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَّكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنتَ التَّوَّابُ الرَّحِيمُ ﴿١٢٨﴾","en":"Our Lord, and make us Muslims [in submission] to You and from our descendants a Muslim nation [in submission] to You. And show us our rites [of worship] and accept our repentance. Indeed, You are the Accepting of Repentance, the Merciful.","ru":"Господь наш! Сделай нас покорившимися Тебе, и из нашего потомства — общину, покорную Тебе, покажи нам наши обряды и прими наше покаяние. Воистину, Ты — Принимающий покаяния, Милующий.","n":1,"src":[],"q":"2:128","t":{"en":"Submission and repentance","ru":"Покорность и покаяние","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim & Ismail","ru":"Ибрахим и Исмаил","ar":""}},"q2":{"ar":"وَمِنْهُم مَّن يَقُولُ رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ ﴿٢٠١﴾","en":"But among them is he who says, \"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire.\"","ru":"Среди них есть и такие, кто говорит: «Господь наш! Даруй нам благо в этом мире и благо в Последней жизни, и защити нас от наказания адского огня».","n":1,"src":[],"q":"2:201","t":{"en":"Good in both worlds","ru":"Благо в обоих мирах","ar":"دعاء من القرآن"},"note":{"en":"The supplication the Prophet ﷺ made most often","ru":"Мольба, с которой Пророк ﷺ обращался чаще всего","ar":""}},"q3":{"ar":"وَلَمَّا بَرَزُوا لِجَالُوتَ وَجُنُودِهِ قَالُوا رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٥٠﴾","en":"And when they went forth to [face] Goliath and his soldiers, they said, \"Our Lord, pour upon us patience and plant firmly our feet and give us victory over the disbelieving people.\"","ru":"Когда же они выступили против Джалута и его войск, они сказали: «Господь наш! Излей на нас терпение, укрепи наши стопы и помоги нам против людей, отвергших веру».","n":1,"src":[],"q":"2:250","t":{"en":"Patience and firmness","ru":"Терпение и стойкость","ar":"دعاء من القرآن"}},"q4":{"ar":"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾","en":"Allāh does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. \"Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.\"","ru":"Аллах не возлагает на душу больше того, что она способна вынести. Ей — то, что она приобрела, и против неё — то, что она заслужила. «Господь наш! Не взыщи с нас, если мы забыли или ошиблись. Господь наш! Не возлагай на нас бремя, подобно тому, как Ты возложил его на тех, которые были до нас. Господь наш! Не возлагай на нас того, чего мы не в силах вынести. Будь снисходителен к нам, прости нам и помилуй нас. Ты — наш Покровитель, так помоги же нам против людей, отвергших веру».","n":1,"src":[],"q":"2:286","t":{"en":"Do not burden us","ru":"Не обременяй нас","ar":"دعاء من القرآن"}},"q5":{"ar":"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً إِنَّكَ أَنتَ الْوَهَّابُ ﴿٨﴾","en":"[Who say], \"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower.","ru":"Господь наш! Не уклоняй наши сердца после того, как Ты наставил нас на верный путь, и даруй нам от Себя милость. Воистину, Ты — Дарующий.","n":1,"src":[],"q":"3:8","t":{"en":"Steadfast heart","ru":"Твёрдость сердца","ar":"دعاء من القرآن"}},"q6":{"ar":"الَّذِينَ يَقُولُونَ رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ ﴿١٦﴾","en":"Those who say, 'Our Lord, indeed we have believed, so forgive us our sins and protect us from the punishment of the Fire,' \"","ru":"[Это те,] которые говорят: «Господь наш! Воистину, мы уверовали, так прости нам наши грехи и защити нас от наказания адского огня»,","n":1,"src":[],"q":"3:16","t":{"en":"Forgiveness","ru":"Прощение","ar":"دعاء من القرآن"}},"q7":{"ar":"هُنَالِكَ دَعَا زَكَرِيَّا رَبَّهُ قَالَ رَبِّ هَبْ لِي مِن لَّدُنكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ ﴿٣٨﴾","en":"At that, Zechariah called upon his Lord, saying, \"My Lord, grant me from Yourself a good offspring. Indeed, You are the Hearer of supplication.\"","ru":"Там же и воззвал Закария к своему Господу. Он сказал: «Господь мой! Даруй мне от Себя благое потомство. Воистину, Ты — слышащий мольбу».","n":1,"src":[],"q":"3:38","t":{"en":"Righteous offspring","ru":"Праведное потомство","ar":"دعاء من القرآن"},"note":{"en":"Zakariya","ru":"Закария","ar":""}},"q8":{"ar":"رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ ﴿٥٣﴾","en":"Our Lord, we have believed in what You revealed and have followed the messenger [i.e., Jesus], so register us among the witnesses [to truth].\"","ru":"Господь наш! Мы уверовали в то, что Ты ниспослал, и последовали Посланнику, так запиши нас среди свидетельствующих».","n":1,"src":[],"q":"3:53","t":{"en":"Among the witnesses","ru":"Среди свидетельствующих","ar":"دعاء من القرآن"},"note":{"en":"The disciples of Isa","ru":"Апостолы Исы","ar":""}},"q9":{"ar":"وَمَا كَانَ قَوْلَهُمْ إِلَّا أَن قَالُوا رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿١٤٧﴾","en":"And their words were not but that they said, \"Our Lord, forgive us our sins and the excess [committed] in our affairs and plant firmly our feet and give us victory over the disbelieving people.\"","ru":"И не изрекали они [в тот момент] ничего, кроме слов: «Господь наш! Прости нам наши грехи и чрезмерность в наших делах, укрепи наши стопы и помоги нам против народа, отвергшего веру».","n":1,"src":[],"q":"3:147","t":{"en":"Forgive our excesses","ru":"Прости наши излишества","ar":"دعاء من القرآن"}},"q10":{"ar":"رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ ﴿١٩٣﴾ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ ﴿١٩٤﴾","en":"Our Lord, indeed we have heard a caller [i.e., Prophet Muḥammad (ﷺ)] calling to faith, [saying], 'Believe in your Lord,' and we have believed. Our Lord, so forgive us our sins and remove from us our misdeeds and cause us to die among the righteous. Our Lord, and grant us what You promised us through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in [Your] promise.\"","ru":"Господь наш! Воистину, мы услышали взывающего, который призывал к вере: «Уверуйте в своего Господа!», — и уверовали. Господь наш! Прости нам наши грехи, искупи наши дурные деяния и упокой нас вместе с благочестивыми. Господь наш! Даруй нам то, что Ты обещал нам через Своих посланников, и не посрами нас в День воскресения. Воистину, Ты не нарушаешь обещания».","n":1,"src":[],"q":"3:193–194","t":{"en":"Die with the righteous","ru":"Умереть с праведниками","ar":"دعاء من القرآن"}},"q11":{"ar":"قَالَا رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ ﴿٢٣﴾","en":"They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.\"","ru":"Они оба сказали: «Господь наш! Мы были несправедливы к самим себе, и если Ты не простишь нас и не помилуешь, мы непременно окажемся в числе потерпевших убыток».","n":1,"src":[],"q":"7:23","t":{"en":"Repentance of Adam","ru":"Покаяние Адама","ar":"دعاء من القرآن"},"note":{"en":"Adam & Hawwa","ru":"Адам и Хавва","ar":""}},"q12":{"ar":"وَإِذَا صُرِفَتْ أَبْصَارُهُمْ تِلْقَاءَ أَصْحَابِ النَّارِ قَالُوا رَبَّنَا لَا تَجْعَلْنَا مَعَ الْقَوْمِ الظَّالِمِينَ ﴿٤٧﴾","en":"And when their eyes are turned toward the companions of the Fire, they say, \"Our Lord, do not place us with the wrongdoing people.\"","ru":"И когда их взоры обратятся к обитателям адского огня, они скажут: «Господь наш! Не причисляй нас к числу людей несправедливых».","n":1,"src":[],"q":"7:47","t":{"en":"Not with the wrongdoers","ru":"Не с несправедливыми","ar":"دعاء من القرآن"}},"q13":{"ar":"وَمَا تَنقِمُ مِنَّا إِلَّا أَنْ آمَنَّا بِآيَاتِ رَبِّنَا لَمَّا جَاءَتْنَا رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ ﴿١٢٦﴾","en":"And you do not resent us except because we believed in the signs of our Lord when they came to us. Our Lord, pour upon us patience and let us die as Muslims [in submission to You].\"","ru":"И ты мстишь нам не иначе, как за то, что мы уверовали в знамения нашего Господа, когда они пришли к нам. Господь наш, ниспошли нам терпение и упокой нас покорными [Тебе]».","n":1,"src":[],"q":"7:126","t":{"en":"Pour patience on us","ru":"Ниспошли терпение","ar":"دعاء من القرآن"},"note":{"en":"The believing magicians of Pharaoh","ru":"Уверовавшие колдуны Фараона","ar":""}},"q14":{"ar":"قَالَ رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ ﴿١٥١﴾","en":"[Moses] said, \"My Lord, forgive me and my brother and admit us into Your mercy, for You are the most merciful of the merciful.\"","ru":"Он сказал: «Господь мой, прости меня и моего брата и введи нас в Свою милость. Воистину, Ты — самый милующий из милующих».","n":1,"src":[],"q":"7:151","t":{"en":"For family","ru":"За родных","ar":"دعاء من القرآن"},"note":{"en":"Musa","ru":"Муса","ar":""}},"q15":{"ar":"فَقَالُوا عَلَى اللَّهِ تَوَكَّلْنَا رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِّلْقَوْمِ الظَّالِمِينَ ﴿٨٥﴾ وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ ﴿٨٦﴾","en":"So they said, \"Upon Allāh do we rely. Our Lord, make us not [objects of] trial for the wrongdoing people And save us by Your mercy from the disbelieving people.\"","ru":"И они сказали: «На Аллаха мы уповаем. Господь наш! Не делай нас предметом испытания для несправедливых людей, и спаси нас по Твоей милости от людей, отвергших веру».","n":1,"src":[],"q":"10:85–86","t":{"en":"Not a trial for the oppressors","ru":"Не делай нас искушением","ar":"دعاء من القرآن"},"note":{"en":"The people of Musa","ru":"Народ Мусы","ar":""}},"q16":{"ar":"قَالَ رَبِّ إِنِّي أَعُوذُ بِكَ أَنْ أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ ﴿٤٧﴾","en":"[Noah] said, \"My Lord, I seek refuge in You from asking that of which I have no knowledge. And unless You forgive me and have mercy upon me, I will be among the losers.\"","ru":"Он сказал: «Господь мой! Воистину, я прибегаю к Тебе от того, чтобы просить Тебя о том, о чём у меня нет знания. И если Ты не простишь и не помилуешь меня, я окажусь из числа потерпевших убыток».","n":1,"src":[],"q":"11:47","t":{"en":"Asking only what is right","ru":"Не просить неведомого","ar":"دعاء من القرآن"},"note":{"en":"Nuh","ru":"Нух","ar":""}},"q17":{"ar":"رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِن تَأْوِيلِ الْأَحَادِيثِ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ ﴿١٠١﴾","en":"My Lord, You have given me [something] of sovereignty and taught me of the interpretation of dreams. Creator of the heavens and earth, You are my protector in this world and the Hereafter. Cause me to die a Muslim and join me with the righteous.\"","ru":"Господь мой! Ты даровал мне власть и научил меня толкованию снов. О изначально сотворивший небеса и землю! Ты — мой Покровитель в этом мире и в Последней жизни. Упокой меня покорным Тебе и причисли меня к праведникам».","n":1,"src":[],"q":"12:101","t":{"en":"Die as a Muslim","ru":"Умереть мусульманином","ar":"دعاء من القرآن"},"note":{"en":"Yusuf","ru":"Юсуф","ar":""}},"q18":{"ar":"وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا وَاجْنُبْنِي وَبَنِيَّ أَن نَّعْبُدَ الْأَصْنَامَ ﴿٣٥﴾","en":"And [mention, O Muḥammad], when Abraham said, \"My Lord, make this city [i.e., Makkah] secure and keep me and my sons away from worshipping idols.","ru":"Вот Ибрахим сказал: «Господь мой! Сделай этот город безопасным и убереги меня и моих сынов от поклонения идолам.","n":1,"src":[],"q":"14:35","t":{"en":"Protection from idols","ru":"Защита от идолов","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim","ru":"Ибрахим","ar":""}},"q19":{"ar":"رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِن ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ ﴿٤٠﴾ رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ ﴿٤١﴾","en":"My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication. Our Lord, forgive me and my parents and the believers the Day the account is established.\"","ru":"Господь мой! Сделай меня выстаивающим молитву, и [сделай выстаивающими её] из моего потомства, — Господь наш! — и прими мою мольбу. Господь наш! Прости меня, и моих родителей, и верующих — в тот День, когда наступит расчёт».","n":1,"src":[],"q":"14:40–41","t":{"en":"Prayer and parents","ru":"Намаз и родители","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim","ru":"Ибрахим","ar":""}},"q20":{"ar":"وَاخْفِضْ لَهُمَا جَنَاحَ الذُّلِّ مِنَ الرَّحْمَةِ وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا ﴿٢٤﴾","en":"And lower to them the wing of humility out of mercy and say, \"My Lord, have mercy upon them as they brought me up [when I was] small.\"","ru":"И склони пред ними крыло смирения из милосердия и говори: «Господь мой! Помилуй их, ведь они растили меня, когда я был маленьким».","n":1,"src":[],"q":"17:24","t":{"en":"For parents","ru":"За родителей","ar":"دعاء من القرآن"}},"q21":{"ar":"وَقُل رَّبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَل لِّي مِن لَّدُنكَ سُلْطَانًا نَّصِيرًا ﴿٨٠﴾","en":"And say, \"My Lord, cause me to enter a sound entrance and to exit a sound exit and grant me from Yourself a supporting authority.\"","ru":"И скажи: «Господь мой! Введи меня входом истины и выведи меня выходом истины, и даруй мне от Себя власть, [что будет] помощником».","n":1,"src":[],"q":"17:80","t":{"en":"A sound entry and exit","ru":"Достойный вход и выход","ar":"دعاء من القرآن"}},"q22":{"ar":"إِذْ أَوَى الْفِتْيَةُ إِلَى الْكَهْفِ فَقَالُوا رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا ﴿١٠﴾","en":"[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.\"","ru":"Вот юноши укрылись в пещере и сказали: «Господь наш! Даруй нам от Себя милость и устрой нам в нашем деле верный путь».","n":1,"src":[],"q":"18:10","t":{"en":"Mercy and right guidance","ru":"Милость и верный путь","ar":"دعاء من القرآن"},"note":{"en":"The youths of the cave","ru":"Юноши пещеры","ar":""}},"q23":{"ar":"قَالَ رَبِّ اشْرَحْ لِي صَدْرِي ﴿٢٥﴾ وَيَسِّرْ لِي أَمْرِي ﴿٢٦﴾ وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي ﴿٢٧﴾ يَفْقَهُوا قَوْلِي ﴿٢٨﴾","en":"[Moses] said, \"My Lord, expand [i.e., relax] for me my breast [with assurance] And ease for me my task And untie the knot from my tongue That they may understand my speech.","ru":"Он сказал: «Господь мой! Раскрой мне грудь мою, и облегчи мне дело моё, и развяжи узел с языка моего, дабы они поняли речь мою.","n":1,"src":[],"q":"20:25–28","t":{"en":"Ease and clear speech","ru":"Облегчение и ясная речь","ar":"دعاء من القرآن"},"note":{"en":"Musa","ru":"Муса","ar":""}},"q24":{"ar":"فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ وَلَا تَعْجَلْ بِالْقُرْآنِ مِن قَبْلِ أَن يُقْضَىٰ إِلَيْكَ وَحْيُهُ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴿١١٤﴾","en":"So high [above all] is Allāh, the Sovereign, the Truth. And, [O Muḥammad], do not hasten with [recitation of] the Qur’ān before its revelation is completed to you, and say, \"My Lord, increase me in knowledge.\"","ru":"Возвышен Аллах, Истинный Владыка! И не торопись с [чтением] Корана, прежде чем будет завершено внушение тебе его откровения, и скажи: «Господь мой! Приумножь моё знание».","n":1,"src":[],"q":"20:114","t":{"en":"For knowledge","ru":"О знании","ar":"دعاء من القرآن"}},"q25":{"ar":"وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ ﴿٨٣﴾","en":"And [mention] Job, when he called to his Lord, \"Indeed, adversity has touched me, and You are the most merciful of the merciful.\"","ru":"И Айюба, когда он воззвал к своему Господу: «Меня постигло бедствие, а Ты — Милостивейший из милующих!»","n":1,"src":[],"q":"21:83","t":{"en":"In illness","ru":"В болезни","ar":"دعاء من القرآن"},"note":{"en":"Ayyub","ru":"Аюб","ar":""}},"q26":{"ar":"وَذَا النُّونِ إِذ ذَّهَبَ مُغَاضِبًا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَن لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ ﴿٨٧﴾","en":"And [mention] the man of the fish [i.e., Jonah], when he went off in anger and thought that We would not decree [anything] upon him. And he called out within the darknesses, \"There is no deity except You; exalted are You. Indeed, I have been of the wrongdoers.\"","ru":"И Зу-н-Нуна, когда он ушёл в гневе и полагал, что Мы не властны над ним. И он воззвал во тьме: «Нет божества, кроме Тебя, Пречист Ты! Воистину, я был из числа несправедливых!»","n":1,"src":[],"q":"21:87","t":{"en":"In distress","ru":"В беде","ar":"دعاء من القرآن"},"note":{"en":"Yunus","ru":"Юнус","ar":""}},"q27":{"ar":"وَزَكَرِيَّا إِذْ نَادَىٰ رَبَّهُ رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ ﴿٨٩﴾","en":"And [mention] Zechariah, when he called to his Lord, \"My Lord, do not leave me alone [with no heir], while You are the best of inheritors.\"","ru":"И [помяни] Закарию, как он воззвал к своему Господу: «Господь мой! Не оставляй меня одиноким, в то время как Ты — лучший из наследующих».","n":1,"src":[],"q":"21:89","t":{"en":"Not to be left alone","ru":"Не оставаться одиноким","ar":"دعاء من القرآن"},"note":{"en":"Zakariya","ru":"Закария","ar":""}},"q28":{"ar":"وَقُل رَّبِّ أَنزِلْنِي مُنزَلًا مُّبَارَكًا وَأَنتَ خَيْرُ الْمُنزِلِينَ ﴿٢٩﴾","en":"And say, 'My Lord, let me land at a blessed landing place, and You are the best to accommodate [us].'\"","ru":"И скажи: “Господь мой! Посели меня в благословенном месте, ведь Ты — наилучший из дающих пристанище”».","n":1,"src":[],"q":"23:29","t":{"en":"A blessed landing","ru":"Благословенное место","ar":"دعاء من القرآن"},"note":{"en":"Nuh","ru":"Нух","ar":""}},"q29":{"ar":"وَقُل رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ﴿٩٧﴾ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ ﴿٩٨﴾","en":"And say, \"My Lord, I seek refuge in You from the incitements of the devils, And I seek refuge in You, my Lord, lest they be present with me.\"","ru":"Скажи: «Господь мой! Я прибегаю к Твоей защите от наущений шайтанов, и я прибегаю к Твоей защите, о Господь мой, чтобы они не являлись ко мне».","n":1,"src":[],"q":"23:97–98","t":{"en":"Refuge from devils","ru":"Защита от шайтанов","ar":"دعاء من القرآن"}},"q30":{"ar":"إِنَّهُ كَانَ فَرِيقٌ مِّنْ عِبَادِي يَقُولُونَ رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ ﴿١٠٩﴾","en":"Indeed, there was a party of My servants who said, 'Our Lord, we have believed, so forgive us and have mercy upon us, and You are the best of the merciful.'","ru":"Воистину, группа из Моих рабов говорила: «Господь наш! Мы уверовали, так прости же нам и помилуй нас, а Ты — наилучший из милующих!»","n":1,"src":[],"q":"23:109","t":{"en":"Forgiveness and mercy","ru":"Прощение и милость","ar":"دعاء من القرآن"}},"q31":{"ar":"وَقُل رَّبِّ اغْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ الرَّاحِمِينَ ﴿١١٨﴾","en":"And, [O Muḥammad], say, \"My Lord, forgive and have mercy, and You are the best of the merciful.\"","ru":"Скажи: «Господь мой! Прости и помилуй, ибо Ты — наилучший из милующих!»","n":1,"src":[],"q":"23:118","t":{"en":"The best of the merciful","ru":"Лучший из милующих","ar":"دعاء من القرآن"}},"q32":{"ar":"وَالَّذِينَ يَقُولُونَ رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَامًا ﴿٦٥﴾ إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا ﴿٦٦﴾","en":"And those who say, \"Our Lord, avert from us the punishment of Hell. Indeed, its punishment is ever adhering; Indeed, it is evil as a settlement and residence.\"","ru":"И те, которые говорят: «Господь наш! Отврати от нас наказание Геенны. Воистину, её наказание неотступно! Воистину, сколь же скверна [Геенна] как место пребывания и обитель!»","n":1,"src":[],"q":"25:65–66","t":{"en":"Protection from Hell","ru":"Защита от Ада","ar":"دعاء من القرآن"}},"q33":{"ar":"وَالَّذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا ﴿٧٤﴾","en":"And those who say, \"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us a leader [i.e., example] for the righteous.\"","ru":"И те, которые говорят: «Господь наш! Даруй нам от наших жён и нашего потомства усладу очей и сделай нас предводителями для богобоязненных».","n":1,"src":[],"q":"25:74","t":{"en":"Spouses and children","ru":"Супруги и дети","ar":"دعاء من القرآن"}},"q34":{"ar":"رَبِّ هَبْ لِي حُكْمًا وَأَلْحِقْنِي بِالصَّالِحِينَ ﴿٨٣﴾ وَاجْعَل لِّي لِسَانَ صِدْقٍ فِي الْآخِرِينَ ﴿٨٤﴾ وَاجْعَلْنِي مِن وَرَثَةِ جَنَّةِ النَّعِيمِ ﴿٨٥﴾","en":"[And he said], \"My Lord, grant me authority and join me with the righteous. And grant me a mention [i.e., reputation] of honor among later generations. And place me among the inheritors of the Garden of Pleasure.","ru":"Господь мой! Даруй мне мудрость, и причисли меня к праведникам. И даруй мне язык правды среди последующих поколений. И сделай меня из числа наследников Сада Блаженства,","n":1,"src":[],"q":"26:83–85","t":{"en":"Wisdom and Paradise","ru":"Мудрость и Рай","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim","ru":"Ибрахим","ar":""}},"q35":{"ar":"فَتَبَسَّمَ ضَاحِكًا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ ﴿١٩﴾","en":"So [Solomon] smiled, amused at her speech, and said, \"My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to do righteousness of which You approve. And admit me by Your mercy into [the ranks of] Your righteous servants.\"","ru":"И он улыбнулся, смеясь от её слов, и сказал: «Господь мой! Внуши мне быть благодарным за Твою милость, которой Ты одарил меня и моих родителей, и совершать праведное, чем Ты будешь доволен. И введи меня по Своей милости в число Своих праведных рабов».","n":1,"src":[],"q":"27:19","t":{"en":"Gratitude","ru":"Благодарность","ar":"دعاء من القرآن"},"note":{"en":"Sulayman","ru":"Сулейман","ar":""}},"q36":{"ar":"قَالَ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي فَغَفَرَ لَهُ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ ﴿١٦﴾","en":"He said, \"My Lord, indeed I have wronged myself, so forgive me,\" and He forgave him. Indeed, He is the Forgiving, the Merciful.","ru":"Он сказал: «Господь мой! Воистину, я поступил несправедливо по отношению к самому себе, так прости же меня!» И Он простил ему. Воистину, Он — Прощающий, Милующий.","n":1,"src":[],"q":"28:16","t":{"en":"After a mistake","ru":"После ошибки","ar":"دعاء من القرآن"},"note":{"en":"Musa","ru":"Муса","ar":""}},"q37":{"ar":"فَخَرَجَ مِنْهَا خَائِفًا يَتَرَقَّبُ قَالَ رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ ﴿٢١﴾","en":"So he left it, fearful and anticipating [apprehension]. He said, \"My Lord, save me from the wrongdoing people.\"","ru":"И он вышел оттуда, боясь и оглядываясь. Он сказал: «Господь мой! Спаси меня от народа несправедливого».","n":1,"src":[],"q":"28:21","t":{"en":"Safety from the oppressors","ru":"Спасение от притеснителей","ar":"دعاء من القرآن"},"note":{"en":"Musa","ru":"Муса","ar":""}},"q38":{"ar":"فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ ﴿٢٤﴾","en":"So he watered [their flocks] for them; then he went back to the shade and said, \"My Lord, indeed I am, for whatever good You would send down to me, in need.\"","ru":"И он напоил для них [их скот], а затем отошёл в тень и сказал: «Господь мой! Воистину, я нуждаюсь в любом благе, которое Ты ниспошлёшь мне».","n":1,"src":[],"q":"28:24","t":{"en":"In need","ru":"В нужде","ar":"دعاء من القرآن"},"note":{"en":"Musa","ru":"Муса","ar":""}},"q39":{"ar":"قَالَ رَبِّ انصُرْنِي عَلَى الْقَوْمِ الْمُفْسِدِينَ ﴿٣٠﴾","en":"He said, \"My Lord, support me against the corrupting people.\"","ru":"Он сказал: «Господь мой! Помоги мне против народа, творящего беззаконие».","n":1,"src":[],"q":"29:30","t":{"en":"Against the corrupt","ru":"Против нечестивцев","ar":"دعاء من القرآن"},"note":{"en":"Lut","ru":"Лут","ar":""}},"q40":{"ar":"رَبِّ هَبْ لِي مِنَ الصَّالِحِينَ ﴿١٠٠﴾","en":"My Lord, grant me [a child] from among the righteous.\"","ru":"«Господь мой! Даруй мне [потомство] из числа праведных!»","n":1,"src":[],"q":"37:100","t":{"en":"A righteous child","ru":"Праведный ребёнок","ar":"دعاء من القرآن"},"note":{"en":"Ibrahim","ru":"Ибрахим","ar":""}},"q41":{"ar":"وَوَصَّيْنَا الْإِنسَانَ بِوَالِدَيْهِ إِحْسَانًا حَمَلَتْهُ أُمُّهُ كُرْهًا وَوَضَعَتْهُ كُرْهًا وَحَمْلُهُ وَفِصَالُهُ ثَلَاثُونَ شَهْرًا حَتَّىٰ إِذَا بَلَغَ أَشُدَّهُ وَبَلَغَ أَرْبَعِينَ سَنَةً قَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ ﴿١٥﴾","en":"And We have enjoined upon man, to his parents, good treatment. His mother carried him with hardship and gave birth to him with hardship, and his gestation and weaning [period] is thirty months. [He grows] until, when he reaches maturity and reaches [the age of] forty years, he says, \"My Lord, enable me to be grateful for Your favor which You have bestowed upon me and upon my parents and to work righteousness of which You will approve and make righteous for me my offspring. Indeed, I have repented to You, and indeed, I am of the Muslims.\"","ru":"И Мы заповедали человеку добродетельное отношение к своим родителям. Мать носила его в тяготах и родила его в муках, и вынашивание его вместе с отлучением [от груди] длится тридцать месяцев. Когда же он достигает зрелости и достигает сорока лет, он говорит: «Господь мой! Внуши мне быть благодарным за Твою милость, которой Ты облагодетельс
