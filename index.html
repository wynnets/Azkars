صَلِّي إِنْ أَرَادَ ذَلِكَ.","en":"And stand up and pray if you wish.","ru":"И встаньте помолиться, если пожелаете.","n":1,"src":["muslim"],"t":{"en":"After a bad dream","ru":"После плохого сна","ar":"ما يفعل من رأى الرؤيا أو الحلم في النوم"}},"h61":{"ar":"الْحَمْدُ للَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا، وَإِلَيْهِ النُّشُورُ","en":"Praise be to Allah who gave us life after He had caused us to die, and to Him is the resurrection.","ru":"Хвала Аллаху, который оживил нас после того, как умертвил, и к Нему — воскрешение.","n":1,"src":["bukhari"],"t":{"en":"On waking up","ru":"При пробуждении","ar":"أذكار الاستيقاظ من النوم"}},"h62":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَريكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ للَّهِ، وَلاَ إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكبَرُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، رَبِّ اغْفرْ لِي","en":"There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. Glory be to Allah, praise be to Allah, there is no deity but Allah, Allah is the Greatest, and there is no might nor power except with Allah, the Most High, the Most Great. My Lord, forgive me.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. Пречист Аллах, хвала Аллаху, нет божества, кроме Аллаха, Аллах велик, и нет мощи и силы ни у кого, кроме Аллаха Высокого, Великого. Господи, прости меня.","n":1,"src":["bukhari"],"note":{"en":"Whoever says this on waking at night and then supplicates is answered; if he makes wudu and prays, his prayer is accepted.","ru":"Кто, проснувшись ночью, скажет это и попросит — получит ответ, а если совершит омовение и помолится — его намаз будет принят."},"t":{"en":"On waking up","ru":"При пробуждении","ar":"أذكار الاستيقاظ من النوم"}},"h63":{"ar":"الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي، وَرَدَّ عَلَيَّ رُوحِي، وَأَذِنَ لي بِذِكْرِهِ","en":"Praise be to Allah who restored my health to my body, returned my soul to me and permitted me to remember Him.","ru":"Хвала Аллаху, который даровал здоровье моему телу, вернул мне мою душу и позволил мне поминать Его.","n":1,"src":["tir"],"t":{"en":"On waking up","ru":"При пробуждении","ar":"أذكار الاستيقاظ من النوم"}},"h64":{"ar":"إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ ﴿١٩٠﴾ الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ ﴿١٩١﴾ رَبَّنَا إِنَّكَ مَن تُدْخِلِ النَّارَ فَقَدْ أَخْزَيْتَهُ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ ﴿١٩٢﴾ رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ ﴿١٩٣﴾ رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ ﴿١٩٤﴾ فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لَا أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَىٰ بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُوا وَأُخْرِجُوا مِن دِيَارِهِمْ وَأُوذُوا فِي سَبِيلِي وَقَاتَلُوا وَقُتِلُوا لَأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلَأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ثَوَابًا مِّنْ عِندِ اللَّهِ وَاللَّهُ عِندَهُ حُسْنُ الثَّوَابِ ﴿١٩٥﴾ لَا يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُوا فِي الْبِلَادِ ﴿١٩٦﴾ مَتَاعٌ قَلِيلٌ ثُمَّ مَأْوَاهُمْ جَهَنَّمُ وَبِئْسَ الْمِهَادُ ﴿١٩٧﴾ لَٰكِنِ الَّذِينَ اتَّقَوْا رَبَّهُمْ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا نُزُلًا مِّنْ عِندِ اللَّهِ وَمَا عِندَ اللَّهِ خَيْرٌ لِّلْأَبْرَارِ ﴿١٩٨﴾ وَإِنَّ مِنْ أَهْلِ الْكِتَابِ لَمَن يُؤْمِنُ بِاللَّهِ وَمَا أُنزِلَ إِلَيْكُمْ وَمَا أُنزِلَ إِلَيْهِمْ خَاشِعِينَ لِلَّهِ لَا يَشْتَرُونَ بِآيَاتِ اللَّهِ ثَمَنًا قَلِيلًا أُولَٰئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ إِنَّ اللَّهَ سَرِيعُ الْحِسَابِ ﴿١٩٩﴾ يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ ﴿٢٠٠﴾","en":"Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding - Who remember Allāh while standing or sitting or [lying] on their sides and give thought to the creation of the heavens and the earth, [saying], \"Our Lord, You did not create this aimlessly; exalted are You [above such a thing]; then protect us from the punishment of the Fire. Our Lord, indeed whoever You admit to the Fire - You have disgraced him, and for the wrongdoers there are no helpers. Our Lord, indeed we have heard a caller [i.e., Prophet Muḥammad (ﷺ)] calling to faith, [saying], 'Believe in your Lord,' and we have believed. Our Lord, so forgive us our sins and remove from us our misdeeds and cause us to die among the righteous. Our Lord, and grant us what You promised us through Your messengers and do not disgrace us on the Day of Resurrection. Indeed, You do not fail in [Your] promise.\" And their Lord responded to them, \"Never will I allow to be lost the work of [any] worker among you, whether male or female; you are of one another. So those who emigrated or were evicted from their homes or were harmed in My cause or fought or were killed - I will surely remove from them their misdeeds, and I will surely admit them to gardens beneath which rivers flow as reward from Allāh, and Allāh has with Him the best reward.\" Be not deceived by the [uninhibited] movement of the disbelievers throughout the land. [It is but] a small enjoyment; then their [final] refuge is Hell, and wretched is the resting place. But those who feared their Lord will have gardens beneath which rivers flow, abiding eternally therein, as accommodation from Allāh. And that which is with Allāh is best for the righteous. And indeed, among the People of the Scripture are those who believe in Allāh and what was revealed to you and what was revealed to them, [being] humbly submissive to Allāh. They do not exchange the verses of Allāh for a small price. Those will have their reward with their Lord. Indeed, Allāh is swift in account. O you who have believed, persevere and endure and remain stationed and fear Allāh that you may be successful.","ru":"Воистину, в сотворении небес и земли, в чередовании ночи и дня — знамения для обладателей разума, — тех, которые поминают Аллаха стоя, сидя и лёжа на своих боках, и размышляют о сотворении небес и земли: «Господь наш! Ты не сотворил этого попусту. Пречист Ты! Защити же нас от наказания адского огня. Господь наш! Воистину, кого Ты введёшь в адский огонь, того Ты уже опозорил, и нет у несправедливых никаких помощников. Господь наш! Воистину, мы услышали взывающего, который призывал к вере: «Уверуйте в своего Господа!», — и уверовали. Господь наш! Прости нам наши грехи, искупи наши дурные деяния и упокой нас вместе с благочестивыми. Господь наш! Даруй нам то, что Ты обещал нам через Своих посланников, и не посрами нас в День воскресения. Воистину, Ты не нарушаешь обещания». Их Господь ответил им: «Воистину, Я не теряю деяния ни одного из вас, будь то мужчина или женщина. Вы — часть друг друга. А те, которые переселились, были изгнаны из своих жилищ, подверглись страданиям на Моём пути, сражались и были убиты — Я непременно искуплю их скверные деяния и непременно введу их в сады, внизу которых текут реки, — в качестве награды от Аллаха. Аллах — у Него наилучшая награда». Пусть никоим образом не обольщает тебя то, что отвергшие веру свободно странствуют по земле, — [это лишь] временное пользование, а затем их прибежищем станет Геенна. И сколь же скверно это ложе. Но те, которые боялись своего Господа — для них сады, внизу которых текут реки, и где они пребудут вечно — как уготованное им от Аллаха. А то, что у Аллаха, — лучше для благочестивых. Воистину, среди людей Писания есть и те, кто верует в Аллаха и в то, что было ниспослано вам, и в то, что было ниспослано им, смиряясь пред Аллахом, не покупая за аяты Аллаха малую цену. Для них — награда у их Господа. Воистину, Аллах скор в расчёте. О вы, которые уверовали! Будьте терпеливы и состязайтесь в терпении, держитесь стойко и бойтесь Аллаха, — быть может, вы обретёте успех.","n":1,"src":["bm"],"note":{"en":"The Prophet ﷺ recited these verses on waking for the night prayer, looking up at the sky.","ru":"Пророк ﷺ читал эти аяты, проснувшись для ночного намаза и глядя на небо."},"t":{"en":"Al Imran 3:190–200","ru":"Али Имран 3:190–200","ar":"أذكار الاستيقاظ من النوم"}},"h72":{"ar":"بِسْمِ اللَّهِ","en":"In the name of Allah.","ru":"С именем Аллаха.","n":1,"src":["ad"],"t":{"en":"Before wudu","ru":"Перед омовением","ar":"الذكر قبل الوضوء"}},"h73":{"ar":"أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ..","en":"I bear witness that there is no deity but Allah alone, without partner, and I bear witness that Muhammad is His servant and Messenger.","ru":"Свидетельствую, что нет божества, кроме одного лишь Аллаха, у которого нет сотоварища, и свидетельствую, что Мухаммад — Его раб и посланник.","n":1,"src":["muslim"],"note":{"en":"The eight gates of Paradise are opened for him; he may enter by whichever he wishes.","ru":"Перед ним открываются восемь врат Рая, и он войдёт через любые из них."},"t":{"en":"After wudu","ru":"После омовения","ar":"الذكر بعد الفراغ من الوضوء"}},"h74":{"ar":"اللَّهُمَّ اجْعَلْنِي مِنَ التَّوَّابِينَ وَاجْعَلْنِي مِنَ الْمُتَطَهِّرِينَ","en":"O Allah, make me among those who repent and make me among those who purify themselves.","ru":"О Аллах, сделай меня из числа кающихся и из числа очищающихся.","n":1,"src":["tir"],"t":{"en":"After wudu","ru":"После омовения","ar":"الذكر بعد الفراغ من الوضوء"}},"h75":{"ar":"سُبْحانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَسْتَغْفِرُكَ وَأَتوبُ إِلَيْكَ","en":"Glory be to You, O Allah, and praise. I bear witness that there is no deity but You. I seek Your forgiveness and turn to You in repentance.","ru":"Пречист Ты, о Аллах, и хвала Тебе. Свидетельствую, что нет божества, кроме Тебя. Прошу у Тебя прощения и приношу Тебе покаяние.","n":1,"src":["nasai"],"t":{"en":"After wudu","ru":"После омовения","ar":"الذكر بعد الفراغ من الوضوء"}},"h79":{"ar":"اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً، وَفِي لِسَانِي نُوراً، وَفِي سَمْعِي نُوراً، وَفِي بَصَرِي نُوراً، وَمِنْ فَوْقِي نُوراً، وَمِنْ تَحْتِي نُوراً، وَعَنْ يَمِينِي نُوراً، وَعَنْ شِمَالِي نُوراً، وَمِنْ أَمَامِي نُوراً، وَمِنْ خَلْفِي نُوراً، وَاجْعَلْ فِي نَفْسِي نُوراً، وَأَعْظِمْ لِي نُوراً، وَعَظِّم لِي نُوراً، وَاجْعَلْ لِي نُوراً، وَاجْعَلْنِي نُوراً، اللَّهُمَّ أَعْطِنِي نُوراً، وَاجْعَلْ فِي عَصَبِي نُوراً، وَفِي لَحْمِي نُوراً، وَفِي دَمِي نُوراً، وَفِي شَعْرِي نُوراً، وَفِي بَشَرِي نُوراً(اللَّهُمَّ اجْعَلْ لِي نُوراً فِي قَبْرِي... وَنُوراً فِي عِظَامِي)(وَزِدْنِي نُوراً، وَزِدْنِي نُوراً، وَزِدْنِي نُوراً)وَهَبْ لِي نُوراً عَلَى نُورٍ","en":"O Allah, place light in my heart, light on my tongue, light in my hearing, light in my sight, light above me, light below me, light on my right, light on my left, light in front of me and light behind me. Place light in my soul, make light great for me, magnify light for me, grant me light and make me light. O Allah, give me light, and place light in my sinews, my flesh, my blood, my hair and my skin. O Allah, give me light in my grave and light in my bones. Increase me in light, increase me in light, increase me in light, and grant me light upon light.","ru":"О Аллах, помести свет в моё сердце, свет на мой язык, свет в мой слух, свет в моё зрение, свет надо мной, свет подо мной, свет справа от меня, свет слева от меня, свет передо мной и свет позади меня. Помести свет в мою душу, увеличь для меня свет, возвеличь для меня свет, дай мне свет и сделай меня светом. О Аллах, даруй мне свет и помести свет в мои жилы, мою плоть, мою кровь, мои волосы и мою кожу. О Аллах, даруй мне свет в могиле и свет в костях. Прибавь мне света, прибавь мне света, прибавь мне света и даруй мне свет поверх света.","n":1,"src":["bm"],"t":{"en":"Going to the mosque","ru":"По пути в мечеть","ar":"دعاء الذهاب إلى المسجد"}},"h80":{"ar":"يَبْدَأُ بِرِجْلِهِ الْيُمْنَى، وَيَقُولُ: أَعُوذُ بِاللَّهِ العَظِيمِ، وَبِوَجْهِهِ الْكَرِيمِ، وَسُلْطَانِهِ الْقَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ بِسْمِ اللَّهِ، وَالصَّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.","en":"Enter with the right foot and say: I seek refuge in Allah the Mighty, in His noble Face and His eternal authority from Satan the accursed. In the name of Allah, and blessings and peace be upon the Messenger of Allah. O Allah, open for me the gates of Your mercy.","ru":"Входите с правой ноги и говорите: «Прибегаю к Аллаху Великому, к Его благородному Лику и Его извечной власти от шайтана, побиваемого камнями. С именем Аллаха, благословение и мир посланнику Аллаха. О Аллах, открой мне врата Твоей милости».","n":1,"src":["muslim"],"t":{"en":"Entering the mosque","ru":"Входя в мечеть","ar":"دعاء دخول المسجد"}},"h81":{"ar":"يَبْدَأُ بِرِجْلِهِ الْيُسْرَى وَيَقُولُ: بِسْمِ اللَّهِ وَالصّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِك، اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ.","en":"Leave with the left foot and say: In the name of Allah, and blessings and peace be upon the Messenger of Allah. O Allah, I ask You of Your bounty. O Allah, protect me from Satan the accursed.","ru":"Выходите с левой ноги и говорите: «С именем Аллаха, благословение и мир посланнику Аллаха. О Аллах, прошу Тебя о Твоей милости. О Аллах, защити меня от шайтана, побиваемого камнями».","n":1,"src":["ibm"],"t":{"en":"Leaving the mosque","ru":"Выходя из мечети","ar":"دعاء الخروج من المسجد"}},"h82":{"ar":"يَقُولُ مِثْلَ مَا يَقُولُ المُؤَذِّنُ إِلاَّ فِي حَيَّ عَلَى الصَّلَاةِ وَحَيَّ عَلَى الْفَلَاحِ فَيقُولُ: لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.","en":"Repeat what the muezzin says, except for “Come to prayer” and “Come to success”, after which you say: There is no might nor power except with Allah.","ru":"Повторяйте за муэдзином, кроме слов «Спешите на молитву» и «Спешите к успеху», после которых говорите: «Нет мощи и силы ни у кого, кроме Аллаха».","n":1,"src":["bm"],"t":{"en":"The adhan","ru":"Азан","ar":"أذكار الآذان"}},"h83":{"ar":"يَقُولُ: وَأَنَا أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ وَأَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ، رَضِيتُ بِاللَّهِ رَبَّاً، وَبِمُحَمَّدٍ رَسُولاً، وَبِالْإِسْلاَمِ دِينَاً يَقُولُ ذَلِكَ عَقِبَ تَشَهُّدِ الْمُؤَذِّنِ.","en":"And I bear witness that there is no deity but Allah alone, without partner, and that Muhammad is His servant and Messenger. I am pleased with Allah as my Lord, with Muhammad as Messenger and with Islam as my religion. (Said after the muezzin’s testimony of faith.)","ru":"«И я свидетельствую, что нет божества, кроме одного лишь Аллаха, у которого нет сотоварища, и что Мухаммад — Его раб и посланник. Я доволен Аллахом как Господом, Мухаммадом как посланником и исламом как религией». (Говорится после свидетельства муэдзина.)","n":1,"src":["muslim"],"note":{"en":"His sins are forgiven.","ru":"Ему прощаются грехи."},"t":{"en":"The adhan","ru":"Азан","ar":"أذكار الآذان"}},"h84":{"ar":"يُصَلِّي عَلَى النَّبِيِّ صلى الله عليه وسلم بَعْدَ فَرَاغِهِ مِنْ إِجَابَةِ الْمُؤَذِّنِ.","en":"Send blessings upon the Prophet ﷺ after finishing your reply to the muezzin.","ru":"Благословите Пророка ﷺ, закончив отвечать муэдзину.","n":1,"src":["muslim"],"t":{"en":"The adhan","ru":"Азан","ar":"أذكار الآذان"}},"h85":{"ar":"يَقُولُ: اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلاَةِ الْقَائِمَةِ، آتِ مُحَمَّداً الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامَاً مَحمُوداً الَّذِي وَعَدْتَهُ، إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ.","en":"O Allah, Lord of this perfect call and of the prayer about to be established, grant Muhammad al-Wasilah and excellence, and raise him to the praised station You promised him. Indeed, You do not break Your promise.","ru":"О Аллах, Господь этого совершенного призыва и наступающего намаза, даруй Мухаммаду аль-василя и достоинство и вознеси его на славное место, которое Ты ему обещал. Поистине, Ты не нарушаешь обещаний.","n":1,"src":["bukhari"],"note":{"en":"My intercession becomes due for him on the Day of Resurrection.","ru":"Ему будет положено моё заступничество в День воскресения."},"t":{"en":"The adhan","ru":"Азан","ar":"أذكار الآذان"}},"h86":{"ar":"يَدْعُو لِنَفسِهِ بَيْنَ الْأَذَانِ وَالْإِقَامَةِ فَإِنَّ الدُّعَاءَ حِينَئِذٍ لاَ يُرَدُّ.","en":"Supplicate for yourself between the adhan and the iqamah, for a supplication made then is not rejected.","ru":"Просите для себя между азаном и икамой: мольба в это время не отвергается.","n":1,"src":["tir"],"t":{"en":"The adhan","ru":"Азан","ar":"أذكار الآذان"}},"h87":{"ar":"اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ، اللَّهُمَّ نَقِّنِي مِنْ خَطَايَايَ كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ، اللَّهُمَّ اغْسِلْني مِنْ خَطَايَايَ، بِالثَّلْجِ وَالْماءِ وَالْبَرَدِ.","en":"O Allah, distance me from my sins as You have distanced the east from the west. O Allah, cleanse me of my sins as a white garment is cleansed of dirt. O Allah, wash away my sins with snow, water and hail.","ru":"О Аллах, отдали меня от моих грехов, как Ты отдалил восток от запада. О Аллах, очисти меня от моих грехов, как очищается белая одежда от грязи. О Аллах, омой меня от моих грехов снегом, водой и градом.","n":1,"src":["bm"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"}},"h88":{"ar":"سُبْحانَكَ اللَّهُمَّ وَبِحَمْدِكَ، وَتَبارَكَ اسْمُكَ، وَتَعَالَى جَدُّكَ، وَلاَ إِلَهَ غَيْرُكَ.","en":"Glory be to You, O Allah, and praise. Blessed is Your name, exalted is Your majesty, and there is no deity besides You.","ru":"Пречист Ты, о Аллах, и хвала Тебе. Благословенно Твоё имя, превыше всего Твоё величие, и нет божества, кроме Тебя.","n":1,"src":["ad","tir"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"}},"h89":{"ar":"وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَوَاتِ وَالأَرْضَ حَنِيفَاً وَمَا أَنَا مِنَ الْمُشْرِكِينَ، إِنَّ صَلاَتِي، وَنُسُكِي، وَمَحْيَايَ، وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ، لاَ شَرِيكَ لَهُ وَبِذَلِكَ أُمِرْتُ وَأَنَا مِنَ الْمُسْلِمِينَ. اللَّهُمَّ أَنْتَ المَلِكُ لاَ إِلَهَ إِلاَّ أَنْتَ، أَنْتَ رَبِّي وَأَنَا عَبْدُكَ، ظَلَمْتُ نَفْسِي وَاعْتَرَفْتُ بِذَنْبِي فَاغْفِرْ لِي ذُنُوبي جَمِيعَاً إِنَّهُ لاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ. وَاهْدِنِي لِأَحْسَنِ الأَخْلاقِ لاَ يَهْدِي لِأَحْسَنِها إِلاَّ أَنْتَ، وَاصْرِفْ عَنِّي سَيِّئَهَا، لاَ يَصْرِفُ عَنِّي سَيِّئَهَا إِلاَّ أَنْتَ، لَبَّيْكَ وَسَعْدَيْكَ، وَالخَيْرُ كُلُّهُ بِيَدَيْكَ، وَالشَّرُّ لَيْسَ إِلَيْكَ، أَنَا بِكَ وَإِلَيْكَ، تَبارَكْتَ وَتَعَالَيْتَ، أَسْتَغْفِرُكَ وَأَتوبُ إِلَيْكَ.","en":"I have turned my face to the One who created the heavens and the earth, inclining to truth, and I am not of the polytheists. My prayer, my sacrifice, my life and my death are for Allah, Lord of the worlds, who has no partner; this I have been commanded and I am of the Muslims. O Allah, You are the King; there is no deity but You. You are my Lord and I am Your servant. I have wronged myself and I confess my sin, so forgive all my sins, for none forgives sins but You. Guide me to the best of character, for none guides to the best of it but You, and turn its evil away from me, for none turns its evil away but You. Here I am at Your service. All good is in Your hands and evil is not attributed to You. I exist by You and return to You. Blessed and exalted are You. I seek Your forgiveness and turn to You.","ru":"Я обратил своё лицо к Тому, кто сотворил небеса и землю, будучи единобожником, и я не из многобожников. Мой намаз, моё жертвоприношение, моя жизнь и моя смерть принадлежат Аллаху, Господу миров, у которого нет сотоварища. Это мне велено, и я — из мусульман. О Аллах, Ты — Царь, нет божества, кроме Тебя. Ты — мой Господь, а я — Твой раб. Я был несправедлив к себе и признаю свой грех, так прости же мне все грехи, ведь никто не прощает грехов, кроме Тебя. Наставь меня к лучшему нраву, ведь никто не наставит к лучшему, кроме Тебя, и отврати от меня дурной нрав, ведь никто не отвратит его, кроме Тебя. Вот я перед Тобой, всё благо — в Твоих руках, а зло не приписывается Тебе. Я существую благодаря Тебе и возвращаюсь к Тебе. Благословен Ты и превыше всего. Прошу у Тебя прощения и каюсь перед Тобой.","n":1,"src":["muslim"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"}},"h90":{"ar":"اللَّهُمَّ رَبَّ جِبْرَائِيلَ، وَمِيْكَائِيلَ، وَإِسْرَافِيلَ، فَاطِرَ السَّمَوَاتِ وَالأَرْضِ، عَالِمَ الغَيْبِ وَالشَّهَادَةِ أَنْتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِيمَا كَانُوا فِيهِ يَخْتَلِفُونَ. اهْدِنِي لِمَا اخْتُلِفَ فِيهِ مِنَ الْحَقِّ بِإِذْنِكَ إِنَّكَ تَهْدِي مَنْ تَشَاءُ إِلَى صِرَاطٍ مُسْتَقيمٍ.","en":"O Allah, Lord of Jibril, Mika’il and Israfil, Originator of the heavens and the earth, Knower of the unseen and the seen, You judge between Your servants in what they differ. Guide me, by Your permission, to the truth in what has been disputed. Indeed, You guide whom You will to a straight path.","ru":"О Аллах, Господь Джибриля, Микаиля и Исрафиля, Творец небес и земли, Знающий сокрытое и явное! Ты рассудишь Своих рабов в том, в чём они расходились. Наставь меня, с Твоего позволения, к истине в том, в чём разошлись. Поистине, Ты наставляешь на прямой путь, кого пожелаешь.","n":1,"src":["muslim"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"}},"h91":{"ar":"اللَّهُ أَكْبَرُ كَبِيرَاً، اللَّهُ أَكْبَرُ كَبِيراً، اللَّهُ أَكْبَرُ كَبِيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَالْحَمْدُ لِلَّهِ كَثيراً، وَسُبْحَانَ اللَّهِ بُكْرَةً وَأَصِيلاً ثَلاثاً أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ: مِنْ نَفْخِهِ، وَنَفْثِهِ، وَهَمْزِهِ.","en":"Allah is the Greatest, truly great (×3). Praise be to Allah, abundantly (×3). Glory be to Allah morning and evening (×3). I seek refuge in Allah from Satan: from his pride, his poetry and his madness.","ru":"Аллах велик, велик безмерно (×3). Хвала Аллаху обильная (×3). Пречист Аллах утром и вечером (×3). Прибегаю к Аллаху от шайтана: от его высокомерия, его стихов и его безумия.","n":1,"src":["ad"],"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"}},"h92":{"ar":"اللَّهُمَّ لَكَ الْحَمْدُ، أَنْتَ نُورُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ قَيِّمُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ، وَلَكَ الْحَمْدُ أَنْتَ رَبُّ السَّمَواتِ وَالأَرْضِ وَمَنْ فِيهِنَّ وَلَكَ الْحَمْدُ لَكَ مُلْكُ السَّمَوَاتِ وَالأَرْضِ وَمَنْ فِيهِنَّ وَلَكَ الْحَمْدُ أَنْتَ مَلِكُ السَّمَوَاتِ وَالأَرْضِ وَلَكَ الْحَمْدُ أَنْتَ الْحَقُّ، وَوَعْدُكَ الْحَقُّ، وَقَوْلُكَ الْحَقُّ، وَلِقاؤُكَ الْحَقُّ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، وَالنَّبِيُّونَ حَقٌّ، وَمحَمَّدٌ صلى الله عليه وسلم حَقٌّ، وَالسّاعَةُ حَقٌّ اللَّهُمَّ لَكَ أَسْلَمتُ، وَعَلَيْكَ تَوَكَّلْتُ، وَبِكَ آمَنْتُ، وَإِلَيْكَ أَنَبْتُ، وَبِكَ خاصَمْتُ، وَإِلَيْكَ حاكَمْتُ. فَاغْفِرْ لِي مَا قَدَّمْتُ، وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي أَنْتَ المُقَدِّمُ، وَأَنْتَ المُؤَخِّرُ لاَ إِلَهَ إِلاَّ أَنْتَ أَنْتَ إِلَهِي لاَ إِلَهَ إِلاَّ أَنْتَ وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.","en":"O Allah, to You is praise; You are the Light of the heavens and the earth and all within them. To You is praise; You are the Sustainer of the heavens and the earth and all within them. To You is praise; You are the Lord of the heavens and the earth and all within them; to You belongs their dominion, and You are their King. To You is praise. You are the Truth, Your promise is true, Your word is true, meeting You is true, Paradise is true, the Fire is true, the prophets are true, Muhammad ﷺ is true and the Hour is true. O Allah, to You I submit, in You I trust, in You I believe, to You I turn, by You I argue and to You I bring judgement. So forgive me what I have done before and after, what I have hidden and made public, and what You know better than I. You bring forward and You put back; there is no deity but You. You are my God; there is no deity but You, and there is no might nor power except with Allah.","ru":"О Аллах, Тебе хвала, Ты — Свет небес, земли и всех, кто на них. Тебе хвала, Ты — Хранитель небес, земли и всех, кто на них. Тебе хвала, Ты — Господь небес, земли и всех, кто на них, Тебе принадлежит власть над ними, и Ты — их Царь. Тебе хвала. Ты — Истина, Твоё обещание — истина, Твоё слово — истина, встреча с Тобой — истина, Рай — истина, Огонь — истина, пророки — истина, Мухаммад ﷺ — истина, и Час — истина. О Аллах, Тебе я покорился, на Тебя положился, в Тебя уверовал, к Тебе обратился, Тобой спорил и к Твоему суду прибег. Прости же мне то, что я совершил прежде и потом, что скрыл и сделал явно, и то, о чём Ты знаешь лучше меня. Ты выдвигаешь вперёд и отодвигаешь назад, нет божества, кроме Тебя. Ты — мой Бог, нет божества, кроме Тебя, и нет мощи и силы ни у кого, кроме Аллаха.","n":1,"src":["bm"],"note":{"en":"Said in the night prayer (tahajjud).","ru":"Говорится в ночном намазе (тахаджуд)."},"t":{"en":"Opening the prayer","ru":"Начало намаза","ar":"دعاء الاستفتاح"}},"h93":{"ar":"سُبْحانَ رَبِّيَ الْعَظِيمِ. ثلاث مرَّاتٍ.","en":"Glory be to my Lord, the Most Great.","ru":"Пречист мой Господь Великий.","n":3,"src":["ad","tir"],"t":{"en":"In ruku (bowing)","ru":"В поясном поклоне","ar":"دعاء الركوع"}},"h94":{"ar":"سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي.","en":"Glory be to You, O Allah, our Lord, and praise. O Allah, forgive me.","ru":"Пречист Ты, о Аллах, Господь наш, и хвала Тебе. О Аллах, прости меня.","n":1,"src":["bm"],"t":{"en":"In ruku (bowing)","ru":"В поясном поклоне","ar":"دعاء الركوع"}},"h95":{"ar":"سُبُّوُحٌ، قُدُّوسٌ، رَبُّ المَلاَئِكَةِ وَالرُّوحِ.","en":"Perfect, Most Holy, Lord of the angels and the Spirit.","ru":"Пречистый, Святой, Господь ангелов и Духа.","n":1,"src":["muslim"],"t":{"en":"In ruku (bowing)","ru":"В поясном поклоне","ar":"دعاء الركوع"}},"h96":{"ar":"اللَّهُمَّ لَكَ رَكَعْتُ، وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، خَشَعَ لَكَ سَمْعِي، وَبَصَرِي، وَمُخِّي، وَعَظْمِي، وَعَصَبِي، وَمَا استَقَلَّتْ بِهِ قَدَمِي.","en":"O Allah, to You I have bowed, in You I believe and to You I submit. My hearing, my sight, my mind, my bones, my sinews and whatever my feet carry are humbled before You.","ru":"О Аллах, Тебе я поклонился, в Тебя уверовал и Тебе покорился. Смирились перед Тобой мой слух, моё зрение, мой мозг, мои кости, мои жилы и всё, что носят мои ноги.","n":1,"src":["muslim"],"t":{"en":"In ruku (bowing)","ru":"В поясном поклоне","ar":"دعاء الركوع"}},"h97":{"ar":"سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ.","en":"Glory be to the Possessor of might, dominion, grandeur and majesty.","ru":"Пречист Обладатель могущества, власти, величия и мощи.","n":1,"src":["ad"],"t":{"en":"In ruku (bowing)","ru":"В поясном поклоне","ar":"دعاء الركوع"}},"h98":{"ar":"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ.","en":"Allah hears the one who praises Him.","ru":"Аллах слышит того, кто воздаёт Ему хвалу.","n":1,"src":["bukhari"],"t":{"en":"Rising from ruku","ru":"Выпрямляясь после поклона","ar":"دعاء الرفع من الركوع"}},"h99":{"ar":"رَبَّنَا وَلَكَ الْحَمْدُ، حَمْداً كَثيراً طَيِّباً مُبارَكاً فِيهِ.","en":"Our Lord, and to You is praise: abundant, good and blessed praise.","ru":"Господь наш, Тебе хвала — хвала обильная, благая и благословенная.","n":1,"src":["bukhari"],"t":{"en":"Rising from ruku","ru":"Выпрямляясь после поклона","ar":"دعاء الرفع من الركوع"}},"h100":{"ar":"مِلْءَ السَّمَوَاتِ وَمِلْءَ الأَرْضِ، وَمَا بَيْنَهُمَا، وَمِلْءَ مَا شِئْتَ مِنْ شَيءٍ بَعْدُ. أَهلَ الثَّناءِ وَالْمَجْدِ، أَحَقُّ مَا قَالَ الْعَبْدُ، وَكُلُّنَا لَكَ عَبْدٌ. اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الجَدِّ مِنْكَ الجَدُّ.","en":"Filling the heavens and the earth and all between them, and filling whatever else You will. O Worthy of praise and glory, the truest thing a servant has said, and we are all Your servants: O Allah, none can withhold what You give, none can give what You withhold, and the wealth of the wealthy cannot avail him against You.","ru":"Хвала, наполняющая небеса, землю и то, что между ними, и всё, что Ты пожелаешь после этого. О Достойный хвалы и славы! Это самое верное из того, что говорил раб, и все мы — Твои рабы. О Аллах, никто не лишит того, что Ты даровал, никто не даст того, чего Ты лишил, и богатство не поможет богатому перед Тобой.","n":1,"src":["muslim"],"t":{"en":"Rising from ruku","ru":"Выпрямляясь после поклона","ar":"دعاء الرفع من الركوع"}},"h101":{"ar":"سُبْحَانَ رَبِّيَ الأَعْلَى ثلاث مرَّاتٍ.","en":"Glory be to my Lord, the Most High.","ru":"Пречист мой Господь Всевышний.","n":3,"src":["ad","tir"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h102":{"ar":"سُبْحَانَكَ اللَّهُمَّ رَبَّنَا وَبِحَمْدِكَ، اللَّهُمَّ اغْفِرْ لِي.","en":"Glory be to You, O Allah, our Lord, and praise. O Allah, forgive me.","ru":"Пречист Ты, о Аллах, Господь наш, и хвала Тебе. О Аллах, прости меня.","n":1,"src":["bm"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h103":{"ar":"سُبوحٌ، قُدُّوسٌ، رَبُّ الْمَلَائِكَةِ وَالرُّوحِ.","en":"Perfect, Most Holy, Lord of the angels and the Spirit.","ru":"Пречистый, Святой, Господь ангелов и Духа.","n":1,"src":["muslim"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h104":{"ar":"اللَّهُمَّ لَكَ سَجَدْتُ وَبِكَ آمَنْتُ، وَلَكَ أَسْلَمْتُ، سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَصَوَّرَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ، تَبَارَكَ اللَّهُ أَحْسنُ الْخَالِقينَ.","en":"O Allah, to You I have prostrated, in You I believe and to You I submit. My face has prostrated to the One who created it, shaped it and opened its hearing and sight. Blessed is Allah, the best of creators.","ru":"О Аллах, Тебе я сделал земной поклон, в Тебя уверовал и Тебе покорился. Моё лицо склонилось перед Тем, кто создал его, придал ему облик и открыл в нём слух и зрение. Благословен Аллах, наилучший из творцов.","n":1,"src":["muslim"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h105":{"ar":"سُبْحَانَ ذِي الْجَبَرُوتِ، وَالْمَلَكُوتِ، وَالْكِبْرِيَاءِ، وَالْعَظَمَةِ.","en":"Glory be to the Possessor of might, dominion, grandeur and majesty.","ru":"Пречист Обладатель могущества, власти, величия и мощи.","n":1,"src":["ad"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h106":{"ar":"اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ: دِقَّهُ وَجِلَّهُ، وَأَوَّلَهُ وَآخِرَهُ، وَعَلاَنِيَّتَهُ وَسِرَّهُ.","en":"O Allah, forgive me all my sins, the small and the great, the first and the last, the open and the secret.","ru":"О Аллах, прости мне все мои грехи — малые и великие, первые и последние, явные и тайные.","n":1,"src":["muslim"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h107":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لاَ أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.","en":"O Allah, I seek refuge in Your pleasure from Your anger, in Your pardon from Your punishment, and I seek refuge in You from You. I cannot count Your praise; You are as You have praised Yourself.","ru":"О Аллах, прибегаю к Твоему довольству от Твоего гнева, к Твоему прощению от Твоего наказания и прибегаю к Тебе от Тебя. Я не в силах исчислить хвалу Тебе. Ты таков, каким восхвалил Себя Сам.","n":1,"src":["muslim"],"t":{"en":"In sujud (prostration)","ru":"В земном поклоне","ar":"دعاء السجود"}},"h108":{"ar":"رَبِّ اغْفِرْ لِي، رَبِّ اغْفِرْ لِي.","en":"My Lord, forgive me. My Lord, forgive me.","ru":"Господи, прости меня. Господи, прости меня.","n":1,"src":["ad"],"t":{"en":"Between the prostrations","ru":"Между земными поклонами","ar":"دعاء الجلسة بين السجدتين"}},"h109":{"ar":"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَاهْدِنِي، وَاجْبُرْنِي، وَعَافِنِي، وَارْزُقْنِي، وَارْفَعْنِي.","en":"O Allah, forgive me, have mercy on me, guide me, mend me, grant me well-being, provide for me and raise me.","ru":"О Аллах, прости меня, помилуй меня, наставь меня, поправь мои дела, даруй мне благополучие, надели меня уделом и возвысь меня.","n":1,"src":["ad","tir"],"t":{"en":"Between the prostrations","ru":"Между земными поклонами","ar":"دعاء الجلسة بين السجدتين"}},"h110":{"ar":"سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ، وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ، ﴿فَتَبارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾.","en":"My face has prostrated to the One who created it and opened its hearing and sight by His might and power. So blessed is Allah, the best of creators.","ru":"Моё лицо склонилось перед Тем, кто создал его и открыл в нём слух и зрение Своей мощью и силой. Благословен же Аллах, наилучший из творцов.","n":1,"src":["tir"],"note":{"en":"Said in the prostration of Quran recitation (sajdat at-tilawah).","ru":"Говорится в земном поклоне при чтении Корана (саджда тилява)."},"t":{"en":"Prostration of recitation","ru":"Поклон при чтении Корана","ar":"دعاء سجود التلاوة"}},"h111":{"ar":"اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْراً، وَضَعْ عَنِّي بِهَا وِزْراً، وَاجْعَلْهَا لِي عِنْدَكَ ذُخْراً، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.","en":"O Allah, record for me a reward with You for it, remove a burden from me by it, make it a treasure for me with You, and accept it from me as You accepted it from Your servant Dawud.","ru":"О Аллах, запиши мне за него награду у Тебя, сними с меня за него бремя греха, сделай его моим сокровищем у Тебя и прими его от меня, как Ты принял его от Твоего раба Дауда.","n":1,"src":["tir"],"t":{"en":"Prostration of recitation","ru":"Поклон при чтении Корана","ar":"دعاء سجود التلاوة"}},"h112":{"ar":"التَّحِيَّاتُ لِلَّهِ، وَالصَّلَواتُ، وَالطَّيِّباتُ، السَّلاَمُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلاَمُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ. أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَشْهَدُ أَنَّ مُحَمَّداً عَبْدُهُ وَرَسولُهُ.","en":"All greetings, prayers and good things are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no deity but Allah, and I bear witness that Muhammad is His servant and Messenger.","ru":"Приветствия, молитвы и благие слова — Аллаху. Мир тебе, о Пророк, милость Аллаха и Его благословение. Мир нам и праведным рабам Аллаха. Свидетельствую, что нет божества, кроме Аллаха, и свидетельствую, что Мухаммад — Его раб и посланник.","n":1,"src":["bm"],"t":{"en":"Tashahhud","ru":"Ташаххуд","ar":"التشهد"}},"h113":{"ar":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ، وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيتَ عَلَى إِبْرَاهِيمَ، وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ.","en":"O Allah, send prayers upon Muhammad and the family of Muhammad, as You sent prayers upon Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious. O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious.","ru":"О Аллах, благослови Мухаммада и семейство Мухаммада, как Ты благословил Ибрахима и семейство Ибрахима, ведь Ты — Достойный хвалы, Славный. О Аллах, ниспошли благодать Мухаммаду и семейству Мухаммада, как Ты ниспослал её Ибрахиму и семейству Ибрахима, ведь Ты — Достойный хвалы, Славный.","n":1,"src":["bukhari"],"t":{"en":"Salawat after tashahhud","ru":"Салават после ташаххуда","ar":"الصلاة على النبي بعد التشهد"}},"h114":{"ar":"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى أَزْوَاجِهِ وَذُرِّيَّتِهِ، كَمَا صَلَّيْتَ عَلَى آلِ إِبْرَاهِيمَ. وَبَارِكْ عَلَى مُحَمَّدٍ وَعَلَى أَزْواجِهِ وَذُرِّيَّتِهِ، كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ. إِنَّكَ حَمِيدٌ مَجِيدٌ.","en":"O Allah, send prayers upon Muhammad, his wives and his descendants, as You sent prayers upon the family of Ibrahim, and bless Muhammad, his wives and his descendants, as You blessed the family of Ibrahim. You are Praiseworthy, Glorious.","ru":"О Аллах, благослови Мухаммада, его жён и потомков, как Ты благословил семейство Ибрахима, и ниспошли благодать Мухаммаду, его жёнам и потомкам, как Ты ниспослал её семейству Ибрахима. Поистине, Ты — Достойный хвалы, Славный.","n":1,"src":["bm"],"t":{"en":"Salawat after tashahhud","ru":"Салават после ташаххуда","ar":"الصلاة على النبي بعد التشهد"}},"h115":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَمِنْ عَذَابِ جَهَنَّمَ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ.","en":"O Allah, I seek refuge in You from the punishment of the grave, from the punishment of Hell, from the trials of life and death, and from the evil of the trial of the False Messiah.","ru":"О Аллах, прибегаю к Тебе от мучений в могиле, от мучений Ада, от искушений жизни и смерти и от зла искушения Даджаля.","n":1,"src":["muslim"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h116":{"ar":"اللَّهُمَّ إِنِّي أَعوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، وَأَعوذُ بِكَ مِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ، وَأَعوذُ بِكَ مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ. اللَّهُمَّ إِنِّي أَعوذُ بِكَ مِنَ الْمَأْثَمِ وَالْمَغْرَمِ.","en":"O Allah, I seek refuge in You from the punishment of the grave, from the trial of the False Messiah and from the trials of life and death. O Allah, I seek refuge in You from sin and from debt.","ru":"О Аллах, прибегаю к Тебе от мучений в могиле, от искушения Даджаля и от искушений жизни и смерти. О Аллах, прибегаю к Тебе от греха и от долгов.","n":1,"src":["bm"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h117":{"ar":"اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْماً كَثِيراً، وَلاَ يَغْفِرُ الذُّنوبَ إِلاَّ أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ وَارْحَمْنِي، إِنَّكَ أَنْتَ الغَفورُ الرَّحيمُ.","en":"O Allah, I have greatly wronged myself, and none forgives sins but You, so forgive me with forgiveness from You and have mercy on me. Indeed, You are the Forgiving, the Merciful.","ru":"О Аллах, я много раз был несправедлив к себе, а грехи прощаешь только Ты. Так прости же меня прощением от Тебя и помилуй меня, ведь Ты — Прощающий, Милосердный.","n":1,"src":["bm"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h118":{"ar":"اللَّهُمَّ اغْفِرْ لِي مَا قَدَّمْتُ، وَمَا أَخَّرْتُ، وَمَا أَسْرَرْتُ، وَمَا أَعْلَنْتُ، وَمَا أَسْرَفْتُ، وَمَا أَنْتَ أَعْلَمُ بِهِ مِنِّي. أَنْتَ الْمُقَدِّمُ، وَأَنْتَ الْمُؤَخِّرُ لاَ إِلَهَ إِلاَّ أَنْتَ.","en":"O Allah, forgive me what I have done before and after, what I have done in secret and in public, what I have done to excess, and what You know better than I. You bring forward and You put back; there is no deity but You.","ru":"О Аллах, прости мне то, что я совершил прежде и потом, что скрыл и сделал явно, в чём преступил меру, и то, о чём Ты знаешь лучше меня. Ты выдвигаешь вперёд и отодвигаешь назад, нет божества, кроме Тебя.","n":1,"src":["muslim"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h119":{"ar":"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبادَتِكَ.","en":"O Allah, help me to remember You, to thank You, and to worship You well.","ru":"О Аллах, помоги мне поминать Тебя, благодарить Тебя и должным образом поклоняться Тебе.","n":1,"src":["ad"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h120":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْبُخْلِ، وَأَعوذُ بِكَ مِنَ الْجُبْنِ، وَأَعُوذُ بِكَ مِنْ أَنْ أُرَدَّ إِلَى أَرْذَلِ الْعُمُرِ، وَأَعُوذُ بِكَ مِنْ فِتْنَةِ الدُّنْيَا وَعَذَابِ الْقَبْرِ.","en":"O Allah, I seek refuge in You from miserliness, I seek refuge in You from cowardice, I seek refuge in You from being returned to the most decrepit old age, and I seek refuge in You from the trials of this world and the punishment of the grave.","ru":"О Аллах, прибегаю к Тебе от скупости, прибегаю к Тебе от трусости, прибегаю к Тебе от того, чтобы дожить до самой немощной старости, и прибегаю к Тебе от искушений этого мира и мучений в могиле.","n":1,"src":["bukhari"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h121":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ.","en":"O Allah, I ask You for Paradise and I seek refuge in You from the Fire.","ru":"О Аллах, прошу Тебя о Рае и прибегаю к Тебе от Огня.","n":1,"src":["ad"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h122":{"ar":"اللَّهُمَّ بِعِلْمِكَ الغَيْبَ وَقُدْرَتِكَ عَلَى الْخَلقِ أَحْيِنِي مَا عَلِمْتَ الْحَيَاةَ خَيْراً لِي، وَتَوَفَّنِي إِذَا عَلِمْتَ الْوَفَاةَ خَيْراً لِي، اللَّهُمَّ إِنِّي أَسْأَلُكَ خَشْيَتَكَ فِي الْغَيْبِ وَالشَّهَادَةِ، وَأَسْأَلُكَ كَلِمَةَ الْحَقِّ فِي الرِّضَا وَالْغَضَبِ، وَأَسْأَلُكَ الْقَصْدَ فِي الْغِنَى وَالْفَقْرِ، وَأَسْأَلُكَ نَعِيماً لاَ يَنْفَدُ، وَأَسْأَلُكَ قُرَّةَ عَيْنٍ لاَ تَنْقَطِعُ، وَأَسْأَلُكَ الرِّضَا بَعْدَ الْقَضَاءِ، وَأَسْأَلُكَ بَرْدَ الْعَيْشِ بَعْدَ الْمَوْتِ، وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقائِكَ فِي غَيرِ ضَرَّاءَ مُضِرَّةٍ، وَلاَ فِتْنَةٍ مُضِلَّةٍ، اللَّهُمَّ زَيِّنَا بِزِينَةِ الإِيمَانِ، وَاجْعَلْنَا هُدَاةً مُهْتَدِينَ.","en":"O Allah, by Your knowledge of the unseen and Your power over creation, keep me alive as long as You know life is good for me, and take me when You know death is good for me. O Allah, I ask You for fear of You in private and in public, for the word of truth in contentment and in anger, for moderation in wealth and in poverty, for blessing that does not run out, and for joy that does not cease. I ask You for contentment after Your decree, for a cool, pleasant life after death, for the delight of looking at Your Face and for longing to meet You, without harmful distress or misleading trial. O Allah, adorn us with the beauty of faith and make us guides who are rightly guided.","ru":"О Аллах, Своим знанием сокровенного и Своей властью над творениями сохрани мне жизнь, пока Ты знаешь, что жизнь для меня лучше, и упокой меня, когда Ты будешь знать, что смерть для меня лучше. О Аллах, прошу Тебя о страхе перед Тобой втайне и открыто, о слове истины в довольстве и в гневе, об умеренности в богатстве и в бедности, о неиссякаемой благодати и о непрекращающейся радости. Прошу Тебя о довольстве после свершения предопределённого, о прохладе жизни после смерти, о наслаждении взглядом на Твой Лик и о стремлении к встрече с Тобой без губительной беды и вводящего в заблуждение искушения. О Аллах, укрась нас красотой веры и сделай нас наставляющими и наставленными.","n":1,"src":["nasai"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h123":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا أَللَّهُ بِأَنَّكَ الْوَاحِدُ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يولَدْ، وَلَمْ يَكنْ لَهُ كُفُواً أَحَدٌ، أَنْ تَغْفِرَ لِي ذُنُوبِي إِنَّكَ أَنْتَ الْغَفُورُ الرَّحِّيمُ.","en":"O Allah, I ask You, O Allah, as You are the One, the Unique, the Eternal Refuge, who neither begets nor is born, and there is none comparable to Him, to forgive me my sins. Indeed, You are the Forgiving, the Merciful.","ru":"О Аллах, прошу Тебя, о Аллах, Единый, Единственный, Самодостаточный, Который не родил и не был рождён и Которому нет равного, прости мне мои грехи, ведь Ты — Прощающий, Милосердный.","n":1,"src":["nasai"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h124":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ لَا إِلَهَ إِلاَّ أَنْتَ وَحْدَكَ لاَ شَرِيكَ لَكَ، الْمَنَّانُ، يَا بَدِيعَ السَّمَوَاتِ وَالْأَرْضِ يَا ذَا الْجَلاَلِ وَالْإِكْرَامِ، يَا حَيُّ يَا قَيُّومُ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ.","en":"O Allah, I ask You, for to You belongs all praise; there is no deity but You alone, without partner, the Bestower of favours. O Originator of the heavens and the earth, O Possessor of Majesty and Honour, O Ever-Living, O Sustainer, I ask You for Paradise and I seek refuge in You from the Fire.","ru":"О Аллах, прошу Тебя, ведь Тебе принадлежит хвала, нет божества, кроме Тебя одного, у Тебя нет сотоварища, о Дарующий блага! О Создатель небес и земли, о Обладатель величия и щедрости, о Живой, о Поддерживающий жизнь, прошу Тебя о Рае и прибегаю к Тебе от Огня.","n":1,"src":["ad"],"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h125":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ لاَ إِلَهَ إِلاَّ أَنْتَ الْأَحَدُ الصَّمَدُ الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ .","en":"O Allah, I ask You, bearing witness that You are Allah; there is no deity but You, the One, the Eternal Refuge, who neither begets nor is born, and there is none comparable to Him.","ru":"О Аллах, прошу Тебя, свидетельствуя, что Ты — Аллах, нет божества, кроме Тебя, Единого, Самодостаточного, Который не родил и не был рождён и Которому нет равного.","n":1,"src":["ad","tir"],"note":{"en":"The Prophet ﷺ said: he has asked Allah by His greatest name, by which He answers when called upon.","ru":"Пророк ﷺ сказал: он попросил Аллаха Его величайшим именем, обращаясь с которым получают ответ."},"t":{"en":"Before the salam","ru":"Перед салямом","ar":"الدعاء بعد التشهد الأخير قبل السلام"}},"h126":{"ar":"أَسْتَغْفِرُ اللَّهَ (ثَلاَثَاً) اللَّهُمَّ أَنْتَ السَّلاَمُ، وَمِنْكَ السَّلاَمُ، تَبَارَكْتَ يَا ذَا الْجَلاَلِ وَالْإِكْرَامِ.","en":"I seek Allah’s forgiveness (×3). O Allah, You are Peace and from You comes peace. Blessed are You, O Possessor of Majesty and Honour.","ru":"Прошу прощения у Аллаха (×3). О Аллах, Ты — Мир, и от Тебя мир. Благословен Ты, о Обладатель величия и щедрости.","n":1,"src":["muslim"],"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h127":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ثلاثاً، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ، وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الجَدُّ.","en":"There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. O Allah, none can withhold what You give, none can give what You withhold, and the wealth of the wealthy cannot avail him against You.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. О Аллах, никто не лишит того, что Ты даровал, никто не даст того, чего Ты лишил, и богатство не поможет богатому перед Тобой.","n":1,"src":["bm"],"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h128":{"ar":"لَا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ، وَلَهُ الْحَمدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ. لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ، لاَ إِلَهَ إِلاَّ اللَّهُ، وَلاَ نَعْبُدُ إِلاَّ إِيَّاهُ, لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ وَلَهُ الثَّنَاءُ الْحَسَنُ، لَا إِلَهَ إِلاَّ اللَّهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الكَافِرُونَ.","en":"There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. There is no might nor power except with Allah. There is no deity but Allah, and we worship none but Him. His is the favour, His is the grace, and His is the excellent praise. There is no deity but Allah; we are sincere to Him in religion, even if the disbelievers dislike it.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. Нет мощи и силы ни у кого, кроме Аллаха. Нет божества, кроме Аллаха, и мы не поклоняемся никому, кроме Него. Ему принадлежат блага, щедрость и прекрасная хвала. Нет божества, кроме Аллаха, мы искренни перед Ним в религии, даже если это ненавистно неверующим.","n":1,"src":["muslim"],"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h129":{"ar":"سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَاللَّهُ أَكْبَرُ (ثلاثاً وثلاثين) لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.","en":"Glory be to Allah, praise be to Allah, Allah is the Greatest — thirty-three times each. Then complete the hundred with: There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable.","ru":"«Пречист Аллах», «Хвала Аллаху», «Аллах велик» — по тридцать три раза. Затем сотню завершают словами: «Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может».","n":99,"src":["muslim"],"note":{"en":"His sins are forgiven even if they are like the foam of the sea.","ru":"Его грехи прощаются, даже если их столько, сколько пены морской."},"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h130":{"ar":"بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ﴾، بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾،بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَ النَّاسِ﴾ بَعْدَ كُلِّ صَلاَةٍ.","en":"Recite Al-Ikhlas, Al-Falaq and An-Nas after every prayer (three times each after Fajr and Maghrib).","ru":"Читайте «аль-Ихлас», «аль-Фаляк» и «ан-Нас» после каждого намаза (после фаджра и магриба — по три раза).","n":1,"src":["ad","tir"],"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h131":{"ar":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾","en":"Allāh - there is no deity except Him, the Ever-Living, the Self-Sustaining. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursī extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.","ru":"Аллах — нет божества, кроме Него — Живой, Поддерживающий всё сущее. Его не одолевает ни дремота, ни сон. Ему принадлежит всё, что в небесах, и всё, что на земле. Кто же тот, кто заступится у Него иначе как с Его дозволения? Он знает, что перед ними и что после них, а они ничего не постигают из Его знания, кроме того, что Он пожелает. Подножие Его Трона[20] объемлет небеса и землю, и не тяготит Его охрана их. Он — Возвышенный, Великий.","n":1,"src":["nasai"],"note":{"en":"Nothing stands between the one who recites it after every prayer and Paradise except death.","ru":"Того, кто читает его после каждого намаза, от Рая отделяет лишь смерть."},"t":{"en":"Ayat al-Kursi","ru":"Аят аль-Курси","ar":"الأذكار بعد السلام من الصلاة"}},"h132":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ عَشْرَ مَرّاتٍ بَعْدَ صَلاةِ الْمَغْرِبِ وَالصُّبْحِ.","en":"There is no deity but Allah alone, without partner; His is the dominion and His is the praise; He gives life and causes death, and He is over all things capable. (Ten times after Maghrib and Fajr.)","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, Он оживляет и умерщвляет, и Он всё может. (Десять раз после магриба и фаджра.)","n":10,"src":["tir"],"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h133":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نافِعاً، وَرِزْقاً طَيِّباً، وَعَمَلاً مُتَقَبَّلاً بَعْدَ السّلامِ مِنْ صَلاَةِ الفَجْرِ.","en":"O Allah, I ask You for beneficial knowledge, good provision and accepted deeds. (After the salam of the Fajr prayer.)","ru":"О Аллах, прошу Тебя о полезном знании, благом уделе и принятых деяниях. (После саляма в утреннем намазе.)","n":1,"src":["ibm"],"t":{"en":"After the salam","ru":"После саляма","ar":"الأذكار بعد السلام من الصلاة"}},"h134":{"ar":"قَالَ جَابرُ بْنُ عَبْدِ اللَّهِ رَضِيَ اللَّهُ عَنْهُمَا: كَانَ رسُولُ اللَّهِ صلى الله عليه وسلم يُعَلِّمُنَا الْاسْتِخَارَةَ فِي الْأُمُورِ كُلِّهَا كَمَا يُعَلِّمُنَا السُّورَةَ مِنَ الْقُرْآنِ، يَقُولُ: إِذَا هَمَّ أَحَدُكُمْ بِالْأَمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غَيْرِ الْفَرِيضَةِ، ثُمَّ لْيَقُلْ: اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ؛ فَإِنَّكَ تَقْدِرُ وَلاَ أَقْدِرُ، وَتَعْلَمُ وَلاَ أَعْلَمُ، وَأَنْتَ عَلاَّمُ الغُيُوبِ، اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأمْرَ - وَيُسَمِّي حَاجَتَهُ - خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ - فَاقْدُرْهُ لِي وَيَسِّرْهُ لِي ثمَّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الْأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي – أَوْ قَالَ: عَاجِلِهِ وَآجِلِهِ – فَاصْرِفْهُ عَنِّي وَاصْرِفْنِي عَنْهُ وَاقْدُرْ لِيَ الْخَيْرَ حَيْثُ كَانَ، ثُمَّ أَرْضِنِي بِهِ.وَمَا نَدِمَ مَنِ اسْتَخَارَ الْخَالِقَ، وَشَاوَرَ الْمَخْلُوقِينَ الْمُؤْمِنِينَ وَتَثَبَّتَ فِي أَمْرِهِ، فَقَدْ قَالَ اللَّه تعالى: ﴿وَشاوِرْهُمْ فِي الْأَمْرِ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾ .","en":"Jabir said: The Messenger of Allah ﷺ taught us istikhara in all matters as he taught us a surah of the Quran. He said: When one of you intends a matter, let him pray two rak’ahs other than the obligatory prayer, then say: O Allah, I seek Your guidance by Your knowledge, I seek ability by Your power, and I ask You of Your immense bounty, for You are able and I am not, You know and I do not, and You are the Knower of the unseen. O Allah, if You know that this matter (name it) is good for me in my religion, my livelihood and the outcome of my affairs, then decree it for me, make it easy for me and bless me in it. And if You know that this matter is bad for me in my religion, my livelihood and the outcome of my affairs, then turn it away from me and turn me away from it, decree for me what is good wherever it may be, and make me content with it. One who seeks guidance from the Creator and consults believing people never regrets it.","ru":"Джабир сказал: «Посланник Аллаха ﷺ учил нас истихаре во всех делах так же, как учил суре Корана. Он говорил: „Если кто-то из вас задумал дело, пусть совершит два ракаата добровольного намаза, а потом скажет: О Аллах, прошу Тебя помочь мне выбрать Твоим знанием, прошу Тебя дать мне силы Твоим могуществом и прошу Тебя о Твоей великой милости, ведь Ты можешь, а я не могу, Ты знаешь, а я не знаю, и Ты — Знающий сокровенное. О Аллах, если Ты знаешь, что это дело (называет его) хорошо для меня в моей религии, жизни и исходе моих дел, то предопредели его мне, облегчи его и благослови меня в нём. А если Ты знаешь, что это дело плохо для меня в моей религии, жизни и исходе моих дел, то отврати его от меня и меня от него, предопредели мне благо, где бы оно ни было, и сделай меня довольным им“». Не пожалеет тот, кто просит выбора у Творца и советуется с верующими.","n":1,"src":["bukhari"],"t":{"en":"Istikhara","ru":"Истихара","ar":"دعاء صلاة الاستخارة"}},"h152":{"ar":"اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ، وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ؛ فَإِنَّكَ تَقْضِي وَلاَ يُقْضَى عَلَيْكَ، إِنَّهُ لاَ يَذِلُّ مَنْ وَالَيْتَ، وَلاَ يَعِزُّ مَنْ عَادَيْتَ، تَبارَكْتَ رَبَّنا وَتَعَالَيْتَ.","en":"O Allah, guide me among those You have guided, grant me well-being among those You have granted well-being, take me into Your care among those You have taken into Your care, bless me in what You have given, and protect me from the evil of what You have decreed. You decree and none decrees over You. Whoever You befriend is never humiliated, and whoever You take as an enemy is never honoured. Blessed are You, our Lord, and Exalted.","ru":"О Аллах, наставь меня в числе тех, кого Ты наставил, дай мне благополучие в числе тех, кому Ты его дал, покровительствуй мне в числе тех, кому покровительствуешь, благослови для меня то, что Ты даровал, и защити меня от зла того, что Ты предопределил. Ты решаешь, а не решают за Тебя. Не будет унижен тот, кому Ты покровительствуешь, и не будет возвеличен тот, кому Ты враждебен. Благословен Ты, Господь наш, и превыше всего.","n":1,"src":["ad","tir"],"t":{"en":"Qunut in Witr","ru":"Кунут в витре","ar":"دعاء قنوت الوتر"}},"h153":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِرِضَاكَ مِنْ سَخَطِكَ، وَبِمُعَافَاتِكَ مِنْ عُقُوبَتِكَ، وَأَعُوذُ بِكَ مِنْكَ، لاَ أُحْصِي ثَنَاءً عَلَيْكَ، أَنْتَ كَمَا أَثْنَيْتَ عَلَى نَفْسِكَ.","en":"O Allah, I seek refuge in Your pleasure from Your anger, in Your pardon from Your punishment, and I seek refuge in You from You. I cannot count Your praise; You are as You have praised Yourself.","ru":"О Аллах, прибегаю к Твоему довольству от Твоего гнева, к Твоему прощению от Твоего наказания и прибегаю к Тебе от Тебя. Я не в силах исчислить хвалу Тебе. Ты таков, каким восхвалил Себя Сам.","n":1,"src":["ad","tir"],"t":{"en":"Qunut in Witr","ru":"Кунут в витре","ar":"دعاء قنوت الوتر"}},"h154":{"ar":"اللَّهُمَّ إِيَّاكَ نعْبُدُ، وَلَكَ نُصَلِّي وَنَسْجُدُ، وَإِلَيْكَ نَسْعَى وَنَحْفِدُ، نَرْجُو رَحْمَتَكَ، وَنَخْشَى عَذَابَكَ، إِنَّ عَذَابَكَ بِالكَافِرِينَ مُلْحَقٌ. اللَّهُمَّ إِنَّا نَسْتَعينُكَ، وَنَسْتَغْفِرُكَ، وَنُثْنِي عَلَيْكَ الْخَيْرَ، وَلاَ نَكْفُرُكَ، وَنُؤْمِنُ بِكَ، وَنَخْضَعُ لَكَ، وَنَخْلَعُ مَنْ يَكْفرُكَ.","en":"O Allah, You alone we worship, to You we pray and prostrate, to You we hasten and strive. We hope for Your mercy and fear Your punishment; Your punishment will surely reach the disbelievers. O Allah, we seek Your help and Your forgiveness, we praise You with all good, we do not deny You, we believe in You, we humble ourselves before You, and we renounce whoever disbelieves in You.","ru":"О Аллах, Тебе одному мы поклоняемся, Тебе молимся и Тебе совершаем земной поклон, к Тебе стремимся и спешим. Надеемся на Твою милость и боимся Твоего наказания, ведь Твоё наказание непременно постигнет неверующих. О Аллах, мы просим Тебя о помощи и прощении, восхваляем Тебя за всё благое, не отвергаем Тебя, веруем в Тебя, смиряемся перед Тобой и отрекаемся от тех, кто не верует в Тебя.","n":1,"src":["bayhaqi"],"note":{"en":"Reported from Umar ibn al-Khattab (al-Bayhaqi).","ru":"Передаётся от Умара ибн аль-Хаттаба (аль-Байхаки)."},"t":{"en":"Qunut in Witr","ru":"Кунут в витре","ar":"دعاء قنوت الوتر"}},"h155":{"ar":"سُبْحَانَ المَلِكِ القُدُّوسِ ثلاثَ مرَّاتٍ والثَّالِثَةُ يَجْهَرُ بها ويَمُدُّ بها صَوتَهُ يقولُ: رَبِّ الْمَلاَئِكَةِ وَالرُّوحِ.","en":"Glory be to the King, the Most Holy (three times, raising your voice on the third and adding: Lord of the angels and the Spirit).","ru":"Пречист Царь Святой (три раза; в третий раз громче, добавляя: «Господь ангелов и Духа»).","n":3,"src":["nasai"],"t":{"en":"After Witr","ru":"После витра","ar":"الذكر عقب السلام من الوتر"}},"h65":{"ar":"الْحَمْدُ للَّهِ الَّذِي كَسَانِي هَذَا (الثَّوْبَ) وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلاَ قُوَّة...","en":"Praise be to Allah who clothed me with this garment and provided it for me without any might or power on my part.","ru":"Хвала Аллаху, который одел меня в эту одежду и наделил меня ею без какой-либо силы и мощи с моей стороны.","n":1,"src":["ad","tir"],"note":{"en":"His past sins are forgiven.","ru":"Ему прощаются прошлые грехи."},"t":{"en":"Putting on clothes","ru":"Надевая одежду","ar":"دعاء لبس الثوب"}},"h66":{"ar":"اللَّهُمَّ لَكَ الْحَمْدُ أَنْتَ كَسَوْتَنِيهِ، أَسْأَلُكَ مِنْ خَيْرِهِ وَخَيْرِ مَا صُنِعَ لَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّهِ وَشَرِّ مَا صُنِعَ لَهُ","en":"O Allah, to You is praise; You clothed me with it. I ask You for its good and the good of what it was made for, and I seek refuge in You from its evil and the evil of what it was made for.","ru":"О Аллах, Тебе хвала, Ты одел меня в это. Прошу Тебя о благе этого и благе того, для чего это сделано, и прибегаю к Тебе от зла этого и зла того, для чего это сделано.","n":1,"src":["ad","tir"],"t":{"en":"New clothes","ru":"Новая одежда","ar":"دعاء لبس الثوب الجديد"}},"h67":{"ar":"تُبْلِي وَيُخْلِفُ اللَّهُ تَعَالَى","en":"Said to someone wearing new clothes: May you wear it out and may Allah replace it.","ru":"Говорят тому, кто надел новое: «Изнашивай, и пусть Аллах даст взамен».","n":1,"src":["ad"],"t":{"en":"New clothes","ru":"Новая одежда","ar":"دعاء لبس الثوب الجديد"}},"h68":{"ar":"اِلْبَسْ جَدِيداً وَعِشْ حَمِيداً وَمُتْ شَهِيداً","en":"Said to someone wearing new clothes: Wear new, live praiseworthy and die a martyr.","ru":"Говорят тому, кто надел новое: «Носи новое, живи достойно и умри шахидом».","n":1,"src":["ibm"],"t":{"en":"New clothes","ru":"Новая одежда","ar":"دعاء لبس الثوب الجديد"}},"h69":{"ar":"بِسْمِ اللَّهِ","en":"In the name of Allah.","ru":"С именем Аллаха.","n":1,"src":["tir"],"note":{"en":"Said when taking off clothes: it veils the jinn’s eyes from one’s nakedness.","ru":"Говорится, снимая одежду: это закрывает наготу от глаз джиннов."},"t":{"en":"Taking off clothes","ru":"Снимая одежду","ar":"ما يقول إذا وضع الثوب"}},"h70":{"ar":"بِسْمِ اللَّهِ اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبْثِ وَالْخَبائِث","en":"In the name of Allah. O Allah, I seek refuge in You from the male and female devils.","ru":"С именем Аллаха. О Аллах, прибегаю к Тебе от шайтанов мужского и женского пола.","n":1,"src":["bm"],"t":{"en":"Entering the toilet","ru":"Входя в уборную","ar":"دعاء دخول الخلاء"}},"h71":{"ar":"غُفْرَانَكَ","en":"I ask Your forgiveness.","ru":"Прошу Твоего прощения.","n":1,"src":["ad","tir"],"t":{"en":"Leaving the toilet","ru":"Выходя из уборной","ar":"دعاء الخروج من الخلاء"}},"h76":{"ar":"بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَاَ حَوْلَ وَلَا قُوَّةَ إِلاَّ بِاللَّهِ","en":"In the name of Allah, I place my trust in Allah, and there is no might nor power except with Allah.","ru":"С именем Аллаха, уповаю на Аллаха, нет мощи и силы ни у кого, кроме Аллаха.","n":1,"src":["ad","tir"],"note":{"en":"It is said to him: you are guided, sufficed and protected, and Satan turns away from him.","ru":"Ему говорят: «Ты наставлен, избавлен и защищён», и шайтан отступает от него."},"t":{"en":"Leaving home","ru":"Выходя из дома","ar":"الذكر عند الخروج من المنزل"}},"h77":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ، أَوْ أُضَلَّ، أَوْ أَزِلَّ، أَوْ أُزَلَّ، أَوْ أَظْلِمَ، أَوْ أُظْلَمَ، أَوْ أَجْهَلَ، أَوْ يُجْهَلَ عَلَيَّ","en":"O Allah, I seek refuge in You lest I stray or be led astray, lest I slip or be made to slip, lest I wrong or be wronged, lest I behave foolishly or be treated foolishly.","ru":"О Аллах, прибегаю к Тебе от того, чтобы сбиться с пути или быть сбитым, оступиться или быть сбитым с ног, поступить несправедливо или испытать несправедливость, поступить невежественно или испытать невежество от других.","n":1,"src":["ad","tir"],"t":{"en":"Leaving home","ru":"Выходя из дома","ar":"الذكر عند الخروج من المنزل"}},"h78":{"ar":"بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى اللَّهِ رَبِّنَا تَوَكَّلْنَا، ثُمَّ لِيُسَلِّمْ عَلَى أَهْلِهِ","en":"In the name of Allah we enter, in the name of Allah we leave, and upon Allah our Lord we rely. Then greet your family with salam.","ru":"С именем Аллаха мы вошли, с именем Аллаха вышли и на Аллаха, нашего Господа, уповаем. Затем поприветствуйте домашних салямом.","n":1,"src":["ad"],"t":{"en":"Entering home","ru":"Входя в дом","ar":"الذكر عند دخول المنزل"}},"h180":{"ar":"قَدَرُ اللَّهُ وَمَا شَاءَ فَعَلَ.","en":"Allah has decreed, and He does what He wills.","ru":"Так предопределил Аллах, и Он делает то, что пожелает.","n":1,"src":["muslim"],"note":{"en":"Said when something you dislike happens or you are overcome.","ru":"Говорится, когда случилось неприятное или вы потерпели неудачу."},"t":{"en":"When things go wrong","ru":"Когда что-то не так","ar":"الدعاء حينما يقع ما لا يرضاه أو غلب على أمره"}},"h181":{"ar":"بَارَكَ اللَّهُ لَكَ فِي الْمَوْهُوبِ لَكَ، وَشَكَرْتَ الْوَاهِبَ، وَبَلَغَ أَشُدَّهُ، وَرُزِقْتَ بِرَّهُ. وَيَرُدُّ عَلَيْهِ الْمُهَنَّأُ فَيَقُولُ: بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ، وَجَزَاكَ اللَّهُ خَيْراً، وَرَزَقَكَ اللَّهُ مِثْلَهُ، وَأَجْزَلَ ثَوَابَكَ.","en":"Congratulating a new parent: May Allah bless you in the gift He has given you; may you thank the Giver; may the child reach maturity, and may you be granted its righteousness. The parent replies: May Allah bless you and shower His blessings upon you, reward you with good, grant you the like of it and make your reward abundant.","ru":"Поздравляя с рождением ребёнка: «Да благословит тебя Аллах в том, что тебе даровано; да будешь ты благодарен Дарующему; пусть ребёнок достигнет зрелости, и пусть тебе будет дарована его почтительность». Родитель отвечает: «Да благословит тебя Аллах и ниспошлёт тебе Свою благодать, да воздаст тебе благом, дарует тебе подобное и умножит твою награду».","n":1,"src":["ibnsunni"],"t":{"en":"A new baby","ru":"Рождение ребёнка","ar":"تهنئة المولود له وجوابه"}},"h182":{"ar":"كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُعَوِّذُ الحَسَنَ وَالحُسَينَ رضي الله عنهما أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ.","en":"The Messenger of Allah ﷺ sought protection for al-Hasan and al-Husayn saying: I seek protection for you both in the perfect words of Allah from every devil and every poisonous creature, and from every harmful eye.","ru":"Посланник Аллаха ﷺ испрашивал защиты для аль-Хасана и аль-Хусейна, говоря: «Прибегаю для вас обоих к совершенным словам Аллаха от всякого шайтана, ядовитой твари и всякого дурного глаза».","n":1,"src":["bukhari"],"t":{"en":"Protecting children","ru":"Защита детей","ar":"ما يعوذ به الأولاد"}},"h183":{"ar":"لاَ بأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ.","en":"No harm, it is a purification, if Allah wills.","ru":"Ничего страшного, это очищение, если пожелает Аллах.","n":1,"src":["bukhari"],"t":{"en":"Visiting the sick","ru":"Навещая больного","ar":"الدعاء للمريض في عيادته"}},"h184":{"ar":"أَسْأَلُ اللَّهَ الْعَظيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفيَكَ","en":"I ask Allah the Mighty, Lord of the Mighty Throne, to cure you.","ru":"Прошу Аллаха Великого, Господа великого Трона, исцелить тебя.","n":7,"src":["ad","tir"],"note":{"en":"Whoever says it seven times to a sick person whose time has not come, Allah cures him.","ru":"Если сказать это семь раз больному, чей срок ещё не пришёл, Аллах исцелит его."},"t":{"en":"Visiting the sick","ru":"Навещая больного","ar":"الدعاء للمريض في عيادته"}},"h186":{"ar":"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَأَلْحِقْنِي بِالرَّفِيقِ الْأَعْلَى.","en":"O Allah, forgive me, have mercy on me and join me with the highest companions.","ru":"О Аллах, прости меня, помилуй меня и присоедини меня к высшим спутникам.","n":1,"src":["bm"],"note":{"en":"Said by a sick person who has lost hope of recovery.","ru":"Говорит больной, потерявший надежду на выздоровление."},"t":{"en":"Gravely ill","ru":"Тяжело больной","ar":"دعاء المريض الذي يئس من حياته"}},"h187":{"ar":"جَعَلَ النَّبِيُّ صلى الله عليه وسلم عِنْدَ مَوْتِهِ يُدْخِلُ يَدَيْهِ فِي الْمَاءِ فَيَمْسَحُ بِهِمَا وَجْهَهُ، وَيَقُولُ: لاَ إِلَهَ إِلاَّ اللَّهُ إِنَّ لِلْمَوْتِ سَكَرَاتٍ.","en":"At his death the Prophet ﷺ dipped his hands in water and wiped his face, saying: There is no deity but Allah; indeed, death has its agonies.","ru":"Перед смертью Пророк ﷺ опускал руки в воду, протирал ими лицо и говорил: «Нет божества, кроме Аллаха, поистине, у смерти есть муки».","n":1,"src":["bukhari"],"t":{"en":"Gravely ill","ru":"Тяжело больной","ar":"دعاء المريض الذي يئس من حياته"}},"h188":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لاَ إِلَهَ إِلاَّ اللَّهُ لَهُ المُلْكُ وَلَهُ الْحَمْدُ، لاَ إِلَهَ إِلاَّ اللَّهُ وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.","en":"There is no deity but Allah, and Allah is the Greatest. There is no deity but Allah alone. There is no deity but Allah alone, without partner. There is no deity but Allah; His is the dominion and His is the praise. There is no deity but Allah, and there is no might nor power except with Allah.","ru":"Нет божества, кроме Аллаха, и Аллах велик. Нет божества, кроме одного лишь Аллаха. Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Нет божества, кроме Аллаха, Ему принадлежит владычество и Ему хвала. Нет божества, кроме Аллаха, и нет мощи и силы ни у кого, кроме Аллаха.","n":1,"src":["tir"],"t":{"en":"Gravely ill","ru":"Тяжело больной","ar":"دعاء المريض الذي يئس من حياته"}},"h189":{"ar":"مَنْ كَانَ آخِرُ كَلاَمِهِ لاَ إِلَهَ إِلاَّ اللَّهُ دَخَلَ الْجَنَّةَ.","en":"Whoever’s last words are “There is no deity but Allah” will enter Paradise.","ru":"Тот, чьими последними словами будут «Нет божества, кроме Аллаха», войдёт в Рай.","n":1,"src":["ad"],"note":{"en":"Gently prompt the dying person to say it.","ru":"Мягко подсказывайте умирающему эти слова."},"t":{"en":"The dying","ru":"Умирающий","ar":"تلقين المحتضر"}},"h190":{"ar":"إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي، وَأَخْلِفْ لِي خَيْرَاً مِنْهَا.","en":"To Allah we belong and to Him we return. O Allah, reward me in my affliction and replace it for me with something better.","ru":"Поистине, мы принадлежим Аллаху и к Нему возвращаемся. О Аллах, награди меня в моей беде и замени её мне чем-то лучшим.","n":1,"src":["muslim"],"t":{"en":"Calamity","ru":"Беда","ar":"دعاء من أصيب بمصيبة"}},"h191":{"ar":"اللَّهُمَّ اغْفِرْ لِفُلاَنٍ (بِاسْمِهِ) وَارْفَعْ دَرَجَتَهُ فِي الْمَهْدِيِّينَ، وَاخْلُفْهُ فِي عَقِبِهِ فِي الْغَابِرِينَ، وَاغْفِرْ لَنَا وَلَهُ يَا رَبَّ الْعَالَمِينَ، وَافْسَحْ لَهُ فِي قَبْرِهِ، وَنَوِّرْ لَهُ فِيهِ.","en":"O Allah, forgive (name him) and raise his rank among the rightly guided, be his successor among those he leaves behind, forgive us and him, O Lord of the worlds, widen his grave for him and give him light in it.","ru":"О Аллах, прости такого-то (называют имя), возвысь его степень среди наставленных, будь преемником его для оставшихся после него, прости нас и его, о Господь миров, расширь ему могилу и освети её для него.","n":1,"src":["muslim"],"note":{"en":"Said when closing the eyes of the deceased.","ru":"Говорится, закрывая глаза умершему."},"t":{"en":"Closing the eyes of the deceased","ru":"Закрывая глаза умершему","ar":"الدعاء عند إغماض الميت"}},"h192":{"ar":"اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ، وَعَافِهِ، وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ، وَنَقِّهِ مِنَ الْخَطَايَا كَمَا نَقَّيْتَ الثَّوْبَ الأَبْيَضَ مِنَ الدَّنَسِ، وَأَبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ، وَأَهْلاً خَيْراً مِنْ أَهْلِهِ، وَزَوْجَاً خَيْراً مِنْ زَوْجِهِ، وَأَدْخِلْهُ الْجَنَّةَ، وَأَعِذْهُ مِنْ عَذَابِ القَبْرِ وَعَذَابِ النَّارِ.","en":"O Allah, forgive him and have mercy on him, keep him safe and pardon him, honour his reception and widen his entry. Wash him with water, snow and hail, and cleanse him of sins as a white garment is cleansed of dirt. Give him a home better than his home, a family better than his family and a spouse better than his spouse. Admit him to Paradise and protect him from the punishment of the grave and the punishment of the Fire.","ru":"О Аллах, прости его и помилуй, избавь его и прости ему, окажи ему достойный приём и расширь ему вход. Омой его водой, снегом и градом и очисти от грехов, как очищается белая одежда от грязи. Замени ему дом домом лучшим, семью — семьёй лучшей, супругу — супругой лучшей. Введи его в Рай и защити его от мучений в могиле и мучений в Огне.","n":1,"src":["muslim"],"note":{"en":"In the funeral prayer.","ru":"В погребальном намазе (джаназа)."},"t":{"en":"Funeral prayer","ru":"Джаназа","ar":"الدعاء للميت في الصلاة عليه"}},"h193":{"ar":"اللَّهُمَّ اغْفِرْ لِحَيِّنَا وَمَيِّتِنَا، وَشَاهِدِنَا وَغَائِبِنَا، وَصَغِيرِنَا وَكَبيرِنَا، وَذَكَرِنَا وَأُنْثَانَا. اللَّهُمَّ مَنْ أَحْيَيْتَهُ مِنَّا فَأَحْيِهِ عَلَى الْإِسْلاَمِ، وَمَنْ تَوَفَّيْتَهُ مِنَّا فَتَوَفَّهُ عَلَى الإِيمَانِ، اللَّهُمَّ لاَ تَحْرِمْنَا أَجْرَهُ، وَلاَ تُضِلَّنَا بَعْدَهُ.","en":"O Allah, forgive our living and our dead, those present and those absent, our young and our old, our males and our females. O Allah, whoever of us You keep alive, keep him alive upon Islam, and whoever of us You take, take him upon faith. O Allah, do not deprive us of his reward and do not lead us astray after him.","ru":"О Аллах, прости нашим живым и нашим умершим, присутствующим и отсутствующим, малым и взрослым, мужчинам и женщинам. О Аллах, кого из нас Ты оставишь в живых, сохрани в исламе, а кого упокоишь, упокой с верой. О Аллах, не лиши нас награды за него и не введи нас в заблуждение после него.","n":1,"src":["ad","tir"],"note":{"en":"In the funeral prayer.","ru":"В погребальном намазе."},"t":{"en":"Funeral prayer","ru":"Джаназа","ar":"الدعاء للميت في الصلاة عليه"}},"h194":{"ar":"اللَّهُمَّ إِنَّ فُلاَنَ بْنَ فُلاَنٍ فِي ذِمَّتِكَ، وَحَبْلِ جِوَارِكَ، فَقِهِ مِنْ فِتْنَةِ الْقَبْرِ، وَعَذَابِ النَّارِ، وَأَنْتَ أَهْلُ الْوَفَاءِ وَالْحَقِّ، فَاغْفِرْ لَهُ وَارْحَمْهُ إِنَّكَ أَنْتَ الغَفُورُ الرَّحيمُ.","en":"O Allah, (name) is under Your protection and in the bond of Your safety, so protect him from the trial of the grave and the punishment of the Fire. You are the One who fulfils promises and the Truth, so forgive him and have mercy on him; You are the Forgiving, the Merciful.","ru":"О Аллах, такой-то, сын такого-то, — под Твоей защитой и в узах Твоего покровительства. Убереги его от испытания могилы и мучений Огня. Ты — Верный обещанию и Истина. Прости же его и помилуй, ведь Ты — Прощающий, Милосердный.","n":1,"src":["ad"],"note":{"en":"In the funeral prayer.","ru":"В погребальном намазе."},"t":{"en":"Funeral prayer","ru":"Джаназа","ar":"الدعاء للميت في الصلاة عليه"}},"h195":{"ar":"اللَّهُمَّ عَبْدُكَ وَابْنُ أَمَتِكَ احْتَاجَ إِلَى رَحْمَتِكَ، وَأَنْتَ غَنِيٌّ عَنْ عَذَابِهِ، إِنْ كَانَ مُحْسِناً فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئاً فَتَجَاوَزْ عَنْهُ.","en":"O Allah, Your servant, the son of Your maidservant, is in need of Your mercy, and You have no need to punish him. If he did good, increase his good deeds, and if he did wrong, overlook it.","ru":"О Аллах, Твой раб, сын Твоей рабыни, нуждается в Твоей милости, а Ты не нуждаешься в его наказании. Если он творил добро — приумножь его добрые дела, а если творил зло — прости ему.","n":1,"src":["hakim"],"note":{"en":"In the funeral prayer.","ru":"В погребальном намазе."},"t":{"en":"Funeral prayer","ru":"Джаназа","ar":"الدعاء للميت في الصلاة عليه"}},"h196":{"ar":"اللَّهُمَّ أَعِذْهُ مِنْ عَذَابِ القَبْرِ وإن قال: اللَّهُمَّ اجْعَلْهُ فَرَطاً وَذُخْراً لِوَالِدَيْهِ، وَشَفِيعاً مُجَاباً، اللَّهُمَّ ثَقِّلْ بِهِ مَوَازِينَهُمَا، وَأَعْظِمْ بِهِ أُجورَهُمَا، وَأَلْحِقْهُ بِصَالِحِ الْمُؤْمِنِينَ، وَاجْعَلْهُ فِي كَفَالَةِ إِبْرَاهِيمَ، وَقِهِ بِرَحْمَتِكَ عَذَابَ الْجَحِيمِ، وَأَبْدِلْهُ دَاراً خَيْراً مِنْ دَارِهِ، وَأَهْلاً خَيْراً مِنْ أَهْلِهِ، اللَّهُمَّ اغْفِرْ لِأَسْلاَفِنَا، وَأَفْرَاطِنَا، وَمَنْ سَبَقَنَا بِالْإِيمَانِ إن قال ذلك فَحَسَنٌ.","en":"For a deceased child: O Allah, protect him from the punishment of the grave. And it is good to say: O Allah, make him a forerunner and a treasure for his parents and an intercessor whose intercession is accepted. O Allah, make their scales heavy through him and their reward great, join him with the righteous believers, place him in the care of Ibrahim, and protect him by Your mercy from the punishment of Hell. Give him a home better than his home and a family better than his family. O Allah, forgive our predecessors, our children who went before us, and those who preceded us in faith.","ru":"За умершего ребёнка: «О Аллах, защити его от мучений в могиле». И хорошо сказать: «О Аллах, сделай его предшественником и сокровищем для родителей и заступником, чьё заступничество принимается. О Аллах, утяжели им весы благодаря ему и увеличь их награду, присоедини его к праведным верующим, помести под попечение Ибрахима и защити Своей милостью от мучений Ада. Замени ему дом лучшим домом и семью лучшей семьёй. О Аллах, прости наших предшественников, наших детей, ушедших раньше нас, и тех, кто опередил нас в вере».","n":1,"src":["bukhari"],"t":{"en":"Funeral prayer for a child","ru":"Джаназа по ребёнку","ar":"الدعاء للفرط في الصلاة عليه"}},"h197":{"ar":"اللَّهُمَّ اجْعَلْهُ لَنَا فَرَطاً، وَسَلَفاً، وَأَجْراً.","en":"O Allah, make him for us a forerunner, a predecessor and a reward.","ru":"О Аллах, сделай его для нас предшественником, опередившим нас, и наградой.","n":1,"src":["bukhari"],"note":{"en":"For a deceased child, in the funeral prayer.","ru":"За умершего ребёнка в погребальном намазе."},"t":{"en":"Funeral prayer for a child","ru":"Джаназа по ребёнку","ar":"الدعاء للفرط في الصلاة عليه"}},"h198":{"ar":"إِنَّ للَّهِ مَا أَخَذَ، وَلَهُ مَا أَعْطَى، وَكُلُّ شَيْءٍ عِنْدَهُ بِأَجَلٍ مُسَمَّى... فَلْتَصْبِرْ وَلْتَحْتَسِبْ. وَإِنْ قَالَ: أَعْظَمَ اللَّهُ أَجْرَكَ، وَأَحْسَنَ عَزَاءَكَ، وَغَفَرَ لِمَيِّتِكَ فَحَسَنٌ.","en":"To Allah belongs what He took and what He gave, and everything with Him has an appointed term, so be patient and hope for reward. And it is good to say: May Allah make your reward great, give you the best consolation and forgive your deceased.","ru":"Аллаху принадлежит то, что Он взял, и то, что дал, и у Него всему назначен срок, так терпи же и надейся на награду. И хорошо сказать: «Да увеличит Аллах твою награду, да утешит тебя наилучшим утешением и да простит твоего умершего».","n":1,"src":["bm"],"note":{"en":"Words of condolence.","ru":"Слова соболезнования."},"t":{"en":"Condolence","ru":"Соболезнование","ar":"دعاء التعزية"}},"h199":{"ar":"بِسْمِ اللَّهِ وَعَلَى سُنَّةِ رَسُولِ اللَّهِ.","en":"In the name of Allah and according to the Sunnah of the Messenger of Allah.","ru":"С именем Аллаха и по сунне посланника Аллаха.","n":1,"src":["ad"],"note":{"en":"Said when placing the deceased in the grave.","ru":"Говорится, опуская умершего в могилу."},"t":{"en":"At the burial","ru":"При погребении","ar":"الدعاء عند إدخال الميت القبر"}},"h200":{"ar":"اللَّهُمَّ اغْفِرْ لَهُ، اللَّهُمَّ ثَبِّتْهُ.","en":"O Allah, forgive him. O Allah, make him firm.","ru":"О Аллах, прости его. О Аллах, укрепи его.","n":1,"src":["ad"],"note":{"en":"Said after the burial: he is now being questioned.","ru":"Говорится после погребения: сейчас его допрашивают."},"t":{"en":"After the burial","ru":"После погребения","ar":"الدعاء بعد دفن الميت"}},"h201":{"ar":"السَّلاَمُ عَلَيْكُمْ أَهْلَ الدِّيَارِ، مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا
