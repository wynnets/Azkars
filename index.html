ершенство,","покрыл его ночь мраком и вывел его дневной свет.","А землю после этого Он распростёр,","вывел из неё её воду и её пастбище.","И горы Он утвердил прочно,","в пользование вам и вашему скоту.","А когда настанет Величайшее бедствие —","в тот День человек вспомнит о том, к чему он стремился.","И адское пекло будет явлено тому, кто видит.","Что же касается того, кто преступил предел","и предпочёл мирскую жизнь, —","то, воистину, адское пекло его прибежище.","А что же касается того, кто боялся предстать перед своим Господом и удерживал себя от страстей, —","то, воистину, его прибежище — Рай.","Они спрашивают тебя о Часе: «Когда же его наступление?»","А какое тебе дело до напоминания о нём?","Лишь твоему Господу [ведом] его предел.","Воистину, ты — лишь предостерегающий для того, кто страшится его.","В тот день, когда они увидят его, покажется им, что пробыли они лишь вечер или утреннюю пору."]},"80":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ عَبَسَ وَتَوَلَّىٰ","أَن جَاءَهُ الْأَعْمَىٰ","وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّىٰ","أَوْ يَذَّكَّرُ فَتَنفَعَهُ الذِّكْرَىٰ","أَمَّا مَنِ اسْتَغْنَىٰ","فَأَنتَ لَهُ تَصَدَّىٰ","وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ","وَأَمَّا مَن جَاءَكَ يَسْعَىٰ","وَهُوَ يَخْشَىٰ","فَأَنتَ عَنْهُ تَلَهَّىٰ","كَلَّا إِنَّهَا تَذْكِرَةٌ","فَمَن شَاءَ ذَكَرَهُ","فِي صُحُفٍ مُّكَرَّمَةٍ","مَّرْفُوعَةٍ مُّطَهَّرَةٍ","بِأَيْدِي سَفَرَةٍ","كِرَامٍ بَرَرَةٍ","قُتِلَ الْإِنسَانُ مَا أَكْفَرَهُ","مِنْ أَيِّ شَيْءٍ خَلَقَهُ","مِن نُّطْفَةٍ خَلَقَهُ فَقَدَّرَهُ","ثُمَّ السَّبِيلَ يَسَّرَهُ","ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ","ثُمَّ إِذَا شَاءَ أَنشَرَهُ","كَلَّا لَمَّا يَقْضِ مَا أَمَرَهُ","فَلْيَنظُرِ الْإِنسَانُ إِلَىٰ طَعَامِهِ","أَنَّا صَبَبْنَا الْمَاءَ صَبًّا","ثُمَّ شَقَقْنَا الْأَرْضَ شَقًّا","فَأَنبَتْنَا فِيهَا حَبًّا","وَعِنَبًا وَقَضْبًا","وَزَيْتُونًا وَنَخْلًا","وَحَدَائِقَ غُلْبًا","وَفَاكِهَةً وَأَبًّا","مَّتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ","فَإِذَا جَاءَتِ الصَّاخَّةُ","يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ","وَأُمِّهِ وَأَبِيهِ","وَصَاحِبَتِهِ وَبَنِيهِ","لِكُلِّ امْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ","وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ","ضَاحِكَةٌ مُّسْتَبْشِرَةٌ","وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ","تَرْهَقُهَا قَتَرَةٌ","أُولَٰئِكَ هُمُ الْكَفَرَةُ الْفَجَرَةُ"],"en":["He [i.e., the Prophet (ﷺ) ] frowned and turned away","Because there came to him the blind man, [interrupting].","But what would make you perceive, [O Muḥammad], that perhaps he might be purified","Or be reminded and the remembrance would benefit him?","As for he who thinks himself without need,","To him you give attention.","And not upon you [is any blame] if he will not be purified.","But as for he who came to you striving [for knowledge]","While he fears [Allāh],","From him you are distracted.","No! Indeed, they [i.e., these verses] are a reminder;","So whoever wills may remember it.","[It is recorded] in honored sheets,","Exalted and purified,","[Carried] by the hands of messenger-angels,","Noble and dutiful.","Destroyed [i.e., cursed] is man; how disbelieving is he.","From what thing [i.e., substance] did He create him?","From a sperm-drop He created him and destined for him;","Then He eased the way for him;","Then He causes his death and provides a grave for him.","Then when He wills, He will resurrect him.","No! He [i.e., man] has not yet accomplished what He commanded him.","Then let mankind look at his food -","How We poured down water in torrents,","Then We broke open the earth, splitting [it with sprouts],","And caused to grow within it grain","And grapes and herbage","And olive and palm trees","And gardens of dense shrubbery","And fruit and grass -","[As] enjoyment [i.e., provision] for you and your grazing livestock.","But when there comes the Deafening Blast","On the Day a man will flee from his brother","And his mother and his father","And his wife and his children,","For every man, that Day, will be a matter adequate for him.","[Some] faces, that Day, will be bright -","Laughing, rejoicing at good news.","And [other] faces, that Day, will have upon them dust.","Blackness will cover them.","Those are the disbelievers, the wicked ones."],"ru":["Он нахмурился и отвернулся,","когда к нему подошёл слепой.","Откуда тебе знать, — быть может, он очистится,","или воспримет назидание, и тогда напоминание принесёт ему пользу.","Что касается того, кто возомнил себя самодостаточным,","то к нему ты обращаешься с усердием.","И нет на тебе [вины], если он не очистится.","А что касается того, кто пришёл к тебе, стремясь,","и испытывая страх,","то им ты пренебрегаешь.","Отнюдь! Воистину, это — напоминание.","Так пусть же тот, кто пожелает, вспомнит о нём.","[Оно] — в почитаемых свитках,","вознесённых, очищенных,","в руках посланцев,","благородных, праведных.","Да сгинет человек! Как же он неблагодарен!","Из чего же Он сотворил его?","Из капли семени — Он сотворил его и придал ему соразмерность,","затем облегчил ему путь,","затем умертвил его и поместил его в могилу,","затем, когда пожелает, воскресит его.","Отнюдь! Он ещё не выполнил того, что было повелено ему!","Пусть же человек взглянет на свою пищу:","Мы излили воду обильно,","затем рассекли землю трещинами,","и взрастили на ней зёрна,","и виноград, и травы,","и маслины, и пальмы,","и густые сады,","и плоды, и пастбища —","в пользование вам и вашему скоту.","А когда грянет Оглушительный [вопль],","в тот День человек побежит прочь от своего брата,","и от своей матери, и от своего отца,","и от своей супруги, и от своих детей.","У каждого из них в тот день — дело, поглощающее его.","Лица в тот день будут сияющими,","смеющимися, ликующими.","И лица в тот день будут покрыты пылью,","их окутает мрак.","Такие — они и есть отвергшие веру, порочные."]},"81":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا الشَّمْسُ كُوِّرَتْ","وَإِذَا النُّجُومُ انكَدَرَتْ","وَإِذَا الْجِبَالُ سُيِّرَتْ","وَإِذَا الْعِشَارُ عُطِّلَتْ","وَإِذَا الْوُحُوشُ حُشِرَتْ","وَإِذَا الْبِحَارُ سُجِّرَتْ","وَإِذَا النُّفُوسُ زُوِّجَتْ","وَإِذَا الْمَوْءُودَةُ سُئِلَتْ","بِأَيِّ ذَنبٍ قُتِلَتْ","وَإِذَا الصُّحُفُ نُشِرَتْ","وَإِذَا السَّمَاءُ كُشِطَتْ","وَإِذَا الْجَحِيمُ سُعِّرَتْ","وَإِذَا الْجَنَّةُ أُزْلِفَتْ","عَلِمَتْ نَفْسٌ مَّا أَحْضَرَتْ","فَلَا أُقْسِمُ بِالْخُنَّسِ","الْجَوَارِ الْكُنَّسِ","وَاللَّيْلِ إِذَا عَسْعَسَ","وَالصُّبْحِ إِذَا تَنَفَّسَ","إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ","ذِي قُوَّةٍ عِندَ ذِي الْعَرْشِ مَكِينٍ","مُّطَاعٍ ثَمَّ أَمِينٍ","وَمَا صَاحِبُكُم بِمَجْنُونٍ","وَلَقَدْ رَآهُ بِالْأُفُقِ الْمُبِينِ","وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِينٍ","وَمَا هُوَ بِقَوْلِ شَيْطَانٍ رَّجِيمٍ","فَأَيْنَ تَذْهَبُونَ","إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَالَمِينَ","لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ","وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ"],"en":["When the sun is wrapped up [in darkness]","And when the stars fall, dispersing,","And when the mountains are removed","And when full-term she-camels are neglected","And when the wild beasts are gathered","And when the seas are filled with flame","And when the souls are paired","And when the girl [who was] buried alive is asked","For what sin she was killed","And when the pages are spread [i.e., made public]","And when the sky is stripped away","And when Hellfire is set ablaze","And when Paradise is brought near,","A soul will [then] know what it has brought [with it].","So I swear by the retreating stars -","Those that run [their courses] and disappear [i.e., set]","And by the night as it closes in","And by the dawn when it breathes [i.e., stirs]","[That] indeed, it [i.e., the Qur’ān] is a word [conveyed by] a noble messenger [i.e., Gabriel]","[Who is] possessed of power and with the Owner of the Throne, secure [in position],","Obeyed there [in the heavens] and trustworthy.","And your companion [i.e., Prophet Muḥammad (ﷺ) ] is not [at all] mad.","And he has already seen him [i.e., Gabriel] in the clear horizon.","And he [i.e., Muḥammad (ﷺ)] is not a withholder of [knowledge of] the unseen.","And it [i.e., the Qur’ān] is not the word of a devil, expelled [from the heavens].","So where are you going?","It is not except a reminder to the worlds","For whoever wills among you to take a right course.","And you do not will except that Allāh wills - Lord of the worlds."],"ru":["Когда солнце будет свёрнуто,","и когда звёзды осыплются,","и когда горы будут приведены в движение,","и когда верблюдицы на десятом месяце будут оставлены [без внимания],","и когда дикие звери будут собраны,","и когда моря будут воспламенены,","и когда души будут соединены [с себе подобными],","и когда зарытая заживо будет спрошена:","за какой же грех она была убита,","и когда свитки будут развёрнуты,","и когда небо будет сдёрнуто [словно покров],","и когда адское пекло будет разожжено,","и когда Рай будет приближен, —","душа узнает, что она уготовила.","Так нет же! Клянусь исчезающими звёздами,","движущимися и скрывающимися,","и ночью, когда она проходит,","и утром, когда оно задышит, —","воистину, это — слово благородного Посланника,","обладателя силы, занимающего высокое положение при Властителе Трона,","того, кому там повинуются, верного.","Ваш товарищ — вовсе не одержим.","Действительно, он видел его на ясном горизонте.","И он вовсе не утаивает [переданное ему из] сокровенного.","И это вовсе не речь изгнанного шайтана.","Так куда же вы [после этого] уходите?","Это — не что иное, как напоминание для миров,","для тех из вас, кто желает следовать прямым путём.","Но вы не пожелаете этого, если только не пожелает Аллах — Господь миров."]},"82":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا السَّمَاءُ انفَطَرَتْ","وَإِذَا الْكَوَاكِبُ انتَثَرَتْ","وَإِذَا الْبِحَارُ فُجِّرَتْ","وَإِذَا الْقُبُورُ بُعْثِرَتْ","عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ","يَا أَيُّهَا الْإِنسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ","الَّذِي خَلَقَكَ فَسَوَّاكَ فَعَدَلَكَ","فِي أَيِّ صُورَةٍ مَّا شَاءَ رَكَّبَكَ","كَلَّا بَلْ تُكَذِّبُونَ بِالدِّينِ","وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ","كِرَامًا كَاتِبِينَ","يَعْلَمُونَ مَا تَفْعَلُونَ","إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ","وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ","يَصْلَوْنَهَا يَوْمَ الدِّينِ","وَمَا هُمْ عَنْهَا بِغَائِبِينَ","وَمَا أَدْرَاكَ مَا يَوْمُ الدِّينِ","ثُمَّ مَا أَدْرَاكَ مَا يَوْمُ الدِّينِ","يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْئًا وَالْأَمْرُ يَوْمَئِذٍ لِّلَّهِ"],"en":["When the sky breaks apart","And when the stars fall, scattering,","And when the seas are erupted","And when the [contents of] graves are scattered [i.e., exposed],","A soul will [then] know what it has put forth and kept back.","O mankind, what has deceived you concerning your Lord, the Generous,","Who created you, proportioned you, and balanced you?","In whatever form He willed has He assembled you.","No! But you deny the Recompense.","And indeed, [appointed] over you are keepers,","Noble and recording;","They know whatever you do.","Indeed, the righteous will be in pleasure,","And indeed, the wicked will be in Hellfire.","They will [enter to] burn therein on the Day of Recompense,","And never therefrom will they be absent.","And what can make you know what is the Day of Recompense?","Then, what can make you know what is the Day of Recompense?","It is the Day when a soul will not possess for another soul [power to do] a thing; and the command, that Day, is [entirely] with Allāh."],"ru":["Когда небо расколется,","и когда осыплются звёзды,","и когда моря прорвутся,","и когда могилы будут взрыты,","каждая душа узнает, что она совершила прежде, и что оставила [после].","О человек! Что обольстило тебя относительно твоего щедрого Господа,","Который сотворил тебя, придал тебе соразмерность и соразмерил тебя,","и сложил тебя в том облике, в каком пожелал?","Отнюдь! Напротив, вы считаете ложью День воздаяния.","А ведь, воистину, над вами есть хранители —","благородные писцы,","которые знают всё, что вы совершаете.","Воистину, благочестивые пребудут в блаженстве.","И воистину, порочные пребудут в адском пекле.","Они будут гореть в нём в День воздаяния,","и они вовсе не покинут его.","И откуда тебе знать, что такое День воздаяния?","Затем — откуда тебе знать, что такое День воздаяния?","В тот День ни одна душа ничем не сможет помочь другой душе, а вся власть в тот День будет принадлежать только Аллаху."]},"83":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَيْلٌ لِّلْمُطَفِّفِينَ","الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ","وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ","أَلَا يَظُنُّ أُولَٰئِكَ أَنَّهُم مَّبْعُوثُونَ","لِيَوْمٍ عَظِيمٍ","يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ","كَلَّا إِنَّ كِتَابَ الْفُجَّارِ لَفِي سِجِّينٍ","وَمَا أَدْرَاكَ مَا سِجِّينٌ","كِتَابٌ مَّرْقُومٌ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","الَّذِينَ يُكَذِّبُونَ بِيَوْمِ الدِّينِ","وَمَا يُكَذِّبُ بِهِ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ","إِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا قَالَ أَسَاطِيرُ الْأَوَّلِينَ","كَلَّا بَلْ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا يَكْسِبُونَ","كَلَّا إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ","ثُمَّ إِنَّهُمْ لَصَالُو الْجَحِيمِ","ثُمَّ يُقَالُ هَٰذَا الَّذِي كُنتُم بِهِ تُكَذِّبُونَ","كَلَّا إِنَّ كِتَابَ الْأَبْرَارِ لَفِي عِلِّيِّينَ","وَمَا أَدْرَاكَ مَا عِلِّيُّونَ","كِتَابٌ مَّرْقُومٌ","يَشْهَدُهُ الْمُقَرَّبُونَ","إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ","عَلَى الْأَرَائِكِ يَنظُرُونَ","تَعْرِفُ فِي وُجُوهِهِمْ نَضْرَةَ النَّعِيمِ","يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ","خِتَامُهُ مِسْكٌ وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ","وَمِزَاجُهُ مِن تَسْنِيمٍ","عَيْنًا يَشْرَبُ بِهَا الْمُقَرَّبُونَ","إِنَّ الَّذِينَ أَجْرَمُوا كَانُوا مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ","وَإِذَا مَرُّوا بِهِمْ يَتَغَامَزُونَ","وَإِذَا انقَلَبُوا إِلَىٰ أَهْلِهِمُ انقَلَبُوا فَكِهِينَ","وَإِذَا رَأَوْهُمْ قَالُوا إِنَّ هَٰؤُلَاءِ لَضَالُّونَ","وَمَا أُرْسِلُوا عَلَيْهِمْ حَافِظِينَ","فَالْيَوْمَ الَّذِينَ آمَنُوا مِنَ الْكُفَّارِ يَضْحَكُونَ","عَلَى الْأَرَائِكِ يَنظُرُونَ","هَلْ ثُوِّبَ الْكُفَّارُ مَا كَانُوا يَفْعَلُونَ"],"en":["Woe to those who give less [than due],","Who, when they take a measure from people, take in full.","But if they give by measure or by weight to them, they cause loss.","Do they not think that they will be resurrected","For a tremendous Day -","The Day when mankind will stand before the Lord of the worlds?","No! Indeed, the record of the wicked is in sijjeen.","And what can make you know what is sijjeen?","It is [their destination recorded in] a register inscribed.","Woe, that Day, to the deniers,","Who deny the Day of Recompense.","And none deny it except every sinful transgressor.","When Our verses are recited to him, he says, \"Legends of the former peoples.\"","No! Rather, the stain has covered their hearts of that which they were earning.","No! Indeed, from their Lord, that Day, they will be partitioned.","Then indeed, they will [enter and] burn in Hellfire.","Then it will be said [to them], \"This is what you used to deny.\"","No! Indeed, the record of the righteous is in ʿilliyyūn.","And what can make you know what is ʿilliyyūn?","It is [their destination recorded in] a register inscribed","Which is witnessed by those brought near [to Allāh].","Indeed, the righteous will be in pleasure","On adorned couches, observing.","You will recognize in their faces the radiance of pleasure.","They will be given to drink [pure] wine [which was] sealed.","The last of it is musk. So for this let the competitors compete.","And its mixture is of Tasneem,","A spring from which those near [to Allāh] drink.","Indeed, those who committed crimes used to laugh at those who believed.","And when they passed by them, they would exchange derisive glances.","And when they returned to their people, they would return jesting.","And when they saw them, they would say, \"Indeed, those are truly lost.\"","But they had not been sent as guardians over them.","So Today those who believed are laughing at the disbelievers,","On adorned couches, observing.","Have the disbelievers [not] been rewarded [this Day] for what they used to do?"],"ru":["Горе уменьшающим меру и вес,","которые, когда отмеривают [себе] у людей, берут сполна,","а когда отмеривают им или взвешивают для них — уменьшают.","Неужели они не думают, что будут воскрешены","для великого дня —","дня, когда люди предстанут перед Господом миров?","Отнюдь! Воистину, книга порочных — в Сиджжине.","И откуда тебе знать, что такое Сиджжин?","[Это —] книга, чётко начертанная.","Горе в тот день считающим ложью —","которые считают ложью День воздаяния.","И его считает ложью лишь каждый преступающий пределы, закоренелый грешник.","Когда ему читаются Наши аяты, он говорит: «Предания прежних!»","Отнюдь! Нет, напротив, — их сердца покрыло то, что они приобретали.","Отнюдь! Воистину, в тот День они будут отделены завесой от своего Господа.","Затем — воистину, они будут гореть в адском пекле.","Затем будет сказано: «Вот то, что вы считали ложью!»","Отнюдь! Воистину, книга благочестивых — в ‘Иллиййине.","А откуда тебе знать, что такое ‘Иллиййин?","[Это —] книга чётко начертанная.","Присутствуют при ней приближённые.","Воистину, благочестивые пребудут в блаженстве,","на ложах, взирая.","Ты распознаешь на их лицах сияние блаженства.","Поят их запечатанным нектаром,","печать которого — мускус. Пусть же ради этого состязаются состязающиеся.","А его примесь — из Тасни́ма,","[из] источника, из которого пьют приближённые.","Воистину, те, которые преступно грешили, смеялись над теми, которые уверовали.","И, проходя мимо них, подмигивали друг другу.","А когда возвращались к своим семьям, возвращались, радуясь [своим насмешкам].","И, увидев их, говорили: «Воистину, эти — заблудшие».","Но они не были посланы над ними хранителями.","Сегодня же те, которые уверовали, будут смеяться над отвергшими веру,","возлежа на ложах, взирая.","Вознаграждены ли отвергшие веру за то, что они совершали?"]},"84":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا السَّمَاءُ انشَقَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","وَإِذَا الْأَرْضُ مُدَّتْ","وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","يَا أَيُّهَا الْإِنسَانُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَاقِيهِ","فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ","فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا","وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا","وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ وَرَاءَ ظَهْرِهِ","فَسَوْفَ يَدْعُو ثُبُورًا","وَيَصْلَىٰ سَعِيرًا","إِنَّهُ كَانَ فِي أَهْلِهِ مَسْرُورًا","إِنَّهُ ظَنَّ أَن لَّن يَحُورَ","بَلَىٰ إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا","فَلَا أُقْسِمُ بِالشَّفَقِ","وَاللَّيْلِ وَمَا وَسَقَ","وَالْقَمَرِ إِذَا اتَّسَقَ","لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ","فَمَا لَهُمْ لَا يُؤْمِنُونَ","وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ","بَلِ الَّذِينَ كَفَرُوا يُكَذِّبُونَ","وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَ","فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ"],"en":["When the sky has split [open]","And has listened [i.e., responded] to its Lord and was obligated [to do so]","And when the earth has been extended","And has cast out that within it and relinquished [it]","And has listened [i.e., responded] to its Lord and was obligated [to do so] –","O mankind, indeed you are laboring toward your Lord with [great] exertion and will meet it.","Then as for he who is given his record in his right hand,","He will be judged with an easy account","And return to his people in happiness.","But as for he who is given his record behind his back,","He will cry out for destruction","And [enter to] burn in a Blaze.","Indeed, he had [once] been among his people in happiness;","Indeed, he had thought he would never return [to Allāh].","But yes! Indeed, his Lord was ever, of him, Seeing.","So I swear by the twilight glow","And [by] the night and what it envelops","And [by] the moon when it becomes full","[That] you will surely embark upon [i.e., experience] state after state.","So what is [the matter] with them [that] they do not believe,","And when the Qur’ān is recited to them, they do not prostrate [to Allāh]?","But those who have disbelieved deny,","And Allāh is most knowing of what they keep within themselves.","So give them tidings of a painful punishment,","Except for those who believe and do righteous deeds. For them is a reward uninterrupted."],"ru":["Когда небо расколется","и внемлет своему Господу, как ему и надлежит,","и когда земля будет распростёрта","и извергнет всё, что в ней есть, и опустеет,","и покорно внемлет своему Господу, как ей и надлежит…","О человек! Воистину, ты неустанно стремишься к своему Господу — тяжким стремлением, — и встретишь Его.","Что же касается того, кому будет вручена его книга в правую руку,","тот подвергнется лёгкому расчёту","и вернётся к своей семье радостным.","А что касается того, кому будет вручена его книга из-за спины,","тот станет призывать погибель","и будет гореть в пылающем огне.","Воистину, он был радостен среди своей семьи.","Воистину, он полагал, что никогда не вернётся.","Напротив! Воистину, его Господь видел его.","Нет же! Клянусь вечерней зарёй,","и ночью, и тем, что она объемлет,","и луной, когда она становится полной.","Вы непременно будете переходить от одного состояния к другому.","Так что же с ними, что они не веруют,","и когда читается им Коран, не преклоняются ниц?","Напротив, те, которые отвергли веру, считают это ложью,","а Аллах лучше знает, что они таят.","Так обрадуй же их вестью о мучительном наказании,","кроме тех, которые уверовали и совершали праведные деяния: для них — неиссякаемая награда."]},"85":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالسَّمَاءِ ذَاتِ الْبُرُوجِ","وَالْيَوْمِ الْمَوْعُودِ","وَشَاهِدٍ وَمَشْهُودٍ","قُتِلَ أَصْحَابُ الْأُخْدُودِ","النَّارِ ذَاتِ الْوَقُودِ","إِذْ هُمْ عَلَيْهَا قُعُودٌ","وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ","وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَن يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ","الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ","إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ","إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ","وَهُوَ الْغَفُورُ الْوَدُودُ","ذُو الْعَرْشِ الْمَجِيدُ","فَعَّالٌ لِّمَا يُرِيدُ","هَلْ أَتَاكَ حَدِيثُ الْجُنُودِ","فِرْعَوْنَ وَثَمُودَ","بَلِ الَّذِينَ كَفَرُوا فِي تَكْذِيبٍ","وَاللَّهُ مِن وَرَائِهِم مُّحِيطٌ","بَلْ هُوَ قُرْآنٌ مَّجِيدٌ","فِي لَوْحٍ مَّحْفُوظٍ"],"en":["By the sky containing great stars","And [by] the promised Day","And [by] the witness and what is witnessed,","Destroyed [i.e., cursed] were the companions of the trench","[Containing] the fire full of fuel,","When they were sitting near it.","And they, to what they were doing against the believers, were witnesses.","And they resented them not except because they believed in Allāh, the Exalted in Might, the Praiseworthy,","To whom belongs the dominion of the heavens and the earth. And Allāh, over all things, is Witness.","Indeed, those who have tortured the believing men and believing women and then have not repented will have the punishment of Hell, and they will have the punishment of the Burning Fire.","Indeed, those who have believed and done righteous deeds will have gardens beneath which rivers flow. That is the great attainment.","Indeed, the assault [i.e., vengeance] of your Lord is severe.","Indeed, it is He who originates [creation] and repeats.","And He is the Forgiving, the Affectionate,","Honorable Owner of the Throne,","Effecter of what He intends.","Has there reached you the story of the soldiers -","[Those of] Pharaoh and Thamūd?","But they who disbelieve are in [persistent] denial,","While Allāh encompasses them from behind.","But this is an honored Qur’ān","[Inscribed] in a Preserved Slate."],"ru":["Клянусь небом, украшенным созвездиями[74],","и Днём обещанным,","и свидетелем, и засвидетельствованным.","Да сгинут обладатели рва —","огня, полного топлива, —","когда они сидели вокруг него,","и они были свидетелями того, что творили с верующими.","И они мстили им не иначе как за то, что те уверовали в Аллаха — Могущественного, Достохвального,","Которому принадлежит владычество небес и земли. Аллах — свидетель над всем сущим.","Воистину, те, которые подвергали испытанию верующих мужчин и верующих женщин, а затем не раскаялись, — для них наказание Геенны, и для них — наказание сжигающего огня.","Воистину, те, которые уверовали и совершали праведные деяния, — для них сады, внизу которых текут реки. Это — великий успех.","Воистину, хватка твоего Господа сурова.","Воистину, Он начинает [творение], а затем повторяет его.","Он — Прощающий, Любящий,","Обладатель Трона, Славный,","Вершитель того, что пожелает.","Дошло ли до тебя повествование о воинствах —","Фараоне и племени самуд?","Нет, напротив! Те, которые отвергли веру, упорствуют в отрицании,","а Аллах объемлет их со всех сторон.","Нет, напротив! Это — славный Коран,","в Хранимой Скрижали."]},"86":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالسَّمَاءِ وَالطَّارِقِ","وَمَا أَدْرَاكَ مَا الطَّارِقُ","النَّجْمُ الثَّاقِبُ","إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","فَلْيَنظُرِ الْإِنسَانُ مِمَّ خُلِقَ","خُلِقَ مِن مَّاءٍ دَافِقٍ","يَخْرُجُ مِن بَيْنِ الصُّلْبِ وَالتَّرَائِبِ","إِنَّهُ عَلَىٰ رَجْعِهِ لَقَادِرٌ","يَوْمَ تُبْلَى السَّرَائِرُ","فَمَا لَهُ مِن قُوَّةٍ وَلَا نَاصِرٍ","وَالسَّمَاءِ ذَاتِ الرَّجْعِ","وَالْأَرْضِ ذَاتِ الصَّدْعِ","إِنَّهُ لَقَوْلٌ فَصْلٌ","وَمَا هُوَ بِالْهَزْلِ","إِنَّهُمْ يَكِيدُونَ كَيْدًا","وَأَكِيدُ كَيْدًا","فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا"],"en":["By the sky and the knocker","And what can make you know what is the knocker?","It is the piercing star.","There is no soul but that it has over it a protector.","So let man observe from what he was created.","He was created from a fluid, ejected,","Emerging from between the backbone and the ribs.","Indeed, He [i.e., Allāh], to return him [to life], is Able.","The Day when secrets will be put on trial,","Then he [i.e., man] will have no power or any helper.","By the sky which sends back","And [by] the earth which splits,","Indeed, it [i.e., the Qur’ān] is a decisive statement,","And it is not amusement.","Indeed, they are planning a plan,","But I am planning a plan.","So allow time for the disbelievers. Leave them awhile."],"ru":["Клянусь небом и Ночным Путником.","А откуда тебе знать, что такое Ночной Путник?","[Это —] звезда, пронзающая [тьму].","Нет ни одной души, над которой не поставлен хранитель.","Пусть же человек посмотрит, из чего он сотворён.","Он сотворён из изливающейся жидкости,","которая выходит между позвоночником и рёбрами.","Воистину, Он способен вернуть его.","В тот День, когда будут раскрыты тайные помыслы,","и не будет у него ни силы, ни помощника.","Клянусь небом, возвращающим [дождь],","и землёй, раскалывающейся [для произрастания растений].","Воистину, это — слово решающее,","и оно — вовсе не шутка.","Воистину, они замышляют козни,","и Я замышляю козни.","Так дай же отвергшим веру отсрочку, помедли с ними недолго."]},"87":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى","الَّذِي خَلَقَ فَسَوَّىٰ","وَالَّذِي قَدَّرَ فَهَدَىٰ","وَالَّذِي أَخْرَجَ الْمَرْعَىٰ","فَجَعَلَهُ غُثَاءً أَحْوَىٰ","سَنُقْرِئُكَ فَلَا تَنسَىٰ","إِلَّا مَا شَاءَ اللَّهُ إِنَّهُ يَعْلَمُ الْجَهْرَ وَمَا يَخْفَىٰ","وَنُيَسِّرُكَ لِلْيُسْرَىٰ","فَذَكِّرْ إِن نَّفَعَتِ الذِّكْرَىٰ","سَيَذَّكَّرُ مَن يَخْشَىٰ","وَيَتَجَنَّبُهَا الْأَشْقَى","الَّذِي يَصْلَى النَّارَ الْكُبْرَىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","قَدْ أَفْلَحَ مَن تَزَكَّىٰ","وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ","بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا","وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ","إِنَّ هَٰذَا لَفِي الصُّحُفِ الْأُولَىٰ","صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ"],"en":["Exalt the name of your Lord, the Most High,","Who created and proportioned","And who destined and [then] guided","And who brings out the pasture","And [then] makes it black stubble.","We will make you recite, [O Muḥammad], and you will not forget,","Except what Allāh should will. Indeed, He knows what is declared and what is hidden.","And We will ease you toward ease.","So remind, if the reminder should benefit;","He who fears [Allāh] will be reminded.","But the wretched one will avoid it –","[He] who will [enter and] burn in the greatest Fire,","Neither dying therein nor living.","He has certainly succeeded who purifies himself","And mentions the name of his Lord and prays.","But you prefer the worldly life,","While the Hereafter is better and more enduring.","Indeed, this is in the former scriptures,","The scriptures of Abraham and Moses."],"ru":["Прославляй имя твоего Господа, Высочайшего.","Который сотворил и придал соразмерность,","Который установил меру и наставил на верный путь,","Который вывел пастбища,","а затем сделал их сухим почерневшим сором.","Мы дадим тебе прочитать и ты не забудешь,","кроме того, что пожелает Аллах. Воистину, Он знает явное и сокрытое.","И Мы облегчим тебе [путь] к легчайшему.","Так напоминай же, если напоминание принесёт пользу.","Внемлет назиданию тот, кто страшится,","а отстранится от него самый несчастный,","который войдёт в величайший адский огонь.","Затем в нём он не умрёт и не будет жить.","Преуспел тот, кто очистился,","поминал имя своего Господа и совершал молитву.","Нет, напротив, вы предпочитаете мирскую жизнь,","тогда как Последняя жизнь — лучше и долговечнее.","Воистину, это — в прежних свитках,","в свитках Ибрахима и Мусы."]},"88":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ","وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ","عَامِلَةٌ نَّاصِبَةٌ","تَصْلَىٰ نَارًا حَامِيَةً","تُسْقَىٰ مِنْ عَيْنٍ آنِيَةٍ","لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ","وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","لِّسَعْيِهَا رَاضِيَةٌ","فِي جَنَّةٍ عَالِيَةٍ","لَّا تَسْمَعُ فِيهَا لَاغِيَةً","فِيهَا عَيْنٌ جَارِيَةٌ","فِيهَا سُرُرٌ مَّرْفُوعَةٌ","وَأَكْوَابٌ مَّوْضُوعَةٌ","وَنَمَارِقُ مَصْفُوفَةٌ","وَزَرَابِيُّ مَبْثُوثَةٌ","أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ","وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ","وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ","فَذَكِّرْ إِنَّمَا أَنتَ مُذَكِّرٌ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ","إِنَّ إِلَيْنَا إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم"],"en":["Has there reached you the report of the Overwhelming [event]?","[Some] faces, that Day, will be humbled,","Working [hard] and exhausted.","They will [enter to] burn in an intensely hot Fire.","They will be given drink from a boiling spring.","For them there will be no food except from a poisonous, thorny plant","Which neither nourishes nor avails against hunger.","[Other] faces, that Day, will show pleasure.","With their effort [they are] satisfied","In an elevated garden,","Wherein they will hear no unsuitable speech.","Within it is a flowing spring.","Within it are couches raised high","And cups put in place","And cushions lined up","And carpets spread around.","Then do they not look at the camels - how they are created?","And at the sky - how it is raised?","And at the mountains - how they are erected?","And at the earth - how it is spread out?","So remind, [O Muḥammad]; you are only a reminder.","You are not over them a controller.","However, he who turns away and disbelieves –","Then Allāh will punish him with the greatest punishment.","Indeed, to Us is their return.","Then indeed, upon Us is their account."],"ru":["Дошло ли до тебя повествование о Покрывающем бедствии?","Лица в тот будут День смиренные,","труждающиеся[75], изнурённые.","Они будут гореть в пылающем огне.","Их будут поить из кипящего источника.","Нет у них пищи, кроме горькой колючки,","которая не делает тучным и не утоляет голода.","Лица в тот День будут благоденствующими,","довольными своими стараниями,","в саду возвышенном.","Там они не услышат пустословия.","Там — источник текущий.","Там — ложа возвышенные,","и чаши расставленные,","и подушки разложенные рядами,","и ковры расстеленные.","Неужели они не смотрят на верблюдов — как они сотворены,","и на небо — как оно воздвигнуто,","и на горы — как они установлены,","и на землю — как она распростёрта?","Так напоминай же: воистину, ты — лишь напоминающий.","Ты вовсе не властен над ними.","Но кто отвернулся и отверг веру —","того Аллах подвергнет величайшему наказанию.","Воистину, к Нам их возвращение,","а затем, воистину, на Нас их расчёт."]},"89":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالْفَجْرِ","وَلَيَالٍ عَشْرٍ","وَالشَّفْعِ وَالْوَتْرِ","وَاللَّيْلِ إِذَا يَسْرِ","هَلْ فِي ذَٰلِكَ قَسَمٌ لِّذِي حِجْرٍ","أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","إِرَمَ ذَاتِ الْعِمَادِ","الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ","وَثَمُودَ الَّذِينَ جَابُوا الصَّخْرَ بِالْوَادِ","وَفِرْعَوْنَ ذِي الْأَوْتَادِ","الَّذِينَ طَغَوْا فِي الْبِلَادِ","فَأَكْثَرُوا فِيهَا الْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","إِنَّ رَبَّكَ لَبِالْمِرْصَادِ","فَأَمَّا الْإِنسَانُ إِذَا مَا ابْتَلَاهُ رَبُّهُ فَأَكْرَمَهُ وَنَعَّمَهُ فَيَقُولُ رَبِّي أَكْرَمَنِ","وَأَمَّا إِذَا مَا ابْتَلَاهُ فَقَدَرَ عَلَيْهِ رِزْقَهُ فَيَقُولُ رَبِّي أَهَانَنِ","كَلَّا بَل لَّا تُكْرِمُونَ الْيَتِيمَ","وَلَا تَحَاضُّونَ عَلَىٰ طَعَامِ الْمِسْكِينِ","وَتَأْكُلُونَ التُّرَاثَ أَكْلًا لَّمًّا","وَتُحِبُّونَ الْمَالَ حُبًّا جَمًّا","كَلَّا إِذَا دُكَّتِ الْأَرْضُ دَكًّا دَكًّا","وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا","وَجِيءَ يَوْمَئِذٍ بِجَهَنَّمَ يَوْمَئِذٍ يَتَذَكَّرُ الْإِنسَانُ وَأَنَّىٰ لَهُ الذِّكْرَىٰ","يَقُولُ يَا لَيْتَنِي قَدَّمْتُ لِحَيَاتِي","فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُ أَحَدٌ","وَلَا يُوثِقُ وَثَاقَهُ أَحَدٌ","يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ","ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","فَادْخُلِي فِي عِبَادِي","وَادْخُلِي جَنَّتِي"],"en":["By the dawn","And [by] ten nights","And [by] the even [number] and the odd","And [by] the night when it passes,","Is there [not] in [all] that an oath [sufficient] for one of perception?","Have you not considered how your Lord dealt with ʿAad -","[With] Iram - who had lofty pillars,","The likes of whom had never been created in the land?","And [with] Thamūd, who carved out the rocks in the valley?","And [with] Pharaoh, owner of the stakes?","[All of] whom oppressed within the lands","And increased therein the corruption.","So your Lord poured upon them a scourge of punishment.","Indeed, your Lord is in observation.","And as for man, when his Lord tries him and [thus] is generous to him and favors him, he says, \"My Lord has honored me.\"","But when He tries him and restricts his provision, he says, \"My Lord has humiliated me.\"","No! But you do not honor the orphan","And you do not encourage one another to feed the poor.","And you consume inheritance, devouring [it] altogether,","And you love wealth with immense love.","No! When the earth has been leveled - pounded and crushed","And your Lord has come and the angels, rank upon rank,","And brought [within view], that Day, is Hell - that Day, man will remember, but how [i.e., what good] to him will be the remembrance?","He will say, \"Oh, I wish I had sent ahead [some good] for my life.\"","So on that Day, none will punish [as severely] as His punishment,","And none will bind [as severely] as His binding [of the evildoers].","[To the righteous it will be said], \"O reassured soul,","Return to your Lord, well-pleased and pleasing [to Him],","And enter among My [righteous] servants","And enter My Paradise.\""],"ru":["Клянусь зарёй,","и десятью ночами,","и чётом и нечётом,","и ночью, когда она проходит.","Есть ли в этом клятва для обладающего разумом?","Разве ты не видел, как поступил твой Господь с племенем ‘ад,","— с народом Ира́ма, обладателем колонн,","подобного которому не было создано в городах,","и с племенем самуд, которые вырубали [жилища] в скалах в долине,","и с Фараоном, обладателем кольев,","— теми, которые бесчинствовали в городах","и приумножали в них беззаконие,","и тогда твой Господь обрушил на них бич наказания.","Воистину, твой Господь — в засаде.","Что касается человека, то, когда Господь его испытывает, щедро одаривая и оказывая ему почёт, он говорит: «Мой Господь почтил меня!»","А что касается его, когда Он испытывает его и ограничивает ему удел, то он говорит: «Мой Господь унизил меня!»","Отнюдь! Нет, напротив, вы не оказываете почёта сироте,","и не побуждаете друг друга кормить бедняка,","и алчно пожираете наследство,","и любите богатство страстной любовью.","Отнюдь! Когда земля будет раздроблена в прах,","и придёт твой Господь, и ангелы выстроятся рядами,","и будет приведена Геенна, в тот День человек внемлет напоминанию, но что ему от этого напоминания?","Он скажет: «О, если бы я уготовил для своей жизни!»","В тот День никто не накажет так, как наказывает Он,","и никто не наложит таких оков, как наложит Он.","О душа, обретшая покой!","Вернись к своему Господу, довольная и снискавшая довольство.","Войди же в число Моих рабов,","и войди в Мой Рай."]},"90":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ لَا أُقْسِمُ بِهَٰذَا الْبَلَدِ","وَأَنتَ حِلٌّ بِهَٰذَا الْبَلَدِ","وَوَالِدٍ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ","أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","أَيَحْسَبُ أَن لَّمْ يَرَهُ أَحَدٌ","أَلَمْ نَجْعَل لَّهُ عَيْنَيْنِ","وَلِسَانًا وَشَفَتَيْنِ","وَهَدَيْنَاهُ النَّجْدَيْنِ","فَلَا اقْتَحَمَ الْعَقَبَةَ","وَمَا أَدْرَاكَ مَا الْعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ","يَتِيمًا ذَا مَقْرَبَةٍ","أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","ثُمَّ كَانَ مِنَ الَّذِينَ آمَنُوا وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ","أُولَٰئِكَ أَصْحَابُ الْمَيْمَنَةِ","وَالَّذِينَ كَفَرُوا بِآيَاتِنَا هُمْ أَصْحَابُ الْمَشْأَمَةِ","عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌ"],"en":["I swear by this city [i.e., Makkah] –","And you, [O Muḥammad], are free of restriction in this city –","And [by] the father and that which was born [of him],","We have certainly created man into hardship.","Does he think that never will anyone overcome him?","He says, \"I have spent wealth in abundance.\"","Does he think that no one has seen him?","Have We not made for him two eyes?","And a tongue and two lips?","And have shown him the two ways?","But he has not broken through the difficult pass.","And what can make you know what is [breaking through] the difficult pass?","It is the freeing of a slave","Or feeding on a day of severe hunger","An orphan of near relationship","Or a needy person in misery","And then being among those who believed and advised one another to patience and advised one another to compassion.","Those are the companions of the right.","But they who disbelieved in Our signs - those are the companions of the left.","Over them will be fire closed in."],"ru":["Нет же! Клянусь этим городом, —","и тебе дозволено в этом городе.","И родителем и тем, кого он породил.","Воистину, Мы сотворили человека [погружённым] в тяготы.","Неужели он полагает, что никто его не одолеет?","Он говорит: «Я погубил несметное богатство!»","Неужели он думает, что никто его не видел?","Разве Мы не создали ему два глаза,","и язык, и две губы,","и не указали ему две дороги [добра и зла]?","Но он не стал идти по крутой тропе.","А откуда тебе знать, что такое крутая тропа?","[Это —] освобождение раба,","или кормление в день голода","сироты, близкого по родству,","или бедняка, приникшего к земле.","А затем — быть из тех, которые уверовали и заповедали друг другу терпение и заповедали друг другу милосердие.","Такие — люди правой стороны.","А те, которые отвергли Наши знамения, — они — люди левой стороны.","Над ними — огонь, сомкнувшийся со всех сторон."]},"91":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالشَّمْسِ وَضُحَاهَا","وَالْقَمَرِ إِذَا تَلَاهَا","وَالنَّهَارِ إِذَا جَلَّاهَا","وَاللَّيْلِ إِذَا يَغْشَاهَا","وَالسَّمَاءِ وَمَا بَنَاهَا","وَالْأَرْضِ وَمَا طَحَاهَا","وَنَفْسٍ وَمَا سَوَّاهَا","فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا","قَدْ أَفْلَحَ مَن زَكَّاهَا","وَقَدْ خَابَ مَن دَسَّاهَا","كَذَّبَتْ ثَمُودُ بِطَغْوَاهَا","إِذِ انبَعَثَ أَشْقَاهَا","فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنبِهِمْ فَسَوَّاهَا","وَلَا يَخَافُ عُقْبَاهَا"],"en":["By the sun and its brightness","And [by] the moon when it follows it","And [by] the day when it displays it","And [by] the night when it covers [i.e., conceals] it","And [by] the sky and He who constructed it","And [by] the earth and He who spread it","And [by] the soul and He who proportioned it","And inspired it [with discernment of] its wickedness and its righteousness,","He has succeeded who purifies it,","And he has failed who instills it [with corruption].","Thamūd denied [their prophet] by reason of their transgression,","When the most wretched of them was sent forth.","And the messenger of Allāh [i.e., Ṣāliḥ] said to them, \"[Do not harm] the she-camel of Allāh or [prevent her from] her drink.\"","But they denied him and hamstrung her. So their Lord brought down upon them destruction for their sin and made it equal [upon all of them].","And He does not fear the consequence thereof."],"ru":["Клянусь солнцем и его утренним сиянием,","и луной, когда она следует за ним,","и днём, когда он являет его,","и ночью, когда она покрывает его,","и небом, и тем, что Он его воздвиг,","и землёй, и тем, что Он её распростёр,","и душой, и тем, что Он её соразмерил","и внушил ей её греховность и её богобоязненность.","Преуспел тот, кто очистил её,","и потерпел неудачу тот, кто опорочил её.","Племя самуд сочло ложью [истину] из-за своей мятежности,","когда выступил вперёд самый несчастный из них.","И тогда посланник Аллаха сказал им: «[Не троньте] верблюдицу Аллаха и её питьё!»","Но они сочли его лжецом и закололи её. И их Господь уничтожил их за их грех и уровнял их [в наказании].","И Он не боится последствий этого."]},"92":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَاللَّيْلِ إِذَا يَغْشَىٰ","وَالنَّهَارِ إِذَا تَجَلَّىٰ","وَمَا خَلَقَ الذَّكَرَ وَالْأُنثَىٰ","إِنَّ سَعْيَكُمْ لَشَتَّىٰ","فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ","وَصَدَّقَ بِالْحُسْنَىٰ","فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ","وَأَمَّا مَن بَخِلَ وَاسْتَغْنَىٰ","وَكَذَّبَ بِالْحُسْنَىٰ","فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ","وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ","إِنَّ عَلَيْنَا لَلْهُدَىٰ","وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَىٰ","فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","لَا يَصْلَاهَا إِلَّا الْأَشْقَى","الَّذِي كَذَّبَ وَتَوَلَّىٰ","وَسَيُجَنَّبُهَا الْأَتْقَى","الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّىٰ","وَمَا لِأَحَدٍ عِندَهُ مِن نِّعْمَةٍ تُجْزَىٰ","إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ","وَلَسَوْفَ يَرْضَىٰ"],"en":["By the night when it covers","And [by] the day when it appears","And [by] He who created the male and female,","Indeed, your efforts are diverse.","As for he who gives and fears Allāh","And believes in the best [reward].","We will ease him toward ease.","But as for he who withholds and considers himself free of need","And denies the best [reward],","We will ease him toward difficulty.","And what will his wealth avail him when he falls?","Indeed, [incumbent] upon Us is guidance.","And indeed, to us belongs the Hereafter and the first [life].","So I have warned you of a Fire which is blazing.","None will [enter to] burn therein except the most wretched one","Who had denied and turned away.","But the righteous one will avoid it –","[He] who gives [from] his wealth to purify himself","And not [giving] for anyone who has [done him] a favor to be rewarded –","But only seeking the face [i.e., acceptance] of his Lord, Most High.","And he is going to be satisfied."],"ru":["Клянусь ночью, когда она покрывает,","и днём, когда он сияет,","и тем, что Он сотворил мужской пол и женский.","Воистину, ваши усилия различны.","Что же касается того, кто отдавал и был богобоязнен,","и признавал самое лучшее, —","Мы облегчим ему путь к легчайшему.","А что касается того, кто скупился и возомнил себя самодостаточным,","и счёл ложью самое лучшее, —","Мы облегчим ему путь к тягчайшему.","И не избавит его богатство, когда он будет низвергнут.","Воистину, на Нас — верное руководство,","и, воистину, Нам принадлежат и Последняя жизнь, и первая.","И Я предостерёг вас от огня, который пылает,","в него войдёт только самый несчастный, —","тот, кто счёл ложью [послание] и отвернулся.","А будет удалён от него самый богобоязненный, —","тот, кто отдаёт своё имущество, стремясь к очищению,","не в воздаяние за оказанную милость,","но лишь стремясь к Лику своего Высочайшего Господа.","И он непременно будет доволен."]},"93":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالضُّحَىٰ","وَاللَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","وَوَجَدَكَ ضَالًّا فَهَدَىٰ","وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"],"en":["By the morning brightness","And [by] the night when it covers with darkness,","Your Lord has not taken leave of you, [O Muḥammad], nor has He detested [you].","And the Hereafter is better for you than the first [life].","And your Lord is going to give you, and you will be satisfied.","Did He not find you an orphan and give [you] refuge?","And He found you lost and guided [you],","And He found you poor and made [you] self-sufficient.","So as for the orphan, do not oppress [him].","And as for the petitioner, do not repel [him].","But as for the favor of your Lord, report [it]."],"ru":["Клянусь утренним временем,","и ночью, когда она утихнет.","Твой Господь не покинул тебя и не возненавидел.","И Последняя жизнь лучше для тебя, чем первая.","Твой Господь непременно одарит тебя, и ты останешься доволен.","Разве Он не нашёл тебя сиротой и не приютил?","И не нашёл тебя не знающим пути и не наставил?","И не нашёл тебя нуждающимся и не обогатил?","А что касается сироты, то не притесняй.","А что касается просящего, то не прогоняй.","А что касается благ твоего Господа, то возвещай [о них]."]},"94":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","الَّذِي أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَ","فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","إِنَّ مَعَ الْعُسْرِ يُسْرًا","فَإِذَا فَرَغْتَ فَانصَبْ","وَإِلَىٰ رَبِّكَ فَارْغَب"],"en":["Did We not expand for you, [O Muḥammad], your breast?","And We removed from you your burden","Which had weighed upon your back","And raised high for you your repute.","For indeed, with hardship [will be] ease [i.e., relief].","Indeed, with hardship [will be] ease.","So when you have finished [your duties], then stand up [for worship].","And to your Lord direct [your] longing."],"ru":["Разве Мы не раскрыли тебе грудь,","и не сняли с тебя ношу,","которая отягощала твою спину,","и не возвысили поминание о тебе?","Воистину, с трудностью — облегчение.","Воистину, с трудностью — облегчение.","И когда освободишься [от дел], проявляй усердие,","и к своему Господу устремляйся."]},"95":{"ar":["بِّسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالتِّينِ وَالزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَٰذَا الْبَلَدِ الْأَمِينِ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ","ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ","أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ"],"en":["By the fig and the olive","And [by] Mount Sinai","And [by] this secure city [i.e., Makkah],","We have certainly created man in the best of stature;","Then We return him to the lowest of the low,","Except for those who believe and do righteous deeds, for they will have a reward uninterrupted.","So what yet causes you to deny the Recompense?","Is not Allāh the most just of judges?"],"ru":["Клянусь смоковницей[76] и оливой,","и горой Синай,","и этим безопасным городом:","действительно, Мы сотворили человека в наилучшем сложении.","Затем Мы низвели его до нижайшего из низких,","кроме тех, которые уверовали и совершали праведные деяния: для них — неиссякаемая награда.","Так что же после этого побуждает тебя считать ложью Суд?","Разве Аллах — не Наимудрейший из судящих?"]},"96":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ","خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ","اقْرَأْ وَرَبُّكَ الْأَكْرَمُ","الَّذِي عَلَّمَ بِالْقَلَمِ","عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ","كَلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ","أَن رَّآهُ اسْتَغْنَىٰ","إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ","أَرَأَيْتَ الَّذِي يَنْهَىٰ","عَبْدًا إِذَا صَلَّىٰ","أَرَأَيْتَ إِن كَانَ عَلَى الْهُدَىٰ","أَوْ أَمَرَ بِالتَّقْوَىٰ","أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ","أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ","كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ","نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ","فَلْيَدْعُ نَادِيَهُ","سَنَدْعُ الزَّبَانِيَةَ","كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب"],"en":["Recite in the name of your Lord who created –","Created man from a clinging substance.","Recite, and your Lord is the most Generous -","Who taught by the pen –","Taught man that which he knew not.","No! [But] indeed, man transgresses","Because he sees himself self-sufficient.","Indeed, to your Lord is the return.","Have you seen the one who forbids","A servant when he prays?","Have you seen if he is upon guidance","Or enjoins righteousness?","Have you seen if he denies and turns away -","Does he not know that Allāh sees?","No! If he does not desist, We will surely drag him by the forelock –","A lying, sinning forelock.","Then let him call his associates;","We will call the angels of Hell.","No! Do not obey him. But prostrate and draw near [to Allāh]."],"ru":["Читай с именем своего Господа, Который сотворил,","сотворил человека из сгустка.","Читай, и твой Господь — Наищедрейший,","Который научил посредством пера,","научил человека тому, чего он не знал.","Отнюдь! Воистину, человек преступает предел,","как только увидит себя ни в чём не нуждающимся.","Воистину, к твоему Господу — возвращение.","Видел ли ты того, который препятствует","рабу [Аллаха], когда тот совершает молитву?","А как ты думаешь: если он [раб] на верном пути","или призывает к богобоязненности?","А как ты думаешь: если он [препятствующий] счёл истину ложью и отвернулся?","Неужели он не знал о том, что Аллах видит его?","Отнюдь! Если он не прекратит, Мы непременно схватим его за чуб,","— чуб лживый, грешный!","Так пусть же он созовёт своё сборище!","Мы же призовём Адских стражей.","Отнюдь! Не повинуйся ему, пади ниц и приблизься [к Аллаху]!"]},"97":{"ar":["بِّسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ","لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ"],"en":["Indeed, We sent it [i.e., the Qur’ān] down during the Night of Decree.","And what can make you know what is the Night of Decree?","The Night of Decree is better than a thousand months.","The angels and the Spirit [i.e., Gabriel] descend therein by permission of their Lord for every matter.","Peace it is until the emergence of dawn."],"ru":["Воистину, Мы ниспослали его в Ночь предопределения.","И откуда тебе знать, что такое Ночь предопределения?","Ночь предопределения лучше тысячи месяцев.","В эту ночь нисходят ангелы и Дух с дозволения их Господа с каждым велением.","Она — мир вплоть до восхода зари."]},"98":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ","رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً","فِيهَا كُتُبٌ قَيِّمَةٌ","وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ","وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ","إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا أُولَٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ","جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ"],"en":["Those who disbelieved among the People of the Scripture and the polytheists were not to be parted [from misbelief] until there came to them clear evidence –","A Messenger from Allāh, reciting purified scriptures","Within which are correct writings [i.e., rulings and laws].","Nor did those who were given the Scripture become divided until after there had come to them clear evidence.","And they were not commanded except to worship Allāh, [being] sincere to Him in religion, inclining to truth, and to establish prayer and to give zakāh. And that is the correct religion.","Indeed, they who disbelieved among the People of the Scripture and the polytheists will be in the fire of Hell, abiding eternally therein. Those are the worst of creatures.","Indeed, they who have believed and done righteous deeds - those are the best of creatures.","Their reward with their Lord will be gardens of perpetual residence beneath which rivers flow, wherein they will abide forever, Allāh being pleased with them and they with Him. That is for whoever has feared his Lord."],"ru":["Те, которые отвергли веру, — из людей Писания и придающих Аллаху сотоварищей — не отходили [от своего неверия], пока к ним не пришло ясное доказательство —","Посланник от Аллаха, который читает очищенные свитки,","в которых — верные писания.","Те, которым было даровано Писание, разделились только после того, как к ним пришло ясное доказательство.","А им было велено лишь поклоняться Аллаху, искренне посвящая Ему религию, будучи приверженцами единобожия, выстаивать молитву и выплачивать закят. Такова религия прямоты.","Воистину, те, которые отвергли веру, — из людей Писания и придающих Аллаху сотоварищей — окажутся в огне Геенны, пребывая там вечно. Такие и есть худшие из созданий.","Воистину, те, которые уверовали и совершали праведные деяния, — такие и есть лучшие из созданий.","Их воздаяние у их Господа — сады Вечного пребывания, внизу которых текут реки, и где они пребудут вечно, навсегда. Аллах доволен ими, и довольны они Им. Это — для того, кто страшился своего Господа."]},"99":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","وَقَالَ الْإِنسَانُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ","فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ"],"en":["When the earth is shaken with its [final] earthquake","And the earth discharges its burdens","And man says, \"What is [wrong] with it?\" -","That Day, it will report its news","Because your Lord has inspired [i.e., commanded] it.","That Day, the people will depart separated [into categories] to be shown [the result of] their deeds.","So whoever does an atom's weight of good will see it,","And whoever does an atom's weight of evil will see it."],"ru":["Когда земля сотрясётся своим сотрясением,","и земля извергнет свои ноши,","и скажет человек: «Что с ней?» —","в тот День она поведает свои вести,","потому что твой Господь внушил ей [поведать] это.","В тот День люди выйдут разрозненными группами, чтобы им были показаны их деяния.","И кто совершил добро весом с пылинку — увидит его.","И кто совершил зло весом с пылинку — увидит его."]},"100":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالْعَادِيَاتِ ضَبْحًا","فَالْمُورِيَاتِ قَدْحًا","فَالْمُغِيرَاتِ صُبْحًا","فَأَثَرْنَ بِهِ نَقْعًا","فَوَسَطْنَ بِهِ جَمْعًا","إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ","وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ","أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ","وَحُصِّلَ مَا فِي الصُّدُورِ","إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ"],"en":["By the racers, panting,","And the producers of sparks [when] striking","And the chargers at dawn,","Stirring up thereby [clouds of] dust,","Arriving thereby in the center collectively,","Indeed mankind, to his Lord, is ungrateful.","And indeed, he is to that a witness.","And indeed he is, in love of wealth, intense.","But does he not know that when the contents of the graves are scattered","And that within the breasts is obtained,","Indeed, their Lord with them, that Day, is [fully] Aware."],"ru":["Клянусь мчащимися во весь опор, запыхавшимися,","высекающими [копытами] искры,","нападающими утром,","и поднимающими этим клубы пыли,","и врывающимися с этим в гущу толпы:","воистину, человек неблагодарен своему Господу.","И, воистину, он сам этому свидетель.","И, воистину, он сильно любит богатство.","Неужели он не знает, что когда будет взрыто то, что в могилах,","и извлечено то, что таится в сердцах, —","воистину, в тот День их Господь будет осведомлён о них?"]},"101":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الْقَارِعَةُ","مَا الْقَارِعَةُ","وَمَا أَدْرَاكَ مَا الْقَارِعَةُ","يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ","وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ","فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ","فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ","وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ","فَأُمُّهُ هَاوِيَةٌ","وَمَا أَدْرَاكَ مَا هِيَهْ","نَارٌ حَامِيَةٌ"],"en":["The Striking Calamity -","What is the Striking Calamity?","And what can make you know what is the Striking Calamity?","It is the Day when people will be like moths, dispersed,","And the mountains will be like wool, fluffed up.","Then as for one whose scales are heavy [with good deeds],","He will be in a pleasant life.","But as for one whose scales are light,","His refuge will be an abyss.","And what can make you know what that is?","It is a Fire, intensely hot."],"ru":["Поражающее!","Что такое Поражающее?","И откуда тебе знать, что такое Поражающее?","В тот День люди будут словно разлетающиеся мотыльки,","а горы станут подобны разноцветной растрёпанной шерсти.","А что касается того, чья чаша весов окажется тяжёлой, —","он будет в жизни отрадной.","А что касается того, чья чаша весов окажется лёгкой, —","его матерь — Бездна.","И откуда тебе знать, что это такое?","Огонь раскалённый!"]},"102":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَلْهَاكُمُ التَّكَاثُرُ","حَتَّىٰ زُرْتُمُ الْمَقَابِرَ","كَلَّا سَوْفَ تَعْلَمُونَ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ","لَتَرَوُنَّ الْجَحِيمَ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ","ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ"],"en":["Competition in [worldly] increase diverts you","Until you visit the graveyards.","No! You are going to know.","Then, no! You are going to know.","No! If you only knew with knowledge of certainty...","You will surely see the Hellfire.","Then you will surely see it with the eye of certainty.","Then you will surely be asked that Day about pleasure."],"ru":["Отвлекло вас приумножение —","пока вы не навестили могилы.","Отнюдь! Вы непременно узнаете.","Затем — отнюдь! Вы непременно узнаете.","Отнюдь! Если бы вы обладали достоверным знанием...","Вы непременно увидите адское пекло.","Затем вы непременно увидите его воочию,","а затем в тот День вы непременно будете спрошены о благоденствии."]},"103":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَالْعَصْرِ","إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"],"en":["By time,","Indeed, mankind is in loss,","Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience."],"ru":["Клянусь предвечерьем!","Воистину, человек пребывает в убытке,","кроме тех, кто которые уверовали, совершали праведные деяния, заповедовали друг другу истину и заповедовали друг другу терпение."]},"104":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ","الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ","يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ","كَلَّا لَيُنبَذَنَّ فِي الْحُطَمَةِ","وَمَا أَدْرَاكَ مَا الْحُطَمَةُ","نَارُ اللَّهِ الْمُوقَدَةُ","الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ","إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ","فِي عَمَدٍ مُّمَدَّدَةٍ"],"en":["Woe to every scorner and mocker","Who collects wealth and [continuously] counts it.","He thinks that his wealth will make him immortal.","No! He will surely be thrown into the Crusher.","And what can make you know what is the Crusher?","It is the fire of Allāh, [eternally] fueled,","Which mounts directed at the hearts.","Indeed, it [i.e., Hellfire] will be closed down upon them","In extended columns."],"ru":["Горе всякому хулителю и насмешнику,","который накапливает богатство и пересчитывает его,","полагая, что его богатство сделает его вечным!","Отнюдь! Он непременно будет брошен в Сокрушающее.","И откуда тебе знать, что такое Сокрушающее?","[Это] — разожжённый огонь Аллаха,","который проникает в сердца.","Воистину, он будет сомкнут над ними","в протяжённых столбах."]},"105":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ"],"en":["Have you not considered, [O Muḥammad], how your Lord dealt with the companions of the elephant?","Did He not make their plan into misguidance?","And He sent against them birds in flocks,","Striking them with stones of hard clay,","And He made them like eaten straw."],"ru":["Разве ты не видел, как поступил твой Господь с обладателями слона?","Разве Он не сделал их замысел тщетным,","и не наслал на них птиц стаями,","которые бросали в них камни из обожжённой глины?","И Он сделал их подобными изъеденной соломе."]},"106":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ لِإِيلَافِ قُرَيْشٍ","إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ"],"en":["For the accustomed security of the Quraysh -","Their accustomed security [in] the caravan of winter and summer -","Let them worship the Lord of this House,","Who has fed them, [saving them] from hunger and made them safe, [saving them] from fear."],"ru":["Ради единения курайшитов —","их единения в зимних и летних поездках.","Так пусть же они поклоняются Господу этого Дома,","Который накормил их, [избавив] от голода, и обезопасил их от страха."]},"107":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","فَوَيْلٌ لِّلْمُصَلِّينَ","الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","الَّذِينَ هُمْ يُرَاءُونَ","وَيَمْنَعُونَ الْمَاعُونَ"],"en":["Have you seen the one who denies the Recompense?","For that is the one who drives away the orphan","And does not encourage the feeding of the poor.","So woe to those who pray","[But] who are heedless of their prayer -","Those who make show [of their deeds]","And withhold [simple] assistance."],"ru":["Видел ли ты того, кто считает ложью Суд?","Это тот, кто грубо отталкивает сироту","и не побуждает кормить бедняка.","Так горе же молящимся,","которые небрежны в своих молитвах,","которые совершают деяния напоказ,","и отказывают в малой помощи."]},"108":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ","إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"],"en":["Indeed, We have granted you, [O Muḥammad], al-Kawthar.","So pray to your Lord and offer sacrifice [to Him alone].","Indeed, your enemy is the one cut off."],"ru":["Воистину, Мы даровали тебе аль-Каусар.","Так молись же своему Господу и соверши заклание.","Воистину, твой ненавистник — он сам окажется без потомства."]},"109":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ يَا أَيُّهَا الْكَافِرُونَ","لَا أَعْبُدُ مَا تَعْبُدُونَ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","لَكُمْ دِينُكُمْ وَلِيَ دِينِ"],"en":["Say, \"O disbelievers,","I do not worship what you worship.","Nor are you worshippers of what I worship.","Nor will I be a worshipper of what you worship.","Nor will you be worshippers of what I worship.","For you is your religion, and for me is my religion.\""],"ru":["Скажи: «О вы, отвергшие веру!","Я не поклоняюсь тому, чему вы поклоняетесь.","И вы не поклоняетесь тому, чему поклоняюсь я.","И я не буду поклоняться тому, чему вы поклонялись.","И вы не будете поклоняться тому, чему поклоняюсь я.","Вам — ваша религия, а мне — моя религия!»"]},"110":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا"],"en":["When the victory of Allāh has come and the conquest,","And you see the people entering into the religion of Allāh in multitudes,","Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of Repentance."],"ru":["Когда придёт помощь Аллаха и Победа,","и ты увидишь людей, входящих в религию Аллаха толпами,","то прославляй хвалой Господа твоего и проси у Него прощения. Воистину, Он всегда был [и пребудет] принимающим покаяние."]},"111":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ","مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ","سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ"],"en":["May the hands of Abū Lahab be ruined, and ruined is he.","His wealth will not avail him or that which he gained.","He will [enter to] burn in a Fire of [blazing] flame","And his wife [as well] - the carrier of firewood.","Around her neck is a rope of [twisted] fiber."],"ru":["Да сгинут руки Абу Лахаба, и да сгинет он сам!","Не спасло его богатство и то, что он приобрёл.","Он будет гореть в пылающем огне,","и жена его — носящая дрова,","на шее которой — верёвка из скрученных пальмовых волокон."]},"112":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ"],"en":["Say, \"He is Allāh, [who is] One,","Allāh, the Eternal Refuge.","He neither begets nor is born,","Nor is there to Him any equivalent.\""],"ru":["Скажи: «Он — Аллах, Един.","Аллах — Самодостаточный.","Он не родил и не был рождён,","и нет никого, равного Ему»."]},"113":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ"],"en":["Say, \"I seek refuge in the Lord of daybreak","From the evil of that which He created","And from the evil of darkness when it settles","And from the evil of the blowers in knots","And from the evil of an envier when he envies.\""],"ru":["Скажи: «Прибегаю к защите Господа рассвета —","от зла того, что Он сотворил,","и от зла ночного мрака, когда он сгущается,","и от зла тех, кто дует на узлы,","и от зла завистника, когда он завидует»."]},"114":{"ar":["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","إِلَٰهِ النَّاسِ","مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","مِنَ الْجِنَّةِ وَالنَّاسِ"],"en":["Say, \"I seek refuge in the Lord of mankind,","The Sovereign of mankind,","The God of mankind,","From the evil of the retreating whisperer -","Who whispers [evil] into the breasts of mankind -","From among the jinn and mankind.\""],"ru":["Скажи: «Прибегаю к защите Господа людей,","Владыки людей,","Бога людей,","от зла наущающего, отступающего,","который наущает в груди людей,","из числа джиннов и людей»."]}}};
const D=DATA.D,L=DATA.L,S=DATA.S,QT=DATA.QT;
const ORDER=['morning','evening','sleep','prayer','daily','duas','surahs'];

// ---------- state ----------
const KEY='just-askars.v1';
let st={name:'',lang:'',size:1.75,tab:'',prog:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s)}catch(e){}
const today=new Date().toISOString().slice(0,10);
if(st.day!==today){st.day=today;st.prog={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
const t=()=>T[st.lang]||T.en;
const li=()=>({en:0,ru:1,ar:2})[st.lang]||0;
const loc=o=>o?(o[st.lang]||o.en):'';
const num=n=>st.lang==='ar'?Number(n).toLocaleString('ar-EG'):String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function srcText(arr,q){
  const sep=st.lang==='ar'?'، ':', ';
  let s=arr.map(k=>SRC[k][li()]).join(sep);
  if(q)s=t().quran+' '+q+(s?sep+s:'');
  return s;
}
const AD='٠١٢٣٤٥٦٧٨٩';
const adig=n=>String(n).replace(/\d/g,d=>AD[d]);
const tagOf=o=>!o?'':(st.lang==='ar'?(o.ar||''):(o[st.lang]||o.en||''));
const noteOf=o=>!o?'':(st.lang==='ar'?(o.ar||''):(o[st.lang]||o.en||''));
function quranHTML(n){
  const q=QT[n];if(!q)return'';
  const ar=q.ar.map((a,i)=>a+' <span class="am">﴿'+adig(i+1)+'﴾</span>').join(' ');
  const tr=st.lang==='ar'?'':'<ol class="vt">'+q[st.lang].map(v=>'<li>'+esc(v)+'</li>').join('')+'</ol>';
  return '<p class="ar">'+(n!==1&&n!==9?'<span class="bsm">'+SB+'</span>':'')+ar+'</p>'+tr;
}

function applyLang(){
  const r=document.documentElement;
  r.lang=st.lang||'en';r.dir=st.lang==='ar'?'rtl':'ltr';
  r.style.setProperty('--ar-size',st.size+'rem');
}

// ---------- render ----------
function nowTab(){
  const h=new Date().getHours();
  if(h>=4&&h<12)return'morning';
  if(h>=15&&h<20)return'evening';
  if(h>=21||h<4)return'sleep';
  return null;
}
function render(){
  applyLang();
  const tt=t();
  $('brand').textContent=tt.brand;
  $('openSettings').textContent=tt.settings;$('author').textContent=tt.author;
  $('greet').innerHTML=esc(tt.greet)+', <em>'+esc(st.name)+'</em>';
  const d=new Date(),dl=[];
  const lc=st.lang==='ar'?'ar':st.lang==='ru'?'ru-RU':'en-GB';
  try{dl.push(new Intl.DateTimeFormat(lc,{weekday:'long',day:'numeric',month:'long'}).format(d))}catch(e){}
  try{dl.push(new Intl.DateTimeFormat(lc+'-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(d))}catch(e){}
  $('dates').innerHTML=dl.map(x=>'<span>'+esc(x)+'</span>').join('');
  const nt=nowTab();
  const hint=$('hint');
  if(nt){hint.hidden=false;hint.innerHTML='<p>'+esc(tt.now)+': <b>'+esc(tt.tabs[nt])+'</b></p>'+
    (st.tab!==nt?'<button type="button" data-go="'+nt+'">'+esc(tt.open)+'</button>':'');}
  else hint.hidden=true;
  $('tabs').innerHTML=ORDER.map(k=>'<button class="tab" role="tab" type="button" data-tab="'+k+'" aria-selected="'+(st.tab===k)+'">'+esc(tt.tabs[k])+'</button>').join('');
  $('secTitle').textContent=tt.tabs[st.tab];
  $('secSub').textContent=tt.sub[st.tab];
  renderList();
}
function progOf(tab){
  const p=st.prog[tab]||{};let a=0,b=0;
  L[tab].forEach(id=>{const it=D[id];if(!it.n)return;b++;if((p[id]||0)>=it.n)a++;});
  return[a,b];
}
function renderProg(){
  const el=$('prog');
  if(st.tab==='surahs'){el.innerHTML='<span>'+esc(num(S.length))+' '+esc(t().surahsN)+'</span>';return}
  const[a,b]=progOf(st.tab);
  el.innerHTML='<span>'+esc(t().done.replace('{a}',num(a)).replace('{b}',num(b)))+'</span><span class="bar"><i style="width:'+(b?a/b*100:0)+'%"></i></span><button class="reset" type="button" id="reset">'+esc(t().reset)+'</button>';
}
const R=26,C=2*Math.PI*R;
function ring(cur,n){
  const frac=n?Math.min(cur/n,1):(cur?1:0);
  const label=n?num(Math.max(n-cur,0)||0):num(cur);
  const shown=n&&cur>=n?'✓':label;
  return '<svg viewBox="0 0 60 60"><circle class="trk" cx="30" cy="30" r="'+R+'" fill="none" stroke-width="3"/><circle class="arc" cx="30" cy="30" r="'+R+'" fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-frac))+'"/></svg><span>'+shown+'</span>';
}
function cardHTML(id){
  const it=D[id],tt=t(),cur=(st.prog[st.tab]||{})[id]||0,done=it.n&&cur>=it.n;
  const tag=tagOf(it.t)||(it.n>1?'× '+num(it.n):'');
  const timesTxt=it.n?(it.n===1?tt.once:'<b>'+num(Math.min(cur,it.n))+'</b> / '+num(it.n)+' '+tt.times):'<b>'+num(cur)+'</b> · '+tt.free;
  return '<article class="card tappable'+(done?' done':'')+'" data-id="'+id+'">'+
    '<div class="meta"><span class="t">'+esc(tag)+'</span><span>'+esc(srcText(it.src,it.q))+'</span></div>'+
    '<p class="ar">'+it.ar+'</p>'+(st.lang==='ru'&&it.tl?'<p class="tl">'+esc(it.tl)+'</p>':'')+
    (st.lang!=='ar'&&(it[st.lang]||it.en)?'<p class="tr">'+esc(it[st.lang]||it.en)+'</p>':'')+
    (noteOf(it.note)?'<p class="note">'+esc(noteOf(it.note))+'</p>':'')+
    '<div class="foot"><span class="times">'+timesTxt+'</span><button class="count" type="button" aria-label="Count">'+ring(cur,it.n)+'</button></div></article>';
}
function surahHTML(s){
  const tt=t(),open=!!(st.open||{})[s.id],has=s.sura||s.ar;
  let body='';
  if(open){
    if(s.sura)body=quranHTML(s.sura);
    else body='<p class="ar">'+s.ar+'</p>'+(st.lang!=='ar'?'<p class="tr">'+esc(s[st.lang]||s.en)+'</p>':'');
  }
  const meta=s.verses?num(s.verses)+' '+tt.ayat:'';
  return '<article class="card" data-sid="'+s.id+'">'+
    '<div class="meta"><span class="t">'+esc(s.title[li()])+'</span><span>'+esc([meta,srcText(s.src||[])].filter(Boolean).join(' · '))+'</span></div>'+
    '<p class="tr"><b>'+esc(tt.when)+':</b> '+esc(tagOf(s.when))+'</p>'+
    (has?'<button class="toggle" type="button" data-toggle="'+s.id+'">'+esc(open?tt.hide:tt.show)+'</button>'+body:'')+'</article>';
}
function renderList(){
  const list=$('list');
  list.innerHTML=st.tab==='surahs'?S.map(surahHTML).join(''):L[st.tab].map(cardHTML).join('');
  renderProg();
}

function tap(card){
  const id=card.dataset.id,it=D[id];
  const p=st.prog[st.tab]=st.prog[st.tab]||{};
  const cur=p[id]||0;
  if(it.n&&cur>=it.n)return;
  p[id]=cur+1;save();
  try{navigator.vibrate&&navigator.vibrate(p[id]===it.n?[20,40,20]:10)}catch(e){}
  const tmp=document.createElement('div');tmp.innerHTML=cardHTML(id);
  const nc=tmp.firstChild;nc.classList.add('pop');
  card.replaceWith(nc);renderProg();
  if(it.n&&p[id]===it.n){
    const next=nc.nextElementSibling;
    if(next&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      const r=next.getBoundingClientRect();
      if(r.top>window.innerHeight*0.6)next.scrollIntoView({behavior:'smooth',block:'center'});
    }
  }
}

// ---------- events ----------
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){st.tab=go.dataset.go;save();render();return}
  const tb=e.target.closest('[data-tab]');if(tb){st.tab=tb.dataset.tab;save();render();return}
  if(e.target.id==='reset'){st.prog[st.tab]={};save();renderList();return}
  const tg=e.target.closest('[data-toggle]');if(tg){st.open=st.open||{};st.open[tg.dataset.toggle]=!st.open[tg.dataset.toggle];save();renderList();return}
  const card=e.target.closest('.card.tappable');
  if(card&&!e.target.closest('a')){
    if(!e.target.closest('.count')&&String(window.getSelection&&window.getSelection())!=='')return;
    tap(card);
  }
});

// ---------- modal ----------
let pendingLang='',firstRun=!st.name||!st.lang;
function modalText(){
  const tt=pendingLang?T[pendingLang]:T.en;
  
  $('lLang').textContent=tt.lang;$('lName').textContent=tt.name;$('lSize').textContent=tt.size;
  $('go').textContent=firstRun?tt.go:tt.save;
  $('nameIn').dir=pendingLang==='ar'?'rtl':'auto';
  document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===pendingLang));
}
function openModal(){
  pendingLang=st.lang;$('nameIn').value=st.name;$('err').hidden=true;
  $('sizeField').hidden=firstRun;modalText();$('modal').hidden=false;
  setTimeout(()=>{if(pendingLang)$('nameIn').focus()},50);
}
$('langs').addEventListener('click',e=>{const b=e.target.closest('.lang');if(!b)return;pendingLang=b.dataset.l;
  document.documentElement.lang=pendingLang;document.documentElement.dir=pendingLang==='ar'?'rtl':'ltr';modalText();$('nameIn').focus()});
$('sMinus').onclick=()=>{st.size=Math.max(1.2,+(st.size-.15).toFixed(2));applyLang()};
$('sPlus').onclick=()=>{st.size=Math.min(2.6,+(st.size+.15).toFixed(2));applyLang()};
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const tt=pendingLang?T[pendingLang]:T.en,name=$('nameIn').value.trim();
  if(!pendingLang){$('err').textContent=T.en.needLang+' · Выберите язык · اختر اللغة';$('err').hidden=false;return}
  if(!name){$('err').textContent=tt.needName;$('err').hidden=false;$('nameIn').focus();return}
  st.lang=pendingLang;st.name=name;firstRun=false;
  if(!st.tab)st.tab=nowTab()||'daily';
  save();$('modal').hidden=true;$('app').hidden=false;render();
});
$('openSettings').onclick=openModal;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!firstRun&&!$('modal').hidden){$('modal').hidden=true;render()}});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!firstRun){$('modal').hidden=true;render()}});

if(!st.tab||!L[st.tab])st.tab=nowTab()||'daily';
applyLang();
if(firstRun){openModal()}else{$('app').hidden=false;render()}
})();
</script>

</body>
</html>
