<style>
/* Layout: one floating column of liquid-glass panes over a slowly drifting emerald field — greeting, time hint, glass tab rail, dhikr cards with ring counters */
:root{
  --bg:#DDEBE3; --ink:#0E2A22; --muted:#4D675C; --green:#1F7A5A; --green-2:#3FAF83; --mint:#BFE8D4;
  --gold:#A27A22;
  --glass:rgba(255,255,255,.42); --glass-2:rgba(255,255,255,.62); --edge:rgba(255,255,255,.75); --edge-2:rgba(255,255,255,.25);
  --shadow:0 18px 40px -18px rgba(14,60,42,.35); --track:rgba(14,42,34,.12);
  --blob1:#7DD3AE; --blob2:#2E8B66; --blob3:#CDEFD9; --blob4:#9FD9C0;
  --done-glass:rgba(63,175,131,.20);
  --f-ar:"Scheherazade New","Amiri","Traditional Arabic",serif;
  --f-arui:"Amiri","Scheherazade New",serif;
  --f-display:"Playfair Display","Georgia",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ar-size:1.75rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06140F; --ink:#E6F3EC; --muted:#93B3A5; --green:#5CD6A3; --green-2:#2E9C72; --mint:#163B2E; --gold:#E2BF6E;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.12); --edge:rgba(255,255,255,.22); --edge-2:rgba(255,255,255,.05);
  --shadow:0 20px 50px -20px rgba(0,0,0,.7); --track:rgba(255,255,255,.12);
  --blob1:#0F6B4B; --blob2:#11402F; --blob3:#1E8A62; --blob4:#0A3D2C; --done-glass:rgba(92,214,163,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06140F; --ink:#E6F3EC; --muted:#93B3A5; --green:#5CD6A3; --green-2:#2E9C72; --mint:#163B2E; --gold:#E2BF6E;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.12); --edge:rgba(255,255,255,.22); --edge-2:rgba(255,255,255,.05);
  --shadow:0 20px 50px -20px rgba(0,0,0,.7); --track:rgba(255,255,255,.12);
  --blob1:#0F6B4B; --blob2:#11402F; --blob3:#1E8A62; --blob4:#0A3D2C; --done-glass:rgba(92,214,163,.14); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html[lang="ar"] body{font-family:var(--f-arui);font-size:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.field-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
.field-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.85;animation:drift 26s ease-in-out infinite alternate}
.field-bg i:nth-child(1){width:55vmax;height:55vmax;background:var(--blob1);top:-18vmax;left:-14vmax}
.field-bg i:nth-child(2){width:45vmax;height:45vmax;background:var(--blob2);bottom:-20vmax;right:-12vmax;animation-duration:32s;opacity:.55}
.field-bg i:nth-child(3){width:34vmax;height:34vmax;background:var(--blob3);top:30%;right:10%;animation-duration:22s}
.field-bg i:nth-child(4){width:28vmax;height:28vmax;background:var(--blob4);bottom:8%;left:12%;animation-duration:29s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}

.wrap{max-width:760px;margin:0 auto;padding-block:26px 70px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}

/* liquid glass material */
.glass,.card,.hint,.rail-inner,.icon-btn,.sheet,.tab[aria-selected="true"]{
  position:relative;background:linear-gradient(135deg,var(--glass-2),var(--glass) 55%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--edge-2);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge-2),var(--shadow)}
.card::before,.sheet::before,.hint::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 38%);mix-blend-mode:soft-light}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em}
.brand svg{width:30px;height:30px;color:var(--green)}
.brand span{background:linear-gradient(120deg,var(--green),var(--green-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
a.icon-btn{color:var(--ink);text-decoration:none}
.icon-btn{border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600}
.greet{margin:30px 0 6px;font-family:var(--f-display);font-weight:600;font-size:clamp(32px,7.5vw,50px);line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
html[lang="ar"] .greet{font-family:var(--f-arui);font-weight:700;line-height:1.5;letter-spacing:0}
.greet em{font-style:italic;font-weight:500;color:var(--green)}
html[lang="ar"] .greet em{font-style:normal}
.dates{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 8px}
.dates span+span::before{content:"·";margin-inline-end:8px}
.hint{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:20px;padding:12px 12px 12px 18px}
html[dir="rtl"] .hint{padding:12px 18px 12px 12px}
.hint p{margin:0;min-width:0}
.hint b{color:var(--green);font-weight:700}
.hint button,.go{border:0;color:#fff;font-weight:700;border-radius:999px;
  background:linear-gradient(180deg,var(--green-2),var(--green));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -8px var(--green)}
.hint button{padding:8px 16px;font-size:13px}

/* tabs */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:18px;padding-block:10px}
.rail-inner{border-radius:999px;padding:5px;overflow-x:auto;scrollbar-width:none}
.rail-inner::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:2px;width:max-content}
.tab{border:1px solid transparent;background:transparent;border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted);transition:color .2s}
.tab[aria-selected="true"]{color:var(--green);background:linear-gradient(180deg,var(--glass-2),var(--glass-2))}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
.sec-head h2{margin:0;font-family:var(--f-display);font-size:32px;font-weight:600}
html[lang="ar"] .sec-head h2{font-family:var(--f-arui);font-weight:700}
.sec-sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:120px;height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--green-2),var(--green));transition:width .4s}
.reset{border:0;background:none;color:var(--green);font-size:13px;font-weight:600;padding:0}

/* cards */
.list{display:flex;flex-direction:column;gap:14px}
.card{border-radius:24px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:12px;
  transition:transform .2s,background .3s;-webkit-tap-highlight-color:transparent}
.card.tappable{cursor:pointer}
.card.tappable:active{transform:scale(.99)}
.card.done{background:linear-gradient(135deg,var(--done-glass),var(--glass))}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meta .t{color:var(--green);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;
  background:var(--glass-2);border:1px solid var(--edge-2);border-radius:999px;padding:2px 10px}
.meta .t:empty{display:none}
html[lang="ar"] .meta .t{text-transform:none;letter-spacing:0;font-size:15px}
.ar{font-family:var(--f-ar);font-size:var(--ar-size);line-height:2.15;margin:0;text-align:right;direction:rtl}
.part-name{margin:4px 0 -8px;text-align:right;direction:rtl;font-family:var(--f-arui);font-size:16px;color:var(--gold)}
.bsm{display:block;text-align:center;font-size:.82em;color:var(--green)}
.tr{margin:0;opacity:.9;max-width:68ch}
.note{margin:0;font-size:13.5px;color:var(--muted);background:var(--glass);border-radius:14px;padding:9px 13px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.times{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.times b{color:var(--ink);font-size:15px}
.count{position:relative;width:62px;height:62px;border:0;padding:0;flex:none;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--glass-2),var(--glass));box-shadow:inset 0 1px 0 var(--edge),0 6px 16px -8px rgba(0,0,0,.3)}
.count svg{width:100%;height:100%;transform:rotate(-90deg)}
.count .trk{stroke:var(--track)}
.count .arc{stroke:var(--green);transition:stroke-dashoffset .3s}
.count span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;font-family:var(--f-body)}
.done .count span{color:var(--green)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:600;color:var(--green);background:var(--glass-2);border:1px solid var(--edge-2);border-radius:999px;padding:6px 13px;text-decoration:none}
.toggle{align-self:flex-start;border:0;background:none;padding:0;color:var(--green);font-size:13px;font-weight:600}
.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(.985)}}
@media (prefers-reduced-motion: reduce){.pop,.field-bg i{animation:none}.bar i,.count .arc{transition:none}}

/* modal */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg) 30%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:420px;border-radius:30px;padding:30px 24px 24px;display:flex;flex-direction:column;gap:18px;max-height:100%;overflow:auto}
.sheet .star{color:var(--green);width:46px;height:46px;align-self:center}
.sheet .brandname{margin:-8px 0 -10px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.sheet h3{margin:0;text-align:center;font-family:var(--f-display);font-size:30px;font-weight:600}
.sheet .bis{margin:-10px 0 0;text-align:center;font-family:var(--f-ar);font-size:24px;color:var(--green)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
html[lang="ar"] .field label{text-transform:none;letter-spacing:0;font-size:15px}
.field input{font:inherit;font-size:16px;padding:13px 16px;border-radius:16px;border:1px solid var(--edge-2);background:var(--glass);color:var(--ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lang{border:1px solid var(--edge-2);background:var(--glass);border-radius:16px;padding:12px 6px;font-size:15px;font-weight:600;box-shadow:inset 0 1px 0 var(--edge)}
.lang[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,var(--green-2),var(--green));border-color:transparent}
.lang[data-l="ar"]{font-family:var(--f-arui);font-size:19px;padding-block:8px}
.size{display:flex;gap:8px;align-items:center}
.size button{border:1px solid var(--edge-2);background:var(--glass);border-radius:14px;width:46px;height:42px;font-family:var(--f-arui);font-size:18px}
.size .prev{flex:1;text-align:center;font-family:var(--f-ar);font-size:var(--ar-size);line-height:1.4}
.go{padding:15px;font-size:16px}
.err{color:#C0452F;font-size:13px;margin:-8px 0 0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.hint,.rail-inner,.icon-btn,.sheet{background:var(--bg)}}

.brand{font-family:"Comfortaa",var(--f-body);font-weight:700;font-size:23px;letter-spacing:-.01em}
.sheet .brandname{font-family:"Comfortaa",var(--f-body);font-weight:700;font-size:26px;letter-spacing:-.01em;text-transform:none;margin:0 0 -6px}
.greet{font-family:var(--f-body);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1.15;letter-spacing:-.02em}
.greet em{font-style:normal;font-weight:700}
html[lang="ar"] .greet{font-size:clamp(32px,7.5vw,48px)}
.tl{margin:0;font-style:italic;color:var(--muted);font-size:14px;max-width:68ch}
.am{color:var(--green);font-size:.8em}
.vt{margin:0;padding-inline-start:1.6em;display:flex;flex-direction:column;gap:6px;opacity:.9;max-width:68ch}
.vt li::marker{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85em}
</style>

</div>

 ibnhibban:['Ibn Hibban','Ибн Хиббан','ابن حبان'],ibnsunni:['Ibn al-Sunni','Ибн ас-Сунни','ابن السني'],malik:['Malik','Малик','مالك'],hisn:['Hisn al-Muslim','«Крепость мусульманина»','حصن المسلم']};
const DATA={"D":{"h0":{"ar":"أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ اللّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ.","en":"Allah — there is no deity except Him, the Ever-Living, the Sustainer of all existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and the earth. Who can intercede with Him except by His permission? He knows what is before them and what is behind them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and guarding them does not tire Him. He is the Most High, the Most Great.","ru":"Аллах — нет божества, кроме Него, Живого, Поддерживающего жизнь. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания лишь то, что Он пожелает. Его Престол объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","n":1,"src":["nasai"],"note":{"en":"Whoever says it in the morning is protected from the jinn until evening, and whoever says it in the evening is protected until morning.","ru":"Кто прочтёт его утром, будет защищён от джиннов до вечера, а кто прочтёт вечером — до утра.","ar":"من قالها حين يصبح أجير من الجن حتى يمسى ومن قالها حين يمسى أجير من الجن حتى يصبح."},"t":{"en":"Ayat al-Kursi","ru":"Аят аль-Курси","ar":""}},"h1":{"ar":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ.","en":"Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born, and there is none comparable to Him.","ru":"Скажи: «Он — Аллах Единый, Аллах Самодостаточный. Он не родил и не был рождён, и нет никого, равного Ему».","n":3,"src":["ad","tir"],"note":{"en":"Recite it three times in the morning and evening: Al-Ikhlas, Al-Falaq and An-Nas together will suffice you against everything.","ru":"Читайте трижды утром и вечером: «аль-Ихлас», «аль-Фаляк» и «ан-Нас» вместе будут достаточны для вас от всего.","ar":"من قالها حين يصبح وحين يمسى كفته من كل شىء (الإخلاص والمعوذتين)."},"t":{"en":"Al-Ikhlas","ru":"аль-Ихлас","ar":""}},"h2":{"ar":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.","en":"Say: I seek refuge in the Lord of daybreak, from the evil of what He created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of an envier when he envies.","ru":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла колдуний, дующих на узлы, и от зла завистника, когда он завидует».","n":3,"src":["ad","tir"],"note":{"en":"Recite it three times in the morning and evening: Al-Ikhlas, Al-Falaq and An-Nas together will suffice you against everything.","ru":"Читайте трижды утром и вечером: «аль-Ихлас», «аль-Фаляк» и «ан-Нас» вместе будут достаточны для вас от всего.","ar":"من قالها حين يصبح وحين يمسى كفته من كل شىء (الإخلاص والمعوذتين)."},"t":{"en":"Al-Falaq","ru":"аль-Фаляк","ar":""}},"h3":{"ar":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، إِلَٰهِ ٱلنَّاسِ، مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ، ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ، مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ.","en":"Say: I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the retreating whisperer, who whispers into the hearts of mankind, from among the jinn and mankind.","ru":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла искусителя исчезающего при поминании Аллаха, который наущает в груди людей, от джиннов и людей».","n":3,"src":["ad","tir"],"note":{"en":"Recite it three times in the morning and evening: Al-Ikhlas, Al-Falaq and An-Nas together will suffice you against everything.","ru":"Читайте трижды утром и вечером: «аль-Ихлас», «аль-Фаляк» и «ан-Нас» вместе будут достаточны для вас от всего.","ar":"من قالها حين يصبح وحين يمسى كفته من كل شىء (الإخلاص والمعوذتين)."},"t":{"en":"An-Nas","ru":"ан-Нас","ar":""}},"h4":{"ar":"أَصْبَحْنا وَأَصْبَحَ المُلْكُ لله وَالحَمدُ لله، لا إلهَ إلاّ اللّهُ وَحدَهُ لا شَريكَ لهُ، لهُ المُلكُ ولهُ الحَمْد، وهُوَ على كلّ شَيءٍ قدير، رَبِّ أسْأَلُكَ خَيرَ ما في هذا اليوم وَخَيرَ ما بَعْدَه، وَأَعوذُ بِكَ مِنْ شَرِّ ما في هذا اليوم وَشَرِّ ما بَعْدَه، رَبِّ أَعوذُ بِكَ مِنَ الْكَسَلِ وَسوءِ الْكِبَر، رَبِّ أَعوذُ بِكَ مِنْ عَذابٍ في النّارِ وَعَذابٍ في القَبْر.","en":"We have reached the morning, and the dominion belongs to Allah. Praise be to Allah. There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. My Lord, I ask You for the good of this day and the good of what follows it, and I seek refuge in You from the evil of this day and the evil of what follows it. My Lord, I seek refuge in You from laziness and the misery of old age. My Lord, I seek refuge in You from punishment in the Fire and punishment in the grave.","ru":"Мы дожили до утра, и этим утром владычество принадлежит Аллаху, и хвала Аллаху. Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. Господь мой, прошу Тебя о благе этого дня и благе того, что последует за ним, и прибегаю к Тебе от зла этого дня и зла того, что последует за ним. Господь мой, прибегаю к Тебе от лености и старческой дряхлости. Господь мой, прибегаю к Тебе от мучений в Огне и мучений в могиле.","n":1,"src":["muslim"],"tl":"Асбахна уа асбаха-ль-мульку ли-Ллях, уа-ль-хамду ли-Лляхи, ля иляха илля-Ллаху уахдаху ля шарикя ляху, ляху-ль-мульку уа ляху-ль-хамду уа хува ‘аля кулли шай’ин кадир. Рабби, ас-алюка хайра ма фи хазаль явми уа хайра ма ба‘даху, уа а‘узу бика мин шарри ма фи хазаль явми уа шарри ма ба‘даху. Рабби, а‘узу бика мина-ль-касали уа су‘и-ль-кибари. Рабби, a‘узу бика мин ‘азабин фи-н-нари уа ‘азабин фи-ль-кабри"},"h5":{"ar":"اللّهمَّ أَنْتَ رَبِّي لا إلهَ إلاّ أَنْتَ، خَلَقْتَني وَأَنا عَبْدُك، وَأَنا عَلى عَهْدِكَ وَوَعْدِكَ ما اسْتَطَعْت، أَعوذُ بِكَ مِنْ شَرِّ ما صَنَعْت، أَبوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبوءُ بِذَنْبي فَاغْفِرْ لي فَإِنَّهُ لا يَغْفِرُ الذُّنوبَ إِلاّ أَنْتَ .","en":"O Allah, You are my Lord; there is no deity but You. You created me and I am Your servant, and I keep to Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.","ru":"О Аллах, Ты — мой Господь, нет божества, кроме Тебя. Ты создал меня, а я — Твой раб, и я буду верен обету и обещанию Тебе, пока хватит сил. Прибегаю к Тебе от зла того, что я сделал. Признаю милость Твою ко мне и признаю свой грех. Прости же меня, ведь никто не прощает грехов, кроме Тебя.","n":1,"src":["bukhari"],"note":{"en":"Whoever says it with certainty in the evening and dies that night enters Paradise, and likewise in the morning.","ru":"Кто скажет это с убеждённостью вечером и умрёт этой ночью, войдёт в Рай; так же и утром.","ar":"من قالها موقنا بها حين يمسى ومات من ليلته دخل الجنة وكذلك حين يصبح."},"t":{"en":"Sayyid al-Istighfar","ru":"Саййид аль-истигфар","ar":""},"tl":"Аллахумма, анта Рабби, ля иляха илля Анта, халяктани уа ана ‘абдукя, уа ана ‘аля ‘ахдикя уа уа‘дикя мастатъа‘ту. А‘узу бикя мин шарри ма сана‘ту, абу-у лякя би-ни‘матикя ‘аляййа, уа абу-у би-занби, фа-гъфирли, фа-иннаху ля йагъфиру-з-зунуба илля Анта"},"h6":{"ar":"رَضيتُ بِاللهِ رَبَّاً وَبِالإسْلامِ ديناً وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيّاً.","en":"I am pleased with Allah as my Lord, with Islam as my religion, and with Muhammad ﷺ as my Prophet.","ru":"Я доволен Аллахом как Господом, исламом как религией и Мухаммадом ﷺ как пророком.","n":3,"src":["ahmad"],"note":{"en":"Whoever says it morning and evening, it is a right upon Allah to please him on the Day of Resurrection.","ru":"Кто скажет это утром и вечером, того Аллах непременно обрадует в День воскресения.","ar":"من قالها حين يصبح وحين يمسى كان حقا على الله أن يرضيه يوم القيامة."},"tl":"Радийту би-Лляхи Раббан, ва би-ль-ислами динан ва би-Мухаммадин, сал-ля-Ллаху ‘аляй-хи ва салляма, набийан"},"h7":{"ar":"اللّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُك، وَأُشْهِدُ حَمَلَةَ عَرْشِك، وَمَلَائِكَتَكَ، وَجَميعَ خَلْقِك، أَنَّكَ أَنْتَ اللهُ لا إلهَ إلاّ أَنْتَ وَحْدَكَ لا شَريكَ لَك، وَأَنَّ ُ مُحَمّداً عَبْدُكَ وَرَسولُك.","en":"O Allah, I have reached the morning and I call on You, on the bearers of Your Throne, on Your angels and on all Your creation to witness that You are Allah; there is no deity but You alone, without partner, and that Muhammad is Your servant and Messenger.","ru":"О Аллах, поистине, я дожил до утра и призываю в свидетели Тебя, носителей Твоего Трона, Твоих ангелов и всех Твоих созданий в том, что Ты — Аллах, нет божества, кроме Тебя одного, у Тебя нет сотоварища, и что Мухаммад — Твой раб и посланник.","n":4,"src":["ad"],"note":{"en":"Whoever says it four times, Allah frees him from the Fire.","ru":"Кто скажет это четыре раза, того Аллах освободит от Огня.","ar":"من قالها أعتقه الله من النار."},"tl":"Аллахумма ин-ни асбахту ушхиду-ка ва ушхиду хамалята ‘арши-ка ва маля’иката-ка ва джами‘а халькы-ка анна-ка анта Ллаху ля иляха илля анта, ва анна Мухаммадан ‘абду-ка ва расулю-ка"},"h8":{"ar":"اللّهُمَّ ما أَصْبََحَ بي مِنْ نِعْمَةٍ أَو بِأَحَدٍ مِنْ خَلْقِك، فَمِنْكَ وَحْدَكَ لا شريكَ لَك، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْر.","en":"O Allah, whatever blessing I or any of Your creation have this morning is from You alone, without partner. To You is all praise and to You all thanks.","ru":"О Аллах, любая милость, что этим утром есть у меня или у кого-то из Твоих созданий, — только от Тебя, у Которого нет сотоварища. Тебе хвала и Тебе благодарность.","n":1,"src":["ad"],"note":{"en":"Whoever says it in the morning has fulfilled the thanks due for that day.","ru":"Кто скажет это утром, тот выразил благодарность за этот день.","ar":"من قالها حين يصبح أدى شكر يومه."},"tl":"Аллахума, ма асбаха би мин-ни‘матин, ау би ахадин мин халкыкя, фа-минка уахдака ля шарика ляка, фаляка-ль-хамду уа ляка-ш-шукр"},"h9":{"ar":"حَسْبِيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ العَرْشِ العَظيم.","en":"Allah is sufficient for me; there is no deity but Him. In Him I put my trust, and He is the Lord of the Mighty Throne.","ru":"Достаточно мне Аллаха, нет божества, кроме Него. На Него я уповаю, и Он — Господь великого Трона.","n":7,"src":["ibnsunni"],"note":{"en":"Allah will suffice him in whatever concerns him of this world and the Hereafter.","ru":"Аллах избавит его от того, что тревожит его в делах этого мира и вечного.","ar":"من قالها كفاه الله ما أهمه من أمر الدنيا والأخرة."}},"h10":{"ar":"بِسمِ اللهِ الذي لا يَضُرُّ مَعَ اسمِهِ شَيءٌ في الأرْضِ وَلا في السّماءِ وَهوَ السّميعُ العَليم.","en":"In the name of Allah, with whose name nothing on earth or in the heaven can cause harm, and He is the All-Hearing, the All-Knowing.","ru":"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.","n":3,"src":["ibm"],"note":{"en":"Nothing will harm him.","ru":"Ничто не причинит ему вреда.","ar":"لم يضره من الله شيء."},"tl":"Бисми-Лляхи-ллязи ля йадурру ма‘а-смихи шайун фи-ль-арды уа ля фи-с-самаи уа хува-с-Сами‘у-ль-‘Алим"},"h11":{"ar":"اللّهُمَّ بِكَ أَصْبَحْنا وَبِكَ أَمْسَينا، وَبِكَ نَحْيا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُور.","en":"O Allah, by You we enter the morning and by You we enter the evening, by You we live and by You we die, and to You is the resurrection.","ru":"О Аллах, благодаря Тебе мы дожили до утра и благодаря Тебе доживаем до вечера, благодаря Тебе живём и умираем, и к Тебе — воскрешение.","n":1,"src":["tir"]},"h12":{"ar":"أَصْبَحْنا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.","en":"We have reached the morning upon the natural way of Islam, upon the word of sincere devotion, upon the religion of our Prophet Muhammad ﷺ, and upon the way of our father Ibrahim, upright and submitting, who was not of those who associate partners with Allah.","ru":"Мы дожили до утра в лоне ислама, со словом искренности, в религии нашего пророка Мухаммада ﷺ и в вере нашего отца Ибрахима, единобожника и мусульманина, который не был из многобожников.","n":1,"src":["ahmad"]},"h13":{"ar":"سُبْحانَ اللهِ وَبِحَمْدِهِ عَدَدَ خَلْقِه، وَرِضا نَفْسِه، وَزِنَةَ عَرْشِه، وَمِدادَ كَلِماتِه.","en":"Glory be to Allah and praise be to Him, as many times as the number of His creation, as much as pleases Him, as much as the weight of His Throne, and as much as the ink of His words.","ru":"Пречист Аллах и хвала Ему столько раз, сколько существует Его созданий, сколько будет Ему угодно, сколько весит Его Трон и сколько чернил нужно для записи Его слов.","n":3,"src":["muslim"]},"h14":{"ar":"اللّهُمَّ عافِني في بَدَني، اللّهُمَّ عافِني في سَمْعي، اللّهُمَّ عافِني في بَصَري، لا إلهَ إلاّ أَنْتَ.","en":"O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no deity but You.","ru":"О Аллах, даруй здоровье моему телу! О Аллах, даруй здоровье моему слуху! О Аллах, даруй здоровье моему зрению! Нет божества, кроме Тебя.","n":3,"src":["ad"]},"h15":{"ar":"اللّهُمَّ إِنّي أَعوذُ بِكَ مِنَ الْكُفر، وَالفَقْر، وَأَعوذُ بِكَ مِنْ عَذابِ القَبْر، لا إلهَ إلاّ أَنْتَ.","en":"O Allah, I seek refuge in You from disbelief and poverty, and I seek refuge in You from the punishment of the grave. There is no deity but You.","ru":"О Аллах, прибегаю к Тебе от неверия и бедности и прибегаю к Тебе от мучений в могиле. Нет божества, кроме Тебя.","n":3,"src":["ad"]},"h16":{"ar":"اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعافِيةَ في الدُّنْيا وَالآخِرَة، اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعافِيةَ في ديني وَدُنْيايَ وَأهْلي وَمالي، اللّهُمَّ اسْتُرْ عوْراتي وَآمِنْ رَوْعاتي، اللّهُمَّ احْفَظْني مِن بَينِ يَدَيَّ وَمِن خَلْفي وَعَن يَميني وَعَن شِمالي، وَمِن فَوْقي، وَأَعوذُ بِعَظَمَتِكَ أَن أُغْتالَ مِن تَحْتي.","en":"O Allah, I ask You for pardon and well-being in this world and the next. O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, conceal my faults and calm my fears. O Allah, guard me from in front of me and behind me, from my right and my left, and from above me, and I seek refuge in Your greatness from being struck down from beneath me.","ru":"О Аллах, прошу Тебя о прощении и благополучии в этом мире и в вечном. О Аллах, прошу Тебя о прощении и благополучии в моей религии, мирских делах, семье и имуществе. О Аллах, укрой мои недостатки и избавь меня от страха. О Аллах, защити меня спереди и сзади, справа и слева, и сверху, и я прибегаю к Твоему величию от внезапной гибели снизу.","n":1,"src":["ad"],"tl":"Аллахумма, инни ас-алюкя аль-‘афуа уа-ль-‘афийата фи-д-дуньйа уа-ль-ахирати, Аллахумма, инни ас-алюкя аль-‘афуа уа-ль-‘афийата фи дини уа дуньйа, уа ахли, уа мали. Аллахумма-стур ‘аурати, уа аамин рау‘ати. Аллахумма-хфазни мин байни йадаййа, уа мин хальфи, уа ‘ан йамини, уа ‘ан шимали, уа мин фаукы, уа а‘узу би-‘азаматикя ан угталя мин тахти"},"h17":{"ar":"يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أصْلِحْ لِي شَأنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَرْفَةَ عَيْنٍ.","en":"O Ever-Living, O Sustainer, in Your mercy I seek relief. Set right all my affairs and do not leave me to myself even for the blink of an eye.","ru":"О Живой, о Поддерживающий жизнь, к Твоей милости взываю о помощи. Приведи в порядок все мои дела и не оставляй меня самому себе даже на мгновение ока.","n":3,"src":["hakim"]},"h18":{"ar":"أَصْبَحْنا وَأَصْبَحْ المُلكُ للهِ رَبِّ العالَمين، اللّهُمَّ إِنِّي أسْأَلُكَ خَيْرَ هذا اليَوْم، فَتْحَهُ، وَنَصْرَهُ، وَنورَهُ وَبَرَكَتَهُ، وَهُداهُ، وَأَعوذُ بِكَ مِنْ شَرِّ ما فيهِ وَشَرِّ ما بَعْدَه.","en":"We have reached the morning, and the dominion belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this day: its victory, its help, its light, its blessing and its guidance, and I seek refuge in You from the evil in it and the evil after it.","ru":"Мы дожили до утра, и владычество принадлежит Аллаху, Господу миров. О Аллах, прошу Тебя о благе этого дня: его успехе, помощи, свете, благодати и прямом пути, и прибегаю к Тебе от зла в нём и зла после него.","n":1,"src":["ad"]},"h19":{"ar":"اللّهُمَّ عالِمَ الغَيْبِ وَالشّهادَةِ فاطِرَ السّماواتِ وَالأرْضِ رَبَّ كلِّ شَيءٍ وَمَليكَه، أَشْهَدُ أَنْ لا إِلهَ إِلاّ أَنْت، أَعوذُ بِكَ مِن شَرِّ نَفْسي وَمِن شَرِّ الشَّيْطانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلى نَفْسي سوءاً أَوْ أَجُرَّهُ إِلى مُسْلِم.","en":"O Allah, Knower of the unseen and the seen, Originator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that there is no deity but You. I seek refuge in You from the evil of my soul, from the evil of Satan and his call to associate partners with You, and from bringing harm upon myself or upon a Muslim.","ru":"О Аллах, Знающий сокрытое и явное, Творец небес и земли, Господь и Владыка всего, свидетельствую, что нет божества, кроме Тебя. Прибегаю к Тебе от зла своей души, от зла шайтана и его призыва к многобожию, и от того, чтобы навлечь зло на себя или на мусульманина.","n":1,"src":["tir"],"tl":"Аллахума ‘алима-ль-гайби уа-ш-шахадати, Фатыра-с-самавати уа-ль-арды, Рабба кулли шай’ин уа Маликаху, ашхаду алля иляха илля анта, а‘узу бика мин шарри нафси, уа мин шарри-ш-шайтани уа ширкихи, уа ан актарифа ‘аля нафси су’ан ау аджурраху иля муслим"},"h20":{"ar":"أَعوذُ بِكَلِماتِ اللّهِ التّامّاتِ مِنْ شَرِّ ما خَلَق.","en":"I seek refuge in the perfect words of Allah from the evil of what He has created.","ru":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","n":3,"src":["muslim"]},"h21":{"ar":"اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.","en":"O Allah, send blessings, peace and grace upon our Prophet Muhammad.","ru":"О Аллах, благослови, приветствуй и одари благодатью нашего пророка Мухаммада.","n":10,"src":["tabarani"],"note":{"en":"Whoever sends blessings on me ten times in the morning and ten in the evening will receive my intercession on the Day of Resurrection.","ru":"Кто благословит меня десять раз утром и десять вечером, того настигнет моё заступничество в День воскресения.","ar":"من صلى على حين يصبح وحين يمسى ادركته شفاعتى يوم القيامة."}},"h22":{"ar":"اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.","en":"O Allah, we seek refuge in You from knowingly associating anything with You, and we ask Your forgiveness for what we do unknowingly.","ru":"О Аллах, мы прибегаем к Тебе от того, чтобы сознательно придавать Тебе сотоварищей, и просим прощения за то, чего не знаем.","n":3,"src":["ahmad"]},"h23":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنْ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنْ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.","en":"O Allah, I seek refuge in You from worry and grief, from helplessness and laziness, from cowardice and miserliness, and from being overcome by debt and overpowered by men.","ru":"О Аллах, прибегаю к Тебе от тревоги и печали, от бессилия и лени, от трусости и скупости, от бремени долгов и притеснения людей.","n":3,"src":["ad"]},"h24":{"ar":"أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.","en":"I seek the forgiveness of Allah the Mighty, besides whom there is no deity, the Ever-Living, the Sustainer, and I turn to Him in repentance.","ru":"Прошу прощения у Аллаха Великого, кроме которого нет божества, Живого, Поддерживающего жизнь, и приношу Ему покаяние.","n":3,"src":["tir"]},"h25":{"ar":"يَا رَبِّ، لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ، وَلِعَظِيمِ سُلْطَانِكَ.","en":"O my Lord, to You is praise as befits the majesty of Your Face and the greatness of Your authority.","ru":"О Господь мой, Тебе хвала, достойная величия Твоего Лика и могущества Твоей власти.","n":3,"src":["ibm"]},"h26":{"ar":"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.","en":"O Allah, I ask You for beneficial knowledge, good and pure provision, and deeds that are accepted.","ru":"О Аллах, прошу Тебя о полезном знании, благом уделе и деяниях, которые будут приняты.","n":1,"src":["ibm"]},"h27":{"ar":"اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ، مَا شَاءَ اللَّهُ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.","en":"O Allah, You are my Lord; there is no deity but You. In You I trust, and You are the Lord of the Mighty Throne. What Allah wills happens, and what He does not will does not happen. There is no might nor power except with Allah, the Most High, the Most Great. I know that Allah is able to do all things and that Allah encompasses all things in knowledge. O Allah, I seek refuge in You from the evil of my soul and from the evil of every creature You hold by its forelock. Indeed, my Lord is on a straight path.","ru":"О Аллах, Ты — мой Господь, нет божества, кроме Тебя. На Тебя я уповаю, и Ты — Господь великого Трона. Что пожелал Аллах, то было, а чего не пожелал, того не было. Нет мощи и силы ни у кого, кроме Аллаха Высокого, Великого. Я знаю, что Аллах способен на всё и что Аллах объемлет знанием всё сущее. О Аллах, прибегаю к Тебе от зла своей души и от зла всякого существа, которое Ты держишь за хохол. Поистине, мой Господь — на прямом пути.","n":1,"src":["ibnsunni"],"note":{"en":"Recorded by Ibn al-Sunni; some scholars grade its chain weak.","ru":"Приводит Ибн ас-Сунни; часть учёных считает иснад слабым.","ar":"ذكر طيب."}},"h28":{"ar":"لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءِ قَدِيرِ.","en":"There is no deity but Allah alone, without partner. His is the dominion and His is the praise, and He is over all things capable.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может.","n":100,"src":["bm"],"note":{"en":"Whoever says it 100 times in a day: the reward of freeing ten slaves, 100 good deeds written, 100 sins erased, and protection from Satan that day until evening.","ru":"Кто скажет это 100 раз за день — награда как за освобождение десяти рабов, записывается 100 добрых дел, стирается 100 грехов, и он защищён от шайтана до вечера.","ar":"من قالها 100 مرة في يوم كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزا من الشيطان في يومه ذلك حتى يمسي ولم يأتي أحد بأفضل مما جاء به إلا احد عمل أكثر من ذلك"}},"h29":{"ar":"سُبْحانَ اللهِ وَبِحَمْدِهِ.","en":"Glory be to Allah and praise be to Him.","ru":"Пречист Аллах и хвала Ему.","n":100,"src":["muslim"],"note":{"en":"His sins are wiped away even if they are like the foam of the sea.","ru":"Его грехи будут стёрты, даже если их столько, сколько пены морской.","ar":"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ."},"tl":"Субхана-Ллахи уа би-хамдихи"},"h30":{"ar":"أسْتَغْفِرُ اللهَ وَأتُوبُ إلَيْهِ","en":"I seek Allah’s forgiveness and turn to Him in repentance.","ru":"Прошу прощения у Аллаха и приношу Ему покаяние.","n":100,"src":["muslim"],"note":{"en":"The Prophet ﷺ sought forgiveness a hundred times a day.","ru":"Пророк ﷺ просил прощения у Аллаха сто раз в день.","ar":"مائة حسنة، ومُحيت عنه مائة سيئة، وكانت له حرزاً من الشيطان حتى يمسى."}},"h31":{"ar":"أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ اللّهُ لاَ إِلَهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلاَّ بِمَا شَاء وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ.","en":"Allah — there is no deity except Him, the Ever-Living, the Sustainer of all existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and the earth. Who can intercede with Him except by His permission? He knows what is before them and what is behind them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and guarding them does not tire Him. He is the Most High, the Most Great.","ru":"Аллах — нет божества, кроме Него, Живого, Поддерживающего жизнь. Им не овладевают ни дремота, ни сон. Ему принадлежит то, что на небесах, и то, что на земле. Кто станет заступаться перед Ним без Его дозволения? Он знает их будущее и прошлое. Они постигают из Его знания лишь то, что Он пожелает. Его Престол объемлет небеса и землю, и не тяготит Его оберегание их. Он — Возвышенный, Великий.","n":1,"src":["nasai"],"note":{"en":"Whoever says it in the morning is protected from the jinn until evening, and whoever says it in the evening is protected until morning.","ru":"Кто прочтёт его утром, будет защищён от джиннов до вечера, а кто прочтёт вечером — до утра.","ar":"من قالها حين يصبح أجير من الجن حتى يمسى ومن قالها حين يمسى أجير من الجن حتى يصبح."},"t":{"en":"Ayat al-Kursi","ru":"Аят аль-Курси","ar":""}},"h32":{"ar":"أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ. لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَّسِينَآ أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ.","en":"The Messenger has believed in what was revealed to him from his Lord, and so have the believers. All of them have believed in Allah, His angels, His books and His messengers, saying: We make no distinction between any of His messengers. And they say: We hear and we obey. We seek Your forgiveness, our Lord, and to You is the final return. Allah does not burden a soul beyond its capacity. It will have what it has earned, and it will bear what it has incurred. Our Lord, do not take us to task if we forget or err. Our Lord, do not place upon us a burden like that which You placed upon those before us. Our Lord, do not burden us with what we cannot bear. Pardon us, forgive us and have mercy on us. You are our Protector, so give us victory over the disbelieving people.","ru":"Посланник и верующие уверовали в то, что ниспослано ему от Господа. Все они уверовали в Аллаха, Его ангелов, Его Писания и Его посланников. Мы не делаем различий между Его посланниками. Они говорят: «Слушаем и повинуемся! Просим прощения Твоего, Господь наш, и к Тебе предстоит прибытие». Аллах не возлагает на человека сверх его возможностей. Ему достанется то, что он приобрёл, и против него будет то, что он приобрёл. Господь наш! Не наказывай нас, если мы забыли или ошиблись. Господь наш! Не возлагай на нас бремя, которое Ты возложил на наших предшественников. Господь наш! Не обременяй нас тем, что нам не под силу. Будь снисходителен к нам! Прости нас и помилуй нас! Ты — наш Покровитель. Помоги же нам одержать верх над неверующими людьми.","n":1,"src":["bm"],"note":{"en":"Whoever recites the last two verses of Al-Baqarah at night, they will suffice him.","ru":"Кто прочтёт ночью два последних аята «аль-Бакары», тому их будет достаточно.","ar":"من قرأ آيتين من آخر سورة البقرة في ليلة كفتاه."},"t":{"en":"End of Al-Baqarah","ru":"Конец «аль-Бакары»","ar":""}},"h33":{"ar":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم قُلْ هُوَ ٱللَّهُ أَحَدٌ، ٱللَّهُ ٱلصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ.","en":"Say: He is Allah, the One. Allah, the Eternal Refuge. He neither begets nor is born, and there is none comparable to Him.","ru":"Скажи: «Он — Аллах Единый, Аллах Самодостаточный. Он не родил и не был рождён, и нет никого, равного Ему».","n":3,"src":["ad","tir"],"note":{"en":"Recite it three times in the morning and evening: Al-Ikhlas, Al-Falaq and An-Nas together will suffice you against everything.","ru":"Читайте трижды утром и вечером: «аль-Ихлас», «аль-Фаляк» и «ан-Нас» вместе будут достаточны для вас от всего.","ar":"من قالها حين يصبح وحين يمسى كفته من كل شىء (الإخلاص والمعوذتين)."},"t":{"en":"Al-Ikhlas","ru":"аль-Ихлас","ar":""}},"h34":{"ar":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ، مِن شَرِّ مَا خَلَقَ، وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ، وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ.","en":"Say: I seek refuge in the Lord of daybreak, from the evil of what He created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of an envier when he envies.","ru":"Скажи: «Прибегаю к защите Господа рассвета от зла того, что Он сотворил, от зла мрака, когда он наступает, от зла колдуний, дующих на узлы, и от зла завистника, когда он завидует».","n":3,"src":["ad","tir"],"note":{"en":"Recite it three times in the morning and evening: Al-Ikhlas, Al-Falaq and An-Nas together will suffice you against everything.","ru":"Читайте трижды утром и вечером: «аль-Ихлас», «аль-Фаляк» и «ан-Нас» вместе будут достаточны для вас от всего."},"t":{"en":"Al-Falaq","ru":"аль-Фаляк","ar":""}},"h35":{"ar":"بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ، مَلِكِ ٱلنَّاسِ، إِلَٰهِ ٱلنَّاسِ، مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ، ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ، مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ.","en":"Say: I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the retreating whisperer, who whispers into the hearts of mankind, from among the jinn and mankind.","ru":"Скажи: «Прибегаю к защите Господа людей, Царя людей, Бога людей, от зла искусителя исчезающего при поминании Аллаха, который наущает в груди людей, от джиннов и людей».","n":3,"src":["ad","tir"],"note":{"en":"Recite it three times in the morning and evening: Al-Ikhlas, Al-Falaq and An-Nas together will suffice you against everything.","ru":"Читайте трижды утром и вечером: «аль-Ихлас», «аль-Фаляк» и «ан-Нас» вместе будут достаточны для вас от всего."},"t":{"en":"An-Nas","ru":"ан-Нас","ar":""}},"h36":{"ar":"أَمْسَيْنا وَأَمْسى الملكُ لله وَالحَمدُ لله، لا إلهَ إلاّ اللّهُ وَحدَهُ لا شَريكَ لهُ، لهُ المُلكُ ولهُ الحَمْد، وهُوَ على كلّ شَيءٍ قدير، رَبِّ أسْأَلُكَ خَيرَ ما في هذهِ اللَّيْلَةِ وَخَيرَ ما بَعْدَها، وَأَعوذُ بِكَ مِنْ شَرِّ ما في هذهِ اللَّيْلةِ وَشَرِّ ما بَعْدَها، رَبِّ أَعوذُ بِكَ مِنَ الْكَسَلِ وَسوءِ الْكِبَر، رَبِّ أَعوذُ بِكَ مِنْ عَذابٍ في النّارِ وَعَذابٍ في القَبْر.","en":"We have reached the evening, and the dominion belongs to Allah. Praise be to Allah. There is no deity but Allah alone, without partner; His is the dominion and His is the praise, and He is over all things capable. My Lord, I ask You for the good of this night and the good of what follows it, and I seek refuge in You from the evil of this night and the evil of what follows it. My Lord, I seek refuge in You from laziness and the misery of old age. My Lord, I seek refuge in You from punishment in the Fire and punishment in the grave.","ru":"Мы дожили до вечера, и этим вечером владычество принадлежит Аллаху, и хвала Аллаху. Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может. Господь мой, прошу Тебя о благе этой ночи и благе того, что последует за ней, и прибегаю к Тебе от зла этой ночи и зла того, что последует за ней. Господь мой, прибегаю к Тебе от лености и старческой дряхлости. Господь мой, прибегаю к Тебе от мучений в Огне и мучений в могиле.","n":1,"src":["muslim"],"tl":"Амсайна уа амса-ль-мульку ли-Ллях, уа-ль-хамду ли-Лляхи, ля иляха илля-Ллаху уахдаху ля шарикя ляху, ляху-ль-мульку уа ляху-ль-хамду уа хува ‘аля кулли шай’ин кадир. Рабби, ас-алюка хайра ма фи хазихи-ль-ляйляти уа хайра ма ба‘даха, уа а‘узу бика мин шарри ма фи хазихи-ль-ляйляти уа шарри ма ба‘даха. Рабби, а‘узу бика мина-ль-касали уа су‘и-ль-кибари. Рабби, a‘узу бика мин ‘азабин фи-н-нари уа ‘азабин фи-ль-кабри"},"h37":{"ar":"اللّهمَّ أَنْتَ رَبِّي لا إلهَ إلاّ أَنْتَ، خَلَقْتَني وَأَنا عَبْدُك، وَأَنا عَلى عَهْدِكَ وَوَعْدِكَ ما اسْتَطَعْت، أَعوذُ بِكَ مِنْ شَرِّ ما صَنَعْت، أَبوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبوءُ بِذَنْبي فَاغْفِرْ لي فَإِنَّهُ لا يَغْفِرُ الذُّنوبَ إِلاّ أَنْتَ .","en":"O Allah, You are my Lord; there is no deity but You. You created me and I am Your servant, and I keep to Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.","ru":"О Аллах, Ты — мой Господь, нет божества, кроме Тебя. Ты создал меня, а я — Твой раб, и я буду верен обету и обещанию Тебе, пока хватит сил. Прибегаю к Тебе от зла того, что я сделал. Признаю милость Твою ко мне и признаю свой грех. Прости же меня, ведь никто не прощает грехов, кроме Тебя.","n":1,"src":["bukhari"],"note":{"en":"Whoever says it with certainty in the evening and dies that night enters Paradise, and likewise in the morning.","ru":"Кто скажет это с убеждённостью вечером и умрёт этой ночью, войдёт в Рай; так же и утром.","ar":"من قالها موقنا بها حين يمسى ومات من ليلته دخل الجنة وكذلك حين يصبح."},"t":{"en":"Sayyid al-Istighfar","ru":"Саййид аль-истигфар","ar":""},"tl":"Аллахумма, анта Рабби, ля иляха илля Анта, халяктани уа ана ‘абдукя, уа ана ‘аля ‘ахдикя уа уа‘дикя мастатъа‘ту. А‘узу бикя мин шарри ма сана‘ту, абу-у лякя би-ни‘матикя ‘аляййа, уа абу-у би-занби, фа-гъфирли, фа-иннаху ля йагъфиру-з-зунуба илля Анта"},"h38":{"ar":"رَضيتُ بِاللهِ رَبَّاً وَبِالإسْلامِ ديناً وَبِمُحَمَّدٍ صلى الله عليه وسلم نَبِيّاً.","en":"I am pleased with Allah as my Lord, with Islam as my religion, and with Muhammad ﷺ as my Prophet.","ru":"Я доволен Аллахом как Господом, исламом как религией и Мухаммадом ﷺ как пророком.","n":3,"src":["ahmad"],"note":{"en":"Whoever says it morning and evening, it is a right upon Allah to please him on the Day of Resurrection.","ru":"Кто скажет это утром и вечером, того Аллах непременно обрадует в День воскресения.","ar":"من قالها حين يصبح وحين يمسى كان حقا على الله أن يرضيه يوم القيامة."},"tl":"Радийту би-Лляхи Раббан, ва би-ль-ислами динан ва би-Мухаммадин, сал-ля-Ллаху ‘аляй-хи ва салляма, набийан"},"h39":{"ar":"اللّهُمَّ إِنِّي أَمسيتُ أُشْهِدُك، وَأُشْهِدُ حَمَلَةَ عَرْشِك، وَمَلَائِكَتَكَ، وَجَميعَ خَلْقِك، أَنَّكَ أَنْتَ اللهُ لا إلهَ إلاّ أَنْتَ وَحْدَكَ لا شَريكَ لَك، وَأَنَّ ُ مُحَمّداً عَبْدُكَ وَرَسولُك.","en":"O Allah, I have reached the evening and I call on You, on the bearers of Your Throne, on Your angels and on all Your creation to witness that You are Allah; there is no deity but You alone, without partner, and that Muhammad is Your servant and Messenger.","ru":"О Аллах, поистине, я дожил до вечера и призываю в свидетели Тебя, носителей Твоего Трона, Твоих ангелов и всех Твоих созданий в том, что Ты — Аллах, нет божества, кроме Тебя одного, у Тебя нет сотоварища, и что Мухаммад — Твой раб и посланник.","n":4,"src":["ad"],"note":{"en":"Whoever says it four times, Allah frees him from the Fire.","ru":"Кто скажет это четыре раза, того Аллах освободит от Огня.","ar":"من قالها أعتقه الله من النار."}},"h40":{"ar":"اللّهُمَّ ما أَمسى بي مِنْ نِعْمَةٍ أَو بِأَحَدٍ مِنْ خَلْقِك، فَمِنْكَ وَحْدَكَ لا شريكَ لَك، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْر.","en":"O Allah, whatever blessing I or any of Your creation have this evening is from You alone, without partner. To You is all praise and to You all thanks.","ru":"О Аллах, любая милость, что этим вечером есть у меня или у кого-то из Твоих созданий, — только от Тебя, у Которого нет сотоварища. Тебе хвала и Тебе благодарность.","n":1,"src":["ad"],"note":{"en":"Whoever says it in the evening has fulfilled the thanks due for that night.","ru":"Кто скажет это вечером, тот выразил благодарность за эту ночь.","ar":"من قالها حين يمسى أدى شكر يومه."}},"h41":{"ar":"حَسْبِيَ اللّهُ لا إلهَ إلاّ هُوَ عَلَيهِ تَوَكَّلتُ وَهُوَ رَبُّ العَرْشِ العَظيم.","en":"Allah is sufficient for me; there is no deity but Him. In Him I put my trust, and He is the Lord of the Mighty Throne.","ru":"Достаточно мне Аллаха, нет божества, кроме Него. На Него я уповаю, и Он — Господь великого Трона.","n":7,"src":["ibnsunni"],"note":{"en":"Allah will suffice him in whatever concerns him of this world and the Hereafter.","ru":"Аллах избавит его от того, что тревожит его в делах этого мира и вечного.","ar":"من قالها كفاه الله ما أهمه من أمر الدنيا والأخرة."}},"h42":{"ar":"بِسمِ اللهِ الذي لا يَضُرُّ مَعَ اسمِهِ شَيءٌ في الأرْضِ وَلا في السّماءِ وَهوَ السّميعُ العَليم.","en":"In the name of Allah, with whose name nothing on earth or in the heaven can cause harm, and He is the All-Hearing, the All-Knowing.","ru":"С именем Аллаха, с именем Которого ничто не причинит вреда ни на земле, ни на небе, и Он — Слышащий, Знающий.","n":3,"src":["ibm"],"note":{"en":"Nothing will harm him.","ru":"Ничто не причинит ему вреда.","ar":"لم يضره من الله شيء."},"tl":"Бисми-Лляхи-ллязи ля йадурру ма‘а-смихи шайун фи-ль-арды уа ля фи-с-самаи уа хува-с-Сами‘у-ль-‘Алим"},"h43":{"ar":"اللّهُمَّ بِكَ أَمْسَينا وَبِكَ أَصْبَحْنا، وَبِكَ نَحْيا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.","en":"O Allah, by You we enter the evening and by You we enter the morning, by You we live and by You we die, and to You is the final return.","ru":"О Аллах, благодаря Тебе мы дожили до вечера и благодаря Тебе доживаем до утра, благодаря Тебе живём и умираем, и к Тебе — возвращение.","n":1,"src":["tir"]},"h44":{"ar":"أَمْسَيْنَا عَلَى فِطْرَةِ الإسْلاَمِ، وَعَلَى كَلِمَةِ الإِخْلاَصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ، وَعَلَى مِلَّةِ أَبِينَا إبْرَاهِيمَ حَنِيفاً مُسْلِماً وَمَا كَانَ مِنَ المُشْرِكِينَ.","en":"We have reached the evening upon the natural way of Islam, upon the word of sincere devotion, upon the religion of our Prophet Muhammad ﷺ, and upon the way of our father Ibrahim, upright and submitting, who was not of those who associate partners with Allah.","ru":"Мы дожили до вечера в лоне ислама, со словом искренности, в религии нашего пророка Мухаммада ﷺ и в вере нашего отца Ибрахима, единобожника и мусульманина, который не был из многобожников.","n":1,"src":["ahmad"]},"h45":{"ar":"سُبْحانَ اللهِ وَبِحَمْدِهِ عَدَدَ خَلْقِه، وَرِضا نَفْسِه، وَزِنَةَ عَرْشِه، وَمِدادَ كَلِماتِه.","en":"Glory be to Allah and praise be to Him, as many times as the number of His creation, as much as pleases Him, as much as the weight of His Throne, and as much as the ink of His words.","ru":"Пречист Аллах и хвала Ему столько раз, сколько существует Его созданий, сколько будет Ему угодно, сколько весит Его Трон и сколько чернил нужно для записи Его слов.","n":3,"src":["muslim"]},"h46":{"ar":"اللّهُمَّ عافِني في بَدَني، اللّهُمَّ عافِني في سَمْعي، اللّهُمَّ عافِني في بَصَري، لا إلهَ إلاّ أَنْتَ.","en":"O Allah, grant me well-being in my body. O Allah, grant me well-being in my hearing. O Allah, grant me well-being in my sight. There is no deity but You.","ru":"О Аллах, даруй здоровье моему телу! О Аллах, даруй здоровье моему слуху! О Аллах, даруй здоровье моему зрению! Нет божества, кроме Тебя.","n":3,"src":["ad"]},"h47":{"ar":"اللّهُمَّ إِنّي أَعوذُ بِكَ مِنَ الْكُفر، وَالفَقْر، وَأَعوذُ بِكَ مِنْ عَذابِ القَبْر، لا إلهَ إلاّ أَنْتَ.","en":"O Allah, I seek refuge in You from disbelief and poverty, and I seek refuge in You from the punishment of the grave. There is no deity but You.","ru":"О Аллах, прибегаю к Тебе от неверия и бедности и прибегаю к Тебе от мучений в могиле. Нет божества, кроме Тебя.","n":3,"src":["ad"]},"h48":{"ar":"اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعافِيةَ في الدُّنْيا وَالآخِرَة، اللّهُمَّ إِنِّي أسْأَلُكَ العَفْوَ وَالعافِيةَ في ديني وَدُنْيايَ وَأهْلي وَمالي، اللّهُمَّ اسْتُرْ عوْراتي وَآمِنْ رَوْعاتي، اللّهُمَّ احْفَظْني مِن بَينِ يَدَيَّ وَمِن خَلْفي وَعَن يَميني وَعَن شِمالي، وَمِن فَوْقي، وَأَعوذُ بِعَظَمَتِكَ أَن أُغْتالَ مِن تَحْتي.","en":"O Allah, I ask You for pardon and well-being in this world and the next. O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, conceal my faults and calm my fears. O Allah, guard me from in front of me and behind me, from my right and my left, and from above me, and I seek refuge in Your greatness from being struck down from beneath me.","ru":"О Аллах, прошу Тебя о прощении и благополучии в этом мире и в вечном. О Аллах, прошу Тебя о прощении и благополучии в моей религии, мирских делах, семье и имуществе. О Аллах, укрой мои недостатки и избавь меня от страха. О Аллах, защити меня спереди и сзади, справа и слева, и сверху, и я прибегаю к Твоему величию от внезапной гибели снизу.","n":1,"src":["ad"],"tl":"Аллахумма, инни ас-алюкя аль-‘афуа уа-ль-‘афийата фи-д-дуньйа уа-ль-ахирати, Аллахумма, инни ас-алюкя аль-‘афуа уа-ль-‘афийата фи дини уа дуньйа, уа ахли, уа мали. Аллахумма-стур ‘аурати, уа аамин рау‘ати. Аллахумма-хфазни мин байни йадаййа, уа мин хальфи, уа ‘ан йамини, уа ‘ан шимали, уа мин фаукы, уа а‘узу би-‘азаматикя ан угталя мин тахти"},"h49":{"ar":"يَا حَيُّ يَا قيُّومُ بِرَحْمَتِكَ أسْتَغِيثُ أصْلِحْ لِي شَأنِي كُلَّهُ وَلاَ تَكِلْنِي إلَى نَفْسِي طَرْفَةَ عَيْنٍ.","en":"O Ever-Living, O Sustainer, in Your mercy I seek relief. Set right all my affairs and do not leave me to myself even for the blink of an eye.","ru":"О Живой, о Поддерживающий жизнь, к Твоей милости взываю о помощи. Приведи в порядок все мои дела и не оставляй меня самому себе даже на мгновение ока.","n":3,"src":["hakim"]},"h50":{"ar":"أَمْسَيْنا وَأَمْسَى الْمُلْكُ للهِ رَبِّ الْعَالَمَيْنِ، اللَّهُمَّ إِنَّي أسْأَلُكَ خَيْرَ هَذَه اللَّيْلَةِ فَتْحَهَا ونَصْرَهَا، ونُوْرَهَا وبَرَكَتهَا، وَهُدَاهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فيهِا وَشَرَّ مَا بَعْدَهَا.","en":"We have reached the evening, and the dominion belongs to Allah, Lord of the worlds. O Allah, I ask You for the good of this night: its victory, its help, its light, its blessing and its guidance, and I seek refuge in You from the evil in it and the evil after it.","ru":"Мы дожили до вечера, и владычество принадлежит Аллаху, Господу миров. О Аллах, прошу Тебя о благе этой ночи: её успехе, помощи, свете, благодати и прямом пути, и прибегаю к Тебе от зла в ней и зла после неё.","n":1,"src":["ad"]},"h51":{"ar":"اللّهُمَّ عالِمَ الغَيْبِ وَالشّهادَةِ فاطِرَ السّماواتِ وَالأرْضِ رَبَّ كلِّ شَيءٍ وَمَليكَه، أَشْهَدُ أَنْ لا إِلهَ إِلاّ أَنْت، أَعوذُ بِكَ مِن شَرِّ نَفْسي وَمِن شَرِّ الشَّيْطانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلى نَفْسي سوءاً أَوْ أَجُرَّهُ إِلى مُسْلِم.","en":"O Allah, Knower of the unseen and the seen, Originator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that there is no deity but You. I seek refuge in You from the evil of my soul, from the evil of Satan and his call to associate partners with You, and from bringing harm upon myself or upon a Muslim.","ru":"О Аллах, Знающий сокрытое и явное, Творец небес и земли, Господь и Владыка всего, свидетельствую, что нет божества, кроме Тебя. Прибегаю к Тебе от зла своей души, от зла шайтана и его призыва к многобожию, и от того, чтобы навлечь зло на себя или на мусульманина.","n":1,"src":["tir"],"tl":"Аллахума ‘алима-ль-гайби уа-ш-шахадати, Фатыра-с-самавати уа-ль-арды, Рабба кулли шай’ин уа Маликаху, ашхаду алля иляха илля анта, а‘узу бика мин шарри нафси, уа мин шарри-ш-шайтани уа ширкихи, уа ан актарифа ‘аля нафси су’ан ау аджурраху иля муслим"},"h52":{"ar":"أَعوذُ بِكَلِماتِ اللّهِ التّامّاتِ مِنْ شَرِّ ما خَلَق.","en":"I seek refuge in the perfect words of Allah from the evil of what He has created.","ru":"Прибегаю к совершенным словам Аллаха от зла того, что Он сотворил.","n":3,"src":["muslim"]},"h53":{"ar":"اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ على نَبِيِّنَا مُحمَّد.","en":"O Allah, send blessings, peace and grace upon our Prophet Muhammad.","ru":"О Аллах, благослови, приветствуй и одари благодатью нашего пророка Мухаммада.","n":10,"src":["tabarani"],"note":{"en":"Whoever sends blessings on me ten times in the morning and ten in the evening will receive my intercession on the Day of Resurrection.","ru":"Кто благословит меня десять раз утром и десять вечером, того настигнет моё заступничество в День воскресения.","ar":"من صلى على حين يصبح وحين يمسى ادركته شفاعتى يوم القيامة."}},"h54":{"ar":"اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ أَنْ نُشْرِكَ بِكَ شَيْئًا نَعْلَمُهُ، وَنَسْتَغْفِرُكَ لِمَا لَا نَعْلَمُهُ.","en":"O Allah, we seek refuge in You from knowingly associating anything with You, and we ask Your forgiveness for what we do unknowingly.","ru":"О Аллах, мы прибегаем к Тебе от того, чтобы сознательно придавать Тебе сотоварищей, и просим прощения за то, чего не знаем.","n":3,"src":["ahmad"]},"h55":{"ar":"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنْ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنْ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ، وَقَهْرِ الرِّجَالِ.","en":"O Allah, I seek refuge in You from worry and grief, from helplessness and laziness, from cowardice and miserliness, and from being overcome by debt and overpowered by men.","ru":"О Аллах, прибегаю к Тебе от тревоги и печали, от бессилия и лени, от трусости и скупости, от бремени долгов и притеснения людей.","n":3,"src":["ad"]},"h56":{"ar":"أسْتَغْفِرُ اللهَ العَظِيمَ الَّذِي لاَ إلَهَ إلاَّ هُوَ، الحَيُّ القَيُّومُ، وَأتُوبُ إلَيهِ.","en":"I seek the forgiveness of Allah the Mighty, besides whom there is no deity, the Ever-Living, the Sustainer, and I turn to Him in repentance.","ru":"Прошу прощения у Аллаха Великого, кроме которого нет божества, Живого, Поддерживающего жизнь, и приношу Ему покаяние.","n":3,"src":["tir"]},"h57":{"ar":"يَا رَبِّ، لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ، وَلِعَظِيمِ سُلْطَانِكَ.","en":"O my Lord, to You is praise as befits the majesty of Your Face and the greatness of Your authority.","ru":"О Господь мой, Тебе хвала, достойная величия Твоего Лика и могущества Твоей власти.","n":3,"src":["ibm"]},"h58":{"ar":"لَا إلَه إلّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءِ قَدِيرِ.","en":"There is no deity but Allah alone, without partner. His is the dominion and His is the praise, and He is over all things capable.","ru":"Нет божества, кроме одного лишь Аллаха, у которого нет сотоварища. Ему принадлежит владычество, Ему хвала, и Он всё может.","n":100,"src":["bm"],"note":{"en":"Whoever says it 100 times: the reward of freeing ten slaves, 100 good deeds written, 100 sins erased, and protection from Satan.","ru":"Кто скажет это 100 раз — награда как за освобождение десяти рабов, записывается 100 добрых дел, стирается 100 грехов, и он защищён от шайтана.","ar":"كانت له عدل عشر رقاب، وكتبت له مئة حسنة، ومحيت عنه مئة سيئة، وكانت له حرزا من الشيطان."}},"h59":{"ar":"اللَّهُمَّ أَنْتَ رَبِّي لا إِلَهَ إِلا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ، وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ، مَا شَاءَ اللَّهُ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ، وَلا حَوْلَ وَلا قُوَّةَ إِلا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ، أَعْلَمُ أَنَّ اللَّهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا، اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا، إِنَّ رَبِّي عَلَى صِرَاطٍ مُسْتَقِيمٍ.","en":"O Allah, You are my Lord; there is no deity but You. In You I trust, and You are the Lord of the Mighty Throne. What Allah wills happens, and what He does not will does not happen. There is no might nor power except with Allah, the Most High, the Most Great. I know that Allah is able to do all things and that Allah encompasses all things in knowledge. O Allah, I seek refuge in You from the evil of my soul and from the evil of every creature You hold by its forelock. Indeed, my Lord is on a straight path.","ru":"О Аллах, Ты — мой Господь, нет божества, кроме Тебя. На Тебя я уповаю, и Ты — Господь великого Трона. Что пожелал Аллах, то было, а чего не пожелал, того не было. Нет мощи и силы ни у кого, кроме Аллаха Высокого, Великого. Я знаю, что Аллах способен на всё и что Аллах объемлет знанием всё сущее. О Аллах, прибегаю к Тебе от зла своей души и от зла всякого существа, которое Ты держишь за хохол. Поистине, мой Господь — на прямом пути.","n":1,"src":["ibnsunni"],"note":{"en":"Recorded by Ibn al-Sunni; some scholars grade its chain weak.","ru":"Приводит Ибн ас-Сунни; часть учёных считает иснад слабым.","ar":"ذكر طيب."}},"h60":{"ar":"سُبْحانَ اللهِ وَبِحَمْدِهِ.","en":"Glory be to Allah and praise be to Him.","ru":"Пречист Аллах и хвала Ему.","n":100,"src":["muslim"],"note":{"en":"His sins are wiped away even if they are like the foam of the sea.","ru":"Его грехи будут стёрты, даже если их столько, сколько пены морской.","ar":"حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ. لَمْ يَأْتِ أَحَدٌ يَوْمَ الْقِيَامَةِ بِأَفْضَلَ مِمَّا جَاءَ بِهِ إِلَّا أَحَدٌ قَالَ مِثْلَ مَا قَالَ أَوْ زَادَ عَلَيْهِ."},"tl":"Субхана-Ллахи уа би-хамдихи"},"h135":{"ar":"يَجْمَعُ كَفَّيْهِ ثُمَّ يَنْفُثُ فِيهِمَا فَيَقْرَأُ فِيهِمَا:بسم الله الرحمن الرحيم ﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُواً أَحَدٌ﴾. بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾. بسم الله الرحمن الرحيم ﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَ النَّاسِ﴾ ثُمَّ يَمْسَحُ بِهِمَا مَا اسْتَطَاعَ مِنْ جَسَدِهِ يَبْدَأُ بِهِمَا عَلَى رَأْسِهِ وَوَجْهِهِ وَمَا أَقبَلَ مِنْ جَسَدِهِ يفعلُ ذلك ثلاثَ مرَّاتٍ","en":"Cup your hands, blow lightly into them and recite Al-Ikhlas, Al-Falaq and An-Nas, then wipe over as much of your body as you can, starting with the head, face and front of the body. Do this three times.","ru":"Сложите ладони, слегка подуйте в них, прочитайте «аль-Ихлас», «аль-Фаляк» и «ан-Нас», затем протрите ими тело, сколько сможете, начиная с головы, лица и передней части тела. Сделайте так три раза.","n":3,"src":["bukhari"]},"h136":{"ar":"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ﴿٢٥٥﴾","en":"Allāh - there is no deity except Him, the Ever-Living, the Self-Sustaining. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursī extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great.","ru":"Аллах — нет божества, кроме Него — Живой, Поддерживающий всё сущее. Его не одолевает ни дремота, ни сон. Ему принадлежит всё, что в небесах, и всё, что на земле. Кто же тот, кто заступится у Него иначе как с Его дозволения? Он знает, что перед ними и что после них, а они ничего не постигают из Его знания, кроме того, что Он пожелает. Подножие Его Трона[20] объемлет небеса и землю, и не тяготит Его охрана их. Он — Возвышенный, Великий.","n":1,"src":["bukhari"],"note":{"en":"A guardian from Allah stays with you and no devil comes near you until morning.","ru":"При тебе будет хранитель от Аллаха, и шайтан не приблизится к тебе до утра."},"t":{"en":"Ayat al-Kursi","ru":"Аят аль-Курси","ar":""}},"h137":{"ar":"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾","en":"The Messenger has believed in what was revealed to him from his Lord, and [so have] the believers. All of them have believed in Allāh and His angels and His books and His messengers, [saying], \"We make no distinction between any of His messengers.\" And they say, \"We hear and we obey. [We seek] Your forgiveness, our Lord, and to You is the [final] destination.\" Allāh does not charge a soul except [with that within] its capacity. It will have [the consequence of] what [good] it has gained, and it will bear [the consequence of] what [evil] it has earned. \"Our Lord, do not impose blame upon us if we have forgotten or erred. Our Lord, and lay not upon us a burden like that which You laid upon those before us. Our Lord, and burden us not with that which we have no ability to bear. And pardon us; and forgive us; and have mercy upon us. You are our protector, so give us victory over the disbelieving people.\"","ru":"Посланник уверовал в то, что было ниспослано ему от его Господа, и верующие. Каждый уверовал в Аллаха, в Его ангелов, в Его Писания и в Его посланников: «Мы не разделяем между кем-либо из Его посланников». Они сказали: «Мы услышали и повиновались. Твоего прощения [просим], Господь наш, и к Тебе — конечный исход». Аллах не возлагает на душу больше того, что она способна вынести. Ей — то, что она приобрела, и против неё — то, что она заслужила. «Господь наш! Не взыщи с нас, если мы забыли или ошиблись. Господь наш! Не возлагай на нас бремя, подобно тому, как Ты возложил его на тех, которые были до нас. Господь наш! Не возлагай на нас того, чего мы не в силах вынести. Будь снисходителен к нам, прости нам и помилуй нас. Ты — наш Покровитель, так помоги же нам против людей, отвергших веру».","n":1,"src":["bm"],"note":{"en":"Whoever recites the last two verses of Al-Baqarah at night, they will suffice him.","ru":"Кто прочтёт ночью два последних аята «аль-Бакары», тому их будет достаточно.","ar":"من قرأ آيتين من آخر سورة البقرة في ليلة كفتاه."},"t":{"en":"End of Al-Baqarah","ru":"Конец «аль-Бакары»","ar":""}},"h138":{"ar":"بِاسْمِكَ رَبِّي وَضَعْتُ جَنْبِي، وَبِكَ أَرْفَعُهُ، فَإِن أَمْسَكْتَ نَفْسِي فارْحَمْهَا، وَإِنْ أَرْسَلْتَهَا فَاحْفَظْهَا، بِمَا تَحْفَظُ بِهِ عِبَادَكَ الصَّالِحِينَ.","en":"In Your name, my Lord, I lay down my side, and by You I raise it. If You take my soul, have mercy on it, and if You return it, protect it as You protect Your righteous servants.","ru":"С именем Твоим, Господь мой, я ложусь на бок и с Тобой поднимаюсь. Если Ты заберёшь мою душу — помилуй её, а если вернёшь — защити её так, как защищаешь Своих праведных рабов.","n":1,"src":["bm"]},"h139":{"ar":"اللَّهُمَّ إِنَّكَ خَلَقْتَ نَفْسِي وَأَنْتَ تَوَفَّاهَا، لَكَ مَمَاتُهَا وَمَحْياهَا، إِنْ أَحْيَيْتَهَا فَاحْفَظْهَا، وَإِنْ أَمَتَّهَا فَاغْفِرْ لَهَا. اللَّهُمَّ إِنِّي أَسْأَلُكَ العَافِيَةَ.","en":"O Allah, You created my soul and You take it back. Its death and its life belong to You. If You keep it alive, protect it, and if You cause it to die, forgive it. O Allah, I ask You for well-being.","ru":"О Аллах, Ты сотворил мою душу и Ты упокоишь её. Тебе принадлежат её смерть и жизнь. Если Ты оживишь её — защити её, а если умертвишь — прости её. О Аллах, прошу Тебя о благополучии.","n":1,"src":["muslim"]},"h140":{"ar":"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ.","en":"O Allah, protect me from Your punishment on the Day You resurrect Your servants.","ru":"О Аллах, защити меня от Твоего наказания в тот день, когда Ты воскресишь Своих рабов.","n":3,"src":["ad"],"note":{"en":"Said with your right hand under your cheek.","ru":"Говорится, положив правую руку под щёку."}},"h141":{"ar":"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.","en":"In Your name, O Allah, I die and I live.","ru":"С именем Твоим, о Аллах, я умираю и оживаю.","n":1,"src":["bukhari"]},"h142":{"ar":"سُبْحَانَ اللَّهِ (ثلاثاً وثلاثين) وَالْحَمْدُ لِلَّهِ (ثلاثاً وثلاثين) وَاللَّهُ أَكْبَرُ أربعاً وثلاثينَ","en":"Glory be to Allah (33 times), praise be to Allah (33 times), Allah is the Greatest (34 times).","ru":"«Пречист Аллах» (33 раза), «Хвала Аллаху» (33 раза), «Аллах велик» (34 раза).","n":100,"src":["bm"],"note":{"en":"The Prophet ﷺ told Ali and Fatimah this is better for them than a servant.","ru":"Пророк ﷺ сказал Али и Фатиме, что это лучше для них, чем слуга."}},"h143":{"ar":"اللَّهُمَّ رَبَّ السَّمَوَاتِ السَّبْعِ وَرَبَّ الأَرْضِ، وَرَبَّ الْعَرْشِ الْعَظِيمِ، رَبَّنَا وَرَبَّ كُلِّ شَيْءٍ، فَالِقَ الْحَبِّ وَالنَّوَى، وَمُنْزِلَ التَّوْرَاةِ وَالْإِنْجِيلِ، وَالْفُرْقَانِ، أَعُوذُ بِكَ مِنْ شَرِّ كُلِّ شَيْءٍ أَنْتَ آخِذٌ بِنَاصِيَتِهِ. اللَّهُمَّ أَنْتَ الأَوَّلُ فَلَيْسَ قَبْلَكَ شَيْءٌ، وَأَنْتَ الآخِرُ فَلَيسَ بَعْدَكَ شَيْءٌ، وَأَنْتَ الظَّاهِرُ فَلَيْسَ فَوْقَكَ شَيْءٌ، وَأَنْتَ الْبَاطِنُ فَلَيْسَ دُونَكَ شَيْءٌ، اقْضِ عَنَّا الدَّيْنَ وَأَغْنِنَا مِنَ الْفَقْرِ.","en":"O Allah, Lord of the seven heavens, Lord of the earth and Lord of the Mighty Throne, our Lord and Lord of all things, Splitter of the seed and the date-stone, Revealer of the Torah, the Gospel and the Criterion, I seek refuge in You from the evil of every creature whose forelock You hold. O Allah, You are the First, nothing is before You; You are the Last, nothing is after You; You are the Manifest, nothing is above You; You are the Hidden, nothing is beyond You. Settle our debts and free us from poverty.","ru":"О Аллах, Господь семи небес, Господь земли и Господь великого Трона, Господь наш и Господь всего сущего, Раскалывающий зерно и косточку, Ниспославший Таурат, Инджиль и Различение! Прибегаю к Тебе от зла всего, что Ты держишь за хохол. О Аллах, Ты — Первый, и нет ничего прежде Тебя; Ты — Последний, и нет ничего после Тебя; Ты — Явный, и нет ничего над Тобой; Ты — Скрытый, и нет ничего ниже Тебя. Избавь нас от долгов и от бедности.","n":1,"src":["muslim"]},"h144":{"ar":"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا، وَكَفَانَا، وَآوَانَا، فَكَمْ مِمَّنْ لاَ كَافِيَ لَهُ وَلاَ مُؤْوِيَ.","en":"Praise be to Allah who fed us and gave us drink, sufficed us and sheltered us. How many there are who have no one to suffice them and no one to shelter them.","ru":"Хвала Аллаху, который накормил и напоил нас, дал нам достаточно и предоставил приют. Сколько же тех, у кого нет ни помощника, ни приюта!","n":1,"src":["muslim"]},"h145":{"ar":"اللَّهُمَّ عَالِمَ الغَيْبِ وَالشَّهَادَةِ فَاطِرَ السَّمَوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيكَهُ، أَشْهَدُ أَنْ لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ الشَّيْطانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً، أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.","en":"O Allah, Knower of the unseen and the seen, Originator of the heavens and the earth, Lord and Sovereign of all things, I bear witness that there is no deity but You. I seek refuge in You from the evil of my soul, from the evil of Satan and his call to associate partners with You, and from bringing harm upon myself or upon a Muslim.","ru":"О Аллах, Знающий сокрытое и явное, Творец небес и земли, Господь и Владыка всего, свидетельствую, что нет божества, кроме Тебя. Прибегаю к Тебе от зла своей души, от зла шайтана и его призыва к многобожию, и от того, чтобы навлечь зло на себя или на мусульманина.","n":1,"src":["ad","tir"]},"h146":{"ar":"يَقْرَأُ ﴿الم﴾ تَنْزِيلَ السَّجْدَة ِ، وَتَبَارَكَ الَّذي بِيَدِهِ الْمُلْكُ.","en":"Recite Surah As-Sajdah (Alif Lam Mim Tanzil) and Surah Al-Mulk before sleeping. Both are in the Surahs section.","ru":"Перед сном читайте суры «ас-Сажда» («Алиф Лям Мим. Танзиль») и «аль-Мульк». Обе есть в разделе «Суры».","n":1,"src":["tir"],"note":{"en":"The Prophet ﷺ did not sleep until he had recited them.","ru":"Пророк ﷺ не ложился спать, пока не прочитает их."}},"h147":{"ar":"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لاَ مَلْجَأَ وَلاَ مَنْجَا مِنْكَ إِلاَّ إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَبِنَبِيِّكَ الَّذِي أَرْسَلْتَ.","en":"O Allah, I submit myself to You, entrust my affairs to You, turn my face to You and lean my back on You, in hope and in fear of You. There is no refuge and no escape from You except to You. I believe in Your Book which You revealed and in Your Prophet whom You sent.","ru":"О Аллах, я предал себя Тебе, вверил Тебе свои дела, обратил к Тебе своё лицо и опёрся на Тебя спиной, с надеждой и страхом перед Тобой. Нет убежища и спасения от Тебя, кроме как у Тебя. Я уверовал в Твою Книгу, которую Ты ниспослал, и в Твоего Пророка, которого Ты отправил.","n":1,"src":["bm"],"note":{"en":"Lie on your right side and make these your last words. If you die that night, you die upon the fitrah.","ru":"Лягте на правый бок, и пусть это будут последние слова. Если умрёте этой ночью, умрёте на естестве ислама."}},"kafirun_s":{"ar":"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ يَا أَيُّهَا الْكَافِرُونَ ﴿١﴾ لَا أَعْبُدُ مَا تَعْبُدُونَ ﴿٢﴾ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿٣﴾ وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ ﴿٤﴾ وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿٥﴾ لَكُمْ دِينُكُمْ وَلِيَ دِينِ ﴿٦﴾","en":"Say, \"O disbelievers, I do not worship what you worship. Nor are you worshippers of what I worship. Nor will I be a worshipper of what you worship. Nor will you be worshippers of what I worship. For you is your religion, and for me is my religion.\"","ru":"Скажи: «О вы, отвергшие веру! Я не поклоняюсь тому, чему вы поклоняетесь. И вы не поклоняетесь тому, чему поклоняюсь я. И я не буду поклоняться тому, чему вы поклонялись. И вы не будете поклоняться тому, чему поклоняюсь я. Вам — ваша религия, а мне — моя религия!»","n":1,"src":["ad","tir"],"t":{"en":"Al-Kafirun","ru":"аль-Кафирун","ar":"سورة الكافرون"},"note":{"en":"Recite it and sleep after it: it is a declaration of freedom from shirk.","ru":"Прочитайте её и засыпайте после неё — она непричастность к многобожию.","ar":"فإنها براءة من الشرك"}},"h148":{"ar":"لاَ إِلَهَ إِلاَّ اللَّهُ الْوَاحِدُ الْقَهّارُ، رَبُّ السَّمَوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا الْعَزيزُ الْغَفَّارُ.","en":"There is no deity but Allah, the One, the Subduer, Lord of the heavens and the earth and all between them, the Mighty, the Oft-Forgiving.","ru":"Нет божества, кроме Аллаха, Единого, Всепобеждающего, Господа небес, земли и того, что между ними, Могущественного, Прощающего.","n":1,"src":["nasai"],"note":{"en":"Said when turning over in bed at night.","ru":"Говорится, когда ворочаешься в постели ночью."},"t":{"en":"Turning over at night","ru":"Ворочаясь ночью","ar":"الدعاء إذا تقلب في الليل"}},"h149":{"ar":"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ غَضَبِهِ وَعِقَابِهِ، وَشَرِّ عِبَادِهِ، وَمِنْ هَمَزَاتِ الشَّياطِينِ وَأَنْ يَحْضُرُونِ.","en":"I seek refuge in the perfect words of Allah from His anger and His punishment, from the evil of His servants, and from the whisperings of the devils and from their presence.","ru":"Прибегаю к совершенным словам Аллаха от Его гнева и наказания, от зла Его рабов, от наущений шайтанов и от того, чтобы они явились ко мне.","n":1,"src":["ad","tir"],"note":{"en":"For fear in sleep or feelings of loneliness.","ru":"При страхе во сне или чувстве одиночества."},"t":{"en":"Fear in sleep","ru":"Страх во сне","ar":"دعاء الفزع في النوم و من بلي بالوحشة"}},"h150":{"ar":"يَنْفُثُ عَنْ يَسَارِهِ ثلاثاً - يَسْتَعِيذُ بِاللَّهِ مِنَ الشَّيطَانِ وَمِنْ شَرِّ مَا رَأَى ثَلاَثَ مَرَّاتٍ - لاَ يُحَدِّثْ بِهَا أَحَداً - يَتَحَوَّلُ عَنْ جَنْبِهِ الَّذِي كَانَ عَلَيْهِ","en":"After a bad dream: spit lightly to your left three times; seek refuge in Allah from Satan and from the evil of what you saw three times; tell no one about it; and turn over from the side you were lying on.","ru":"После плохого сна: слегка сплюньте влево три раза; трижды попросите у Аллаха защиты от шайтана и от зла увиденного; никому о нём не рассказывайте; перевернитесь на другой бок.","n":1,"src":["muslim"],"t":{"en":"After a bad dream","ru":"После плохого сна","ar":"ما يفعل من رأى الرؤيا أو الحلم في النوم"}},"h151":{"ar":"ويَقُومُ يُ
